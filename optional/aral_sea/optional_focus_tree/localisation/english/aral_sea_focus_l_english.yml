l_english:
 KAZ_aral_programme:0 "Aral Sea Rehabilitation Programme"
 KAZ_aral_programme_desc:0 "The drying sea is a national problem. Start a state programme, secure international financing and begin protecting the dried seabed."
 KAZ_aral_programme_unlock_tt:0 "Unlocks decisions: §YIFAS Basin Programme§!, §YProtective Forests§!, §YSYNAS Loan§!"
 KAZ_syr_darya_water:0 "Syr Darya Water Management"
 KAZ_syr_darya_water_desc:0 "Rebuild the river channel and head works and close off the Northern Aral so that the water stays in the sea."
 KAZ_syr_darya_water_unlock_tt:0 "Unlocks decisions: §YSyr Darya Channel§!, §YKokaral Dam§!, §YAklak Hydro Works§!"
 KAZ_water_saving_agriculture:0 "Water-Saving Agriculture"
 KAZ_water_saving_agriculture_desc:0 "Rice and cotton drink the rivers. Modernize irrigation and give the returning fish a processing industry."
 KAZ_water_saving_agriculture_unlock_tt:0 "Unlocks decisions: §YIrrigation Modernization§!, §YAralsk Fisheries§!"
 KAZ_water_diplomacy:0 "Central Asian Water Diplomacy"
 KAZ_water_diplomacy_desc:0 "The rivers belong to the whole region. Negotiate flows with the neighbours and reopen the old big ideas."
 KAZ_water_diplomacy_unlock_tt:0 "Unlocks decisions: §YUzbekistan Flow Agreement§!, §YJoint Southern Aral Plan§!, §YSibaral Talks§!"
 KAZ_green_aral:0 "Green Aral"
 KAZ_green_aral_desc:0 "Turn the dust-blowing seabed into a forest, and protect what grows there."
 KAZ_green_aral_unlock_tt:0 "Unlocks decisions: §YMass Saxaul Programme§!, §YAral Ormany Reserve§!"
 KAZ_aral_phase2:0 "Northern Aral: Phase II"
 KAZ_aral_phase2_desc:0 "Raise the Northern Aral further and decide how to bring the shoreline back toward Aralsk."
 KAZ_aral_phase2_unlock_tt:0 "Unlocks decisions: §YAmanotkel Facility§!, §YPhase II§!, §YSecond Dam§!"
