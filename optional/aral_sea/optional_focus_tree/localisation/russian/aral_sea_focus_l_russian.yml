l_russian:
 KAZ_aral_programme:0 "Программа восстановления Аральского моря"
 KAZ_aral_programme_desc:0 "Высыхающее море — общенациональная проблема. Запустите государственную программу, привлеките международное финансирование и начните защиту осушенного дна."
 KAZ_aral_programme_unlock_tt:0 "Открывает решения: §YПрограмма МФСА для бассейна§!, §YЗащитные леса§!, §YЗаём на проект РРСА§!"
 KAZ_syr_darya_water:0 "Управление водами Сырдарьи"
 KAZ_syr_darya_water_desc:0 "Восстановите русло и головные сооружения Сырдарьи и отделите Северный Арал, чтобы вода оставалась в море."
 KAZ_syr_darya_water_unlock_tt:0 "Открывает решения: §YРусло Сырдарьи§!, §YПлотина Кокарал§!, §YАклакский гидроузел§!"
 KAZ_water_saving_agriculture:0 "Водосберегающее сельское хозяйство"
 KAZ_water_saving_agriculture_desc:0 "Рис и хлопок выпивают реки. Модернизируйте ирригацию и создайте переработку для возвращающейся рыбы."
 KAZ_water_saving_agriculture_unlock_tt:0 "Открывает решения: §YМодернизация ирригации§!, §YРыбное хозяйство Аральска§!"
 KAZ_water_diplomacy:0 "Водная дипломатия Центральной Азии"
 KAZ_water_diplomacy_desc:0 "Реки принадлежат всему региону. Договоритесь о стоке с соседями и вернитесь к старым большим идеям."
 KAZ_water_diplomacy_unlock_tt:0 "Открывает решения: §YСоглашение с Узбекистаном по стоку§!"
 KAZ_green_aral:0 "Зелёный Арал"
 KAZ_green_aral_desc:0 "Превратите пылящее дно в лес и защитите то, что там вырастет."
 KAZ_green_aral_unlock_tt:0 "Открывает решения: §YМассовая посадка саксаула§!"
 KAZ_aral_phase2:0 "Северный Арал: этап II"
 KAZ_aral_phase2_desc:0 "Поднимите Северный Арал ещё выше и решите, как вернуть береговую линию к Аральску."
 KAZ_aral_phase2_unlock_tt:0 "Открывает решения: §YУзел Аманоткель§!, §YЭтап II§!, §YВторая плотина§!"
