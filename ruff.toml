# Линтер только для Python-инструментов проекта (скрипты аудита и тесты в skills/).
# Намеренно узкий набор правил: ошибки и баги, без стилистических споров.
extend-exclude = ["mdredux", "wiki", "drafts", "docs"]

[lint]
select = ["E", "F", "W", "B"]
# Длинные строки допустимы: русский текст в сообщениях аудитора и в фикстурах тестов.
ignore = ["E501"]

[lint.per-file-ignores]
# Пробелы в конце строки внутри многострочных строк-фикстур являются частью тестовых данных.
"skills/**/tests/*.py" = ["W291"]
