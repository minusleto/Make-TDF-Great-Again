l_english:
 KAZ_aral_sea_category:0 "The Aral Sea"
 KAZ_aral_sea_category_desc:0 ""
 aral_sea_dynamic_modifier:0 "Impact of the Aral Sea"
 aral_sea_dynamic_modifier_desc:0 "The Aral disaster hurts agriculture, population growth, migration and jobs. A higher sea weakens the penalties, and so do forests and fisheries that ease the fallout of the dry seabed.\n\nWater level: §Y[?aral_sea_level|1] m§! (the natural level is 40 m). Change per month: §Y[?aral_monthly_level|3] m§!."
 aral_state_modifier:0 "Aral Sea Fallout"
 aral_state_modifier_desc:0 "Salt and dust storms, lost fisheries and poor health. Strongest in Kyzylorda, half as strong in Turkistan, Aktobe and Ulutau, a quarter as strong in Mangystau and Atyrau. Fades as the sea is restored and the fallout is eased.\n\nAral Sea water level: §Y[?aral_s_level|1] m§!. Change per month: §Y[?aral_s_change|2]%§!."
 aral_ifas:0 "IFAS Basin Programme"
 aral_ifas_desc:0 "The International Fund for Saving the Aral Sea coordinates basin programmes across Central Asia. It returns no water, but joining it brings donors, studies and a seat at the table where the region's water is argued over."
 aral_ifas_cost_label:0 "$0.05 bn + 25 PP"
 aral_ifas_cost_tt:0 "Cost: §R$0.05 bn§! from the treasury. Political power: §R25§!."
 aral_ifas_relief_tt:0 "The fallout eases by §G2%§! (this adds no water)"
 aral_loan:0 "SYNAS Loan"
 aral_loan_desc:0 "A project for the Northern Aral is only as good as its financing. Studies, guarantees and the paperwork for a development bank loan take a long time, but without them neither the dam nor the river works can start."
 aral_loan_cost_label:0 "$0.05 bn + 40 PP"
 aral_loan_cost_tt:0 "Cost: §R$0.05 bn§! from the treasury. Political power: §R40§!."
 aral_dike:0 "Emergency Earth Dike"
 aral_dike_desc:0 "A cheap earth dike across the Berg Strait can lift the sea by about a metre within months. Spring floods have broken such dikes before, and the people of Aralsk always had to mend them. It buys time, not a solution."
 aral_dike_cost_label:0 "$0.05 bn"
 aral_dike_cost_tt:0 "Cost: §R$0.05 bn§! from the treasury."
 aral_dike_gain_tt:0 "Water for the sea: §G+12 dm§! of level, arriving gradually (what does not fit under the dam crest spills away)"
 aral_channel:0 "Syr Darya Channel Rehabilitation"
 aral_channel_desc:0 "Much of the river's water is lost on the way to the sea. Clearing the channel, repairing the regulators and cleaning the delta lakes lets more of it reach the Northern Aral."
 aral_channel_cost_label:0 "$0.05 bn"
 aral_channel_cost_tt:0 "Total cost: §R$0.15 bn§!. From the treasury: §R$0.05 bn§!. Borrowed: §Y$0.1 bn§! (adds to debt)."
 aral_kokaral:0 "Kokaral Dam"
 aral_kokaral_desc:0 "A concrete dam with a spillway across the Berg Strait cuts the Small Aral off from the dying southern basin and lets the river fill it. It is the most important structure of the programme, and its crest sets the highest level the sea can ever reach (about 42 m)."
 aral_kokaral_cost_label:0 "$0.15 bn + 60 PP"
 aral_kokaral_cost_tt:0 "Total cost: §R$0.45 bn§!. From the treasury: §R$0.15 bn§!. Borrowed: §Y$0.3 bn§! (adds to debt). Political power: §R60§!."
 aral_kokaral_gain_tt:0 "Water for the sea: §G+30 dm§! of level, arriving gradually (what does not fit under the dam crest spills away)"
 aral_aklak:0 "Aklak Hydro Works"
 aral_aklak_desc:0 "A regulating barrage on the lower Syr Darya steers the flow into the delta lakes and the Northern Aral and evens out the dry years, so a poor winter costs the sea less water."
 aral_aklak_cost_label:0 "$0.05 bn"
 aral_aklak_cost_tt:0 "Total cost: §R$0.1 bn§!. From the treasury: §R$0.05 bn§!. Borrowed: §Y$0.05 bn§! (adds to debt)."
 aral_irrigation:0 "Irrigation Modernization"
 aral_irrigation_desc:0 "Rice and cotton fields along the river use most of the water that never reaches the sea. Lining canals and replacing flood irrigation leaves more in the river and raises the harvest per cubic metre."
 aral_irrigation_cost_label:0 "$0.4 bn"
 aral_irrigation_cost_tt:0 "Total cost: §R$0.8 bn§!. From the treasury: §R$0.4 bn§!. Borrowed: §Y$0.4 bn§! (adds to debt)."
 aral_fish:0 "Revive the Fisheries"
 aral_fish_desc:0 "As the water freshens, fish return to the Small Aral. Quotas, a processing plant and cold storage give Aralsk an income again and a reason for people to stay."
 aral_fish_cost_label:0 "$0.1 bn"
 aral_fish_cost_tt:0 "Cost: §R$0.1 bn§! from the treasury."
 aral_fish_relief_tt:0 "The fallout eases by §G4%§! (this adds no water)"
 aral_saxaul1:0 "Protective Forests"
 aral_saxaul1_desc:0 "The exposed seabed is a source of salt and dust. Saxaul seeded by machine and by hand binds the soil, but the seedlings need years and many do not survive the first summer."
 aral_saxaul1_cost_label:0 "$0.15 bn"
 aral_saxaul1_cost_tt:0 "Cost: §R$0.15 bn§! from the treasury."
 aral_saxaul1_relief_tt:0 "The fallout eases by §G3%§! (this adds no water)"
 aral_saxaul2:0 "Mass Saxaul Programme"
 aral_saxaul2_desc:0 "Once the first plantings prove themselves, the programme moves to hundreds of thousands of hectares of dry seabed, with nurseries, shelter belts around the towns and a reserve on the old coast."
 aral_saxaul2_cost_label:0 "$0.4 bn"
 aral_saxaul2_cost_tt:0 "Total cost: §R$0.8 bn§!. From the treasury: §R$0.4 bn§!. Borrowed: §Y$0.4 bn§! (adds to debt)."
 aral_saxaul2_relief_tt:0 "The fallout eases by §G6%§! (this adds no water)"
 aral_uzb:0 "Uzbekistan Flow Agreement"
 aral_uzb_desc:0 "The Large Aral is lost for good, but a flow agreement on the shared Syr Darya cuts uncontrolled withdrawals and lets the Northern Aral count on a steadier inflow."
 aral_uzb_cost_label:0 "$0.05 bn + 40 PP"
 aral_uzb_cost_tt:0 "Cost: §R$0.05 bn§! from the treasury. Political power: §R40§!."
 aral_amanotkel:0 "Amanotkel Hydro Complex"
 aral_amanotkel_desc:0 "A complex on the Syr Darya near Amanotkel regulates the flow below the Kokaral dam, evens out the dry years and is part of every variant of the next stage. Without it the extra water can be neither held nor sent where it is needed."
 aral_amanotkel_cost_label:0 "$0.4 bn"
 aral_amanotkel_cost_tt:0 "Total cost: §R$0.8 bn§!. From the treasury: §R$0.4 bn§!. Borrowed: §Y$0.4 bn§! (adds to debt)."
 aral_phase2:0 "Phase II: Raise the Dam"
 aral_phase2_desc:0 "Reconstructing the Kokaral dam and modernizing the irrigation systems of the basin lift the crest, and the Small Aral with it, to about 44 m and almost 4,000 square kilometres of water. The engineers call it the realistic plan: expensive, but within reach."
 aral_phase2_cost_label:0 "$0.3 bn + 60 PP"
 aral_phase2_cost_tt:0 "Total cost: §R$1 bn§!. From the treasury: §R$0.3 bn§!. Borrowed: §Y$0.7 bn§! (adds to debt). Political power: §R60§!."
 aral_phase2_gain_tt:0 "Water for the sea: §G+30 dm§! of level, arriving gradually (what does not fit under the dam crest spills away)"
 aral_dam2:0 "The Second Dam and the Aralsk Canal"
 aral_dam2_desc:0 "The older and bolder plan: a second dam and a canal to Aralsk that would push the sea back toward the town and up to about 46 m. The larger surface evaporates more, so every dry year hits harder."
 aral_dam2_cost_label:0 "$0.75 bn + 100 PP"
 aral_dam2_cost_tt:0 "Total cost: §R$2.5 bn§!. From the treasury: §R$0.75 bn§!. Borrowed: §Y$1.75 bn§! (adds to debt). Political power: §R100§!."
 aral_dam2_gain_tt:0 "Water for the sea: §G+50 dm§! of level, arriving gradually (what does not fit under the dam crest spills away)"
 aral_sibaral:0 "Siberian Water Question"
 aral_sibaral_desc:0 "The Soviet plan to turn Siberian rivers south was shelved at the end of the Soviet era, but Uzbekistan and Moscow's mayor keep reviving it. Raising the question formally asks Russia for a study commission. Russia may refuse outright, or study the idea for years."
 aral_sibaral_cost_label:0 "$0.05 bn + 50 PP"
 aral_sibaral_cost_tt:0 "Cost: §R$0.05 bn§! from the treasury. Political power: §R50§!."
 aral_sib_canal:0 "Siberian Canal"
 aral_sib_canal_desc:0 "The old Soviet design: a canal of more than two thousand kilometres from the Ob and the Irtysh to the Syr Darya and the Amu Darya. It carries the most water and is cheaper, but it takes years, loses water to evaporation and leaves Kazakhstan paying Russia for every cubic metre."
 aral_sib_canal_cost_label:0 "$0.75 bn + 80 PP"
 aral_sib_canal_cost_tt:0 "Total cost: §R$4 bn§!. From the treasury: §R$0.75 bn§!. Borrowed: §Y$3.25 bn§! (adds to debt). Political power: §R80§!."
 aral_sib_pipe:0 "Siberian Pipeline"
 aral_sib_pipe_desc:0 "The modern variant: pipes instead of an open canal, so less water is lost and fewer pumping stations are needed. It is faster and gives Russia less room to squeeze, but it is dearer and carries less water."
 aral_sib_pipe_cost_label:0 "$1.0 bn + 80 PP"
 aral_sib_pipe_cost_tt:0 "Total cost: §R$5 bn§!. From the treasury: §R$1.0 bn§!. Borrowed: §Y$4 bn§! (adds to debt). Political power: §R80§!."
