 ARAL_GUI_TREND:0 "Per month: [ROOT.GetAralTrend]"
 ARAL_TREND_TT:0 "§YMonthly change of the Aral Sea§!\nThe river refills the sea up to the crest of its dam: §G+0.05 dm§!\nSyr Darya channel: §G+0.05 dm§!\nUzbekistan flow agreement: §G+0.05 dm§!\nIrrigation modernization: §G+0.05 dm§!\nSecond Dam (the wide surface evaporates): §R-0.10 dm§!\nSiberian water, canal / pipeline: §G+0.30 / +0.15 dm§!\nFilling from finished projects: §G+[?aral_fill|2] dm§! (still to arrive: §Y[?aral_pending|1] dm§!)\nAt the crest the sea cannot rise: the rest spills over.\nOnce a year the river is dry, wet or normal.\nNow: [ROOT.GetAralTrend]"
 ARAL_GUI_MIN:0 "37 m"
 ARAL_TICK_0:0 "§Y40 m§!: the natural level of the Small Aral (the sill of the Berg Strait). Water above it spills into the Large Aral"
 ARAL_TREND_DOWN:0 "§R[?aral_monthly_level|3] m§!"
 ARAL_TREND_UP:0 "§G+[?aral_monthly_level|3] m§!"
 ARAL_TREND_FLAT:0 "§Y0.000 m§!"
 aral_dry_tt:0 "Regulated flow: a dry year takes §G1 dm§! less water from the sea"
 ARAL_TICK_46:0 "§Y46 m§!: the second dam, the limit of the old plans. The sea of 1960 stood at 53 m, off this scale"
 aral_req_coast_tt:0 "Kazakhstan must own the §YKyzylorda region§! (the Aral coast)
 aral_req_level:0 "Water level is at least §Y41.5 m§!"
 ARAL_TICK_415:0 "§Y41.5 m§!: the Fisheries, Phase II and the Second Dam need the sea at least this high"
 aral_kokaral_crest_tt:0 "The dam crest sets the highest level of the sea: §Y42 m§!"
 aral_phase2_crest_tt:0 "The dam crest sets the highest level of the sea: §Y44 m§!"
 aral_dam2_crest_tt:0 "The dam crest sets the highest level of the sea: §Y46 m§!"
 aral_dike_risk_tt:0 "While it stands the sea can rise to §Y41 m§!, but every month there is a §R3%§! chance that a spring flood washes it out and the sea falls back to 40 m"
 aral_dam2_drift_tt:0 "The wide surface evaporates: refill §R-0.10 dm§! a month and every dry year costs §R2 dm§! more. Only a steady inflow holds the sea at this level"
 aral_loan_unlock_tt:0 "Unlocks the §YKokaral Dam§! and the §YSyr Darya Channel§!"
 aral_uzb_drift_tt:0 "Steadier inflow: the sea refills §G0.05 dm§! a month faster"
 aral_irrigation_drift_tt:0 "Saved water: the sea refills §G0.05 dm§! a month faster"
 aral_channel_drift_tt:0 "More of the river reaches the sea: it refills §G0.05 dm§! a month faster"
 aral_irrigation_bonus_tt:0 "Agricultural productivity §G+5%§! (the penalty is offset by that much)"
 aral_fish_bonus_tt:0 "Income from agriculture and fishing §G+5%§!"
 aral_req_russia_tt:0 "§YRussia§! exists"
 aral_req_nostudy_tt:0 "No study commission is working at the moment"
 aral_excl_sib_canal_tt:0 "Has not started the §YSiberian Pipeline§!"
 aral_excl_sib_pipe_tt:0 "Has not started the §YSiberian Canal§!"
 aral_sibaral_tt:0 "Russia answers with an event: a study commission or a refusal. The verdict comes after about a year and a half: feasible §G15%§!, more studies §Y30%§! (another year), shelved §R55%§! (closed for fifteen years)"
 aral_sib_ok_tt:0 "Unlocks the §YSiberian Canal§! and the §YSiberian Pipeline§!"
 aral_sib_canal_tt:0 "Siberian water: the sea refills §G0.30 dm§! a month faster, a dry year costs §G3 dm§! less, agriculture §G+8%§!. Every year §R0.06 bn§! for the water, and every year there is a §R15%§! chance that Russia reopens the price (+50% to the fee for good, or no water for two years)"
 aral_sib_pipe_tt:0 "Siberian water: the sea refills §G0.15 dm§! a month faster, a dry year costs §G2 dm§! less, agriculture §G+4%§!. Every year §R0.04 bn§! for the water, and every year there is a §R8%§! chance that Russia reopens the price (+50% to the fee for good, or no water for two years)"
 aral_sea.1.a:0 "Buy releases ($0.03 bn, 15 PP)"
 aral_sea.1.b:0 "Let the sea drop"
 aral_sea.1.b_tt:0 "The sea drops by §R[?aral_dry_loss|0] dm§! (regulated flow cuts this, the wide surface of the Second Dam raises it)"
 aral_sea.1.d:0 "Snow in the mountains was poor and the upstream reservoirs are holding back what they have. The river reaches the delta as a trickle, and the Northern Aral loses more water than it gets. Extra releases can be bought, at a price."
 aral_sea.1.t:0 "A Dry Year on the Syr Darya"
 aral_sea.2.a:0 "Rebuild it ($0.04 bn)"
 aral_sea.2.b:0 "Wait for the loan"
 aral_sea.2.d:0 "A spring flood went over the earth dike and cut a gap in it. The water gathered behind it is running back into the southern basin, and the engineers repeat that anything made of earth will go the same way sooner or later."
 aral_sea.2.t:0 "The Dike Is Washed Away"
 aral_sea.3.a:0 "Fund shelter belts ($0.05 bn)"
 aral_sea.3.b:0 "Nothing can be done yet"
 aral_sea.3.d:0 "Every dry wind lifts salt and dust off the exposed seabed and carries it over fields and villages. Doctors in the Aral region report more breathing and kidney trouble, and farmers have started to leave. Something must be done for the people who stay."
 aral_sea.3.t:0 "Salt Storms Over the Seabed"
 aral_sea.4.a:0 "Form a study commission"
 aral_sea.4.b:0 "Decline politely"
 aral_sea.4.d:0 "Kazakhstan and Uzbekistan raise the old Soviet plan to turn Siberian rivers south. Supporters promise water for fruit and vegetables and a steady income for Russia, while opponents answer that the Ob has no water to spare and Siberia would pay the price."
 aral_sea.4.t:0 "Central Asia Asks for Siberian Water"
 aral_sea.6.a:0 "Start planning"
 aral_sea.6.d:0 "The commission has finished its work. On paper the project can be built, at a vast cost and with the Siberian regions against it. Nothing is decided yet, but Kazakhstan can now choose between the old canal and a pipeline."
 aral_sea.6.t:0 "The Commission Finds It Feasible"
 aral_sea.7.a:0 "Wait"
 aral_sea.7.d:0 "The commission has not reached a verdict. Old Soviet materials are being gathered from hundreds of institutes, the estimates keep growing, and the report is postponed by another year."
 aral_sea.7.t:0 "The Commission Asks for More Data"
 aral_sea.8.a:0 "Accept the decision"
 aral_sea.8.a_tt:0 "The question of Siberian water is closed for §R15 years§!"
 aral_sea.8.d:0 "Russia has given its answer: the question is closed for now. The cost is too high, the Siberian regions object and the press mocks the plan. The idea will return, as it has before, but not soon."
 aral_sea.8.t:0 "Russia Shelves the Idea"
 aral_sea.9.a:0 "Accept the new price"
 aral_sea.9.a_tt:0 "The yearly fee for the water rises by §R50%§!, for good"
 aral_sea.9.b:0 "Refuse and wait it out"
 aral_sea.9.b_tt:0 "Russia cuts the supply for §R2 years§!: no extra inflow and no benefit to agriculture, and no yearly fee"
 aral_sea.9.d:0 "The contract for the water comes up for review. Russia points to its own costs and asks for more, and everyone in the region understands that a tap can be turned both ways."
 aral_sea.9.t:0 "Russia Reopens the Price"

