# Regional coordination events and political consequences
 aral_regional_neglect_modifier: "Delayed Regional Response"
 aral_regional_neglect_modifier_desc: "The government postponed coordination with the districts around the Aral basin. This temporary political cost reflects delayed planning and a fragmented public response; it does not represent environmental damage across the whole country."
 aral_regional_crisis_modifier: "Regional Coordination Crisis"
 aral_regional_crisis_modifier_desc: "Repeatedly ignoring the warning has turned a local ecological emergency into a wider administrative crisis. Stability and political power suffer until the government funds a coordinated regional response."
 aral_sea.10.t: "Beyond the Aral Coast"
 aral_sea.10.d: "The retreating sea leaves salt and dust on exposed ground, while pressure on water and livelihoods can cross administrative borders. Local projects protect the shoreline, but they do not by themselves show which neighbouring districts need help first. A joint assessment would give the government a clearer picture before the costs spread."
 aral_sea.10.a: "Fund regional monitoring"
 aral_sea.10.a_tt: "Cost: §R$0.5 bn§! from the treasury and §R25§! political power. Successful monitoring prevents this regional warning from escalating."
 aral_sea.10.b: "Postpone the response"
 aral_sea.11.t: "The Regional Warning Returns"
 aral_sea.11.d: "The government postponed coordination, and the temporary penalty has not resolved the problem. Without a regional response, local authorities continue to work separately, emergency resources are harder to direct and the political cost of inaction is growing. The government can still intervene, or leave the crisis to deepen."
 aral_sea.11.a: "Fund an emergency response"
 aral_sea.11.a_tt: "Cost: §R$1 bn§! from the treasury and §R50§! political power. This removes the temporary penalty and establishes ongoing regional monitoring."
 aral_sea.11.b: "Continue to ignore it"
 aral_regional_response: "Regional Recovery Programme"
 aral_regional_response_desc: "Fund a coordinated programme between affected districts, align public-health and water monitoring, and establish a standing response mechanism. This is expensive administrative work, not another dam or water project."
 aral_regional_response_cost_label: "$1.5 bn"
