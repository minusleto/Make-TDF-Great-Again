 aral_ifas:0 "IFAS Basin Programme"
 aral_ifas_desc:0 "The International Fund for Saving the Aral Sea coordinates the Aral Sea Basin Programs of the Central Asian states, and Kazakhstan has taken its turn chairing it. It does not bring water back, but regional cooperation eases the fallout a little."
 aral_ifas_cost_tt:0 "Cost: §R$0.05 bn§! from the treasury"
 aral_ifas_relief_tt:0 "Aral Sea fallout eased by §G2%§!"
 aral_saxaul1:0 "Protective Forests on the Dry Seabed"
 aral_saxaul1_desc:0 "Donor-supported protective plantations in Kyzylorda Region: about 195,000 hectares so far, the first line of defence against salt and dust storms. They do not bring the water back, but they ease the damage."
 aral_saxaul1_cost_tt:0 "Total cost: §R$0.2 bn§!. From the treasury: §R$0.1 bn§!. Borrowed: §Y$0.1 bn§! (adds to debt)"
 aral_saxaul1_relief_tt:0 "Aral Sea fallout eased by §G4%§!"
 aral_loan:0 "Syr Darya & Northern Aral Sea Loan"
 aral_loan_desc:0 "Kazakhstan secures World Bank financing and prepares the Syr Darya Control and Northern Aral Sea project. Phase I as a whole cost about $86 million, of which $64.5 million came from the World Bank. Paperwork only: it unlocks the channel works and the dam."
 aral_loan_cost_tt:0 "Cost: §R$0.05 bn§! from the treasury"
 aral_channel:0 "Rehabilitate the Syr Darya Channel"
 aral_channel_desc:0 "Restore the riverbed and the Shardara dam, and build head structures on the Sagimbai and Domalak channels, so that more water reaches the delta."
 aral_channel_cost_tt:0 "Total cost: §R$0.1 bn§!. From the treasury: §R$0.03 bn§!. Borrowed: §Y$0.07 bn§! (adds to debt)"
 aral_channel_gain_tt:0 "Aral Sea restoration: §G+6%§! (arrives gradually)"
 aral_kokaral:0 "Build the Kokaral Dam"
 aral_kokaral_desc:0 "A 13 km dam and dike seal off the Northern Aral. Together with the works around it, the dam helped lift the level about 12 m above its low point of around 30 m within a few years; salinity fell and the shoreline crept from about 100 km to 12 km from Aralsk. On its own it gives roughly half of that. Until the dam is built, the sea keeps drying (-0.2% restoration per month)."
 aral_kokaral_cost_tt:0 "Total cost: §R$0.15 bn§!. From the treasury: §R$0.03 bn§!. Borrowed: §Y$0.12 bn§! (adds to debt)"
 aral_kokaral_gain_tt:0 "Aral Sea restoration: §G+24%§! (arrives gradually)"
 aral_aklak:0 "Aklak Spillway & Hydro Works (Phase I)"
 aral_aklak_desc:0 "The Aklak structures on the Syr Darya regulate the flow into the Northern Aral and add some hydro output in Kyzylorda. After the dam the sea still dries slowly (-0.05% per month) until the flows are secured by irrigation reform and the agreement with Uzbekistan."
 aral_aklak_cost_tt:0 "Total cost: §R$0.05 bn§!. From the treasury: §R$0.01 bn§!. Borrowed: §Y$0.04 bn§! (adds to debt)"
 aral_aklak_gain_tt:0 "Aral Sea restoration: §G+4%§! (arrives gradually)"
 aral_fish:0 "Revive the Aralsk Fisheries"
 aral_fish_desc:0 "The catch grew from a few dozen tons to around 2,000 t within three years; processing plants opened and fish was soon exported. Hatcheries and processing bring back livelihoods in the region. The water level must reach 36 m first."
 aral_fish_cost_tt:0 "Cost: §R$0.1 bn§! from the treasury"
 aral_fish_relief_tt:0 "Aral Sea fallout eased by §G5%§!"
 aral_irrigation:0 "Irrigation Modernization (Syr Darya Basin)"
 aral_irrigation_desc:0 "Modernize irrigation in Turkistan and Kyzylorda: 167 projects are under preparation, and water-saving on 143,100 ha has already saved about 500 million m3. The saved water is channelled to the Northern Aral."
 aral_irrigation_cost_tt:0 "Total cost: §R$2 bn§!. From the treasury: §R$1 bn§!. Borrowed: §Y$1 bn§! (adds to debt)"
 aral_irrigation_gain_tt:0 "Aral Sea restoration: §G+12%§! (arrives gradually)"
 aral_uzb:0 "Water-Flow Agreement with Uzbekistan"
 aral_uzb_desc:0 "An agreement with Uzbekistan secures stable Syr Darya flows even in low-water periods."
 aral_uzb_cost_tt:0 "Cost: §R$0.05 bn§! from the treasury"
 aral_saxaul2:0 "Mass Saxaul Programme"
 aral_saxaul2_desc:0 "Saxaul sown on about 1.1 million hectares of the dried seabed. Survival of the stands is only about 30%, so the work never really ends. It eases the fallout, but does not bring the water back."
 aral_saxaul2_cost_tt:0 "Total cost: §R$0.7 bn§!. From the treasury: §R$0.49 bn§!. Borrowed: §Y$0.21 bn§! (adds to debt)"
 aral_saxaul2_relief_tt:0 "Aral Sea fallout eased by §G8%§!"
 aral_ormany:0 "Aral Ormany State Forest Reserve (planned)"
 aral_ormany_desc:0 "Plan: a protected reserve of more than 1.3 million hectares to keep the new ecosystem on the dried seabed."
 aral_ormany_cost_tt:0 "Cost: §R$0.1 bn§! from the treasury"
 aral_ormany_relief_tt:0 "Aral Sea fallout eased by §G3%§!"
 aral_amanotkel:0 "Amanotkel Water-Control Facility (Phase II)"
 aral_amanotkel_desc:0 "A water-control and hydropower facility near Amanotkel would regulate the Akshatau and Kamystybas lake systems in Aral District. The hydropower project alone is put at about $377 million."
 aral_amanotkel_cost_tt:0 "Total cost: §R$1.5 bn§!. From the treasury: §R$0.75 bn§!. Borrowed: §Y$0.75 bn§! (adds to debt)"
 aral_amanotkel_gain_tt:0 "Aral Sea restoration: §G+8%§! (arrives gradually)"
 aral_phase2:0 "Northern Aral Phase II: Raise the Kokaral Dam"
 aral_phase2_desc:0 "Reconstruct the dam to lift the Northern Aral to 44 m: 3,913 km2 and 34 km3. The plan has been delayed repeatedly by disputes over dam height, and financing is still being sought. Excludes the Second Dam alternative."
 aral_phase2_cost_tt:0 "Total cost: §R$0.8 bn§!. From the treasury: §R$0.12 bn§!. Borrowed: §Y$0.68 bn§! (adds to debt)"
 aral_phase2_gain_tt:0 "Aral Sea restoration: §G+12%§! (arrives gradually)"
 aral_dam2:0 "Second Dam & Aralsk Harbor Canal (shelved)"
 aral_dam2_desc:0 "Shelved alternative: a second, more powerful dam at the Saryshaganak strait, a canal from the Kamystybas delta, and a navigable channel (23 km, 100 m wide) to bring the sea back to Aralsk. Earlier plans put it at $250-300 million. Excludes Phase II."
 aral_dam2_cost_tt:0 "Total cost: §R$1.2 bn§!. From the treasury: §R$0.6 bn§!. Borrowed: §Y$0.6 bn§! (adds to debt)"
 aral_dam2_gain_tt:0 "Aral Sea restoration: §G+18%§! (arrives gradually)"
 aral_transboundary:0 "Joint Southern Aral Plan with Uzbekistan"
 aral_transboundary_desc:0 "Hypothetical: joint management of the Amu Darya releases and the Southern Aral and its delta."
 aral_transboundary_cost_tt:0 "Total cost: §R$3 bn§!. From the treasury: §R$0.9 bn§!. Borrowed: §Y$2.1 bn§! (adds to debt)"
 aral_transboundary_gain_tt:0 "Aral Sea restoration: §G+8%§! (arrives gradually)"
 aral_sibaral:0 "Reopen the Sibaral Talks with Russia"
 aral_sibaral_desc:0 "The Soviet plan to divert Siberian rivers to Central Asia was cancelled in the late Soviet period. After the Soviet collapse Kazakhstan talked to Russia about reviving it, without result. A long shot: only a 10% chance that Russia agrees (+25% restoration)."
 aral_sibaral_cost_tt:0 "Cost: §R$0.1 bn§! from the treasury"
