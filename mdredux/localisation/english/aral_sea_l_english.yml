 ARAL_GUI_TREND:0 "Per month: [ROOT.GetAralTrend]"
 ARAL_TREND_TT:0 "§YMonthly change of the Aral Sea§!\nDrying without the dam: §R-0.20%§!\nAfter the Kokaral Dam: §R-0.05%§!\nUzbekistan flow agreement: §G+0.03%§!\nIrrigation modernization: §G+0.02%§!\nFilling from finished projects: §G+[?aral_fill|2]%§! (still to arrive: §Y[?aral_pending|1]%§!)\nNow: [ROOT.GetAralTrend]"
 aral_sea_dynamic_modifier_desc:0 "The desiccated sea hurts agriculture, infrastructure, productivity, population growth, migration and jobs. Restoring the water weakens the penalties, and so do forests and fisheries that ease the fallout.\n\nWater level: §Y[?aral_sea_level|1] m§!. Change per month: §Y[?aral_monthly_change|2]%§! ([?aral_monthly_level|3] m)."
 aral_state_modifier_desc:0 "Salt and dust storms, lost fisheries and poor health. Strongest in Kyzylorda, half as strong in Turkistan, Aktobe and Ulutau, a quarter as strong in Mangystau and Atyrau. Fades as the sea is restored and the fallout is eased.\n\nAral Sea water level: §Y[?aral_s_level|1] m§!. Change per month: §Y[?aral_s_change|2]%§!."
