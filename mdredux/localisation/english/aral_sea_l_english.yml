l_english:
 KAZ_aral_sea_category: "The Aral Sea"
 KAZ_aral_sea_category_desc: ""
 aral_state_modifier: "Aral Sea Fallout"
 aral_state_modifier_desc: "These regions lie closest to the exposed seabed. Salt and dust storms and the loss of fisheries undermine local productivity, reduce the manpower available for recruitment and limit room for development. The pressure is strongest in Kyzylorda, weaker in neighbouring regions, and remains attached to the state if its owner changes."
 aral_ifas: "IFAS Basin Programme"
 aral_ifas_desc: "The International Fund for Saving the Aral Sea coordinates basin programmes across Central Asia. It returns no water, but joining it brings donors, studies and a seat at the table where the region's water is argued over."
 aral_ifas_cost_label: "$0.5 bn"
 aral_ifas_cost_tt: "Cost: §R$0.5 bn§! from the treasury. Political power: §R25§!."
 aral_ifas_relief_tt: "The fallout eases by §G2%§! (this adds no water)"
 aral_loan: "SYNAS Loan"
 aral_loan_desc: "A project for the Northern Aral is only as good as its financing. Studies, guarantees and the paperwork for a development bank loan take a long time, but without them neither the dam nor the river works can start."
 aral_loan_cost_label: "$0.5 bn"
 aral_loan_cost_tt: "Cost: §R$0.5 bn§! from the treasury. Political power: §R40§!."
 aral_dike: "Emergency Earth Dike"
 aral_dike_desc: "A cheap earth dike across the Berg Strait can lift the sea by about a metre within months. Spring floods have broken such dikes before, and the people of Aralsk always had to mend them. It buys time, not a solution."
 aral_dike_cost_label: "$0.5 bn"
 aral_dike_cost_tt: "Cost: §R$0.5 bn§! from the treasury."
 aral_dike_gain_tt: "Water for the sea: §G+12 dm§! of level, arriving gradually (what does not fit under the dam crest spills away)"
 aral_channel: "Syr Darya Channel Rehabilitation"
 aral_channel_desc: "Much of the river's water is lost on the way to the sea. Clearing the channel, repairing the regulators and cleaning the delta lakes lets more of it reach the Northern Aral."
 aral_channel_cost_label: "$0.5 bn"
 aral_channel_cost_tt: "Total cost: §R$1.5 bn§!. From the treasury: §R$0.5 bn§!. Borrowed: §Y$1 bn§! (adds to debt)."
 aral_kokaral: "Kokaral Dam"
 aral_kokaral_desc: "A concrete dam with a spillway across the Berg Strait cuts the Small Aral off from the dying southern basin and lets the river fill it. It is the most important structure of the programme, and its crest sets the highest level the sea can ever reach (about 42 m)."
 aral_kokaral_cost_label: "$1.5 bn"
 aral_kokaral_cost_tt: "Total cost: §R$4.5 bn§!. From the treasury: §R$1.5 bn§!. Borrowed: §Y$3 bn§! (adds to debt). Political power: §R60§!."
 aral_kokaral_gain_tt: "Water for the sea: §G+30 dm§! of level, arriving gradually (what does not fit under the dam crest spills away)"
 aral_aklak: "Aklak Hydro Works"
 aral_aklak_desc: "A regulating barrage on the lower Syr Darya steers the flow into the delta lakes and the Northern Aral and evens out the dry years, so a poor winter costs the sea less water."
 aral_aklak_cost_label: "$0.5 bn"
 aral_aklak_cost_tt: "Total cost: §R$1 bn§!. From the treasury: §R$0.5 bn§!. Borrowed: §Y$0.5 bn§! (adds to debt)."
 aral_irrigation: "Irrigation Modernization"
 aral_irrigation_desc: "Rice and cotton fields along the river use most of the water that never reaches the sea. Lining canals and replacing flood irrigation leaves more in the river and raises the harvest per cubic metre."
 aral_irrigation_cost_label: "$4 bn"
 aral_irrigation_cost_tt: "Total cost: §R$8 bn§!. From the treasury: §R$4 bn§!. Borrowed: §Y$4 bn§! (adds to debt)."
 aral_fish: "Revive the Fisheries"
 aral_fish_desc: "As the water freshens, fish return to the Small Aral. Quotas, a processing plant and cold storage give Aralsk an income again and a reason for people to stay."
 aral_fish_cost_label: "$1 bn"
 aral_fish_cost_tt: "Cost: §R$1 bn§! from the treasury."
 aral_fish_relief_tt: "The fallout eases by §G4%§! (this adds no water)"
 aral_saxaul1: "Protective Forests"
 aral_saxaul1_desc: "The exposed seabed is a source of salt and dust. Saxaul seeded by machine and by hand binds the soil, but the seedlings need years and many do not survive the first summer."
 aral_saxaul1_cost_label: "$1.5 bn"
 aral_saxaul1_cost_tt: "Cost: §R$1.5 bn§! from the treasury."
 aral_saxaul1_relief_tt: "The fallout eases by §G3%§! (this adds no water)"
 aral_saxaul2: "Mass Saxaul Programme"
 aral_saxaul2_desc: "Once the first plantings prove themselves, the programme moves to hundreds of thousands of hectares of dry seabed, with nurseries, shelter belts around the towns and a reserve on the old coast."
 aral_saxaul2_cost_label: "$4 bn"
 aral_saxaul2_cost_tt: "Total cost: §R$8 bn§!. From the treasury: §R$4 bn§!. Borrowed: §Y$4 bn§! (adds to debt)."
 aral_saxaul2_relief_tt: "The fallout eases by §G6%§! (this adds no water)"
 aral_uzb: "Uzbekistan Flow Agreement"
 aral_uzb_desc: "The Large Aral is lost for good, but a flow agreement on the shared Syr Darya cuts uncontrolled withdrawals and lets the Northern Aral count on a steadier inflow."
 aral_uzb_cost_label: "$0.5 bn"
 aral_uzb_cost_tt: "Cost: §R$0.5 bn§! from the treasury. Political power: §R40§!."
 aral_amanotkel: "Amanotkel Hydro Complex"
 aral_amanotkel_desc: "A complex on the Syr Darya near Amanotkel regulates the flow below the Kokaral dam, evens out the dry years and is part of every variant of the next stage. Without it the extra water can be neither held nor sent where it is needed."
 aral_amanotkel_cost_label: "$4 bn"
 aral_amanotkel_cost_tt: "Total cost: §R$8 bn§!. From the treasury: §R$4 bn§!. Borrowed: §Y$4 bn§! (adds to debt)."
 aral_phase2: "Phase II: Raise the Dam"
 aral_phase2_desc: "Reconstructing the Kokaral dam and modernizing the irrigation systems of the basin lift the crest, and the Small Aral with it, to about 44 m and almost 4,000 square kilometres of water. The engineers call it the realistic plan: expensive, but within reach."
 aral_phase2_cost_label: "$3 bn"
 aral_phase2_cost_tt: "Total cost: §R$10 bn§!. From the treasury: §R$3 bn§!. Borrowed: §Y$7 bn§! (adds to debt). Political power: §R60§!."
 aral_phase2_gain_tt: "Water for the sea: §G+30 dm§! of level, arriving gradually (what does not fit under the dam crest spills away)"
 aral_dam2: "The Second Dam and the Aralsk Canal"
 aral_dam2_desc: "The older and bolder plan: a second dam and a canal to Aralsk that would push the sea back toward the town and up to about 46 m. The larger surface evaporates more, so every dry year hits harder."
 aral_dam2_cost_label: "$7.5 bn"
 aral_dam2_cost_tt: "Total cost: §R$25 bn§!. From the treasury: §R$7.5 bn§!. Borrowed: §Y$17.5 bn§! (adds to debt). Political power: §R100§!."
 aral_dam2_gain_tt: "Water for the sea: §G+50 dm§! of level, arriving gradually (what does not fit under the dam crest spills away)"
 aral_sibaral: "Siberian Water Question"
 aral_sibaral_desc: "The Soviet plan to turn Siberian rivers south was shelved at the end of the Soviet era, but Uzbekistan and Moscow's mayor keep reviving it. Raising the question formally asks Russia for a study commission. Russia may refuse outright, or study the idea for years."
 aral_sibaral_cost_label: "$0.5 bn"
 aral_sibaral_cost_tt: "Cost: §R$0.5 bn§! from the treasury. Political power: §R50§!."
 aral_sib_canal: "Siberian Canal"
 aral_sib_canal_desc: "The old Soviet design: a canal of more than two thousand kilometres from the Ob and the Irtysh to the Syr Darya and the Amu Darya. It carries the most water and is cheaper, but it takes years, loses water to evaporation and leaves Kazakhstan paying Russia for every cubic metre."
 aral_sib_canal_cost_label: "$7.5 bn"
 aral_sib_canal_cost_tt: "Total cost: §R$40 bn§!. From the treasury: §R$7.5 bn§!. Borrowed: §Y$32.5 bn§! (adds to debt). Political power: §R80§!."
 aral_sib_pipe: "Siberian Pipeline"
 aral_sib_pipe_desc: "The modern variant: pipes instead of an open canal, so less water is lost and fewer pumping stations are needed. It is faster and gives Russia less room to squeeze, but it is dearer and carries less water."
 aral_sib_pipe_cost_label: "$10 bn"
 aral_sib_pipe_cost_tt: "Total cost: §R$50 bn§!. From the treasury: §R$10 bn§!. Borrowed: §Y$40 bn§! (adds to debt). Political power: §R80§!."
 ARAL_STATUS_DRYING: "§RUnprotected§!"
 ARAL_STATUS_STABLE: "§YHeld by a dam§!"
 ARAL_STATUS_RECOVERY: "§GRecovering§!"
 ARAL_STATUS_CRITICAL: "§RShrinking§!"
 ARAL_GUI_LEVEL: "Northern Aral water level: §Y[?aral_sea_level|1] m§!"
 ARAL_GUI_PERCENT: "Deviation from the natural 40 m level: §Y[?aral_gain|1] m§!"
 ARAL_GUI_STATUS: "Sea status: [ROOT.GetAralStatus]"
 ARAL_GUI_ZERO: "40 m"
 ARAL_GUI_FULL: "50 m"
 ARAL_GUI_BANNER: "Restoration projects"
 ARAL_HELP_TT: "§YHow the Aral Sea programme works§!\nThe natural level of the Small Aral is 40 m. The deviation above or below that mark is shown beside the current water level. Dams set the ceiling: 41 m for the temporary earth dike, 42 m for Kokaral, 44 m for Phase II and 46 m for the Second Dam. Any water above the crest spills away.\n\nFinished projects do not raise the sea instantly: their water arrives gradually. Syr Darya channel works, the Uzbekistan flow agreement and irrigation savings improve inflow; the larger surface created by the Second Dam also increases evaporation. Dry and wet years change the balance.\n\nForests, fisheries and IFAS reduce the social and environmental damage, but do not add water themselves. Focus milestones unlock project groups. Kazakhstan must own Kyzylorda (state 717) to start projects and update the system; losing it after a project starts does not cancel that project timer."
 aral_excl_phase2_tt: "Has not started the §YSecond Dam§! alternative"
 aral_excl_dam2_tt: "Has not started §YPhase II§!"
 aral_infra_tt: "Adds §Y1§! infrastructure in Kyzylorda"
 aral_agri_tt: "Adds §Y1§! commercial agriculture district in Turkistan"
 ARAL_TICK_42: "§Y42 m§!: the crest of the Kokaral Dam, the level of viability"
 ARAL_TICK_44: "§Y44 m§!: the Phase II target (3,913 km2 of water)"
 aral_req_ifas: "Has joined the §YIFAS Basin Programme§!"
 aral_req_loan: "Has secured the §YSYNAS loan§!"
 aral_req_channel: "Has rehabilitated the §YSyr Darya Channel§!"
 aral_req_kokaral: "Has built the §YKokaral Dam§!"
 aral_req_aklak: "Has built the §YAklak Hydro Works§!"
 aral_req_irrigation: "Has completed §YIrrigation Modernization§!"
 aral_req_uzb: "Has signed the §YUzbekistan flow agreement§!"
 aral_req_saxaul1: "Has planted §YProtective Forests§!"
 aral_req_amanotkel: "Has built the §YAmanotkel Facility§!"
 ARAL_GUI_TREND: "Monthly level change: [ROOT.GetAralTrend]"
 ARAL_TREND_TT: "§YWhat changes the sea level§!\nThe figure is the monthly change in metres. The Syr Darya refills the sea while it stands below the dam crest. Finished projects send their water gradually from the pending reserve. A dry year can lower the level; a wet year adds water. Channel works, the Uzbekistan flow agreement and irrigation savings increase inflow, while the Second Dam's wider surface increases evaporation. Water above the crest spills away.\n\nCurrent monthly change: [ROOT.GetAralTrend]\nWater still on its way: §Y[?aral_pending|1] dm§!."
 ARAL_GUI_MIN: "37 m"
 ARAL_TICK_0: "§Y40 m§!: the natural level of the Small Aral (the sill of the Berg Strait). Water above it spills into the Large Aral"
 ARAL_TREND_DOWN: "§RDecline: [?aral_monthly_level|3] m/month§!"
 ARAL_TREND_UP: "§GRise: +[?aral_monthly_level|3] m/month§!"
 ARAL_TREND_FLAT: "§YNo change§!"
 aral_dry_tt: "Regulated flow: a dry year takes §G1 dm§! less water from the sea"
 ARAL_TICK_46: "§Y46 m§!: the second dam, the limit of the old plans. The sea of 1960 stood at 53 m, off this scale"
 aral_req_coast_tt: "Kazakhstan must own the §YKyzylorda region§! (the Aral coast)"
 aral_req_level: "Water level is at least §Y41.5 m§!"
 ARAL_TICK_415: "§Y41.5 m§!: the Fisheries, Phase II and the Second Dam need the sea at least this high"
 aral_kokaral_crest_tt: "The dam crest sets the highest level of the sea: §Y42 m§!"
 aral_phase2_crest_tt: "The dam crest sets the highest level of the sea: §Y44 m§!"
 aral_dam2_crest_tt: "The dam crest sets the highest level of the sea: §Y46 m§!"
 aral_dike_risk_tt: "While it stands the sea can rise to §Y41 m§!, but every month there is a §R3%§! chance that a spring flood washes it out and the sea falls back to 40 m"
 aral_dam2_drift_tt: "The wide surface evaporates: refill §R-0.10 dm§! a month and every dry year costs §R2 dm§! more. Only a steady inflow holds the sea at this level"
 aral_loan_unlock_tt: "Unlocks the §YKokaral Dam§! and the §YSyr Darya Channel§!"
 aral_uzb_drift_tt: "Steadier inflow: the sea refills §G0.05 dm§! a month faster"
 aral_irrigation_drift_tt: "Saved water: the sea refills §G0.05 dm§! a month faster"
 aral_channel_drift_tt: "More of the river reaches the sea: it refills §G0.05 dm§! a month faster"
 aral_irrigation_bonus_tt: "Agricultural productivity §G+5%§! (the penalty is offset by that much)"
 aral_fish_bonus_tt: "Income from agriculture and fishing §G+5%§!"
 aral_req_russia_tt: "§YRussia§! exists"
 aral_req_nostudy_tt: "No study commission is working at the moment"
 aral_excl_sib_canal_tt: "Has not started the §YSiberian Pipeline§!"
 aral_excl_sib_pipe_tt: "Has not started the §YSiberian Canal§!"
 aral_sibaral_tt: "Russia answers with an event: a study commission or a refusal. The verdict comes after about a year and a half: feasible §G15%§!, more studies §Y30%§! (another year), shelved §R55%§! (closed for fifteen years)"
 aral_sib_ok_tt: "Unlocks the §YSiberian Canal§! and the §YSiberian Pipeline§!"
 aral_sib_canal_tt: "Siberian water: the sea refills §G0.30 dm§! a month faster, a dry year costs §G3 dm§! less, agriculture §G+8%§!. Every year §R0.06 bn§! for the water, and every year there is a §R15%§! chance that Russia reopens the price (+50% to the fee for good, or no water for two years)"
 aral_sib_pipe_tt: "Siberian water: the sea refills §G0.15 dm§! a month faster, a dry year costs §G2 dm§! less, agriculture §G+4%§!. Every year §R0.04 bn§! for the water, and every year there is a §R8%§! chance that Russia reopens the price (+50% to the fee for good, or no water for two years)"
 aral_sea.1.a: "Buy releases ($0.3 bn, 15 PP)"
 aral_sea.1.b: "Let the sea drop"
 aral_sea.1.b_tt: "The sea drops by §R[?aral_dry_loss|0] dm§! (regulated flow cuts this, the wide surface of the Second Dam raises it)"
 aral_sea.1.d: "Snow in the mountains was poor and the upstream reservoirs are holding back what they have. The river reaches the delta as a trickle, and the Northern Aral loses more water than it gets. Extra releases can be bought, at a price."
 aral_sea.1.t: "A Dry Year on the Syr Darya"
 aral_sea.2.a: "Rebuild it ($0.4 bn)"
 aral_sea.2.b: "Wait for the loan"
 aral_sea.2.d: "A spring flood went over the earth dike and cut a gap in it. The water gathered behind it is running back into the southern basin, and the engineers repeat that anything made of earth will go the same way sooner or later."
 aral_sea.2.t: "The Dike Is Washed Away"
 aral_sea.3.a: "Fund shelter belts ($0.5 bn)"
 aral_sea.3.b: "Nothing can be done yet"
 aral_sea.3.d: "Every dry wind lifts salt and dust off the exposed seabed and carries it over fields and villages. Doctors in the Aral region report more breathing and kidney trouble, and farmers have started to leave. Something must be done for the people who stay."
 aral_sea.3.t: "Salt Storms Over the Seabed"
 aral_sea.4.a: "Form a study commission"
 aral_sea.4.b: "Decline politely"
 aral_sea.4.d: "Kazakhstan and Uzbekistan raise the old Soviet plan to turn Siberian rivers south. Supporters promise water for fruit and vegetables and a steady income for Russia, while opponents answer that the Ob has no water to spare and Siberia would pay the price."
 aral_sea.4.t: "Central Asia Asks for Siberian Water"
 aral_sea.6.a: "Start planning"
 aral_sea.6.d: "The commission has finished its work. On paper the project can be built, at a vast cost and with the Siberian regions against it. Nothing is decided yet, but Kazakhstan can now choose between the old canal and a pipeline."
 aral_sea.6.t: "The Commission Finds It Feasible"
 aral_sea.7.a: "Wait"
 aral_sea.7.d: "The commission has not reached a verdict. Old Soviet materials are being gathered from hundreds of institutes, the estimates keep growing, and the report is postponed by another year."
 aral_sea.7.t: "The Commission Asks for More Data"
 aral_sea.8.a: "Accept the decision"
 aral_sea.8.a_tt: "The question of Siberian water is closed for §R15 years§!"
 aral_sea.8.d: "Russia has given its answer: the question is closed for now. The cost is too high, the Siberian regions object and the press mocks the plan. The idea will return, as it has before, but not soon."
 aral_sea.8.t: "Russia Shelves the Idea"
 aral_sea.9.a: "Accept the new price"
 aral_sea.9.a_tt: "The yearly fee for the water rises by §R50%§!, for good"
 aral_sea.9.b: "Refuse and wait it out"
 aral_sea.9.b_tt: "Russia cuts the supply for §R2 years§!: no extra inflow and no benefit to agriculture, and no yearly fee"
 aral_sea.9.d: "The water contract comes up for review. Russia cites its costs and asks for more. Kazakhstan can accept only while the next annual fee stays at or below §Y$1.5 bn§!; any higher price means refusing the offer and waiting two years without supply."
 aral_sea.9.t: "Russia Reopens the Price"

