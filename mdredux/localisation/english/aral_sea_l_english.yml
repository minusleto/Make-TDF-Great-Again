 aral_sea.1.t:0 "The Water Returns"
 aral_sea.1.d:0 "The last sluice of the Kokaral Dam is closed. The Syr Darya water that used to vanish into the sand now stays in the Northern Aral. In Aralsk, people stand on the old shore and watch the waterline move."
 aral_sea.1.a:0 "A sea worth saving"
 aral_sea.1.b:0 "Bank the savings"
 aral_sea.2.t:0 "Fish at Aralsk"
 aral_sea.2.d:0 "The salinity has fallen enough for fish to survive. Hatcheries are restocked and a small processing plant opens at the old port. For the first time in a generation, there is a fish market in Aralsk."
 aral_sea.2.a:0 "Open the processing plant"
 aral_sea.2.b:0 "Sell the first catch abroad"
 aral_sea.3.t:0 "Moscow Says No"
 aral_sea.3.d:0 "The old idea of bringing Siberian water to Central Asia is politely received and quietly shelved. Russian officials point to the cost, the distance and the ecology of the north. The sea will have to be saved with its own rivers."
 aral_sea.3.a:0 "So be it"
 aral_sea.4.t:0 "Siberian Water"
 aral_sea.4.d:0 "Against every expectation, an agreement is signed to divert a share of Siberian water south. The canal will take years to build, and many will say it cannot be done. But the sea, for the first time, has a source that does not depend on the weather."
 aral_sea.4.a:0 "Begin the long work"
 aral_sea.5.t:0 "Dust Over Kyzylorda"
 aral_sea.5.d:0 "Storms lift salt and dust from the exposed seabed and carry it over the fields and towns of Kyzylorda. Doctors report more illness, farmers report failed crops, and fishermen have nothing to fish."
 aral_sea.5.a:0 "Fund an emergency programme"
 aral_sea.5.b:0 "Nothing can be done now"
 aral_sea.6.t:0 "The Sea Retreats Again"
 aral_sea.6.d:0 "The shoreline has moved so far that the old harbour towns are now deep inland. Whole fishing villages empty as families leave for the cities. The question is no longer how to bring the sea back, but how to keep anyone living near it."
 aral_sea.6.a:0 "Help the villages relocate"
 aral_sea.6.b:0 "Accept it"
 aral_sea.7.t:0 "Ships on the Northern Aral"
 aral_sea.7.d:0 "Boats are sailing again on the Northern Aral. The old pier at Aralsk, which stood in the sand for decades, has been rebuilt, and the shoreline is close enough to see from the town. The sea is not what it was, but it is a sea again."
 aral_sea.7.a:0 "Raise a flag at the old pier"
 aral_sea.7.b:0 "Plan the port"
 aral_sea.8.t:0 "A Coastline Returns"
 aral_sea.8.d:0 "The reconstructed Kokaral Dam holds a higher level, and the water reaches places that have been dry for a generation. Engineers measure the new shoreline, and the maps of the region are redrawn."
 aral_sea.8.a:0 "A long road, well walked"
 aral_sea.9.t:0 "The Second Dam Holds"
 aral_sea.9.d:0 "The second dam and the harbour canal are complete. Ships can again reach Aralsk by water, and the town that gave the sea its name is, once more, a port."
 aral_sea.9.a:0 "A port again"
