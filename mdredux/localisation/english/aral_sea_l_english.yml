 aral_debug_worse_desc:0 "Testing tool: lowers water restoration by 10 points, so the picture, bar, level and debuffs move toward the worse state."
 aral_debug_better:0 "DEBUG: Improve the Aral Sea (+10%)"
 aral_debug_better_desc:0 "Testing tool: raises water restoration by 10 points, so the picture, bar, level and debuffs move toward the better state."
 aral_debug_reset:0 "DEBUG: Reset the Aral Sea"
 aral_debug_reset_desc:0 "Testing tool: sets water restoration and fallout relief back to 0 (the starting state). Project flags are not cleared."
