 aral_dike_risk_tt:0 "While it stands, drying is halved (§G-0.10%§! a month), but every month there is a §R3%§! chance that a flood washes it out"
 aral_dam2_drift_tt:0 "The wide surface evaporates more: monthly drying §R+0.03%§! and every dry year costs §R2%§! more. Only a steady inflow holds the sea at this level"
 aral_dry_tt:0 "Regulated flow: a dry year takes §G1%§! less water from the sea"
 aral_loan_unlock_tt:0 "Unlocks the §YKokaral Dam§! and the §YSyr Darya Channel§!"
 aral_uzb_drift_tt:0 "Stable flows: monthly drying after the dam is reduced by §G0.04%§!"
 aral_irrigation_drift_tt:0 "Saved water: monthly drying after the dam is reduced by §G0.04%§!"
 aral_irrigation_bonus_tt:0 "Agricultural productivity §G+5%§! (the penalty is offset by that much)"
 aral_fish_bonus_tt:0 "Income from agriculture and fishing §G+5%§!"
 aral_req_level_42:0 "Water level is at least §Y42 m§!"
 ARAL_TICK_46:0 "§Y46 m§!: the limit of the old plans (the second dam). Above it the sea stays lost: the rest of the bar is the sea of 1960"
 aral_sea.1.a:0 "Buy releases ($0.03 bn, 15 PP)"
 aral_sea.1.b:0 "Let the sea drop"
 aral_sea.1.b_tt:0 "The sea loses §R[?aral_dry_loss|0]%§! of restoration (regulated flow cuts this, the wide surface of the Second Dam raises it)"
 aral_sea.1.d:0 "Snow in the mountains was poor and the upstream reservoirs are holding back what they have. The river reaches the delta as a trickle, and the Northern Aral loses more water than it gets. Extra releases can be bought, at a price."
 aral_sea.1.t:0 "A Dry Year on the Syr Darya"
 aral_sea.2.a:0 "Rebuild it ($0.04 bn)"
 aral_sea.2.b:0 "Wait for the loan"
 aral_sea.2.d:0 "A spring flood went over the earth dike and cut a gap in it. The water gathered behind it is running back into the southern basin, and the engineers repeat that anything made of earth will go the same way sooner or later."
 aral_sea.2.t:0 "The Dike Is Washed Away"
 aral_sea.3.a:0 "Fund shelter belts ($0.05 bn)"
 aral_sea.3.b:0 "Nothing can be done yet"
 aral_sea.3.d:0 "Every dry wind lifts salt and dust off the exposed seabed and carries it over fields and villages. Doctors in Kyzylorda report more lung and kidney illness, and farmers have started to leave. Something must be done for the people who stay."
 aral_sea.3.t:0 "Salt Storms Over the Seabed"
