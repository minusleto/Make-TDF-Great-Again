 GEO_foreign_policy_doctrine_idea_desc: "Situated at the geopolitical hinge of the South Caucasus and the Black Sea, Georgia's Ministry of Foreign Affairs coordinates a multi-layered diplomatic, trade, and security strategy across our neighbors and global partners."
 GEO_fp_doctrine_start_tt: "Establishes the §YGeorgian Foreign Policy Doctrine§! national spirit, which will dynamically accumulate diplomatic, trade, and defense modifiers as we complete Foreign Policy focuses.\n"
