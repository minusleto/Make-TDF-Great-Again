 GEO_thieves_economy3_desc: "A regional syndicate spanning trans-Caucasian commerce, smuggling, and protection enterprises under state coordination."

 GEO_builders_legacy1: "Legacy of the Builder"
 GEO_builders_legacy1_desc: "Drawing inspiration from King David the Builder, state efforts are focused on administrative discipline, infrastructure development, and national revitalization."
