 GEO_stance_recognized_abk_soo_idea: "Recognized Abkhazian & South Ossetian Independence"
 GEO_stance_recognized_abk_soo_idea_desc: "Tbilisi has formally abandoned its territorial claims over Sukhumi and Tskhinvali, trading revanchist ambitions for normalized regional diplomacy and internal stability."
 GEO_stance_non_recognition_idea: "Strategic Non-Recognition & Peaceful Engagement"
 GEO_stance_non_recognition_idea_desc: "While steadfastly refusing to recognize the independence of Abkhazia and South Ossetia and rallying international non-recognition, Georgia pursues pragmatic trade, humanitarian access, and confidence-building talks."
 GEO_stance_hardliner_integrity_idea: "Hardliner Territorial Integrity Doctrine"
 GEO_stance_hardliner_integrity_idea_desc: "Georgia has adopted an uncompromising military-political doctrine aimed at the full restoration of constitutional order over Abkhazia and Samachablo by any means necessary."

 GEO_adjara_separatism_high_tt: "§YAdjaran Separatism§! is higher than §Y35§!"
 GEO_monadire_lowered_autonomy_status_tt: "§YMonadire§! autonomy status has been lowered below §YAssociated State§! (to §YSatellite§!, §YPuppet§!, or §YAutonomous Region§!)"
 GEO_zsfsr_submission_decisions_tt: "If §YArmenia§! or §YAzerbaijan§! refuses our invitation to the §YZSFSR§!, we will unlock decisions in the §YGeorgian Government§! tab to demand their immediate submission.\n"
 GEO_ussr_submission_decision_tt: "Proposes Soviet reunification to §YRussia§!. If rejected, we will unlock a decision in the §YGeorgian Government§! tab to demand their submission into the §YUSSR§!.\n"
 GEO_create_djavakheti_autonomous_subject_tt: "Establishes §YDjavakheti§! as an autonomous subject of §YGeorgia§! in §YJavakheti§!.\n"
 GEO_spawn_djavakheti_volunteer_army_tt: "Raises §G2§! Georgian-controlled §YDjavakheti Volunteer Brigade§! militia regiments in §YJavakheti§!.\n"

 GEO_negotiate_adjara_autonomy: "Negotiate Autonomous Status for Adjara"
 GEO_negotiate_adjara_autonomy_desc: "With separatist tensions in Batumi reaching dangerous levels, Tbilisi can negotiate a formal federal autonomy compact with Aslan Abashidze's administration, reorganizing Adjara as an autonomous republic under Georgian sovereignty."
 GEO_reintegrate_autonomous_adjara: "Reintegrate the Autonomous Republic of Adjara"
 GEO_reintegrate_autonomous_adjara_desc: "With central authority consolidated and national stability restored, Tbilisi can peacefully reintegrate the autonomous administration in Batumi directly into the Georgian state."

 GEO_monadire_financial_subsidies: "Extend Financial Subsidies to the Monadire"
 GEO_monadire_financial_subsidies_desc: "Provide direct financial stipends and infrastructure grants to Emzar Kvitsiani's Monadire militia in the Upper Kodori Gorge in exchange for closer subordination to the Ministry of Defense."
 GEO_monadire_weapons_shipments: "Supply Infantry Weapons to the Monadire"
 GEO_monadire_weapons_shipments_desc: "Transfer modern small arms and ammunition to the Svan defenders of Upper Kodori, binding the Monadire battalion closer to Georgian central command."
 GEO_monadire_full_integration: "Integrate Upper Kodori into Central Administration"
 GEO_monadire_full_integration_desc: "Having steadily curbed autonomous warlordism in the Kodori Gorge, Tbilisi can now formally integrate the territory and its defenders into the regular Georgian state apparatus."

 GEO_stance_abandon_and_recognize: "Diplomatic Stance: Recognize Abkhazia & South Ossetia"
 GEO_stance_abandon_and_recognize_desc: "Formally renounce Tbilisi's territorial claims over Abkhazia and South Ossetia and recognize their sovereignty in order to achieve lasting reconciliation with Sukhumi, Tskhinvali, and Moscow."
 GEO_stance_neutral_non_recognition: "Diplomatic Stance: Neutrality & Strategic Non-Recognition"
 GEO_stance_neutral_non_recognition_desc: "Maintain Georgia's official policy of strategic patience and international non-recognition of Abkhazia and South Ossetia while avoiding military escalation and keeping humanitarian and trade channels open."
 GEO_stance_hardliner_territorial_integrity: "Diplomatic Stance: Hardliner Territorial Integrity"
 GEO_stance_hardliner_territorial_integrity_desc: "Declare the restoration of Georgia's territorial integrity over Abkhazia and Samachablo to be the supreme, non-negotiable priority of the state, mobilizing the nation for decisive action."
 GEO_negotiate_ergneti_and_enguri_ceasefire: "Ergneti Market & Enguri Hydroelectric Talks"
 GEO_negotiate_ergneti_and_enguri_ceasefire_desc: "Conduct pragmatic bilateral talks with de facto authorities in Sukhumi and Tskhinvali regarding joint operation of the Enguri Dam and cross-boundary commerce, expanding Georgian soft power."
 GEO_propose_abk_soo_autonomy: "Propose Asymmetric Confederal Autonomy"
 GEO_propose_abk_soo_autonomy_desc: "Present a comprehensive constitutional settlement offering Abkhazia and South Ossetia broad autonomous status within a federal Georgian state."

 GEO_demand_submission_of_armenia: "ZSFSR: Demand the Submission of Armenia"
 GEO_demand_submission_of_armenia_desc: "Yerevan dared to reject our call for peaceful socialist federation. Issue an immediate ultimatum demanding Armenia's incorporation into the Transcaucasian SFSR—or crush their bourgeois defiance by force."
 GEO_demand_submission_of_azerbaijan: "ZSFSR: Demand the Submission of Azerbaijan"
 GEO_demand_submission_of_azerbaijan_desc: "Baku refused our invitation to reconstitute the Transcaucasian Federation. Deliver a final ultimatum demanding Azerbaijan's submission to Tbilisi."
 GEO_demand_submission_for_ussr: "USSR: Demand Soviet Submission to Tbilisi"
 GEO_demand_submission_for_ussr_desc: "Moscow rejected our proposal for voluntary Soviet reunification. As the true heirs of the Soviet vanguard, we shall demand their submission or reclaim the Union by force of arms."

 GEO_samtskhe_language_integration_decision: "Samtskhe-Javakheti: Enforce State Language Integration"
 GEO_samtskhe_language_integration_decision_desc: "Mandate comprehensive Georgian-language civil service exams and school curricula across Akhalkalaki and Ninotsminda, strengthening Tbilisi's domestic sovereignty at the cost of friction with Yerevan."
 GEO_samtskhe_security_checkpoints_decision: "Samtskhe-Javakheti: Establish Interior Ministry Checkpoints"
 GEO_samtskhe_security_checkpoints_decision_desc: "Deploy Interior Ministry border police and customs checkpoints across Samtskhe-Javakheti to dismantle informal cross-border networks and curb foreign political influence."

 geo_misc.12.t: "Establishment of the Djavakheti Autonomous Region"
 geo_misc.12.d: "Following constitutional reforms in Tbilisi, the Armenian-majority district of Javakheti has been formally organized as an autonomous administration under Georgian sovereignty, putting an end to decades of mutual distrust."
 geo_misc.12.a: "Autonomy within a united Georgia."

 geo_communist.9.t: "[From.GetNameDefCap] Rejects the ZSFSR!"
 geo_communist.9.d: "The government of [From.GetNameDef] has formally rejected our diplomatic invitation to reconstitute the Transcaucasian Socialist Federative Soviet Republic. If we are to unite the South Caucasus under the red banner, we must now decide whether to compel their submission by ultimatum and force."
 geo_communist.9.a: "We will force their compliance!"

 geo_communist.10.t: "Tbilisi Demands Our Submission into the ZSFSR!"
 geo_communist.10.d: "Having rejected their earlier diplomatic overture, the communist leadership in Tbilisi has issued a stark ultimatum to [Root.GetNameDef]: accept immediate incorporation as a constituent republic of the Transcaucasian SFSR, or face full-scale military invasion."
 geo_communist.10.a: "We have no choice but to submit."
 geo_communist.10.b: "Never! Prepare the armed forces!"

 geo_communist.11.t: "[From.GetNameDefCap] Defies Our Ultimatum!"
 geo_communist.11.d: "[From.GetNameDefCap] has rejected our final ultimatum to join the Transcaucasian SFSR and is mobilizing its forces along the border. The Red Army of Georgia must march!"
 geo_communist.11.a: "To arms!"

 geo_communist.12.t: "Tbilisi Proposes Restoration of the Soviet Union"
 geo_communist.12.d: "Having consolidated socialist rule across Transcaucasia, the Georgian government in Tbilisi has proclaimed the restoration of the Union of Soviet Socialist Republics and invited [Root.GetNameDef] to unite under the restored Soviet banner."
 geo_communist.12.a: "Long live the restored Union!"
 geo_communist.12.b: "We reject Tbilisi's pretensions!"

 geo_communist.13.t: "[From.GetNameDefCap] Rejects Soviet Unification!"
 geo_communist.13.d: "[From.GetNameDefCap] has dismissed our proposal for peaceful reunification into the restored USSR. We may now issue a direct ultimatum demanding their submission to the Soviet center in Tbilisi."
 geo_communist.13.a: "They will bow to the Red Banner!"

 geo_communist.14.t: "Tbilisi Demands Our Submission to the Restored USSR!"
 geo_communist.14.d: "The Georgian Soviet leadership has delivered an uncompromising ultimatum demanding that [Root.GetNameDef] submit to the restored Union of Soviet Socialist Republics or face a war of Soviet reunification."
 geo_communist.14.a: "Submit to the new Soviet center."
 geo_communist.14.b: "We will fight their red imperialism!"

 geo_communist.15.t: "[From.GetNameDefCap] Defies the Soviet Ultimatum!"
 geo_communist.15.d: "[From.GetNameDefCap] has defied our ultimatum for Soviet reunification. The time has come to liberate the Soviet homeland by force of arms!"
 geo_communist.15.a: "For the Soviet Union!"

 ########## Mkhedrioni & Monarchist Events ##########
 georg_mkhedrioni.2.t: "The Return of Jaba Ioseliani"
 georg_mkhedrioni.2.d: "Following widespread institutional paralysis, Jaba Ioseliani has returned to the center of Georgian power. Flanked by loyal fighters of the Mkhedrioni and prominent figures from the criminal underworld, he has proclaimed the formation of a Military-Criminal Council to restore order to Sakartvelo by any means necessary."
 georg_mkhedrioni.2.a: "Order will be established by the barrel of a gun."

 georg_mkhedrioni.3.t: "The Skeleton Dance"
 georg_mkhedrioni.3.d: "In an unapologetic purge of the state bureaucracy, Ioseliani has ordered the subordination of the police, judiciary, and prosecutor's office to the armed brotherhood. The corrupt and dysfunctional institutions are restructured around personal loyalty, street codes, and swift paramilitary justice."
 georg_mkhedrioni.3.a: "Let the street dispense justice."

 georg_mkhedrioni.4.t: "The Institutional Obshchak"
 georg_mkhedrioni.4.d: "By pooling contributions from regional transit routes, casino concessions, fuel smuggling corridors, and private protection networks into a centralized common treasury—an institutional 'obshchak'—the Mkhedrioni command has secured an independent financial foundation for state operations."
 georg_mkhedrioni.4.a: "A portion of every ruble and dollar belongs to the brotherhood."

 georg_mkhedrioni.5.t: "Traditions of the Caucasus"
 georg_mkhedrioni.5.d: "Reaffirming highland customs, orthodox patriarchal authority, and martial brotherhood, the Council has codified traditional Georgian mountain virtues as official doctrine, outlawing modern liberal decadence and binding church hierarchies into mutual security pacts."
 georg_mkhedrioni.5.a: "Honor, brotherhood, and the Holy Cross."

 georg_mkhedrioni.6.t: "Transcaucasian Underworld Summit"
 georg_mkhedrioni.6.d: "Representatives of the Georgian Mkhedrioni and criminal syndicates across the South Caucasus have gathered in Tbilisi to establish informal non-aggression protocols, coordinate lucrative regional transit rackets, and ensure smooth cross-border operations regardless of state borders."
 georg_mkhedrioni.6.a: "Borders exist for customs; brothers operate everywhere."

 georg_mkhedrioni.7.t: "Proclamation of Greater Sakartvelo"
 georg_mkhedrioni.7.d: "With internal power secured and paramilitary brigades mobilized, Jaba Ioseliani has proclaimed the doctrine of Greater Sakartvelo. Pledging to forcibly reincorporate the breakaway regions of Abkhazia and Samachablo and assert Georgian dominance over regional frontiers, the Mkhedrioni prepare for decisive confrontation."
 georg_mkhedrioni.7.a: "Sakartvelo shall be united in iron and fire!"


 GEO_border_dispute_azerbaijan: "Border Dispute with Azerbaijan"
 GEO_border_dispute_azerbaijan_desc: "The border demarcation between Georgia and Azerbaijan remains contested around the David Gareja monastery complex, creating administrative friction and security vigilance along the frontier."
 georg_fp.40.t: "Georgia Demands Full Demarcation of David Gareja"
 georg_fp.40.d: "Tbilisi has officially taken a firm stance on the David Gareja monastery ridge, demanding that Azerbaijan cede its claims and withdraw border guards from the contested heights. We must choose between conceding the ridge to preserve bilateral friendship or standing our ground with force."
 georg_fp.40.a: "Yield the Disputed Heights to Georgia"
 georg_fp.40.b: "Hold the Frontier: Stand Our Ground!"
 georg_fp.41.t: "Azerbaijan Yields Disputed Ridge at David Gareja"
 georg_fp.41.d: "Following decisive diplomatic pressure, Baku has agreed to withdraw border guards from the David Gareja heights and recognize Georgian sovereignty over the monastic ridge, securing our eastern border."
 georg_fp.41.a: "Our sacred heritage is secured!"
 georg_fp.42.t: "Victory in David Gareja Border Clashes"
 georg_fp.42.d: "Georgian border troops and rapid-reaction units have successfully held the ridge at David Gareja, repelling Azerbaijani frontier units and consolidating military dominance across the disputed heights."
 georg_fp.42.a: "The ridge is ours!"
 georg_fp.43.t: "David Gareja Border Skirmish Standoff"
 georg_fp.43.d: "Armed skirmishes along the David Gareja ridge have ended in a tactical standoff without establishing Georgian control. International mediators have stepped in to halt further escalation."
 georg_fp.43.a: "A bitter outcome."

 GEO_effect_if_they_accept_TT: "§HEffect if they Accept:§!"
 GEO_kazakh_capital_tt: "§YTrans-Caspian Kazakh Capital Investments§!\nKazakh state enterprises invest in Georgian transit and industrial manufacturing in Eastern Georgia."
 GEO_azerbaijan_georgia_electro: "Azerbaijani-Georgian Electricity Exchange"
 GEO_azerbaijan_georgia_electro_desc: "A comprehensive cross-border electricity purchase agreement providing reliable baseload power to Georgian manufacturing grids."
 GEO_azerbaijan_georgia_electro_agre: "Electricity Supply Agreement"
 GEO_azerbaijan_georgia_electro_agre_desc: "Long-term contractual power export agreements with Georgia, monetizing excess thermal power generation."

 georg_fp.13_geo.t: "Baku-Tbilisi-Ceyhan Pipeline Ratified"
 georg_fp.13_geo.d: "Azerbaijan has approved the strategic expansion of the pipeline transit corridor across Georgia, securing our transit revenues and infrastructure."
 georg_fp.13_geo.a: "An enduring energy partnership."

 georg_fp.21_geo.t: "Kazakh Capital Investment Finalized"
 georg_fp.21_geo.d: "Kazakhstan has agreed to channel investment funds into Georgian transit and industrial projects, modernizing facilities in Eastern Georgia."
 georg_fp.21_geo.a: "Welcome Trans-Caspian investments."

 georg_fp.30_geo.t: "Azerbaijani Electricity Cooperation Ratified"
 georg_fp.30_geo.d: "Azerbaijan has signed the bilateral electricity supply agreement, ensuring uninterrupted electric power for Georgian consumers and industries."
 georg_fp.30_geo.a: "Power grid secured."

 georg_fp.35.b: "Reject the Trilateral Proposal"
 georg_fp.45.t: "The Trilateral Caucasus Strategic Pact (Ankara Approves)"
 georg_fp.45.d: "Turkey has formally endorsed the Trilateral Caucasus Strategic Pact proposed by Georgia. The initiative now rests upon our decision in Baku to ratify mutual security guarantees, non-aggression commitments, and military access across the Caucasus corridor."
 georg_fp.45.a: "Ratify the Trilateral Pact"
 georg_fp.45.b: "Reject the Trilateral Pact"

 georg_fp.46.t: "Turkey Declines the Trilateral Pact"
 georg_fp.46.d: "The government in Ankara has declined our proposal to establish a formal Trilateral Caucasus Strategic Pact at this time."
 georg_fp.46.a: "A diplomatic disappointment."

 georg_fp.47.t: "Trilateral Caucasus Strategic Pact Ratified!"
 georg_fp.47.d: "Both Turkey and Azerbaijan have formally ratified the Trilateral Caucasus Strategic Pact! Non-aggression treaties, mutual military access, and collective security guarantees are now active across Georgia, Turkey, and Azerbaijan."
 georg_fp.47.a: "A historic cornerstone of Caucasian security."

 georg_fp.48.t: "Trilateral Caucasus Strategic Pact Ratified!"
 georg_fp.48.d: "Following our approval, Azerbaijan and Georgia have ratified the Trilateral Caucasus Strategic Pact, consolidating strategic cooperation and defense access across the Caucasus."
 georg_fp.48.a: "A triumph of regional partnership."

 georg_fp.49.t: "Azerbaijan Declines Trilateral Pact"
 georg_fp.49.d: "Azerbaijan has decided not to ratify the Trilateral Caucasus Strategic Pact, bringing the trilateral initiative to a close for now."
 georg_fp.49.a: "Understood."

 georg_fp.50.t: "Georgian Proposal for Russian Capital Investment"
 georg_fp.50.d: "The Georgian government has invited Russian state and private corporations - including RAO UES and VTB - to acquire stakes in Georgia's electricity distribution networks, metallurgical plants, and transport infrastructure, offering preferential market access in exchange for capital investment."
 georg_fp.50.a: "Invest in Georgian energy and industrial assets."
 georg_fp.50.b: "Decline the investment proposal."

