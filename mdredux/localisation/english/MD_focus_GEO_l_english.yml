 ########## Georgian Foreign Policy Events (georg_fp.1 - 38) ##########
 georg_fp.1.t: "Georgia Proposes Restoration of Bilateral Trade"
 georg_fp.1.d: "The Ministry of Foreign Affairs in Tbilisi has approached our government with a formal proposal to reopen border customs checkpoints at Verkhny Lars and lift restrictions on Georgian wine, mineral water, and agricultural imports.\n\nRestoring commercial ties will benefit border regions in the North Caucasus and give Moscow renewed economic leverage in Tbilisi."
 georg_fp.1.a: "Reopen the border and resume bilateral trade."
 georg_fp.1.b: "Maintain existing sanitary and trade restrictions."
 georg_fp.2.t: "Gazprom Transit Agreement with Georgia"
 georg_fp.2.d: "Georgian energy officials have finalized negotiations with Gazprom to modernize the North-South Main Gas Pipeline supplying Georgia and Armenia, offering long-term transit stability in exchange for predictable winter gas deliveries."
 georg_fp.2.a: "Sign the Gazprom transit and supply protocol."
 georg_fp.2.b: "Reject the proposed transit terms."
 georg_fp.3.t: "Georgia Proposes Visa-Free Travel & Direct Flights"
 georg_fp.3.d: "In a major gesture aimed at encouraging tourism, labor mobility, and people-to-people ties, the Georgian government has proposed abolishing visa requirements and restoring direct air links with Russia."
 georg_fp.3.a: "A welcome step toward normalization."
 georg_fp.3.b: "Keep travel restrictions in place."
 georg_fp.4.t: "Audit of Strategic Assets & FSB Networks"
 georg_fp.4.d: "Georgian counter-intelligence and financial auditors have uncovered extensive covert networks linking Russian intelligence services to strategic energy and telecommunications firms operating inside Georgia.\n\nWe can either nationalize and auction the implicated enterprises to replenish the state treasury, or focus on a covert counter-intelligence sweep to dismantle the spy rings."
 georg_fp.4.a: "Seize the compromised assets and auction them!"
 georg_fp.4.b: "Dismantle the intelligence cells quietly and bolster state security."
 georg_fp.5.t: "The Tbilisi-Kyiv Black Sea Strategic Axis"
 georg_fp.5.d: "Seeking to counter Russian hegemony in the Black Sea basin, the Georgian government has proposed elevating bilateral relations between Tbilisi and Kyiv into a formal mutual security and defense partnership."
 georg_fp.5.a: "Sign the Tbilisi-Kyiv Mutual Security Charter!"
 georg_fp.5.b: "Limit cooperation to diplomatic consultations."
 georg_fp.6.t: "Franco-Georgian Defense & Mountain Warfare Cooperation"
 georg_fp.6.d: "Recalling the historic ties forged by the Georgian political emigration at Leuville-sur-Orge, Tbilisi has invited French Alpine military instructors to help establish the Sachkhere Mountain Warfare School and expand bilateral defense cooperation."
 georg_fp.6.a: "Vive l'amitie franco-georgienne!"
 georg_fp.6.b: "Decline the defense cooperation proposal."
 georg_fp.7.t: "EU Association Agreement & Georgian Reform Fund"
 georg_fp.7.d: "Georgia has enacted comprehensive anti-corruption reforms and aligned its economic standards with the European Union. Brussels has opened a diplomatic window for EU member states to contribute 50 Political Power to sponsor institutional harmonization, in exchange for gaining political and economic influence in Georgia."
 georg_fp.7.a: "Contribute to the Georgian Reform Fund"
 georg_fp.7.b: "Decline to Contribute"
 georg_fp.8.t: "Georgia Requests Entry into the IMET Program"
 georg_fp.8.d: "The Georgian Ministry of Defense has formally applied to enroll in the US International Military Education and Training (IMET) program, seeking to send a new generation of Georgian officers to American military academies."
 georg_fp.8.a: "Welcome Georgian officers to our military academies."
 georg_fp.8.b: "Decline the request at this time."
 georg_fp.9.t: "Launch of the Georgia Train and Equip Program (GTEP)"
 georg_fp.9.d: "To help Tbilisi secure the Pankisi Gorge and modernize its armed forces to NATO standards, Georgia has requested the deployment of US Special Forces instructors to Krtsanisi under the Georgia Train and Equip Program (GTEP)."
 georg_fp.9.a: "Deploy our instructors and equipment to Tbilisi."
 georg_fp.9.b: "Withhold military training authorization."
 georg_fp.10.t: "US Special Forces Instructors Arrive at Krtsanisi"
 georg_fp.10.d: "American Green Berets and US Marine Corps instructors have arrived at the Krtsanisi National Training Center outside Tbilisi to begin the Georgia Train and Equip Program (GTEP).\n\nOver the coming months, four Georgian light infantry battalions and mechanized tactical groups will be equipped with modern communications gear, uniforms, and NATO-standard small arms."
 georg_fp.10.a: "A new era for the Georgian Armed Forces!"
 georg_fp.11.t: "Georgia Requests NATO Integration & Security Guarantees"
 georg_fp.11.d: "The Georgian government has formally submitted an expedited request to join the North Atlantic Treaty Organization, seeking full Article 5 collective security guarantees. The United States must decide whether to sponsor Georgia's immediate accession or withhold membership due to unresolved territorial disputes in Abkhazia and South Ossetia."
 georg_fp.11.a: "Admit Georgia into NATO!"
 georg_fp.11.b: "Postpone Full Accession — Grant Major Non-NATO Ally Status"
 georg_fp.12.t: "The GUAM Summit for Democracy and Economic Development"
 georg_fp.12.d: "Delegations from Georgia, Ukraine, Azerbaijan, and Moldova have been invited by Tbilisi to convene at the GUAM Summit and sign a new charter strengthening regional free trade, border cooperation, and energy transit security."
 georg_fp.12.a: "Long live the GUAM partnership!"
 georg_fp.12.b: "Decline to ratify the new GUAM charter."
 georg_fp.13.t: "Inauguration of the Baku-Tbilisi-Ceyhan & South Caucasus Pipelines"
 georg_fp.13.d: "Georgia has proposed finalizing the intergovernmental transit agreements for the Baku-Tbilisi-Ceyhan (BTC) oil pipeline and the South Caucasus gas pipeline, linking Caspian hydrocarbons directly to Western markets."
 georg_fp.13.a: "A triumph of South Caucasian strategic cooperation!"
 georg_fp.13.b: "Suspend pipeline transit negotiations."
 georg_fp.14.t: "The David Gareja Border Demarcation"
 georg_fp.14.d: "The medieval monastery complex of David Gareja spans an un-demarcated sector of the Georgian-Azerbaijani state border. Georgia can double down and demand Azerbaijan yield the disputed monastic ridge, risking military tension, or formally demarcate the boundary in exchange for a significant 5.0 Billion financial settlement from Baku."
 georg_fp.14.a: "Double Down: Demand Azerbaijan Yield the Monastic Ridge"
 georg_fp.14.b: "Cede Disputed Ridges for $5.0B in Financial Compensation"
 georg_fp.15.t: "Georgian-Armenian Intergovernmental Commission"
 georg_fp.15.d: "Tbilisi has proposed convening a high-level session of the Georgian-Armenian Intergovernmental Commission on Economic Cooperation to streamline border crossings, transport links, and diplomatic coordination."
 georg_fp.15.a: "Strengthen our historic neighborly friendship."
 georg_fp.15.b: "Decline the diplomatic initiative."
 georg_fp.16.t: "Georgian-Armenian High-Voltage Energy & Transit Accord"
 georg_fp.16.d: "Georgia has proposed a bilateral agreement expanding cross-border high-voltage electricity exchanges and reducing rail freight tariffs between Yerevan and Georgian Black Sea ports."
 georg_fp.16.a: "Mutual prosperity for both nations."
 georg_fp.16.b: "Reject the proposed transit tariff terms."
 georg_fp.17.t: "The Trabzon Declaration: Georgian-Turkish Strategic Partnership"
 georg_fp.17.d: "Meeting in Trabzon, Georgian diplomats have proposed signing a comprehensive Strategic Partnership Declaration with Turkey to expand free trade, customs modernization at Sarpi, and joint Black Sea security."
 georg_fp.17.a: "Friends and strategic partners across the Chorokhi!"
 georg_fp.17.b: "Decline the strategic partnership charter."
 georg_fp.18.t: "Georgian-Israeli Defense & Avionics Partnership"
 georg_fp.18.d: "The Georgian Ministry of Defense has proposed major procurement and modernization agreements with Israeli defense industries, covering aircraft avionics upgrades, unmanned aerial vehicles, and military training."
 georg_fp.18.a: "Deepen defense and technological ties with Georgia."
 georg_fp.18.b: "Decline the defense cooperation proposal."
 georg_fp.19.t: "Israeli Cyber-Defense & Drip-Irrigation Technology Transfer"
 georg_fp.19.d: "Georgia has invited Israeli technology specialists to partner with Georgian ministries and agricultural cooperatives to deploy state-of-the-art cyber-defense systems in Tbilisi and modern drip-irrigation networks across eastern Georgia."
 georg_fp.19.a: "Innovation and security hand in hand."
 georg_fp.19.b: "Decline the technology transfer agreement."
 georg_fp.20.t: "Warsaw-Vilnius-Tallinn Defense Cooperation"
 georg_fp.20.d: "Seeking to counter shared regional threats, Georgia has proposed a defense and military cooperation accord with Poland, Lithuania, and Estonia, focusing on military training, joint doctrine sharing, and mutual security assistance."
 georg_fp.20.a: "Ratify Joint Military Cooperation!"
 georg_fp.20.b: "Decline Defense Agreement"
 georg_fp.21.t: "KazMunayGas Acquires the Batumi Oil Terminal"
 georg_fp.21.d: "Georgia has proposed a major investment agreement granting Kazakh state energy enterprises long-term operating rights at the Batumi Oil Terminal and port facilities, cementing the Trans-Caspian transit corridor."
 georg_fp.21.a: "A vital gateway to the Black Sea for Kazakhstan!"
 georg_fp.21.b: "Pass on the Batumi investment offer."
 georg_fp.22.t: "The Tbilisi Silk Road Forum: Eurasian Middle Corridor"
 georg_fp.22.d: "Georgia has invited Beijing to co-sponsor the Tbilisi Silk Road Forum and sign a comprehensive Belt and Road Middle Corridor trade and transit agreement linking China to Europe across the South Caucasus and Black Sea."
 georg_fp.22.a: "Georgia is a vital pillar of the Middle Corridor!"
 georg_fp.22.b: "Decline to prioritize the Caucasian corridor."
 georg_fp.23.t: "Georgia Proposes European Neighbourhood Policy Action Plan"
 georg_fp.23.d: "The Georgian government has formally petitioned Brussels and leading EU member states to adopt an ambitious European Neighbourhood Policy (ENP) Action Plan, committing Tbilisi to regulatory harmonization and judicial reform in exchange for European financial and technical assistance."
 georg_fp.23.a: "Approve the EU-Georgia ENP Action Plan!"
 georg_fp.23.b: "Delay the Action Plan."
 georg_fp.24.t: "Georgia Completes EU Visa Liberalization Benchmarks"
 georg_fp.24.d: "Having introduced biometric passports, modernized border management, and aligned migration controls with European standards, Georgia has formally requested visa-free travel for Georgian citizens across the Schengen Area."
 georg_fp.24.a: "Grant visa-free Schengen travel to Georgia!"
 georg_fp.24.b: "Withhold visa liberalization for now."
 georg_fp.25.t: "US-Georgian Coast Guard & Poti Naval Modernization"
 georg_fp.25.d: "To safeguard Black Sea maritime routes and counter smuggling, Tbilisi has requested US Coast Guard assistance to modernize the Poti naval facility and train Georgian maritime patrol crews."
 georg_fp.25.a: "Approve the Coast Guard modernization package."
 georg_fp.25.b: "Decline maritime assistance."
 georg_fp.26.t: "Georgian Contingent Joins ISAF in Afghanistan"
 georg_fp.26.d: "The Republic of Georgia has offered to deploy infantry battalions to serve alongside US and NATO forces in Afghanistan under the International Security Assistance Force (ISAF), requesting American utility vehicles and logistical support."
 georg_fp.26.a: "Welcome our Georgian comrades-in-arms!"
 georg_fp.26.b: "Decline the deployment offer."
 georg_fp.27.t: "Georgian Brigade Deploys to Multi-National Force - Iraq"
 georg_fp.27.d: "Tbilisi has offered to deploy up to 2,000 Georgian troops to Iraq in support of coalition stabilization operations, requesting coalition operational funding and military advisory support."
 georg_fp.27.a: "Accept the Georgian coalition deployment!"
 georg_fp.27.b: "We do not require additional coalition troops."
 georg_fp.28.t: "Georgian-Azerbaijani Strategic Partnership Charter"
 georg_fp.28.d: "Tbilisi has proposed elevating bilateral ties between Georgia and Azerbaijan into a formal Strategic Partnership Charter, coordinating diplomacy, transit security, and mutual sovereignty defense."
 georg_fp.28.a: "Sign the Strategic Partnership Charter with Tbilisi!"
 georg_fp.28.b: "Keep relations at their current level."
 georg_fp.29.t: "Georgian-Azerbaijani Digital & Educational Fiber Accord"
 georg_fp.29.d: "Georgia has proposed a joint bilateral program to lay high-capacity fiber-optic communications lines between Tbilisi and Baku and expand technical university exchanges."
 georg_fp.29.a: "Invest in our shared digital and educational future."
 georg_fp.29.b: "Decline the joint program."
 georg_fp.30.t: "South Caucasus High-Voltage Power Grid Synchronization"
 georg_fp.30.d: "Georgian energy authorities have proposed synchronizing the Georgian and Azerbaijani high-voltage electricity grids via the Gardabani converter station to expand cross-border power trade."
 georg_fp.30.a: "Synchronize our power grids and expand energy exports!"
 georg_fp.30.b: "Decline the grid integration project."
 georg_fp.31.t: "Tbilisi-Yerevan Highway & Rail Transit Modernization"
 georg_fp.31.d: "Georgia has allocated capital to upgrade the highway and rail links connecting Armenia to Tbilisi and Black Sea ports, inviting Yerevan to co-finance customs and transit modernization."
 georg_fp.31.a: "Co-finance the transit corridor upgrades!"
 georg_fp.31.b: "Decline participation."
 georg_fp.32.t: "Georgian-Armenian Biometric ID Visa-Free Travel Treaty"
 georg_fp.32.d: "Tbilisi has proposed a bilateral treaty allowing citizens of Georgia and Armenia to cross the shared border using internal biometric ID cards, boosting labor mobility, tourism, and cross-border commerce."
 georg_fp.32.a: "Open our borders to simplified ID-card travel!"
 georg_fp.32.b: "Maintain standard passport controls."
 georg_fp.33.t: "Sadakhlo-Bagratashen Joint Border Management Protocol"
 georg_fp.33.d: "Georgia has proposed establishing integrated border management, joint anti-smuggling patrols, and direct military border communications along the Georgian-Armenian frontier."
 georg_fp.33.a: "Sign the joint border management protocol."
 georg_fp.33.b: "Decline joint border patrols."
 georg_fp.34.t: "Sarpi One-Stop Customs & Marneuli Airbase Modernization"
 georg_fp.34.d: "Tbilisi has proposed establishing a joint 'one-stop' customs terminal at the Sarpi border crossing in Adjara and invited Turkish military engineers to assist in modernizing the Marneuli airbase."
 georg_fp.34.a: "Upgrade Sarpi customs and dispatch military engineers to Marneuli!"
 georg_fp.34.b: "Decline the infrastructure proposal."
 georg_fp.35.t: "The Trilateral Caucasus Strategic Pact"
 georg_fp.35.d: "Recognizing shared regional stability, mutual security interests, and identical political alignments, Turkey, Azerbaijan, and Georgia have signed the Trilateral Caucasus Strategic Pact, sealing non-aggression, mutual military access, and reciprocal security guarantees across the South Caucasus."
 georg_fp.35.a: "Celebrate the Caucasus Trilateral Accord!"
 georg_fp.36.t: "Elbit Systems & Rafael SPYDER-SR Air-Defense Contract"
 georg_fp.36.d: "The Georgian Ministry of Defense has placed a $3.0 billion procurement order with Elbit Systems and Rafael for mobile SPYDER-SR surface-to-air missile batteries, C4I command systems, and Su-25KM avionics upgrades."
 georg_fp.36.a: "Approve the defense export contract and deliver the systems!"
 georg_fp.36.b: "Block the defense export license and refund Tbilisi."
 georg_fp.37.t: "The Poti-Constanta-Varna Black Sea Ferry Bridge"
 georg_fp.37.d: "Georgia has proposed establishing high-capacity roll-on/roll-off (Ro-Ro) rail and cargo ferry links across the Black Sea to connect Georgian ports directly with the European Union."
 georg_fp.37.a: "Establish the Black Sea ferry corridor!"
 georg_fp.37.b: "Decline the maritime ferry agreement."
 georg_fp.38.t: "Persian Gulf-Black Sea Transit & Sovereign Investment Accord"
 georg_fp.38.d: "Georgia has invited Gulf and Iranian trade delegations to establish a North-South transit corridor to the Black Sea ports of Poti and Batumi, paired with visa facilitation and free industrial zone tax incentives."
 georg_fp.38.a: "Invest in Georgia's Black Sea logistics and transit zones!"
 georg_fp.38.b: "Decline the investment proposal."
 georg_fp.39.t: "The Status of Russian Military Bases in Georgia"
 georg_fp.39.d: "Since the collapse of the Soviet Union, units of the Group of Russian Forces in the Transcaucasus have remained stationed at military bases in Vaziani, Batumi, and Akhalkalaki. Under the 1999 Istanbul OSCE Summit commitments, Moscow pledged to negotiate the closure and withdrawal of these garrisons, yet Russian commanders continue to delay.\n\nOur government must now make a strategic choice: enforce the Istanbul commitments and demand the immediate withdrawal of Russian troops from Georgian soil, or permit the Russian bases to remain under a long-term leasing arrangement in exchange for financial compensation and security assurances."
 georg_fp.39.a: "Demand the immediate withdrawal of all Russian military bases!"
 georg_fp.39.b: "Allow the Russian bases to remain and extend their lease."
 ########## Actual Georgian Dream Focuses & Missing Keys ##########
 GEO_faith_of_georgia: "The Faith of Georgia"
 GEO_faith_of_georgia_desc: "For over fifteen centuries, the Georgian Orthodox Church has been the spiritual pillar of our nation. Strengthening the bond between state and Patriarchate reinforces national unity and traditional values."
 GEO_Parliamenteary_Reform: "Constitutional Parliamentary Reform"
 GEO_Parliamenteary_Reform_desc: "Completing Georgia's transition from a super-presidential system to a parliamentary republic ensures that executive authority rests with the parliamentary majority and prime minister."
 GEO_Populist_Rhetoric: "Social Solidarity & Populist Appeal"
 GEO_Populist_Rhetoric_desc: "Addressing the grievances of ordinary Georgians left behind by shock-therapy market reforms through higher social spending, pension increases, and worker protections."
 GEO_Ivanishvili_s_Gamble: "Ivanishvili's Political Gamble"
 GEO_Ivanishvili_s_Gamble_desc: "Stepping directly from philanthropy and business into the political arena, Bidzina Ivanishvili stakes his fortune and prestige on reshaping Georgia's political landscape."
 GEO_Investigacia_Saakasha: "Restoration of Justice: Investigate the Old Regime"
 GEO_Investigacia_Saakasha_desc: "Prosecutors launch sweeping investigations into abuses of power, property seizures, and human rights violations committed by senior officials of the former United National Movement administration."
 GEO_State_Universal_Healthcare_Program: "Launch the Universal Healthcare Program"
 GEO_State_Universal_Healthcare_Program_desc: "Introducing state-funded universal health insurance guarantees every Georgian citizen access to essential medical care, dramatically reducing household out-of-pocket health costs."
 GEO_Russian_Trade_Deals: "Reopen the Northern Market"
 GEO_Russian_Trade_Deals_desc: "Through pragmatic bilateral trade negotiations, Georgian wine, mineral water, and agricultural products return to Russian shelves, revitalizing rural Kakheti and western Georgia."
 GEO_European_Strategic_Partnerships: "Deepen European Strategic Partnerships"
 GEO_European_Strategic_Partnerships_desc: "Expanding institutional, trade, and regulatory alignment with the European Union demonstrates that pragmatic diplomacy and European integration go hand in hand."
 GEO_Ivanishvilis_Ways: "The Glass Palace: Informal Governance"
 GEO_Ivanishvilis_Ways_desc: "From his residence overlooking Tbilisi, Bidzina Ivanishvili guides strategic state decisions through a trusted network of Cartu Group executives, advisors, and loyal ministers."
 GEO_Corruption_Crackdown: "Anti-Corruption & Judicial Audit"
 GEO_Corruption_Crackdown_desc: "Reforming public procurement, auditing municipal budgets, and curbing petty administrative abuses strengthens state efficiency and investor confidence."
 GEO_Connections_with_Oligarchs: "Co-opt the Business Elite"
 GEO_Connections_with_Oligarchs_desc: "Aligning Georgia's major financial, construction, and industrial magnates with the ruling coalition secures domestic investment and political stability."
 GEO_Deal_with_Salome: "Settle the Dispute with Salome Zurabishvili"
 GEO_Deal_with_Salome_desc: "Tensions between President Salome Zurabishvili at the Orbeliani Palace and the Prime Minister over the conduct of Georgia's European Union partnership have reached a boiling point, requiring a decisive resolution."
 GEO_Decision_on_Demilitarization: "Review the National Defense Posture"
 GEO_Decision_on_Demilitarization_desc: "Following the costly military confrontations of the past, the government must decide whether to prioritize defense modernization or shift resources toward civilian infrastructure and strategic restraint."
 GEO_Stance_on_EU_Reforms: "The EU Reform Benchmarks"
 GEO_Stance_on_EU_Reforms_desc: "Brussels has presented a list of judicial, electoral, and anti-oligarchic benchmarks required for Georgia's next stage of European integration."
 GEO_Anti_Protest_Trainings_nbsp: "Modernize Special Tasks Department Crowd Control"
 GEO_Anti_Protest_Trainings_nbsp_desc: "Equipping and training the Ministry of Internal Affairs' Special Tasks Department ensures that street demonstrations and radical opposition rallies on Rustaveli Avenue cannot paralyze the state."
 GEO_Restricting_Russia: "Safeguard Strategic Sectors from Russian Leverage"
 GEO_Restricting_Russia_desc: "Imposing strict regulatory oversight on foreign state-owned enterprises prevents northern capital from turning trade ties into political leverage over Tbilisi."
 GEO_Pragmatic_Relationship: "The Karasin–Abashidze Normalization Format"
 GEO_Pragmatic_Relationship_desc: "Institutionalizing pragmatic bilateral dialogue with Moscow expands cross-border transport, direct flights, and energy trade while avoiding military escalation."
 GEO_Stance_on_LGBT: "Define State Policy on Traditional Family Values"
 GEO_Stance_on_LGBT_desc: "Caught between Western human rights expectations and the strong conservative consensus of Georgian society and the Orthodox Church, parliament must define its legal stance."
 GEO_Keeping_the_Trade_Distance: "Balanced Multi-Vector Trade Policy"
 GEO_Keeping_the_Trade_Distance_desc: "By diversifying trade across the European Union, Turkey, China, and the CIS without becoming overly dependent on any single power, Georgia maximizes its economic sovereignty."
 GEO_Georgian_Prosperity_Above_All: "Georgian Prosperity Above All"
 GEO_Georgian_Prosperity_Above_All_desc: "Subordinating ideological crusades to concrete economic growth, infrastructure modernization, and household welfare delivers sustained prosperity across Georgia."
 GEO_Salome_Way: "The Orbeliani Palace European Initiative"
 GEO_Salome_Way_desc: "President Salome Zurabishvili leverages her personal diplomatic ties in Paris, Berlin, and Brussels to champion Georgia's European Union candidacy."
 GEO_Between_Two_Fire: "Sovereign Peace Between Great Powers"
 GEO_Between_Two_Fire_desc: "Refusing to allow Georgia to be dragged into a destructive second front or foreign proxy conflict, Tbilisi charts a cautious course of sovereign peace and non-escalation."
 GEO_Georgian_Dreams_Dominance: "Consolidate the Constitutional Majority"
 GEO_Georgian_Dreams_Dominance_desc: "With the opposition fractured and the ruling party commanding a parliamentary supermajority, Georgian Dream cements its long-term political dominance."
 GEO_Towards_the_Georgian_Dream: "Fulfill the Georgian Dream"
 GEO_Towards_the_Georgian_Dream_desc: "A stable, sovereign, and prosperous Georgia—at peace with its neighbors, rooted in its traditions, and connected to global markets—stands as the culmination of the Georgian Dream."

 ########## Missing Georgian Ideas & Tooltips ##########
 GEO_Georgian_Dream_anticorruption_idea: "Institutional Anti-Corruption Drive"
 GEO_Georgian_Dream_anticorruption_idea_desc: "Streamlined public procurement and financial oversight have reduced administrative waste across Georgian ministries."
 GEO_Georgian_Dream_LGBT_idea: "Anti-Discrimination Legal Protections"
 GEO_Georgian_Dream_LGBT_idea_desc: "Parliament has enacted anti-discrimination legislation aligned with European Union human rights standards, pleasing Western partners while provoking strong domestic conservative backlash."
 GEO_Georgian_Dream_Anti_LGBT_idea: "Constitutional Protection of Traditional Family Values"
 GEO_Georgian_Dream_Anti_LGBT_idea_desc: "The government has enshrined traditional family values in law with the full blessing of the Georgian Orthodox Patriarchate, rallying conservative voters."
 GEO_Georgian_Dream_populist_idea: "Social Solidarity & Welfare Expansion"
 GEO_Georgian_Dream_populist_idea_desc: "Expanded state pensions, universal healthcare coverage, and rural subsidies bolster household living standards across Georgia."
 GEO_support_armenians_monarchists: "Royal Patronage of Armenian Monarchists"
 GEO_support_armenians_monarchists_desc: "Tbilisi supports monarchist and traditionalist circles in Armenia who recognize the shared medieval heritage of the Bagrationi-Bagratuni dynasty."
 GEO_Zhvania_rage: "Zurab Zhvania's Parliamentary Opposition"
 GEO_Zhvania_rage_desc: "Having survived an assassination plot, Prime Minister Zurab Zhvania has broken with President Saakashvili, rallying a formidable opposition bloc in Parliament."
 GEO_saakashvili_2: "Saakashvili's Consolidated Presidency"
 GEO_saakashvili_2_desc: "With internal rivals sidelined and executive authority concentrated in the presidency, Mikheil Saakashvili drives rapid state modernization."
 GEO_saakashvili_3: "Saakashvili's Unchallenged Executive"
 GEO_saakashvili_3_desc: "The United National Movement's executive vertical exercises sweeping control over Georgia's bureaucracy, courts, and security organs."
 GEO_western_civilization2_idea: "Beacon of Euro-Atlantic Democracy"
 GEO_western_civilization2_idea_desc: "Georgia stands as the premier Western-oriented reform state in the South Caucasus, deeply integrated with European and Euro-Atlantic institutions."
