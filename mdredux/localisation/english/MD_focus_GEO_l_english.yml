 GEO_integrate_transcaucasian_republics: "ZSFSR: Integrate the Transcaucasian Constituent Republics"
 GEO_integrate_transcaucasian_republics_desc: "With Armenia and Azerbaijan brought under the authority of the Transcaucasian Socialist Federative Soviet Republic, the Central Executive Committee in Tbilisi can now abolish internal customs barriers and fully integrate Transcaucasia as core Soviet territory."

 geo_communist.16.t: "The Grandson of the Vozhd Takes Command"
 geo_communist.16.d: "Colonel Yevgeny Dzhugashvili - grandson of Joseph Vissarionovich Stalin and veteran Soviet military historian - has assumed leadership of the Georgian Soviet Socialist Republic. Addressing a parade of Red Army units in Tbilisi, Dzhugashvili vowed to restore iron military discipline, modernize the defense industry, and reclaim the legacy of his grandfather."
 geo_communist.16.a: "Reorganize the Red Officer Corps and restore iron command!"
 geo_communist.16.b: "Launch a Five-Year Defense Industrial Plan!"

 geo_communist.17.t: "The Red Synod of Tbilisi: Elder Tsiklauri's Blessing"
 geo_communist.17.d: "Under the spiritual guidance of Elder Ivan Tsiklauri, a special convocation of clergy and party delegates in Tbilisi has proclaimed the synthesis of early Christian communal brotherhood and socialist justice. Parish councils and workers' soviets now stand united against capitalist exploitation and foreign cultural subversions."
 geo_communist.17.a: "Cross and Hammer united for the working people!"

 geo_communist.18.t: "Tbilisi Proposes Minsk-Tbilisi Socialist Partnership"
 geo_communist.18.d: "The newly consolidated socialist government in Georgia has reached out to Minsk, proposing a bilateral strategic and industrial alliance uniting Belarus and Georgia against Western sanctions and NATO encroachment, paired with joint tractor, agricultural, and manufacturing investments."
 geo_communist.18.a: "Stand shoulder to shoulder with Soviet Georgia!"
 geo_communist.18.b: "Decline the bilateral alliance."

 geo_communist.19.t: "Hot War, Frozen Peace: The Fate of Abkhazia & South Ossetia"
 geo_communist.19.d: "For over a decade, the fratricidal conflicts in Abkhazia and South Ossetia - fomented by bourgeois nationalists in the 1990s - have left Georgia divided. Now that Soviet power has been restored in Tbilisi, the Central Committee must decide whether to march the Red Army into Sukhumi and Tskhinvali by force, or offer both regions immediate reintegration as Socialist Autonomous Republics."
 geo_communist.19.a: "The Red Army Marches: Crush Separatist Defiance!"
 geo_communist.19.b: "Offer Socialist Autonomous Republic Reintegration"

 geo_communist.20.t: "Tbilisi Proposes Socialist Autonomous Reintegration"
 geo_communist.20.d: "The restored Soviet government in Tbilisi has issued a formal proclamation to [Root.GetNameDef], repudiating the bourgeois nationalist conflicts of 1991-1993 and offering immediate reintegration into the Georgian SSR as an Autonomous Soviet Socialist Republic - warning that refusal will be met with the full force of the Red Army."
 geo_communist.20.a: "Rejoin the Georgian SSR as a Soviet Autonomous Republic."
 geo_communist.20.b: "Reject Tbilisi's offer and prepare for war!"

 geo_communist.21.t: "The Red Road Back to the Union"
 geo_communist.21.d: "Having united the revolutionary vanguard of the Caucasus, the Presidium in Tbilisi has formally denounced the 1991 Belovezha Accords as illegal and proclaimed the restoration of the Union of Soviet Socialist Republics, dispatching a delegation to Moscow to demand immediate Soviet reunification."
 geo_communist.21.a: "The Union of Soviet Socialist Republics shall live again!"



 georg_monarchist.11.t:0 "The Bagrationi Claim to Suzerainty"
 georg_monarchist.11.d:0 "Georgia has invoked its Bagrationi heritage to demand Armenian submission. The proposed settlement would make Armenia a Saeristavo under the Georgian Crown, install Armenian monarchists in government, and place our foreign and military policy under Tbilisi's authority.\n\nIf Georgian influence in our country has reached 30%, resistance is no longer politically possible. Below that threshold, our government will reject the request and uphold Armenian independence."
 georg_monarchist.11.a:0 "Accept Georgian suzerainty as a Saeristavo."
 georg_monarchist.11.b:0 "Reject the Bagrationi demand."
 georg_monarchist.12.t:0 "Armenia Accepts the Bagrationi Settlement"
 georg_monarchist.12.d:0 "Our influence in Yerevan has secured Armenia's submission. Armenian monarchists have taken power and accepted the authority of the Georgian Crown. Armenia now stands as a Saeristavo, retaining its domestic administration while providing troops, industrial resources and strategic support to its Georgian overlord."
 georg_monarchist.12.a:0 "The Bagrationi banner rises over a new Saeristavo."
 georg_monarchist.13.t:0 "Armenia Rejects Our Heritage Claim"
 georg_monarchist.13.d:0 "Our influence in Armenia was insufficient to secure the settlement. Yerevan has refused to submit to the Georgian Crown.\n\nThe royal army will concentrate its reconnaissance, supplies and operational planning against Armenia. For the next 180 days, our forces will gain a strong advantage in attack and defense against Armenian troops, and the Crown will have a limited opportunity to impose its suzerainty by war."
 georg_monarchist.13.a:0 "Prepare the royal armies to enforce our claim."
 autonomy_saeristavo_geo:0 "Saeristavo"
 GEO_bagrationi_campaign:0 "The Crown's Armenian Campaign"
 GEO_bagrationi_campaign_desc:0 "The royal army has concentrated its reconnaissance, supplies and operational planning against Armenia. Georgian forces gain +20% attack and defense against Armenia for 180 days."
 GEO_settlement_armenia_tt:0 "§YArmenia will receive our request.§!\nWith §Y30% or more Georgian influence§!, Armenia is guaranteed to become a §YSaeristavo§! subject of Georgia and Armenian monarchists take power.\nWith §Yless than 30%§!, Armenia refuses. Georgia gains §G20%§! attack and defense against Armenia for §Y180 days§! and a §Y180-day puppet wargoal§! against Armenia."
 GEO_settlement_outcomes_tt:0 "The focus grants §Ynon-expiring puppet wargoals§! against existing Azerbaijan, Abkhazia and South Ossetia, excluding our subjects and current enemies.\nIf Armenia exists and is not already our subject, the Crown will invoke its heritage and request Armenian submission. §Y30% or more Georgian influence§! guarantees acceptance as a §YSaeristavo§! under Armenian monarchists. Below §Y30%§!, refusal grants Georgia §G20%§! attack and defense against Armenia and a puppet wargoal, both lasting §Y180 days§!."
