 ########## Communist Ideas & Cosmetic Tags ##########
 GEO_red_pioneers1_idea: "Militarized Red Pioneers"
 GEO_red_pioneers1_idea_desc: "The Young Pioneers of Georgia have been expanded into a nationwide patriotic and paramilitary youth organization, preparing a new generation for labor and defense of the socialist homeland."
 GEO_pipia_red_terror_idea: "Pipia's Vanguard Discipline"
 GEO_pipia_red_terror_idea_desc: "Under Temur Pipia and the Unified Communist Party, strict ideological discipline, state planning, and revolutionary vigilance govern every ministry and enterprise."
 GEO_heir_of_vozhd_idea: "Heir of the Vozhd"
 GEO_heir_of_vozhd_idea_desc: "With Yevgeny Dzhugashvili—grandson of Joseph Stalin—elevated to the leadership of the Georgian Republic, the martial and industrial legacy of the Vozhd inspires the nation."
 GEO_christian_communism_idea: "Orthodox Christian Socialism"
 GEO_christian_communism_idea_desc: "Reconciling the social teachings of the Early Church with socialist collective solidarity, Georgia's Christian Communists unite red banners with Orthodox heritage."
 GEO_ZSFSR_communism: "Transcaucasian Socialist Federative Soviet Republic"
 GEO_ZSFSR_communism_DEF: "the Transcaucasian Socialist Federative Soviet Republic"
 GEO_ZSFSR_communism_ADJ: "Transcaucasian Soviet"

 ########## Georgian Dream & Communist Events ##########
 georg_geo_dream.3.t: "The Karasin-Abashidze Format"
 georg_geo_dream.3.d: "Following years of severed diplomatic ties with Moscow, our government has established a pragmatic bilateral dialogue channel to restore trade, transport links, and agricultural exports to the Russian market.\n\nGeorgian wine, mineral water, and citrus producers stand to gain billions in renewed export revenue, while direct flights and border transit will bring immediate relief to tens of thousands of families. Critics in the opposition warn that deeper economic reliance on Russia gives Moscow leverage over Tbilisi, forcing us to decide how far normalization should go."
 georg_geo_dream.3.a: "Keep the reset focused on trade and transport."
 georg_geo_dream.3.b: "Expand full market access and bilateral economic ties."
 georg_geo_dream.4.t: "The Middle Corridor & Chinese Investment"
 georg_geo_dream.4.d: "Delegations from Beijing have arrived in Tbilisi to negotiate long-term transit agreements, free trade arrangements, and major infrastructure investments along the Trans-Caspian East-West Middle Corridor.\n\nA comprehensive strategic partnership with Chinese state enterprises promises immediate capital for Georgian ports, railways, and industrial zones, though Western diplomats advise keeping strategic Black Sea infrastructure under domestic majority control."
 georg_geo_dream.4.a: "Sign the comprehensive Middle Corridor investment charter."
 georg_geo_dream.4.b: "Welcome transit trade while retaining domestic control of ports."
 georg_geo_dream.5.t: "The Restoration of Justice"
 georg_geo_dream.5.d: "Across Georgia, thousands of citizens who suffered property confiscation or imprisonment under the previous United National Movement administration are demanding accountability.\n\nProsecutors have prepared indictments against senior officials of the former regime. We must decide whether to limit prosecutions to top leaders or conduct a sweeping lustration of the entire civil service and security apparatus."
 georg_geo_dream.5.a: "Focus prosecutions on the top architects of the old regime."
 georg_geo_dream.5.b: "Purge UNM cadres across every ministry and municipality!"
 georg_geo_dream.6.t: "The Transparency of Foreign Influence Bill"
 georg_geo_dream.6.d: "Parliament has tabled the 'Transparency of Foreign Influence' bill, requiring non-governmental organizations and media outlets that receive more than 20 percent of their funding from abroad to register as organizations pursuing the interests of a foreign power.\n\nWhile demonstrators have gathered outside Parliament on Rustaveli Avenue and Western embassies have issued sharp warnings, party leaders argue that the law is essential to prevent foreign-financed color revolutions."
 georg_geo_dream.6.a: "Override all objections and enact the law in full!"
 georg_geo_dream.6.b: "Pass a moderated financial disclosure bill."
 georg_geo_dream.7.t: "Inauguration of Salome Zurabishvili"
 georg_geo_dream.7.d: "At the historic royal palace in Telavi, Salome Zurabishvili has taken the oath of office as President of Georgia. The daughter of prominent Georgian political emigrants in France and a veteran diplomat who once negotiated the withdrawal of Russian military bases from Georgia, Zurabishvili pledges to use the Orbeliani Palace to champion Georgia's European integration and constitutional stability."
 georg_geo_dream.7.a: "A seasoned diplomat for Georgia's European path."
 georg_geo_dream.8.t: "The Unchallenged Dream"
 georg_geo_dream.8.d: "With the constitutional supermajority secured, the opposition networks dismantled, and state institutions aligned behind the ruling party's vision of sovereign peace and stability, Georgian Dream has consolidated an unchallenged political order in Tbilisi."
 georg_geo_dream.8.a: "Peace, dignity, and sovereign stability for Georgia!"
 georg_geo_dream.9.t: "The Clash Between Orbeliani Palace and the Prime Minister"
 georg_geo_dream.9.d: "A bitter constitutional and diplomatic standoff has erupted between President Salome Zurabishvili and the Prime Minister over the future of Georgia's European Union partnership.\n\nFrom the Orbeliani Palace, President Zurabishvili has accused the Prime Minister and the ruling party leadership of jeopardizing Georgia's EU candidacy through confrontational rhetoric with Brussels and stalled judicial reforms, embarking on personal diplomatic tours to Paris, Berlin, and Brussels without cabinet authorization. In response, the Prime Minister has accused the President of breaching the parliamentary constitution and usurping executive foreign policy powers. Closed-door talks have been convened to resolve the crisis between the Presidency and the Government Chancellery."
 georg_geo_dream.9.a: "Endorse President Zurabishvili's European mission and elevate her leadership."
 georg_geo_dream.9.b: "Broker a joint constitutional compromise on EU partnership."
 georg_geo_dream.9.c: "Back the Prime Minister and curb Orbeliani Palace's foreign policy powers!"
 geo_communist.4.t: "The Monument in Gori Restored"
 geo_communist.4.d: "Before a massive crowd of party cadres, veterans, and youth brigades in Gori, the monument to Joseph Vissarionovich Stalin has been ceremonially unveiled in the center of his birthplace.\n\nSpeakers from the Central Committee declared an end to decades of liberal historical revisionism, hailing the industrialization, literacy, and victory over fascism achieved under the Georgian-born leader."
 geo_communist.4.a: "The Vozhd returns to his homeland!"
 geo_communist.5.t: "The Extraordinary Commission for State Purification"
 geo_communist.5.d: "To secure the socialist transition against sabotage, corruption, and counter-revolutionary subversion, the Central Committee has established an Extraordinary Commission to purge the ministries, courts, and officer corps.\n\nWe must decide whether the Commission should prioritize ideological purification of the state and military apparatus or focus on expropriating corrupt oligarchs and comprador networks."
 geo_communist.5.a: "Purge the ministries and officer corps with iron discipline!"
 geo_communist.5.b: "Expropriate the oligarchs and seize their illicit wealth!"
 geo_communist.6.t: "Tribunal Against the Westernist Fifth Column"
 geo_communist.6.d: "The Supreme Revolutionary Tribunal in Tbilisi has concluded its proceedings against the network of Western-backed parties, comprador NGOs, and foreign intelligence assets that turned Georgia into a neo-colonial outpost after 1991.\n\nWith the pro-Western parties dissolved and their assets nationalized, foreign political leverage over the Georgian SSR has been broken."
 geo_communist.6.a: "Georgia is no longer a pawn of foreign imperialism!"
 geo_communist.7.t: "March of the Red Pioneers"
 geo_communist.7.d: "Red scarves once again fill the schools and squares of Tbilisi, Kutaisi, and Batumi. Reorganized on a nationwide scale, the Georgian Pioneer Organization combines technical education, civic labor, and patriotic preparedness to raise a generation devoted to the socialist motherland."
 geo_communist.7.a: "Always ready!"
 geo_communist.8.t: "The Transcaucasian Red Banner"
 geo_communist.8.d: "From the shores of the Black Sea to the peaks of the Caucasus, the red banner of the restored Transcaucasian Socialist Federative Soviet Republic has been raised over Tbilisi.\n\nReclaiming the revolutionary heritage of 1922, the Republic stands ready to unite the peoples of the South Caucasus into a single socialist federation."
 geo_communist.8.a: "Long live the Transcaucasian SFSR!"

 ########## Georgian Foreign Policy Focuses ##########
 GEO_Foreign_Policy: "Reorganize the Ministry of Foreign Affairs"
 GEO_Foreign_Policy_desc: "Positioned at the crossroads of the Black Sea, the Caucasus mountains, and the Eurasian steppes, Georgia's survival and prosperity depend on an agile, professional diplomatic corps capable of navigating between great powers and regional neighbors."
 GEO_russian_trade: "Restore Trade with the Northern Neighbor"
 GEO_russian_trade_desc: "For decades, Russia has been the largest natural market for Georgian wine, mineral water, citrus, and agricultural goods. Reopening customs checkpoints at Kazbegi-Verkhny Lars and lifting bilateral trade barriers will revitalize rural livelihoods across Georgia."
 GEO_russian_investments: "Welcome Russian Capital & Energy Investment"
 GEO_russian_investments_desc: "Major Russian energy and industrial enterprises such as RAO UES and VTB have expressed interest in acquiring and modernizing Georgian power grids, metallurgical plants, and banking infrastructure."
 GEO_gazprom_cooperation: "Gazprom Transit & Supply Accord"
 GEO_gazprom_cooperation_desc: "By negotiating a long-term gas supply and transit agreement with Gazprom along the North-South Main Gas Pipeline to Armenia, Tbilisi can secure discounted winter energy supplies and steady transit fees."
 GEO_russian_bases_decision: "Address the Russian Military Bases"
 GEO_russian_bases_decision_desc: "Since the dissolution of the Soviet Union, Russian military garrisons have remained stationed at Vaziani, Gudauta, Batumi, and Akhalkalaki. Under the Istanbul OSCE commitments, Tbilisi must formally address their status and timetable for withdrawal."
 GEO_revitalize_relations_with_russia: "Pragmatic Detente with Moscow"
 GEO_revitalize_relations_with_russia_desc: "Rather than pursuing endless confrontation with a nuclear superpower on our northern border, Georgia will establish a structured diplomatic normalization framework with Moscow to de-escalate tensions and restore bilateral treaties."
 GEO_block_from_russia: "Economic & Security Decoupling from Russia"
 GEO_block_from_russia_desc: "Relying on the Russian market and energy grid leaves Georgia vulnerable to political blackmail and sudden embargoes. We must decisively decouple our economy and security architecture from Moscow's orbit."
 GEO_target_russian_interests: "Counter FSB Networks & Audit Strategic Assets"
 GEO_target_russian_interests_desc: "Russian intelligence services and state-affiliated holding companies have penetrated strategic sectors of the Georgian economy. Counter-intelligence operations and strict asset audits will dismantle Moscow's covert networks in Georgia."
 GEO_russian_visa: "Unilateral Visa-Free Regime for Russian Citizens"
 GEO_russian_visa_desc: "Lifting visa requirements for Russian citizens and restoring direct flights between Tbilisi, Batumi, and Moscow will attract hundreds of thousands of tourists and bolster hard-currency inflows for Georgian hospitality."
 GEO_defense_cooperation_with_russia: "Joint Border & Counter-Terrorism Protocols"
 GEO_defense_cooperation_with_russia_desc: "Establishing joint border security protocols, intelligence sharing on North Caucasian militant groups, and officer exchanges with the Russian Ministry of Defense will stabilize the Greater Caucasus frontier."
 GEO_ukraine_alliance: "The Tbilisi–Kyiv Black Sea Strategic Axis"
 GEO_ukraine_alliance_desc: "Bound by shared democratic aspirations and common security challenges in the Black Sea basin, Georgia and Ukraine will elevate their bilateral partnership into a full mutual defense and military-technical alliance."
 GEO_western_alignment: "Euro-Atlantic Vector"
 GEO_western_alignment_desc: "'I am Georgian, and therefore I am European.' Guided by Zurab Zhvania's historic words before the Council of Europe, Georgia anchors its foreign policy in full integration with the European Union and the Euro-Atlantic community."
 GEO_european_neigborhood_action_plan: "ENP Action Plan"
 GEO_european_neigborhood_action_plan_desc: "Joining the EU's European Neighbourhood Policy (ENP) unlocks technical assistance, judicial harmonization grants, and regulatory reform benchmarks designed to bring Georgian governance closer to Brussels."
 GEO_friendship_with_france: "Paris Diplomacy"
 GEO_friendship_with_france_desc: "From the historic Georgian political emigration at Leuville-sur-Orge to modern defense cooperation, France is Georgia's closest Western European partner. French Alpine troops will help establish the Sachkhere Mountain Warfare School and modernize our air defense radar network."
 GEO_visa_liberalization_negotiations: "EU Visa Dialogue"
 GEO_visa_liberalization_negotiations_desc: "By introducing biometric passports, modernizing integrated border management, and aligning migration standards with the Schengen acquis, Georgian citizens will gain visa-free travel across the European Union."
 GEO_EU_association_plan: "Association Agreement"
 GEO_EU_association_plan_desc: "The signing of the EU-Georgia Association Agreement and the Deep and Comprehensive Free Trade Area (DCFTA) opens the world's largest single market to Georgian exports and locks in our European institutional trajectory."
 GEO_Ossetian_Abkhazian_Conflict_Mediation: "Geneva Discussions"
 GEO_Ossetian_Abkhazian_Conflict_Mediation_desc: "Working closely with the European Union Monitoring Mission (EUMM) and the OSCE, Tbilisi will advance confidence-building and non-use-of-force initiatives toward Abkhazia and South Ossetia."
 GEO_european_culture_promotion: "European Reforms"
 GEO_european_culture_promotion_desc: "Expanding Erasmus+ academic exchanges, Horizon Europe scientific grants, and European cultural initiatives across Georgian universities will cultivate a new generation of European-educated professionals."
 GEO_enact_IMET: "IMET Program"
 GEO_enact_IMET_desc: "Through the US International Military Education and Training (IMET) program, Georgian officers will attend West Point, the US Army War College, and Fort Benning, replacing Soviet-era staff doctrine with modern Western command standards."
 GEO_GTEP_program: "Georgia Train & Equip"
 GEO_GTEP_program_desc: "US Special Forces instructors deployed to Krtsanisi National Training Center will train and equip four light infantry battalions and mechanized elements of the Georgian Armed Forces in modern communications, marksmanship, and tactical mobility."
 GEO_coast_guard_coop: "Coast Guard Modernization"
 GEO_coast_guard_coop_desc: "With American technical assistance, Island-class and Point-class patrol cutters, and radar stations at Poti and Batumi, the Georgian Coast Guard will secure our Black Sea territorial waters and maritime trade routes."
 GEO_american_investments: "US Economic Aid"
 GEO_american_investments_desc: "Backed by the Overseas Private Investment Corporation (OPIC) and the Millennium Challenge Corporation (MCC), American capital will finance Georgian energy rehabilitation, regional highways, and agro-industrial enterprises."
 GEO_afganistan_intervention: "ISAF Deployment"
 GEO_afganistan_intervention_desc: "By deploying infantry battalions to Helmand and Kabul alongside US and NATO forces, Georgia demonstrates that it is not merely a consumer of Euro-Atlantic security, but one of the largest per-capita contributors to allied operations."
 GEO_near_abroad_connections: "Regional Diplomacy"
 GEO_near_abroad_connections_desc: "Georgia's immediate neighborhood across the Black Sea and Caspian basins forms our vital strategic hinterland. Deepening bilateral coordination with our post-Soviet partners strengthens our regional standing."
 GEO_GUAM_conference: "GUAM Summit"
 GEO_GUAM_conference_desc: "Together with Ukraine, Azerbaijan, and Moldova, Georgia will institutionalize the GUAM Organization for Democracy and Economic Development to coordinate sovereignty defense, energy transit corridors, and free trade."
 GEO_Relations_with_Azerbaijan_adv: "Baku Strategic Accord"
 GEO_Relations_with_Azerbaijan_adv_desc: "Georgia and Azerbaijan form the indispensable tandem of the South Caucasus. Elevating our relationship to a comprehensive strategic partnership safeguards both nations' independence and transit sovereignty."
 GEO_pipeline_projects: "Energy Corridors"
 GEO_pipeline_projects_desc: "The Baku–Tbilisi–Ceyhan (BTC) oil pipeline and the Baku–Tbilisi–Erzurum South Caucasus gas pipeline transform Georgia into a critical global energy transit corridor, delivering reliable energy and billions in long-term transit royalties."
 GEO_cooperation_in_education_information: "Cross-Border Integration"
 GEO_cooperation_in_education_information_desc: "Joint investments in regional fiber-optic telecommunications, technical universities, and Azerbaijani-language schools in Kvemo Kartli foster civic integration and technological growth."
 GEO_gareja_dispute: "David Gareja Settlement"
 GEO_gareja_dispute_desc: "A portion of the historic 6th-century David Gareja monastery complex sits directly astride the un-demarcated Georgian-Azerbaijani border ridge. Convening a joint bilateral demarcation commission will resolve the dispute in a spirit of neighborly respect."
 GEO_defense_cooperation_azer: "Joint Defense Protocol"
 GEO_defense_cooperation_azer_desc: "Protecting critical oil, gas, and railway infrastructure across the South Caucasus requires regular joint staff exercises, air-defense coordination, and military-technical cooperation between Tbilisi and Baku."
 GEO_electr_cooperation_azer: "Power Grid Integration"
 GEO_electr_cooperation_azer_desc: "Linking the Georgian and Azerbaijani high-voltage power grids via the Gardabani converter station ensures grid stability and allows seasonal electricity exports across the region."
 GEO_Relations_with_Armenia: "Yerevan Dialogue"
 GEO_Relations_with_Armenia_desc: "Sharing millennia of Christian heritage and intertwined history, Georgia and Armenia rely on open borders and constructive diplomacy. Convening the Intergovernmental Commission in Tbilisi will deepen bilateral trust."
 GEO_Economic_Cooperation_with_Armenia: "Armenian Energy Import"
 GEO_Economic_Cooperation_with_Armenia_desc: "Over 70 percent of Armenia's external trade transits through Georgian ports and railways. Modernizing customs procedures at Sadakhlo-Bagratashen and expanding high-voltage electricity swaps benefits both economies."
 GEO_Djavakheti_Issue: "Address the Samtskhe-Javakheti Question"
 GEO_Djavakheti_Issue_desc: "The high-plateau districts of Akhalkalaki and Ninotsminda in Samtskhe-Javakheti are home to a compact Armenian population facing severe economic isolation after the closure of the Russian military base. Tbilisi must formulate a comprehensive strategy for the region."
 GEO_Plan_for_Mutual_Benefits: "Modernize the Yerevan–Tbilisi–Batumi Highway"
 GEO_Plan_for_Mutual_Benefits_desc: "Upgrading the mountain highways and rail links connecting Yerevan to Tbilisi and the Black Sea ports of Poti and Batumi will slash freight transit times and stimulate commerce across southern Georgia."
 GEO_Allow_Armenian_Self_Rule: "Grant Cultural & Municipal Self-Rule in Javakheti"
 GEO_Allow_Armenian_Self_Rule_desc: "By guaranteeing Armenian cultural institutions, local municipal representation, and bilingual public services in Akhalkalaki and Ninotsminda, Tbilisi can win the lasting loyalty of Javakheti's citizens and warm ties with Yerevan."
 GEO_Merge_it_with_Samtskhe: "Centralize Samtskhe-Javakheti Administration"
 GEO_Merge_it_with_Samtskhe_desc: "To prevent the emergence of another separatist enclave, Tbilisi will strengthen unitary administration across Samtskhe-Javakheti from Akhaltsikhe, enforcing Georgian state language education and unified civil service standards."
 GEO_Visa_free_Travels: "Visa-Free Travel"
 GEO_Visa_free_Travels_desc: "Allowing Georgian and Armenian citizens to cross the state border using internal biometric ID cards without passports will boost cross-border tourism, family visits, and small business trade."
 GEO_Autonomous_Region: "Establish the Javakheti Autonomous District"
 GEO_Autonomous_Region_desc: "Formalizing a regional autonomous assembly in Akhalkalaki within the Georgian constitutional order satisfies local demands for self-governance while keeping the region firmly integrated into Georgia's economy."
 GEO_Federative_Region: "Establish the Autonomous Region of Djavakheti"
 GEO_Federative_Region_desc: "Formalizing a regional autonomous administration in Akhalkalaki as a constituent subject under Georgian sovereignty satisfies local demands for self-governance, ends decades of distrust, and unlocks both economic and military integration in Djavakheti."
 GEO_Local_Armenian_Economic_Integration: "Rehabilitate the Akhalkalaki Plateau Infrastructure"
 GEO_Local_Armenian_Economic_Integration_desc: "Investing state funds into the Marabda–Akhalkalaki railway, potato and dairy processing plants, and paved roads to Tbilisi will reorient Javakheti's economy toward the Georgian heartland."
 GEO_Border_Patrol_Cooperation: "Joint Georgian-Armenian Border Management"
 GEO_Border_Patrol_Cooperation_desc: "Coordinating border patrol communications, anti-smuggling operations, and emergency mountain rescue services along the Georgian-Armenian frontier strengthens regional security."
 GEO_Special_Djavakheti_Economy_Zone: "Ninotsminda–Akhalkalaki Free Economic Zone"
 GEO_Special_Djavakheti_Economy_Zone_desc: "Creating a tax-exempt cross-border industrial and logistics zone in Javakheti attracts Armenian, Georgian, and diaspora investors to build light manufacturing and agricultural hubs."
 GEO_Armenian_Rebellion_Army: "Integrate Javakheti Territorial Defense Battalions"
 GEO_Armenian_Rebellion_Army_desc: "Former local militia networks in Javakheti will be formalized into regular mountain territorial defense battalions under the Georgian Ministry of Defense, turning a potential source of unrest into a disciplined reserve force."
 GEO_Calming_them_Down: "Civic Reconciliation & Language Integration"
 GEO_Calming_them_Down_desc: "Through state-funded Georgian language academies, university scholarships in Tbilisi for minority youth, and sustained economic development, separatist grievances in Samtskhe-Javakheti are permanently defused."
 GEO_razjebat_abkhaz: "Operation Kodori: Restore Constitutional Order in Abkhazia"
 GEO_razjebat_abkhaz_desc: "With constitutional control restored over the Tskhinvali region and our armed forces triumphant, the time has come to march from the Kodori Gorge and the Enguri River to liberate Abkhazia and reunite Georgia."
 GEO_NATO_Integration: "Major Non-NATO Ally"
 GEO_NATO_Integration_desc: "Having proven our democratic commitment and spilled blood alongside allied soldiers in Iraq and Afghanistan, Georgia signs the NATO-Georgia Commission Charter, establishing the NATO-Georgia Joint Training and Evaluation Center (JTEC) and locking in our path to Alliance membership."

 ########## Foreign Policy Expansion Focuses (14 New Focuses) ##########
 GEO_southern_strategic_partners: "Southern Strategy"
 GEO_southern_strategic_partners_desc: "Beyond the great power blocs of Brussels, Washington, and Moscow, Georgia's most dynamic bilateral trade, defense, and infrastructure partners lie immediately to our south and across the Eastern Mediterranean: the Republic of Turkey and the State of Israel."
 GEO_turkish_strategic_partnership: "Ankara Partnership"
 GEO_turkish_strategic_partnership_desc: "Turkey is Georgia's largest bilateral trading partner and our direct land bridge to NATO. Signing a High-Level Strategic Cooperation Charter with Ankara will expand customs integration, energy transit, and military support."
 GEO_israeli_defense_partnership: "Jerusalem Accords"
 GEO_israeli_defense_partnership_desc: "Drawing on centuries of friendship between the Georgian and Jewish peoples and the vibrant Georgian-Jewish community in Israel, Tbilisi will sign defense modernization contracts with Israeli aerospace and electronics firms."
 GEO_sarpi_customs_and_marneuli: "Sarpi Corridor"
 GEO_sarpi_customs_and_marneuli_desc: "Upgrading the Sarpi border crossing in Adjara into a high-capacity joint customs terminal and rehabilitating the Marneuli military airfield with Turkish engineering assistance will strengthen both trade and air readiness."
 GEO_elbit_and_spyder_contracts: "SPYDER Procurement"
 GEO_elbit_and_spyder_contracts_desc: "Partnering with Israel's Elbit Systems and Rafael at the TAM Tbilisi Aircraft Manufacturing plant allows us to upgrade our Su-25 ground-attack aircraft to the digital 'Scorpion' standard and acquire mobile SPYDER air-defense systems and Skylark reconnaissance UAVs."
 GEO_trilateral_caucasus_pact: "Trilateral Security Pact"
 GEO_trilateral_caucasus_pact_desc: "Institutionalizing the trilateral summit format between Georgia, Turkey, and Azerbaijan creates a contiguous security and economic belt stretching from the Caspian Sea to the Mediterranean, backed by regular 'Caucasian Eagle' joint special forces exercises."
 GEO_israeli_cyber_and_agro_tech: "Cyber & Agro Tech"
 GEO_israeli_cyber_and_agro_tech_desc: "Israeli technology firms will assist Tbilisi in establishing modern government cyber-defense shields and introducing advanced drip-irrigation and greenhouse agriculture across Kakheti and Kvemo Kartli."
 GEO_eastern_mediterranean_security_link: "Levant Security Link"
 GEO_eastern_mediterranean_security_link_desc: "Consolidating our defense, intelligence, and economic partnerships with Ankara and Tel Aviv transforms Georgia into the indispensable northern anchor of the Black Sea–Eastern Mediterranean strategic architecture."
 GEO_new_friends_and_silk_road: "Silk Road Horizons"
 GEO_new_friends_and_silk_road_desc: "To avoid diplomatic isolation, Georgia will simultaneously cultivate the 'New Friends of Georgia' coalition in Central and Eastern Europe while positioning our ports and railways as the premier Trans-Caspian Silk Road hub for Central Asian, Gulf, and East Asian commerce."
 GEO_warsaw_and_vilnius_axis: "Intermarium Axis"
 GEO_warsaw_and_vilnius_axis_desc: "Poland, Lithuania, and Estonia understand better than any other European nations the existential challenges facing Georgia. Forging a close solidarity axis with President Lech Kaczynski in Warsaw and our Baltic allies ensures vocal support for Georgia inside both the EU and NATO."
 GEO_trans_caspian_kazakh_capital: "Caspian Energy Accord"
 GEO_trans_caspian_kazakh_capital_desc: "Kazakhstan's booming hydrocarbon and grain sectors require reliable export routes bypassing northern monopolies. Welcoming KazMunayGas investments into the Batumi Oil Terminal and Tbilgazi links Central Asian wealth directly to Georgia's Black Sea coast."
 GEO_black_sea_romanian_ferry: "Pontic Maritime Link"
 GEO_black_sea_romanian_ferry_desc: "Establishing regular roll-on/roll-off (Ro-Ro) rail and cargo ferries between Batumi/Poti and the EU ports of Constanta in Romania and Varna in Bulgaria creates a direct maritime highway to the European Single Market."
 GEO_persian_gulf_and_iran_corridor: "Persian Gulf Corridor"
 GEO_persian_gulf_and_iran_corridor_desc: "Attracting sovereign wealth investments from the United Arab Emirates into the Poti Free Industrial Zone and Tbilisi real estate, alongside transit trade agreements with Iran toward the Persian Gulf, diversifies Georgia's foreign capital inflows."
 GEO_eurasian_crossroads_summit: "Belt & Road Gateway"
 GEO_eurasian_crossroads_summit_desc: "Hosting prime ministers, trade ministers, and logistics giants from across Europe, Central Asia, the Middle East, and China at the Tbilisi Silk Road Forum cements Georgia's status as the premier financial and transit hub of the Eurasian Middle Corridor."

