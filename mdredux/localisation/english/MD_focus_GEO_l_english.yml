 # Eco Decisions
 GEO_modernize_chiatura_mines: "Modernize Chiatura Mines"
 GEO_modernize_chiatura_mines_desc: ""
 GEO_modernize_tkibuli_mines: "Modernize Tkibuli Mines"
 GEO_modernize_tkibuli_mines_desc: "The Tkibuli mines have supplied coal since the 19th century, but their tunnels are outdated, dangerous and inefficient. Mechanization, new ventilation and proper safety measures will raise output and finally put an end to the accidents haunting the miners of Imereti."
 GEO_launch_madneuli_complex: "Restart the Madneuli Mining Complex"
 GEO_launch_madneuli_complex_desc: "The Madneuli mining and processing combine was raised in the late Soviet decades as one of Georgia's industrial jewels - its shafts tore copper ore laced with gold from beneath Kvemo Kartli, and a whole settlement grew up around its gates. Then came the collapse of the Union, the chaos of the nineties, and years of neglect: the machinery fell silent, the mills rusted, and the town slowly emptied. Yet the ores are still there. Investors stand ready to breathe life back into the old shafts, and restarting Madneuli would put thousands back to work, restore Georgian copper and gold to world markets, and give Kvemo Kartli its beating heart again."
 GEO_kokhta_mitarbi_lift_construction: "Kokhta-Mitarbi Ski Lift Construction"
 GEO_kokhta_mitarbi_lift_construction_desc: ""
 GEO_anaklia_phase1_breakwater: "Anaklia Phase I: Breakwater and Dredging"
 GEO_anaklia_phase1_breakwater_desc: "The quiet village of Anaklia on the Samegrelo coast has watched the Black Sea for centuries, its shallow waters fit only for fishing boats. All that changes now. Fifteen million cubic meters of seabed will be torn out to carve a channel deep enough for Post-Panamax giants, while a 1.6-kilometer Northern Breakwater rises from the waves to shield the future berths. Engineers call it groundwork. Georgia calls it destiny - the first deep-water port on the eastern Black Sea coast begins here, in the sand and stone of Anaklia."
 GEO_anaklia_phase2_container: "Anaklia Phase II: Container Terminal"
 GEO_anaklia_phase2_container_desc: "Six hundred and twenty-five meters of quay wall, two berths, thirty hectares of container yard, rail lines threading inland toward Tbilisi and beyond. When the first crane lifts its first box off a Middle Corridor vessel, Georgia will no longer be a country ships pass by - it will be the gateway where Asian cargo meets European markets. Nine hundred thousand TEU a year, and the cranes will not stop. Poti handles what it can, Batumi pours its oil, but Anaklia will carry the future of Georgian trade on its steel shoulders."
 GEO_anaklia_phase3_liquid_bulk: "Anaklia Phase III: Liquid Bulk Terminal"
 GEO_anaklia_phase3_liquid_bulk_desc: "Inside the curve of the Southern Breakwater, a jetty stretches into deep water where tankers will moor to load six million tonnes of petroleum products each year. Batumi built its name on oil in the early twentieth century, when Nobel and Rothschild shipped Baku crude through its docks. Now Anaklia takes up that old mantle with modern steel. Kazakh crude, Azerbaijani condensate, refined fuel from the BTC corridor - all of it flowing westward through Georgian hands. The Black Sea energy map is being redrawn, and Anaklia holds the pen."
 GEO_no_more_bought_diplomas: "No More Bought Diplomas"
 GEO_no_more_bought_diplomas_desc: "For too long a university place could be bought - a gift to the dean, an envelope to the rector. The Unified National Exams end that trade. From now on only merit opens the doors of Tbilisi State, and the brightest no longer need to leave to be valued."
 GEO_return_of_specialists: "Specialist Repatriation Program"
 GEO_return_of_specialists_desc: "Grants, housing and job placement for the engineers, doctors and programmers who left for Brussels, Boston and Moscow. The state pays for the move home - and the first wave returns with foreign experience and Georgian passports. The country that once exported brains begins to import them back."
 GEO_khudoni_hpp: "Finish the Khudoni Dam"
 GEO_khudoni_hpp_desc: "The arch dam on the Enguri has been standing a third complete since 1992. We will finish the wall, flood the reservoir and set four 175 MW turbines into the half-empty machine hall. At 700 MW Khudoni becomes the second station in the country after Enguri itself, and holds the whole cascade through dry winters."
 GEO_namakhvani_cascade: "The Namakhvani Cascade"
 GEO_namakhvani_cascade_desc: "Two crests across the Rioni: the upper reservoir feeds a 333 MW machine hall, the lower stage adds another hundred. We bore the diversion tunnels, lay the concrete and send the cascade down the valley - 433 MW, enough for half of Imereti."
 GEO_shuakhevi_cascade: "Shuakhevi in the Adjarian Mountains"
 GEO_shuakhevi_cascade_desc: "We raise a dam on the Adjaristskali, lock the water in the high valley and drive headrace tunnels to a 185 MW hall. By day Shuakhevi holds the river, by night it releases - the evening peak on the Batumi coast is covered."
 GEO_dariali_hpp: "Dariali on the Tergi"
 GEO_dariali_hpp_desc: "A dam across the Tergi, at the mouth of the Dariali Gorge, with two 54 MW turbines underneath the Kazbegi peaks. No giant reservoir: the river keeps its channel, the Military Highway stays put, and the northern valleys get 108 MW that do not freeze in winter."

 #Economy Events
 georg_economy.1.t: "The Iron Silk Road"
 georg_economy.1.d: "Georgia has put forward an ambitious proposal: to build the Baku-Tbilisi-Kars railway corridor together with us. The project would link the Caspian to Anatolia, turning the South Caucasus into a land bridge between Europe and Asia. Tbilisi asks for our commitment - to share the burden of construction, to harmonise customs, and to stitch our economies into a single thread of steel and trade. The rails do not exist yet, but the choice is ours."
 georg_economy.1.a: "We will build this corridor together"
 georg_economy.1.b: "We have no interest in this project"
 georg_economy.2.t: "[From.GetName] Joins the Corridor"
 georg_economy.2.d: "[From.GetName] has formally agreed to co‑build the Baku-Tbilisi-Kars railway corridor. With their participation secured, the project can now move from blueprints to earthworks. Joint funding, aligned regulations, and shared strategic purpose will turn this line into a true artery of regional prosperity. For Georgia, this is more than a railway - it is proof that the Caucasus can choose partnership over isolation."
 georg_economy.2.a: "Let the spades strike the soil"
 georg_economy.3.t: "[From.GetName] Turns Away"
 georg_economy.3.d: "[From.GetName] has declined to take part in the construction of the Baku-Tbilisi-Kars railway. The refusal will not stop the project;We will lay the rails with or without them. Yet a seat at the table has been left empty, and a chance to strengthen the bonds of the region has been missed."
 georg_economy.3.a: "We will build it alone"
 georg_economy.4.t: "Heidelberg Comes to Kaspi"
 georg_economy.4.d: "The government of [From.GetName] has approached us with an ambitious offer: to invest in the restoration of the Kaspi Cement Plant, a derelict giant of the Soviet era. The project would give us a foothold in the South Caucasus construction market, access to local raw materials, and a strategic position along the East-West transport corridor. Tbilisi asks for modern equipment, expertise, and capital - in return, they promise favourable conditions and long-term partnership."
 georg_economy.4.a: "We will invest in the restoration"
 georg_economy.4.b: "This is not a priority for us"
 georg_economy.5.t: "[From.GetName] Invests in Kaspi"
 georg_economy.5.d: "[From.GetName] has formally agreed to restore the Kaspi Cement Plant. Their engineers, machinery, and capital will breathe new life into the outdated facility, turning it into a modern industrial enterprise. Beyond cement, this partnership represents something greater - a vote of confidence in Georgia's economic future and a signal to other foreign investors that the country is open for business."
 georg_economy.5.a: "Let the reconstruction begin"
 georg_economy.6.t: "[From.GetName] Declines Investment"
 georg_economy.6.d: "[From.GetName] has declined our invitation to restore the Kaspi Cement Plant. The refusal is a setback, but not a catastrophe. The site still holds potential, and other partners - domestic or foreign - may yet be found. For now, the old Soviet chimneys will remain silent."
 georg_economy.6.a: "We will look elsewhere"
 georg_economy.7.t: "Kaspi Plant Stabilization"
 georg_economy.7.d: "The initial construction boom around the Kaspi Cement Plant has naturally subsided. Temporary workshops and auxiliary facilities are dismantled, leaving behind a stable, modern industrial enterprise."
 georg_economy.7.a: "Steady as she goes"
 georg_economy.8.t: "Looking for a Lifeline"
 georg_economy.8.d: "The Kutaisi Automobile Plant sits half-idle, its Soviet-era truck lines producing a trickle of vehicles nobody wants. We need a foreign partner willing to invest - whoever we approach first will shape what the plant becomes. Or we could try to save it ourselves, without outside help."
 georg_economy.8.a: "Approach Voyager Resource"
 georg_economy.8.b: "Approach Mahindra"
 georg_economy.8.c: "Approach Kharkiv Tractor Plant"
 georg_economy.8.e: "Restore it ourselves"
 georg_economy.8.f: "Give up on Kutaisi"
 georg_economy.9.t: "An Offer from Kutaisi"
 georg_economy.9.d: "Georgia has approached us about a partnership at the Kutaisi Automobile Plant - a joint venture to put its idle production lines back to work."
 georg_economy.9.a: "Accept the partnership"
 georg_economy.9.b: "Not interested"
 georg_economy.10.t: "A Partner for Kutaisi"
 georg_economy.10.d: "[From.GetName] has accepted our proposal. Foreign investment and expertise from [From.GetAdjective] investors will soon begin flowing into the Kutaisi Automobile Plant, breathing new life into its idle production lines."
 georg_economy.10.a: "Excellent"
 georg_economy.11.t: "No Interest in Kutaisi"
 georg_economy.11.d: "[From.GetName] has turned down our proposal. The Kutaisi Automobile Plant will have to keep waiting for a partner willing to take the risk - or for us to find another way forward."
 georg_economy.11.a: "Unfortunate"
 georg_economy.12.t: "A Request from Tbilisi"
 georg_economy.12.d: "Georgia wants us to take over their airports - modernize the terminals, run the concession, the usual deal. Tbilisi and Batumi both."
 georg_economy.12.a: "We will grant the concession"
 georg_economy.12.b: "This is not a priority for us"
 georg_economy.13.t: "TAV Says Yes"
 georg_economy.13.d: "[From.GetName] is putting up the money. Our airports are about to look a lot less Soviet."
 georg_economy.13.a: "Let the construction begin"
 georg_economy.14.t: "TAV Says No"
 georg_economy.14.d: "[From.GetName] passed on the deal. Our terminals stay old for now - someone else might still bite."
 georg_economy.14.a: "We will look elsewhere"
 georg_economy.16.t: "Investment Opportunity"
 georg_economy.16.d: "[FROM.GetNameDef] has approached us with a proposal for financial investment in the rebuilding of the Georgian economy. Tbilisi promises a favourable climate and asks for capital in return. Will we take a stake in the Caucasus?"
 georg_economy.16.a: "Approve the financial investment"
 georg_economy.16.b: "Decline the proposal"
 georg_economy.17.t: "Investment Accepted"
 georg_economy.17.d: "[FROM.GetName] has agreed to provide financial investment. The capital will support our ongoing economic development and strengthen bilateral ties."
 georg_economy.17.a: "A positive step forward"
 georg_economy.18.t: "Investment Declined"
 georg_economy.18.d: "[FROM.GetName] has refused to invest in Georgia. We will have to look for other sources of capital."
 georg_economy.18.a: "We must seek other opportunities"

 # Events
 georg.1000.t: "Epoch of Shevardnadze"
 georg.1000.d: "Eduard Amvrosievich Shevardnadze lived three lives: as a Soviet party functionary, creator of perestroika and new thinking, and leader of independent Georgia. No one could have foreseen these turns, least of all himself. Like his patron Mikhail Gorbachev, Shevardnadze is more respected and appreciated in the world than at home. Some argue that he consistently failed in everything he undertook, others are convinced that mankind will not forget his historical merits. However, when in March 1992 the Georgian politicians who had just overthrown Zviad Gamsakhurdia offered Shevardnadze to head the country, he agreed. It is difficult to say what was more here: the desire to help the motherland in difficult times or the longing for power and active work. I knew that if I had not returned to Georgia, she would have died,” Shevardnadze said. There was some truth in his words, but, unlike Heydar Aliyev, who found himself in a similar situation, he failed to consolidate society. Probably, Shevardnadze expected to be in a small country \"a whale in an aquarium\", before whose world authority everyone would bow in unison. Instead, he found himself in a society brought to a boiling point, and surrounded by armed barons determined to obey no one. The crisis in relations with Abkhazia and South Ossetia was created by his predecessor Gamsakhurdia. Shevardnadze agreed to a military expedition to Abkhazia in August 1992 under pressure from public opinion and influential military leaders Tengiz Kitovani and Jaba Ioseliani. After the overthrow of Gamashurdia, the pro-Russian Shevardnadze, who is relatively building relations with the West and the East, and shaky on his former authority, must draw up a plan for the further development of Georgia."
 georg.1000.a: "The right hand of Gorbachev."

 georg_chech.1.t: "Gelayev's Boeviks in Gorges"
 georg_chech.1.d: "Information that about 700 armed Chechen boeviks were planning to enter Abkhazia was disseminated several days ago. The parliamentary minority (political block Revival, leader of which is Aslan Abashidze, lead of Adjara Autonomous Republic) accused the Georgian authorities of using military and political adventurism. Leader of the minority Jemal Gogitidze is positive that Chechen boeviks gathered in Kodori Gorge near the border of Abkhazia are planning to enter Adjara Autonomous Republic through the Black Sea cost. Giorgi Targamadze, leader of the oppositional faction United Georgia, supports the idea and claims that the military and political intrigue is made up by the authorities in order to draw the society's attention away from conflict between Shevardnadze and Zhvania (head of the parliament) and serve to Russia's interests in Georgia”, the Resonance states. Citizens Union – the ruling party, on the other hand, regards the government of Adjara that supports the interests of Russia. Illegal dislocation of Russian military forces in the neighborhood of Cholokhi (Adjara) was reviewed at the Defense and Security Committee session yesterday. Everything should be done for the Russian military bases to leave the territory of Georgia because they hinder the country's security, head of the Committee Gia Baramidze announced. Both ruling and opposition parties try to collect scores for just the upcoming elections while the internal situation in the country is very tense. Making the theme of Abkhazia active and talking about possible enemies is a part of the electoral campaign”, this is how the newspaper evaluated the comments of government representatives. It is also worth pointing out that Russia has sent a descant to the Gudauta military base, territory of Abkhazia, in order to find and catch 13 Chechen boeviks thought to be dislocated there (the Resonance). According to Khizri Aldamov, nonofficial representative of Chechnya in Georgia, none of these 13 boeviks are nationally Chechen; they are citizens of the Russian Federation. It may be considered that they pretend they are Chechens. Adequate facts have occurred earlier as well. Russia had them come to Georgia deliberately in order to have Georgia involved in provocation, Aldamov stated."
 georg_chech.1.a: "We need to stabilize the situation."

 georg_chech.2.t: "Meeting of Georgian and Russian officials."
 georg_chech.2.d: "Recently, a meeting of Georgian and Russian politicians took place within the framework of the settlement of the issue of the presence of Chechen fighters in the border gorges between Georgia and the Russian Federation. Georgia asked for help in resolving the issue, despite previous conflicts. Georgia asks for the presence of Russian peacekeepers, as well as assistance in diplomatic support for Georgia."
 georg_chech.2.a: "Let's hope they will help us."
 georg_chech.2.b: "Sure, the terrorists should be captured."
 georg_chech.2.c: "They will have to rely on their own."

 georg_chech.3.t: "Russia sends help"
 georg_chech.3.d: "Russia agreed to send us help for the sake of us capturing them and sending them back to Russia."
 georg_chech.3.a: "Let's decide what to do next..."

 georg_chech.4.t: "Georgia does not give the Chechen boeviks to Russia."
 georg_chech.4.d: "To the surprise of the Russian authorities, Georgia says it cannot hand over all Chechen fighters to Russia for various reasons. Some say that they decided to deport them to third countries or put them on trial in Georgia itself. Georgia has handed over only a few minor fighters, but the leaders are still in Georgian prisons."
 georg_chech.4.a: "They will come handy in future..."
 georg_chech.4.b: "You are playing with fire, Eduard."
 georg_chech.4.c: "The most important thing is that the Borders are now secure."

 georg_chech.5.t: "Georgia hands Chechen boeviki to Russia."
 georg_chech.5.d: "Georgia claims to have handed over all Chechen fighters to Russia for mutually beneficial reasons of security and stability in the region. Initially, Georgia handed over only some minor fighters, but now the leaders have already been sent to trial in Russia."
 georg_chech.5.a: "Let's hope they will like our effort."
 georg_chech.5.b: "Georgian-Russian relations should become stronger."
 georg_chech.5.c: "Huh? Wha..? We don't care."

 georg_chech.6.t: "Georgia starts a diplomatic mission."
 georg_chech.6.d: "Almost simultaneously with the beginning of the military operation of the US and Great Britain in Afghanistan - the beginning of the war on terrorism - an armed conflict broke out in the zone of the Abkhaz-Georgian confrontation. From the Kodori Gorge, which belongs to Abkhazia but is controlled by Georgia, combined detachments of Georgian partisans and militants from the North Caucasus descended into the territory controlled by Sukhumi. Troops are being pulled up to the Abkhazian-Georgian borders. The Georgian parliament demanded the withdrawal of Russian peacekeepers from the conflict zone, Abkhazia, in turn, announced that it would apply for inclusion in Russia: armed phase. We will try to discuss this topic with the representative of Abkhazia in Moscow Igor Akhba, the Georgian parliamentarian Hamlet Chipashvili and the Tbilisi correspondent Yuri Vachnadze. So, real battles are going on in the Kodori Gorge and several questions arise at once. The Kodori Gorge geographically belongs to Abkhazia, but was controlled until recently by Georgia. Igor Akhba, the representative of Abkhazia in Moscow, is speaking."
 georg_chech.6.a: "Kviciani and Gelaev, of course..."
 georg_chech.6.b: "Let's prepare a mutual agreement."
 georg_chech.6.c: "We don't really care."

 georg.30.t: "Georgia asks for cooperation agreement."
 georg.30.d: "Georgia asks us not to raise the issue of Javakhk, in exchange for mutual cooperation in various fields and a comprehensive friendship treaty. How will we answer them?"
 georg.30.a: "Of Course"
 georg.30.b: "Sorry, no"

 georg.31.t: "Armenia agrees!"
 georg.31.d: "Armenia agreed to the pact."
 georg.31.a: "Wonderful"

 georg.5.t: "[FROM.GetNameWithFlag] Is Asking for Our Protection"
 georg.5.d: "[FROM.GetNameWithFlag] government is showing an increasing desire to become our key ally in the Caucasus and is asking us to station our troops on its territory, thereby safeguarding [FROM.GetNameWithFlag] sovereignty from foreign influence"
 georg.5.a: "We Agree"
 georg.5.b: "No, we don't like Geogian Wine"

 georg.6.t: "[FROM.GetNameWithFlag] Agrees"
 georg.6.d: "[FROM.GetNameWithFlag] Government Has Agreed to Provide Us with Military Protection"
 georg.6.a: "Good"

 georg.7.t: "[FROM.GetNameWithFlag] Declines"
 georg.7.d: "[FROM.GetNameWithFlag] Government Has No Intention of Protecting Us from External Enemies"
 georg.7.a: "Meh"

 georg.8.t: "The Deal of the Century"
 georg.8.d: "[FROM.GetNameWithFlag] government is proposing that we finally resolve this long-standing conflict by offering [ABK.GetNameWithFlag] and [SOO.GetNameWithFlag] the opportunity to become part of [FROM.GetNameWithFlag] in exchange for [FROM.GetNameWithFlag] becoming a neutral state with no foreign troops on its territory. We will also sign a lasting peace agreement"
 georg.8.a: "We Agree"
 georg.8.b: "No"

 georg.9.t: "A Letter from [FROM.GetNameWithFlag]"
 georg.9.d: "[FROM.GetNameWithFlag] government is demanding that we accept the new reality, under which we become part of [GEO.GetNameWithFlag] as a new constituent entity. Otherwise, [FROM.GetNameWithFlag] will draw “red lines.”"
 georg.9.a: "We Should Accept"
 georg.9.b: "No, We Will Remain Independent"

 georg.10.t: "Success in negotiations with [SOV.GetNameWithFlag]"
 georg.10.d: "We have managed to resolve the issue with [ABK.GetNameWithFlag] and [SOO.GetNameWithFlag], and in turn we will sign an agreement on a neutral zone and a lasting peace"
 georg.10.a: "Good"

 georg.11.t: "[FROM.GetNameWithFlag] Is Resisting"
 georg.11.d: "[FROM.GetNameWithFlag] Government Flatly Refuses to Agree to Join Us"
 georg.11.a: "To the Weapons"
 georg.11.b: "They’ll Regret It Later"

 georg.12.t: "[FROM.GetNameWithFlag] Refuses"
 georg.12.d: "Unfortunately, we were unable to reach an agreement with Russia on the incorporation of Abkhazia and Ossetia into our country"
 georg.12.a: "Meh"

 georg.21.t: "Georgia Wants investments"
 georg.21.d: "Georgia wants investments from us. Should we accept?"
 georg.21.a: "Of course, Gogi!"
 georg.21.b: "No"

 georg.22.t: "Saakashvili Investigation"
 georg.22.d: "Should we start an investigation on Saakashvili and potentially imprison him?"
 georg.22.a: "Of course no"
 georg.22.b: "of course yes"

 georg.23.t: "Saakashvili flees to Ukraine"
 georg.23.d: "Saakashvili fled to Ukraine to avoid judgment and imprisonment. He will continue his political Career there."
 georg.23.a: "Skatertyu Doroga, Mikheil."

 georg.24.t: "Big Debate"
 georg.24.d: "Who will lead Georgia onwards? This question rose up recently. As we speak about national heritage, wouldn't it be great to bring Bagrationis to rule Georgia gain?"
 georg.24.a: "All hail the king!"
 georg.24.b: "The Yoseliani should be the Supreme Ruler and the King of all Georgia."

 georg.25.t: "Georgia Invites us to alliance!"
 georg.25.d: "Georgia invites us to their alliance to fight our mutual enemies!"
 georg.25.a: "Sure!"
 georg.25.b: "nah."
 georg.26.t: "Georgia asks for Guarantees"
 georg.26.d: "Georgia wants our military to protect Georgia."
 georg.26.a: "Of Course"
 georg.26.b: "Sorry, no"

 georg.234.t: "Geopolice game"
 georg.234.d: "Game is FREE and in Georgian but it's pretty intuitive to play, there's 3 levels: 1 investigation, puzzle 1 shooter FPS 1 Easter egg level Levels can be played in any order, multiple choices and ways to solve puzzles. Game download links are presented below. Game ISO: Stormbringerstudios.com Patch: Stormbringerstudios.com"
 georg.234.a: "chveni siamaqe!"

 georg.1243.t: "Georgia Demands Russian Forces Withdrawal"
 georg.1243.d: "In the light of recent events, the Georgian government has sent a notice to our government demanding a formal withdrawal of all of our military personnel from the country. The demands also include decomissioning all of the military bases owned and operated by our military, the Russian Armed Forces. Our forces have been shifted away from their posts and are being sent back across our border with Georgia."
 georg.1243.a: "An Unfortunate Circumstance"

 georg.1244.t: "Seize old soviet air bases and their assets in our territory."
 georg.1244.d: "Today, the Georgian Armed Forces raided and reclaimed old Soviet air bases, taking any and all remaining assets."
 georg.1244.a: "We'll take them!"


 geo_misc.2.t: "Immediate Response Trainings"
 geo_misc.2.d: "United States, Georgia, Azerbaijan, Armenia and Ukraine conduct the mutual military training programs in Georgia!"
 geo_misc.2.a: "Cool!"

 geo_misc.3.t: "Georgia proposes non-aggression pact"
 geo_misc.3.d: "Georgia wants to achieve strong peace in the region by having a pact signed by both of our countries."
 geo_misc.3.a: "Good idea!"
 geo_misc.3.b: "Never"

 geo_misc.4.t: "Russia Denies"
 geo_misc.4.d: "Russia will not sign a pact with us."
 geo_misc.4.a: "Sad"

 geo_misc.5.t: "Georgia proposes non-aggression pact"
 geo_misc.5.d: "Georgia wants to achieve strong peace in the region by having a pact signed by both of our countries."
 geo_misc.5.a: "Good idea!"
 geo_misc.5.b: "Never"
 geo_misc.5.c: "Never"

 geo_misc.6.t: "Ossetia Denies"
 geo_misc.6.d: "Ossetia will not sign a pact with us."
 geo_misc.6.a: "Sad"

 geo_misc.7.t: "Abkhazia Denies"
 geo_misc.7.d: "Abkhazia will not sign a pact with us."
 geo_misc.7.a: "Sad"

 geo_misc.8.t: "Georgia suggests we join ZSFSR"
 geo_misc.8.d: "Georgian communists want to build a communist Transcaucasia under their leadership. They want us to integrate into their union as a puppet state. "
 geo_misc.8.a: "Everything for the Red October!"
 geo_misc.8.b: "Fuck off!"
 geo_misc.9.t: "Djavakhq Compromise Proposal"
 geo_misc.9.d: "[FROM.GetName] has proposed a peace proposal concerning the Djavakhq issue. The proposed solution is to allow the Armenians a degree of autonomy. They theorize that it will prevent the Armenians from feeling as if they are not represented in government and allow the Georgian government the ability to retain control over their territories. How do we respond? Are we willing to take a seat at the negotiating table?"
 geo_misc.9.a: "Autonomy would solve the issue."
 geo_misc.9.b: "Are you joking? Djavakhq Should be free!"
 geo_misc.9.c: "We are ready to start the talks on increasing autonomy..."
 geo_misc.9.d1: "Samtskhe-Djavakheti is rightfully ours!"

 geo_misc.10.t: "Increasing Autonomy in Djavakheti."
 geo_misc.10.d: "Now, the time has come to finally sign the resolution. Djavakheti will get a status of religious, cultural and linguistical autonomy. Are we going to take the next step?"
 geo_misc.10.a: "We agree to these terms."
 geo_misc.10.b: "We are ready to give special status."

 geo_misc.11.t: "Georgian SSR Proposal"
 geo_misc.11.d: "Georgian Socialists propose an agreement on unification of our countries. What should we do?"
 geo_misc.11.a: "Red-masked capitalists will not enslave us!"
 geo_misc.11.b: "Maybe for the sake of red October..."

 georg_war2008.1.t: "Deciding the Course of Action"
 georg_war2008.1.d: "And so, the problem of South Ossetia and Abkhazia is indeed at the peak of the current agenda of the Georgian country... On the one hand, trying to conquer Georgia is a difficult and dangerous adventure for Georgia. Some of our generals propose to make a blitzkrieg and attack Ossetia from two sides with a quick dash so that Russia does not have time to do anything and we annex Ossetia before the Russian peacekeepers begin any action. On the other hand, our experts warn that we should abandon the issue of Ossetia and Abkhazia and leave everything as it is, perhaps even recognizing their independence. Comrade President [GEO.GetLeader], what are we going to do?"
 georg_war2008.1.b: "We should abandon the question... Let's recognise them."
 georg_war2008.1.a: "We should attack the Pseudorepublics. Prepare the plan."
 georg_war2008.1.c: "Are there any other Options?"
 georg_war2008.2.t: "Other Options"
 georg_war2008.2.d: "Comrade President [GEO.GetLeader], you promised to solve the question! People demand a solution."
 georg_war2008.2.a: "Fine... Ugh."
 georg_war2008.3.t: "Ukrainian Volunteers in Georgia"
 georg_war2008.3.d: "Many Ukrainian volunteers from the Army and military veterans from the UNA-UNSO Organization decided to respond to the call for help from Georgia and joined the Georgian Armed Forces, creating volunteer battalions."
 georg_war2008.3.a: "Interesting"
 georg_war2008.3.b: "Wonderful"

 georg_war2008.4.t: "Chechen Volunteers in Georgia."
 georg_war2008.4.d: "Many Chechen fighters of free Ichkeria decided to join the side of Georgia and create a nation. battalions in the Georgian army."
 georg_war2008.4.a: "Ugh, traitors."
 georg_war2008.4.b: "Wonderful"


 georg_war2008.5.t: "Georgia proposes an Agreement."
 georg_war2008.5.d: "Georgia wants to offer us a full-fledged agreement on Abkhazia and South Ossetia, under which they will renounce their claims and recognize the unrecognized republics. This is good, of course, but we must not allow Georgia to enter NATO after that..."
 georg_war2008.5.a: "We agree, but we need concessions."

 georg_war2008.6.t: "Georgia Warns us about Special Operation."
 georg_war2008.6.d: "Georgia warns us that they have decided to conduct a military operation in the territory of South Ossetia. They promise not to attack our peacekeepers in exchange for our non-intervention. However, for little reason, they have already begun shelling a military camp near Tskhinvali. Our country guarantees the security of South Ossetia; perhaps we should intervene and teach the Georgians a lesson."
 georg_war2008.6.a: "Finish off the survivors!"
 georg_war2008.6.b: "Let's leave Ossetia..."

 georg_war2008.7.t: "Successful Tiger Operation!"
 georg_war2008.7.d: "Georgia annexes Ossetia."
 georg_war2008.7.a: "Ha-ha!"

 georg_war2008.8.t: "Forced Peace..."
 georg_war2008.8.d: "Nothing Changes"
 georg_war2008.8.a: "Ah."

 georg_war2008.9.t: "Forced Peace"
 georg_war2008.9.d: "Should we force peace on georgia or continue the war?"
 georg_war2008.9.a: "Of Course, they got enough..."

 georg_war2008.10.t: "Forced Peace"
 georg_war2008.10.d: "Should we force peace on georgia or continue the war?"
 georg_war2008.10.a: "Of Course, they got enough..."
 georg_war2008.10.b: "Finish off the survivors!"

 georg_war2008.11.t: "Georgia asks for Guarantees"
 georg_war2008.11.d: "Georgia asks for Guarantees to ensure Russian non-Aggression to their internationally recognized territory."
 georg_war2008.11.a: "Georgian National Guard will be deployed immediately."
 georg_war2008.11.b: "Sorry Guys, there should be only one Georgia."

 georg_revol.1.t: "Rose Revolution in Georgia!"
 georg_revol.1.d: "The era of the gray fox in Georgia is over. The peaceful Rose Revolution dismissed Eduard Shevardnadze. The legendary cunning and art of intrigue betrayed him. Shevardnadze could have saved his country from shock and himself from humiliation if he had retired long ago. Georgia would only benefit from this. In recent years, the 75-year-old president did not solve the country's problems but put them on the back burner. Georgia's resources were spent solely to maintain the power of Shevardnadze. Shevardnadze deceived his people. He allowed or even organized electoral fraud himself. It was this lie that led to his resignation. He saved the country from bloodshed, and this is his merit. However, the authority of the state power in Georgia has yet to be undermined. In addition, there is no answer to the main question: what will be the country's future after Shevardnadze?"
 georg_revol.1.a: "We Have No Choice"

 georg_revol.2.t: "Protests in Georgia"
 georg_revol.2.d: "A rally with protests against falsification gathered in Tbilisi. The authorities felt alarmed and, just in case, slightly corrected the result, so that Burdzhanadze-Democrats received their passing 7 percent.All these unrest could be carefully ignored, but there was one subtle nuance - a new parliament might not convene on a wave of chaos. There was clearly no quorum - half of the deputies did not recognize the election results. Shevardnadze had to do something to get the parliament started, but he couldn't do anything. The gray fox decided to play for time - to conduct endless negotiations until the protesters got bored. On his side was a powerful ally in the form of the November rains in Tbilisi."
 georg_revol.2.a: "Let's hope protests will settle down by themselves..."

 georg_revol.3.t: "Epoch of Saakashvili"
 georg_revol.3.d: "The Age of Saakashvili has begun in Georgia. The belated resignation of Eduard Shevardnadze may have prevented a bloody civil war. But the prospects remain extremely dangerous. Georgia will only have a chance for a better future if it manages to unite the moderate political forces of the opposition and isolate the radicals. The Rose Revolution will cause some anxiety among post-Soviet presidents. Similar unrest will happen in Ukraine, Kyrgyzstan and Uzbekistan. Much will change in Russia itself - the authorities will understand that they are vulnerable. The Ministry of Foreign Affairs is displeased with the fact that the post-Soviet republics also require attention, and they also need to work with them and protect their interests there."
 georg_revol.3.a: "Georgia chose It's path!"

 georg_revol.4.t: "Kviciani's rebellion!"
 georg_revol.4.d: "Kvitsiani stated that he was no longer subordinate to the central government of Georgia. The reason for this statement was the activities of members of the Georgian government - the heads of the Ministry of Internal Affairs and the Ministry of Defense Vano Merabishvili and Okruashvili. According to Kvitsiani, on their orders, the inhabitants of Kodori were persecuted by the authorities. In this regard, Kvitsiani demanded the resignation of the heads of the Georgian law enforcement agencies, threatening otherwise to bring people to the streets of Tbilisi and organize armed resistance to the Georgian military directly in Kodor."
 georg_revol.4.a: "Let's see what we can do."

 georg_revol.5.t: "Crisis in Adjara!"
 georg_revol.5.d: "Abashidze, who opposed our current government, began to conduct anti-Georgian activities in Adzharia. During these speeches, Abashidze supported the country's President Eduard Shevardnadze and, speaking on Adjarian television, he called the leaders of the opposition United National Movement Mikheil Saakashvili and David Berdzenishvili fascists, and their movement - fascist. On November 23, after the opposition seized the parliament building, the government of Adjara declared a state of emergency."
 georg_revol.5.a: "Let's deal with this idiot."

 georg_revol.6.t: "Kodori Crisis"
 georg_revol.6.d: "Emzar Kvitsiani announced the re-establishment of the Monadire detachment and declared disobedience to the government of Georgia, demanding the resignation of the heads of the Ministry of Internal Affairs and the Ministry of Defense Vano Merabishvili and Okruashvili, who, according to Kvitsiani, committed arbitrariness against the Svans and prepared their extermination. At the same time, Kvitsiani threatened with actions of civil disobedience, and in extreme cases, with a transition to armed resistance."
 georg_revol.6.a: "Maybe we can find an agreement?"
 georg_revol.6.b: "Traitors must be punished!"

 georg_revol.7.t: "Zhvania is Killed!"
 georg_revol.7.d: "The prime minister's body was found in his friend's apartment. Moreover, his friend was also found dead. According to the minister, last night Z. Zhvania came to visit his friend, the deputy governor of one of the regions of Georgia. After a while, the Prime Minister's security became worried because he did not return calls. At 4:30 local time, the guards broke the window and found the bodies of Z. Zhvania and his friend. According to the preliminary version voiced by V. Merabishvili, there was an accident - death was the result of gas poisoning. However, David Morchiladze, general director of the Tbilisi gas distribution company JSC Tbilgaz, told Rustavi 2 television after inspecting the apartment that there was no natural gas leak. According to him, a gas heater was installed in the apartment. And, in all likelihood, for some time the product of incomplete combustion of gas accumulated in the apartment, which could cause poisoning. In addition, according to Ekho Moskvy, now all approaches to the entrance of the house where Z. Zhvania died are cordoned off by the police. Journalists are also not allowed to enter the republican hospital where his body was sent. As the hospital doctor told the media representatives, they will not speak to the press until the examination is completed. \"We were informed that the President ordered not to communicate with journalists,\" he said. An emergency meeting of the government has already been held in Tbilisi, convened on the occasion of the death of Z. Zhvania. President of Georgia Mikheil Saakashvili addressed the meeting. According to him, Georgia has lost a great patriot, and M. Saakashvili himself - his closest friend, most reliable adviser and comrade-in-arms. The President called on the government to be firm, resilient and united. In addition, M. Saakashvili expressed condolences to the families of Z. Zhvania and Raul Yusupov, who died with him. The meeting participants honored the memory of the dead with a minute of silence."
 georg_revol.7.a: "Good"

 georg_revol.8.t: "Georgia jails presumed Russian spies!"
 georg_revol.8.d: "After a week of silence, the Georgian Interior Ministry issued a statement naming 13 people suspected of spying for Russia. Envery's large-scale operation, according to representatives of the Ministry of Internal Affairs, is the result of four years of work by the Georgian counterintelligence. An unprecedented operation and the destruction of the myth about the invincibility of the Russian special services - such assessments were made in Georgia on Friday after the official statement of the Georgian Interior Ministry about the disclosure of a spy network."
 georg_revol.8.a: "Have they lost their minds?"

 georg_militar.1.t: "Military Coup in Georgia!"
 georg_militar.1.d: "Recently, a military coup took place in Georgia. The supreme command of the army took over the government of Georgia. Let's see where this leads."
 georg_militar.1.a: "Forward!"

 georg_militar.2.t: "Djaba Yoseliani is Empowered in Georgia"
 georg_militar.2.d: "Djaba Yoseliani is Empowered in Georgia. He and his Mafiosi/Military Council now reside in the governmental presidium of Georgia. What will he do next?"
 georg_militar.2.a: "Sainteresoa."


 georgia_news.1.t: "Georgia recognize South Ossetia and Abkhazia!"
 georgia_news.1.d: "In view of the new policy pursued by Georgia, Georgia has decided to recognize Ossetia and Abkhazia within the framework of bilateral cooperation. Does this mean peace for Georgia and the absence of future conflicts?"
 georgia_news.1.o1: "Interesting"

 #Army
 georg_army.1.t: "From Paper to Practice"
 georg_army.1.d: "For years, military reform in Georgia existed largely on paper. Budget shortages, corruption, and the legacy of post-Soviet military structures repeatedly derailed ambitious modernization efforts. Now, with political support and renewed determination, the General Staff has begun implementing long-overdue reforms. New training standards, streamlined command procedures, and a renewed focus on professionalism mark the beginning of a new era for the Georgian Armed Forces. The road ahead will not be easy, but for the first time in years, progress is measured not in promises, but in results."
 georg_army.1.a: "The real work begins now"
 georg_army.2.t: "Forged Among the Best"
 georg_army.2.d: "The transformation of Georgia's armed forces cannot rely solely on larger formations. Modern conflicts demand highly trained units capable of operating independently, carrying out reconnaissance, counter-terrorism missions, and supporting conventional forces under the most demanding conditions. With the assistance of foreign instructors and years of experience gained through international deployments, the foundations of the Georgian Special Operations Forces have been laid. Though small in number, these soldiers will represent the cutting edge of the country's military and a symbol of its growing professionalism."
 georg_army.2.a: "Quality over quantity"
 georg_army.3.t: "A New Generation of Soldiers"
 georg_army.3.d: "The transformation of the Georgian Armed Forces has been neither quick nor easy. Years of neglect, corruption, and outdated Soviet practices have gradually given way to a professional military built around modern doctrine, disciplined leadership, and rigorous training. While Georgia remains a small nation facing significant security challenges, its armed forces are no longer defined by their weaknesses. Equipped with modern operational standards and led by a new generation of officers, they now stand as a symbol of the country's determination to defend its independence and future."
 georg_army.3.a: "A new army for a new Georgia"
 georg_army.4.t: "[FROM.GetName] Requests UAV Cooperation"
 georg_army.4.d: "The government of [FROM.GetName] has approached us with a proposal to purchase modern reconnaissance unmanned aerial vehicles manufactured by Elbit Systems and establish closer defense cooperation. Approving the deal would strengthen our ties with Georgia and expand our influence in the South Caucasus, though it would also involve the transfer of advanced military technology."
 georg_army.4.a: "Approve the export"
 georg_army.4.b: "We cannot authorize this sale"
 georg_army.5.t: "[FROM.GetName] Approves the UAV Deal"
 georg_army.5.d: "[FROM.GetName] has approved our request to purchase reconnaissance unmanned aerial vehicles from Elbit Systems. The agreement will provide the Georgian Armed Forces with valuable reconnaissance capabilities and allow our personnel to gain experience operating modern UAVs, laying the foundation for a domestic unmanned aviation program."
 georg_army.5.a: "Excellent news"
 georg_army.6.t: "[FROM.GetName] Rejects the UAV Deal"
 georg_army.6.d: "[FROM.GetName] has declined our request to purchase reconnaissance unmanned aerial vehicles. While this is a setback for our modernization efforts, we will continue developing our unmanned capabilities through domestic research and alternative foreign partners."
 georg_army.6.a: "We'll find another way"
 georg_army.7.t: "The Establishment of STC Delta"
 georg_army.7.d: "The consolidation of Georgia's defense research institutes and military production facilities into the State Military Scientific-Technical Center 'Delta' marks the beginning of a new chapter for our defense industry. By bringing engineers, designers, and manufacturers under a single organization, we can coordinate the development of indigenous military equipment instead of relying solely on foreign suppliers.\n\nSTC Delta will be tasked with designing armored vehicles, modernizing existing equipment, developing unmanned systems, manufacturing ammunition, and supporting the Georgian Armed Forces with domestically produced technology."
 georg_army.7.a: "A foundation for Georgia's defense industry"

 ###################

 GEO_idea_remov_west_tt: "This idea will be removed if you §Yswitch to a §2pro-western§! government§!"

 georg.1.t: "Split in the party"
 georg.1.d: "The ruling party of Georgia, Citizens Union, is split into two factions. One faction is pro-western and the other is pro-Russian. The pro-western faction is led by the current Prime Minister Zurab Zhvania, while the pro-Russian faction is led by the current President Eduard Shevardnadze. The split has caused a lot of tension within the party and has made it difficult for them to govern effectively. The question now is how we will try to keep the party from total collapse."
 georg.1.a: "Let them go, we don't need them!"
 georg.1.b: "Bribe them to stay together!"

 GEO_calm_kvitsiani: "Calm Kvitsiani Down"
 GEO_calm_kvitsiani_desc: "Kvitsiani is very dangerous and has a lot of influence in the Svaneti region. We need to calm him down and make sure he doesn't cause any more problems for us."

 GEO_oligarchic_deals: "Oligarchic Deals"
 GEO_oligarchic_deals_desc: "We will make deals with the oligarchs to keep them happy and ensure their support for our government."

 GEO_protect_georgian_industry: "Protect Georgian Industry"
 GEO_protect_georgian_industry_desc: "We will implement protectionist policies to protect Georgian industry from foreign competition and ensure the sustainability of our economy."

 georg.2.t: "Georgian Opposition Crushed!"
 georg.2.d: "The opposition in Georgia has been crushed by the government. Saakashvili has fled the country and his supporters have been arrested and imprisoned. The government has also taken control of the media and is using it to spread propaganda and silence dissent.\n\nNow Shevardnadze is the undisputed leader of Georgia and opposition is severely weakened."
 georg.2.a: "Stable Georgia is a strong Georgia!"

 GEO_crush_opposition_sherv: "Crush the Opposition"
 GEO_crush_opposition_sherv_desc: "Shevardnadze has gained enough popularity and momentum to crush the opposition and solidify his power. We will use all means necessary to ensure that the opposition is completely crushed and unable to challenge our rule."

 GEO_anal_castrate_kvitsiani: "Down with Monadire!"
 GEO_anal_castrate_kvitsiani_desc: "Kvitsiani is a dangerous individual whose influence in the Kodori Gorge and Svaneti region is a threat to our government. We need to take him down and ensure that he is no longer able to cause problems for us."

 GEO_old_soviet_connections: "Old Soviet Connections"
 GEO_old_soviet_connections_desc: "We will use our old Soviet connections to gain support and resources from Russia and other former Soviet states. This will help us to strengthen our position and ensure the stability of our government."

 georg.3.t: "Georgia asks for non-aggression agreement."
 georg.3.d: "Georgia asks us to sign a non-aggression agreement with them. This is a part of their neutrality act law which [GEO.GetLeader] has been pushing for. Should we sign this agreement and ensure peace with Georgia?"
 georg.3.a: "Of Course"
 georg.3.b: "Sorry, no"

 GEO_push_real_neutrality: "Push for Real Neutrality"
 GEO_push_real_neutrality_desc: "We will push for real neutrality in our relations with neighboring countries. This means that we will not interfere in their internal affairs and will not take sides in any conflicts they may have with other countries."

 GEO_georgian_neutrality_act: "Georgian Neutrality Act"
 GEO_georgian_neutrality_act_desc: "Georgia will pass a neutrality act which declares that we will not take sides in any conflicts between other countries. This is a positive step towards ensuring peace and stability in the region, and we should support this act and encourage other countries to follow suit."

 GEO_firm_eastern_route: "Firm Eastern Route"
 GEO_firm_eastern_route_desc: "Pursue a closer strategic alignment with the East to secure economic and security ties. This path cements relations with former Soviet partners and may bring stronger Russian influence at the expense of Western trust."

 GEO_russian_protection: "Request Russian Protection"
 GEO_russian_protection_desc: "Formally request Russian security guarantees and cooperation. This may require leaving current security arrangements and will signal a clear pivot toward Moscow, with potential diplomatic consequences."

 GEO_loyal_military: "Consolidate a Loyal Military"
 GEO_loyal_military_desc: "Strengthen and reorient the armed forces to ensure loyalty to the government. The military will gain experience and political influence, improving regime security but increasing militarization of politics."

 GEO_peace_agreements: "Pursue Peace Agreements"
 GEO_peace_agreements_desc: "Negotiate peace accords with conflicting parties to reduce tensions and stabilize the region. Success may improve regional relations but could require difficult concessions."

 GEO_georgian_demilitarization: "Georgian Demilitarization"
 GEO_georgian_demilitarization_desc: "Significantly reduce military spending and roll back conscription in favour of a non'military defence posture. This frees resources for civilian use but weakens conventional force readiness."

 GEO_stability_at_all_costs: "Stability At All Costs"
 GEO_stability_at_all_costs_desc: "Make national stability the top priority, seeking broad popular support and appointing conciliatory leadership to keep the country calm and orderly, even if it requires difficult compromises."

 georg.4.t: "[FROM.GetNameWithFlag] Joins the §GUnion State!§!"
 georg.4.d: "Recently, President of [FROM.GetName] [FROM.GetLeader] decided to join the Union State project and unite with us and other member states!"
 georg.4.a: "Wonderful!"

 GEO_union_state_agreement: "Union State Agreement"
 GEO_union_state_agreement_desc: "We will sign the Union State Agreement with Russia and other member states, which will allow us to integrate our economies and political systems and create a stronger union between our countries."

 peacemaker_trait: "Georgian Peacemaker"

 GEO_saakashvili_1: "Saakashvili's Politics"

 GEO_new_government_symbols: "New Government Symbols"
 GEO_new_government_symbols_desc: "We will change the national symbols of Georgia to reflect the new government and its ideology. This may include changing the flag, coat of arms, and national anthem to better represent our values and aspirations."

 GEO_gamsakhurdias_legacy: "Gamsakhurdia's Legacy"
 GEO_gamsakhurdias_legacy_desc: "We will embrace the legacy of Zviad Gamsakhurdia, the first president of Georgia, and use his image and ideals to inspire our people and promote national unity. This may include commemorating his achievements and promoting his vision for a strong and independent Georgia."

 GEO_adjara_razjebat: "Deal with Adjara"
 GEO_adjara_razjebat_desc: "We will take decisive action to deal with the situation in Adjara, where Aslan Abashidze has been causing problems for our government. This may include military intervention or diplomatic efforts to bring him under control and restore order in the region."

 GEO_military_strength: "Military Strength"
 GEO_military_strength_desc: "We will focus on strengthening our military capabilities to ensure the security of our country and deter any potential aggressors. This may include increasing military spending, modernizing our armed forces, and improving our defense infrastructure."

 GEO_gamsakhurdia_legacy: "Gamsakhurdia's Legacy"

 GEO_military_friend_saak: "Saakashvili's Military Reforms"

 georg.13.t: "Plan on Zhvania"
 georg.13.d: "Saakashvili is planning to assassinate the Prime Minister Zurab Zhvania. This is a risky move, but he has long been abusing his power to pursue his own interests under rule of Saakashvili. We must decide what we should do now."
 georg.13.a: "Let's try to assassinate him!"
 georg.13.b: "We shdouldn't do that, it would be too risky."

 georg.14.t: "Zhvania is Killed!"
 georg.14.d: "Prime Minister Zurab Zhvania, who helped lead Georgia's revolution that toppled the corruption-tainted regime of Eduard Shevardnadze, died early Thursday in a friend's apartment from what officials claimed was an accidental gas leak from a heater. But the circumstances of his death have raised suspicions of foul play, and the government has launched an investigation into the incident."
 georg.14.a: "Good..."

 georg.15.t: "Zhvania Survives!"
 georg.15.d: "Prime Minister Zurab Zhvania has survived an assassination attempt. The assasin who was tasked to kill him failed his mission and was captured by police. All traces lead to Saalashvili, but he affirms that he is not part of this plan and that he had no knowledge of it. Opposition is outraged and demands Saakashvili's resignation, but he refuses to step down. The situation is tense and uncertain."
 georg.15.a: "We are in deep shit."

 GEO_decrease_corruption: "Decrease Corruption"
 GEO_decrease_corruption_desc: "We will take decisive action to decrease corruption within our government and institutions. This may include implementing stricter oversight mechanisms, increasing transparency, and holding corrupt officials accountable for their actions."

 GEO_saak_increase_social_supp: "Increase Social Support"
 GEO_saak_increase_social_supp_desc: "We will focus on increasing social support for our citizens, particularly those who have been affected by the political changes and economic challenges. This may include implementing social welfare programs, improving access to healthcare and education, and providing financial assistance to those in need."

 GEO_saak_socialka: "Social Support Reform"

 GEO_western_civilization_idea: "Part of Western Civilization"

 GEO_western_civilization: "Part of Western Civilization"
 GEO_western_civilization_desc: "We will embrace the values and principles of Western civilization to guide our nation's development and strengthen our ties with the international community. We have always been a part of Western civilization, and we will continue to uphold its ideals of democracy, human rights, and the rule of law. This will help us to build a better future for our country and our people."

 GEO_traditional_christianity: "Traditional Christianity"
 GEO_traditional_christianity_desc: "We will reaffirm our commitment to traditional Christianity as a core part of our national identity and values. This may include promoting the teachings of the Orthodox Church, supporting religious institutions, and incorporating Christian principles into our laws and policies. We will also distance ourselves from Russian Church, to establish more firm relations with Greek Orthodox Church."

 GEO_human_rights_reform: "Human Rights Reform"
 GEO_human_rights_reform_desc: "We will implement comprehensive human rights reforms to ensure the protection and promotion of human rights for all citizens. This may include strengthening legal protections, improving access to justice, and promoting equality and non-discrimination. We will also work to align our human rights standards with international norms and best practices."

 GEO_Liberator_Georgia: "Liberator of Georgia"

 GEO_strong_and_free_georgia: "Strong and Free Georgia"
 GEO_strong_and_free_georgia_desc: "We have built a strong and free Georgia, where our people can live in peace and prosperity. We have overcome many challenges and obstacles to get to this point, and we will continue to work hard to maintain our independence and sovereignty. Our country is now a beacon of hope and freedom in the region, and we will do everything in our power to protect it and ensure its continued success."

 GEO_economic_reform_idea: "Economic Liberalization"

 GEO_economic_liberty_act: "Economic Liberalization Act"
 GEO_economic_liberty_act_desc: "We will implement an Economic Liberalization Act to promote economic growth and development in our country. This may include reducing regulations, encouraging entrepreneurship, and attracting foreign investment. We will also work to diversify our economy and reduce our dependence on any single industry or sector. This will help us to create a more dynamic and resilient economy that can provide opportunities for all of our citizens."

 GEO_bendukidze_reforms: "Bendukidze's Reforms"
 GEO_bendukidze_reforms_desc: "We will implement the economic reforms proposed by Kakha Bendukidze, which include reducing government intervention in the economy, promoting free market principles, and encouraging entrepreneurship. These reforms will help to stimulate economic growth and create a more competitive business environment in our country."

 GEO_economic_reform_idea2: "Bendukidze's Reforms"

 GEO_suppress_kartvelic_separatism: "Suppress Kartvelic Separatism"
 GEO_suppress_kartvelic_separatism_desc: "We will take decisive action to suppress any separatist movements within our country that threaten our national unity and territorial integrity. This may include increased security measures, intelligence gathering, and targeted operations to dismantle separatist networks and prevent them from gaining traction among the population."

 GEO_suppress_crime: "Suppress Crime"
 GEO_suppress_crime_desc: "We will implement a comprehensive strategy to suppress crime in our country and ensure the safety and security of our citizens. This may include increasing law enforcement resources, improving crime prevention programs, and strengthening the justice system to hold criminals accountable for their actions."

 GEO_future_of_media_freedom: "Future of Media Freedom"
 GEO_future_of_media_freedom_desc: "We will need to decide on the future of media freedom in our country. While we value a free and independent press, we also need to ensure that the media is responsible and does not spread russian propaganda or misinformation. We will need to find a balance between protecting media freedom and ensuring that our citizens have access to accurate and reliable information."

 georg.16.t: "Discsussion on Media Freedom"
 georg.16.d: "The issue of media freedom is a contentious one in our country. On one hand, we want to promote a free and independent press that can hold those in power accountable and provide our citizens with accurate information. On the other hand, we also need to ensure that the media does not spread russian propaganda or misinformation that could harm our national security. We need to find a way to balance these two concerns and ensure that our media is both free and responsible."
 georg.16.a: "Let's silently censor the media."
 georg.16.b: "Do not risk it."

 GEO_changes_in_militar: "Changes in Military"

 GEO_okurashvili_case: "Okurashvili Case"
 GEO_okurashvili_case_desc: "We will need to address the case of Defense Minister Irakli Okruashvili. There's evidence that he is related to related to a parliamentary commission probe and the high-profile killing of Amiran (Buta) Robakidze."

 georg.17.t: "Deal with Saakashvili"
 georg.17.d: "Saakashvili wants to strike a deal with our country so thta in case of his abdication he would be able to flee to Ukraine and become politician here. He is also ready to give us some concessions in exchange for this deal. Should we accept his offer?"
 georg.17.a: "Accept the deal."
 georg.17.b: "Reject the deal."

 georg.18.t: "Ukraine Accepts!"
 georg.18.d: "Ukraine has accepted Saakashvili's offer and has agreed to provide him with a safe haven in exchange for certain concessions."
 georg.18.a: "Good, we have a deal!"

 georg.19.t: "Ukraine Rejects!"
 georg.19.d: "Ukraine has rejected Saakashvili's offer and has refused to provide him with a safe haven. This is a setback for Saakashvili and may force him to reconsider his options."
 georg.19.a: "Bad, we need to find another solution."

 GEO_ukrainian_backdoor: "Ukrainian Backdoor"
 GEO_ukrainian_backdoor_desc: "We will need to find a way to maintain a backdoor relationship with Ukraine in case we need to use it as a safe haven for Saakashvili or other political figures in the future. This may involve maintaining diplomatic ties and keeping channels of communication open with Ukrainian officials."

 ###########   Georgia Dream's

 georg_geo_dream.1.t: "Stance on LGBT"
 georg_geo_dream.1.d: "The following is on the government's agenda: the issue of LGBTQ legalization. Supporters of legalizing sexual minorities are the pro-Western part of society. Additionally, legalizing LGBTQ will improve our image among EU member states and will undoubtedly accelerate their decision on Georgia's accession to the EU and NATO. On the other hand, our opponents are the conservative part of society and the clergy. They advocate for a complete ban on sexual minorities and will exert pressure in the event of LGBTQ legalization."
 georg_geo_dream.1.a: "Down with obstacles to love!"
 georg_geo_dream.1.b: "We are against sodomy!"

 georg_geo_dream.2.t: "The question of the country's demilitarization."
 georg_geo_dream.2.d: "Given the prevailing geopolitical circumstances, the Ministry of Defense has begun considering the suspension of demilitarization and an increase in defense expenditures. Such measures would unquestionably reinforce our defensive capacities and facilitate future cooperation with NATO. However, they would also attract Russia's scrutiny, as Moscow would likely view them as an aggressive act."
 georg_geo_dream.2.a: "We must stand up for our sovereignty."
 georg_geo_dream.2.b: "There is a significant risk in attracting Russia's attention."

 ############### Mkhedrioni #################
    
    #focus
 GEO_revive_mkhedrioni: "Revive the Mkhedrioni"
 GEO_revive_mkhedrioni_desc: "The Mkhedrioni have returned from the political grave. Once condemned as a relic of Georgia's violent first years of independence, the Horsemen have again found an audience among veterans, nationalists and those who have lost faith in the existing political order. Yet reviving the movement is easier than deciding what it should become. Some see the Mkhedrioni as the sword that can restore Georgia's ancient monarchy and return the Bagrationi tradition to the center of national life. Others believe that the country has no need for another ceremonial authority, but for a disciplined state ruled by men prepared to impose order by force. The Horsemen ride again—but toward what kind of Georgia?"
 GEO_crossroads_of_the_horsemen: "Crossroads of the Horsemen"
 GEO_crossroads_of_the_horsemen_desc: "The Mkhedrioni have returned, but the movement can no longer avoid the question of what comes next. The Horsemen must choose what kind of Georgia they intend to build."
 GEO_church_and_sword: "Church and Sword"
 GEO_church_and_sword_desc: "For centuries, Georgia survived not only by the strength of its armies, but by the endurance of its faith. Kings were overthrown, borders erased and foreign rulers imposed, yet the Georgian Church remained one of the few institutions capable of carrying the memory of the nation through every occupation. In modern Georgia, few figures have embodied that continuity more strongly than Catholicos-Patriarch Ilia II. His authority reaches far beyond the clergy, commanding respect among believers, conservatives and those who see the Church as the last institution untouched by the failures of ordinary politics. If Georgia is to be rebuilt around tradition rather than imitation, then the new order must begin with the moral authority of the Patriarch and the strength required to defend it." 
 GEO_return_of_ioseliani: "Return of Ioseliani"
 GEO_return_of_ioseliani_desc: "The Horsemen were never truly gone. Their veterans, contacts and loyalties survived beneath the surface of Georgian politics long after the black uniforms disappeared from the streets. With the nationalist military establishment now holding power, Jaba Ioseliani's legacy can be restored and the Mkhedrioni brought back into political life."
 GEO_legacy_of_the_builder: "Legacy of the Builder"
 GEO_legacy_of_the_builder_desc: "Few Georgian rulers reshaped the state as completely as David IV. He inherited a divided and weakened kingdom, yet understood that military strength alone could not secure Georgia's future. Roads had to be restored, towns revived, administration strengthened and the resources of the realm organized toward a common purpose. His victories made him famous, but it was his ability to rebuild the foundations of the state that earned him the name 'the Builder'. If our new order is to claim continuity with Georgia's greatest age, then we must follow the same principle: first build the state, and only then ask what that state is capable of achieving."
 GEO_a_new_gelati: "A New Gelati"
 GEO_a_new_gelati_desc: "David the Builder understood that a powerful kingdom required more than armies and fortresses. Under his patronage, Gelati became one of the great centers of learning in the medieval Caucasus, bringing together theology, philosophy and scholarship in service of the Georgian state. A modern Georgia cannot simply imitate the institutions of the eleventh century, but it can revive the principle behind them: knowledge, education and the welfare of the population are foundations of national strength. We must build institutions worthy of the state we intend to restore."
 GEO_order_the_royal_accounts: "Order the Royal Accounts"
 GEO_order_the_royal_accounts_desc: "The restoration of Georgia cannot be financed through sentiment alone. David the Builder understood that a strong crown required disciplined administration, reliable revenues and officials who served the state rather than themselves. We must bring the same order to modern Georgia—cleaner accounts, stronger oversight and a treasury capable of supporting national reconstruction."
 GEO_rebuild_the_royal_roads: "Rebuild the Royal Roads"
 GEO_rebuild_the_royal_roads_desc: "The strength of David's kingdom did not rest only in fortresses and armies. Royal authority required roads capable of carrying merchants, officials and soldiers from one end of the realm to another. A road was more than stone beneath a cart—it bound distant provinces to the crown and transformed isolated communities into parts of a single state. Modern Georgia possesses highways, railways and communications that David could never have imagined, yet too much of the country remains poorly connected and unevenly developed. The old principle remains unchanged: where the state can travel, the state can govern."
 GEO_the_crown_of_the_golden_age: "The Crown of the Golden Age"
 GEO_the_crown_of_the_golden_age_desc: "David the Builder laid the foundations of a powerful Georgian state, but it was under his great-granddaughter Tamar that those foundations reached their fullest expression. Her reign became synonymous with Georgia's Golden Age: a kingdom secure enough to prosper, influential enough to attract merchants and travelers, and powerful enough to stand at the center of the political and commercial life of the Caucasus. We cannot recreate the economy of the twelfth century, nor should we try. But we can revive the principle that made that age possible. A stable, connected and confident Georgia can once again become a crossroads between the Black Sea, the Caucasus and the markets beyond. Let the prestige of the old Golden Age become the foundation of a new one."  
 GEO_georgia_of_our_patriarch: "Georgia of Our Patriarch"
 GEO_georgia_of_our_patriarch_desc: "The old proposal of a ceremonial constitutional crown no longer seems sufficient. Georgia's divisions require something stronger: an authority capable of standing above parties not merely in symbolism, but in power. Under the guidance of Patriarch Ilia II, the monarchist movement is beginning to demand the restoration of a sovereign crown at the center of the Georgian state."   
 GEO_save_the_dynasty: "Save the dynasty heritage"
 GEO_save_the_dynasty_desc: "Restoring the Georgian monarchy requires more than finding a descendant of the old kings. The House of Bagrationi itself has long been divided between competing branches, each carrying its own claim to dynastic legitimacy. Patriarch Ilia II understood that such a division could become a fatal weakness for any restoration. The union of Ana Bagration-Gruzinsky and Davit Bagration-Mukhrani demonstrated that the rivalry of the two houses need not continue forever. Their marriage did not endure, but it produced something of lasting importance: a new generation carrying the blood of both lines. Before the crown can return, the dynasty must once again learn to think of itself as one house."   
 GEO_godfather_of_georgian_nation: "Godfather of the Georgian Nation"
 GEO_godfather_of_georgian_nation_desc: "Georgia's demographic decline has become a threat to the future of the nation itself. Patriarch Ilia II answered that danger in a deeply personal way, encouraging larger families and becoming godfather to tens of thousands of Georgian children through mass baptisms. What began as a religious initiative must now become a national policy. The Church has already given larger families prestige and moral support; the state will now help give them the means to raise the next generation." 
 GEO_friends_in_rome: "Friends in Rome"
 GEO_friends_in_rome_desc: "Patriarch Ilia II has spent years maintaining ties with the Catholic world without compromising Georgia's Orthodox identity. Those relationships now offer something more tangible than theological dialogue. The restoration of churches, monasteries, hospitals and monuments can be presented as the preservation of a common Christian heritage, drawing Catholic foundations, charitable organizations and wealthy benefactors into Georgia. Rome may worship differently, but its doors—and its purses—are open to the Patriarch."
 GEO_restore_the_sacred_heritage: "Restore the Sacred Heritage"
 GEO_restore_the_sacred_heritage_desc: "The assistance secured through the Patriarch's connections in Rome must leave something permanent behind. Across Georgia stand monasteries, churches, archives and historic religious centers that survived invasion, imperial rule and decades of neglect. Their restoration will require more than state decrees. Architects, craftsmen, builders, archivists and local businesses must all take part in the work. By rebuilding the institutions that preserved Georgian identity through centuries of crisis, we will preserve the past while creating new economic life around it." 
 GEO_academy_of_saint_queen_tamar: "Academy of Saint Queen Tamar"
 GEO_academy_of_saint_queen_tamar_desc: "The Order of Saint Queen Tamar once honored those who rendered distinguished service to Georgia and its struggle for national independence. Under the restored royal movement, that tradition will be given a new purpose. The Order will become the foundation of an elite military academy charged with educating a new generation of officers. Its cadets will be taught not only modern warfare, but the duties of service to the Crown, the Church and the Georgian nation."  
 GEO_heir_of_two_houses: "Heir of Two Houses"
 GEO_heir_of_two_houses_desc: "The union of the Gruzinsky and Mukhrani branches has done more than settle an old dynastic dispute. It has created an heir who carries the blood of both major Bagrationi lines and offers the monarchist movement something it has long lacked: a succession around which the entire royal house can rally. With the dynasty's future secured at home, we can now seek recognition beyond Georgia and present the Bagrationi restoration as the continuation of a royal tradition that reaches across the history of the Caucasus."   
 GEO_the_bagrationi_settlement: "The Bagrationi Settlement"
 GEO_the_bagrationi_settlement_desc:0 "In Georgia's Golden Age, the Bagrationi kings and queens made their kingdom the foremost power of the southern Caucasus. From David the Builder to Queen Tamar, royal authority reached beyond Georgia's heartland, drawing neighboring rulers into its orbit. The restored Crown will invoke that inheritance once more: Armenia will be asked to acknowledge our suzerainty, while Azerbaijan, Abkhazia and South Ossetia must be brought beneath the Bagrationi banner."
 GEO_crown_of_the_caucasus: "Crown of the Caucasus"
 GEO_crown_of_the_caucasus_desc: "Armenia has already acknowledged the Bagrationi restoration as part of the wider Bagratid inheritance. History has opened a door that may never open again. Georgia will now propose something far greater than symbolic recognition: a common monarchist order capable of reshaping the balance of power across the Caucasus. If Yerevan accepts, the two nations will stand together beneath a new alliance and pursue the restoration of lands lost to foreign rule. If it refuses, the monarchist forces awakened within Armenia may decide that their own government has betrayed the legacy it once recognized."  
 GEO_armenia_recognized_bagrationi: "Armenia Recognized the Bagrationi Legacy"
 GEO_armenia_recognized_bagrationi_desc: "Armenia has formally acknowledged the Bagrationi restoration as part of a wider shared Bagratid dynastic tradition."   
 GEO_greater_georgian_project: "The Greater Georgian Project"
 GEO_greater_georgian_project_desc: "Georgia cannot allow the borders imposed by defeat, foreign intervention and the collapse of the Soviet Union to define the limits of its future. Abkhazia and South Ossetia remain beyond Tbilisi's authority, while Armenia occupies territory that Georgian nationalists increasingly regard as part of the country's historical sphere. To the southeast, our ambitions are more limited but no less deliberate: strategic lands along the Azerbaijani frontier must be incorporated into the Georgian state. The Greater Georgian Project will transform territorial restoration from rhetoric into state policy."   
 GEO_greater_georgian_project_tt: "Georgia will receive §YAnnex§! war goals against §YAbkhazia§!, §YSouth Ossetia§! and §YArmenia§!.\nGeorgia will gain claims on Azerbaijani states §Y712§! and §Y1206§!."   
 GEO_skeleton_dance: "Skeleton Dance"
 GEO_skeleton_dance_desc: "Ioseliani's years in the theatre were not a detour from politics, but preparation for it. A playwright learns how to construct heroes and villains, how to direct attention and how to make an audience accept the logic of a story before the final act arrives. The Mkhedrioni will apply those lessons to Georgian politics. Rallies, speeches, symbols and carefully staged public appearances will transform a discredited armed movement into a political spectacle capable of capturing the national imagination."   
 GEO_thieves_in_black: "Thieves in Black"
 GEO_thieves_in_black_desc: "The Mkhedrioni were never merely soldiers. Around the black uniforms grew a network of businessmen, smugglers, thieves, fixers and officials whose loyalty depended less upon laws than upon favors. Ioseliani understands such relationships better than most. Rather than attempting to destroy Georgia's informal economy, the new movement will bind it to the state. Offices will conceal private arrangements, businessmen will purchase political protection, and every favor granted will create another obligation owed to the Horsemen."  
 GEO_money_laundering: "Money Laundering"
 GEO_money_laundering_desc: "Protection money, smuggling revenue and payments collected through informal networks are useful only while they can be spent without attracting attention. The Mkhedrioni's businessmen will now provide a bridge between the underground economy and respectable commerce. Shell companies, friendly offices and protected corporations will absorb illicit funds and return them as investments, contracts and taxable income. The money may have changed its clothes, but everyone involved knows where it came from."   
 GEO_use_our_people: "Use Our People"
 GEO_use_our_people_desc: "Borders mean little to networks that existed long before governments learned to control them. Georgian and Armenian businessmen, smugglers, fixers and criminal authorities already know one another, and Armenia's own accommodation with organized crime has created an opportunity for cooperation. Rather than build a new commercial relationship from nothing, Ioseliani intends to use the people who already know how to move money and goods across the Caucasus."   
 GEO_traditions_of_the_caucasus: "Traditions of the Caucasus"
 GEO_traditions_of_the_caucasus_desc: "Economic growth means little if it comes at the cost of the society it was meant to serve. The new order will direct support toward Georgian families, local businesses and community institutions while defending the social traditions that have shaped life in the Caucasus for generations. Prosperity must strengthen the nation, not dissolve it."   
 GEO_jeans_sweaters_jackets_sunglasses: "Jeans, Sweaters, Jackets, Sunglasses"
 GEO_jeans_sweaters_jackets_sunglasses_desc: "The Mkhedrioni were never defined by parade uniforms or military regulations. Jeans, sweaters, leather jackets and dark sunglasses became as recognizable as the weapons they carried. The new Horsemen will be raised in the same spirit: lightly equipped, loosely organized and personally loyal to the movement rather than to the traditions of a conventional army."   
 GEO_connection_with_migrants_abroad: "Connection with Migrants Abroad"
 GEO_connection_with_migrants_abroad_desc: "Hundreds of thousands of Georgians live and work beyond our borders, from Moscow and Athens to Istanbul, Tel Aviv, Berlin and New York. By organizing diaspora associations, cultural initiatives, and civic councils abroad, we can turn the Georgian diaspora into a powerful vehicle for state influence across the globe."
 GEO_caucasian_cultural_centers_abroad: "Caucasian Cultural Centers Abroad"
 GEO_caucasian_cultural_centers_abroad_desc: "Georgia's ancient Christian culture, polyphonic heritage, and historical prestige represent our greatest instruments of soft power. Establishing Caucasian cultural centers and Orthodox mission outposts across Europe and the Middle East ensures that Georgia commands international respect and a recognized voice on the world stage."
   # Mkhedrioni events
 georg_mkhedrioni.1.t: "Two Souls of the Mkhedrioni"
 georg_mkhedrioni.1.d: "The revival of the Mkhedrioni has brought together men who share a deep contempt for the existing political order, but increasingly little else.\n\nOne camp believes the Horsemen should become the armed foundation of a restored Georgian monarchy. To them, the Mkhedrioni exist to defend the Church, restore the authority of the Bagrationi dynasty and rebuild a state rooted in Georgia's older traditions. The movement should be the sword of the new order, not its master.\n\nThe other camp is made of harder men: veterans, military loyalists, businessmen of questionable reputation and figures whose influence was forged in prisons, markets and the criminal underworld. They have little patience for ceremonies or noble ancestry. To them, power belongs to those capable of taking and keeping it. Jaba Ioseliani's mixture of intellect, ruthlessness and underworld authority remains their ideal.\n\nBoth factions still march beneath the same banner, but they no longer imagine the same Georgia. One looks toward crown and altar. The other looks toward the return of Jaba's order.\n\nThe Horsemen cannot ride in two directions forever."
 georg_mkhedrioni.1.a: "Crown or Mafia?"
   #Monarchist events
 georg_monarchist.1.t: "More Than a Conqueror"
 georg_monarchist.1.d: "David IV is remembered first as the king who defeated Georgia's enemies and opened the way for the country's golden age. Yet his military victories were only one part of a much broader transformation.\n\nWhen David came to power, Georgia was fragmented, politically weak and under constant pressure from stronger neighbors. His answer was not simply to raise a larger army. He strengthened royal authority, reorganized administration, reduced the power of rival nobles, reformed the military and sought to ensure that the resources of the kingdom could be directed toward a common national purpose.\n\nHe also understood that prosperity was itself a weapon. Roads, towns, monasteries and centers of learning were encouraged because a stronger economy and better educated elite made the crown more capable of governing and defending the realm. The state that emerged under David was not merely larger—it was more organized.\n\nFor modern Georgia, this may be the most important part of his legacy. Corruption, private interests and weak institutions can destroy a country as effectively as any foreign army. If we wish to invoke the Builder's name, then we must be prepared to imitate his discipline as well as his ambition."
 georg_monarchist.1.a: "A kingdom is built in offices as well as on battlefields."
 georg_monarchist.2.t: "The Patriarch's Godchildren"
 georg_monarchist.2.d: "Georgia's demographic decline has long troubled Patriarch Ilia II. Emigration, economic uncertainty and shrinking families threatened something no army could restore once lost: the people themselves.\n\nHis answer was deeply personal. The Patriarch announced that he would baptize and become godfather to the third and subsequent children of Georgian Orthodox families. What began as a religious gesture gradually became a national phenomenon. Mass baptisms filled the Holy Trinity Cathedral, and tens of thousands of Georgian children came to regard Ilia as their godfather.\n\nThe initiative carried a meaning far beyond baptism. Larger families were no longer to be seen merely as bearing a private economic burden. They were preserving the future of the Georgian nation itself. The Church gave that sacrifice prestige, while the Patriarch's personal participation transformed demographic policy from a bureaucratic concern into a question of faith, continuity and national survival.\n\nThe new government intends to build upon this legacy. Families willing to raise the next generation of Georgians must receive greater support from the state. Healthcare and social assistance will be strengthened around the same principle that guided the Patriarch's campaign: a kingdom without children has no future, no matter how glorious its past."
 georg_monarchist.2.a: "Let Georgia grow beneath his blessing."
 georg_monarchist.3.t: "Friends in Rome"
 georg_monarchist.3.d: "The restoration of Georgia's churches, monasteries and historic institutions has quickly grown beyond the resources that the state can comfortably provide. Patriarch Ilia II, however, possesses connections unavailable to ordinary politicians.\n\nFor years, the Patriarch maintained cordial relations with the Catholic world. Differences of doctrine never disappeared, but neither did they prevent personal respect, cultural cooperation and a shared concern for the preservation of Christianity's ancient heritage.\n\nIlia has now called upon those relationships. Catholic charitable organizations, religious foundations, wealthy benefactors and European investors have been encouraged to see the recovery of Georgia's Christian heritage as a common cause. Rome has become the symbolic center of a wider network of support, opening doors throughout Catholic Europe that would otherwise have remained closed to us.\n\nThe response has exceeded expectations. Large financial commitments have been assembled for the restoration of churches, monasteries, schools, hospitals and cultural institutions. These funds will strengthen not only the Church, but the Georgian state itself.\n\nYet every open door allows influence to travel in both directions. Greater cooperation with Catholic Europe will bring investment, education and political goodwill, but it will also expose Georgian society more closely to Western ideas and foreign interests. The Patriarch believes Georgia is strong enough to accept friendship without surrendering its identity."
 georg_monarchist.3.a: "Old faiths can still build new bridges."
 georg_monarchist.5.t: "Recognition Beyond Georgia"
 georg_monarchist.5.d: "The reconciliation of the great Bagrationi branches has strengthened the monarchist cause inside Georgia, but legitimacy proclaimed only by ourselves can carry us only so far.\n\nThe Bagrationi name is inseparable from the complicated dynastic history of the medieval Caucasus. Georgian monarchists increasingly emphasize the historical connections between the Bagrationi and the Armenian Bagratid tradition, arguing that the restoration of our dynasty represents the survival of a royal heritage older than the modern borders of either state.\n\nRecognition from Armenia would therefore carry enormous symbolic weight. It would demonstrate that the Bagrationi restoration is not merely an invention of Georgian nationalists, but a dynasty whose historical significance is acknowledged even beyond Georgia.\n\nThere is another consideration. Such recognition may awaken monarchist sentiment inside Armenia itself. If Yerevan accepts that an ancient Caucasian royal dynasty can return to political life, Armenian nationalists may begin asking why their own royal traditions should remain confined to history.\n\nThe Patriarch and the royalists therefore propose sending a formal request to Yerevan: recognize the Bagrationi as heirs to a shared Bagratid dynastic tradition."
 georg_monarchist.5.a: "Send the request to Yerevan."
 GEO_bagratid_request_sent_tt: "§YArmenia will decide whether to recognize our dynastic claim.§!\n\n§GIf Armenia accepts:§!\nArmenian monarchism and nationalism will receive a major boost.\nArmenia will receive §YAwakening of the Bagratid Legacy§! for §Y365 days§!.\nRelations between Georgia and Armenia will improve.\nGeorgia gains §G50§! Political Power, §G3%§! Stability and §G3%§! monarchist popularity.\n\n§RIf Armenia rejects:§!\nRelations between Georgia and Armenia will deteriorate.\nGeorgia loses §R100§! Political Power and §R2%§! Stability."
 georg_monarchist.6.t: "The Bagrationi Request"
 georg_monarchist.6.d: "A formal delegation from Tbilisi has presented Armenia with an unusual request. The Georgian government asks us to recognize the restored House of Bagrationi as an heir to the broader Bagratid dynastic tradition.\n\nGeorgia stresses that this is not a territorial demand. Instead, Tbilisi argues that the histories of the Georgian Bagrationi and Armenian Bagratids form part of a wider royal tradition of the Caucasus, and that recognition by Armenia would give the Georgian restoration legitimacy beyond its own borders.\n\nThe proposal has already attracted attention among Armenian monarchists and nationalists. To them, the return of an ancient dynasty in neighboring Georgia demonstrates that monarchy need not remain a matter of museums and chronicles. Recognition could breathe new life into Armenia's own royalist movement.\n\nCritics are furious. They argue that the Bagratid legacy is one of the great symbols of Armenian statehood and should not be used to legitimize another country's monarchy.\n\nOur response will therefore have consequences far beyond ordinary Georgian-Armenian relations."
 georg_monarchist.6.a: "Recognize our shared Bagratid heritage."
 georg_monarchist.6.b: "The Bagratid legacy is Armenia's own."
 georg_monarchist.7.t: "Armenia Recognizes the Bagrationi"
 georg_monarchist.7.d: "Yerevan has accepted our proposal. Armenia has formally acknowledged the Bagrationi restoration as part of a shared Bagratid dynastic heritage.\n\nFor Georgian monarchists, the decision is a remarkable diplomatic victory. The dynasty can now claim recognition not only from its supporters at home, but from the country most closely associated with the older Bagratid tradition.\n\nThe announcement has also produced an unexpected political reaction inside Armenia, where monarchist and nationalist organizations have begun invoking Georgia's restoration as an example for their own country."
 georg_monarchist.7.a: "The old houses remember one another."
 georg_monarchist.8.t: "Yerevan Rejects Our Request"
 georg_monarchist.8.d: "Armenia has rejected our request for recognition. Yerevan insists that the Bagratid legacy belongs to Armenian history and refuses to grant the restored Bagrationi dynasty any broader dynastic legitimacy.\n\nThe answer has disappointed the royal court and angered Georgian nationalists. What was intended as recognition of a shared past has instead exposed how differently the two nations remember that past."
 georg_monarchist.8.a: "Then history will judge the matter."
 georg_monarchist.9.t: "The Royal Wedding at Sameba"
 georg_monarchist.9.d: "Beneath the golden dome of the Holy Trinity Cathedral in Tbilisi, the two historic branches of the House of Bagrationi—the Mukhraneli and the Gruzinsky—have been united in marriage with the blessing of Catholicos-Patriarch Ilia II.\n\nWhat once seemed an insurmountable dynastic rivalry has now become the cornerstone of royal restoration. Nobles, clergy, military officers and thousands of ordinary citizens gathered in the courtyard to witness the ceremony, greeting the union as the rebirth of Georgia's ancient sovereignty."
 georg_monarchist.9.a: "Long live the united House of Bagrationi!"
 georg_monarchist.9.t: "The Crown of the Caucasus"
 georg_monarchist.9.d: "Georgia has returned with a proposal far more consequential than the recognition we granted earlier. Tbilisi asks Armenia not merely to acknowledge the shared Bagratid inheritance, but to give that inheritance political form.\n\nUnder the proposal, Armenia's monarchist movement would assume leadership of the state and enter a permanent alliance with the restored Georgian monarchy. The new bloc would be known as the Crown of the Caucasus, joining Georgian and Armenian power against their common regional rivals.\n\nSupporters argue that Georgia has demonstrated that royal restoration need not remain a historical fantasy. Armenia could now recover its own monarchical tradition while gaining a powerful military partner.\n\nOpponents see an altogether different future. They warn that the supposed common crown is merely Georgian hegemony disguised in dynastic language, and that Armenia would surrender its independent political course to Tbilisi.\n\nThe decision is dangerous either way. Our monarchists have grown stronger since recognition of the Bagrationi legacy. If the government rejects Georgia now, some of them may refuse to accept that decision peacefully."
 georg_monarchist.10.t:0 "Take Advantage of Our Heritage"
 georg_monarchist.10.d:0 "The Bagrationi name once commanded respect throughout the southern Caucasus. The royal court now proposes turning that inheritance into a political settlement with Armenia.\n\nYerevan will be asked to accept the status of a Saeristavo: an administrative territory under Georgian suzerainty, governed by Armenian monarchists. If Georgian influence in Armenia has reached 30%, our supporters will secure its submission. Otherwise, the Armenian government will refuse, and the Crown must prepare to enforce its demand by force."
 georg_monarchist.10.a:0 "Invoke our heritage and send the request to Yerevan."
 
