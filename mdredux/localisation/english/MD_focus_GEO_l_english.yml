 GEO_thieves_economy1: "Thieves' Economy"
 GEO_thieves_economy1_desc: "The pervasive influence of underworld authorities and informal networks shapes the administration and revenue collection of the Georgian state."
 GEO_cultural_centers_abroad_idea: "Caucasian Cultural Mission"
 GEO_cultural_centers_abroad_idea_desc: "Georgian cultural centers and Orthodox mission outposts established across Europe and the Middle East serve as  instruments of soft power. The ancient traditions, polyphonic heritage and Christian identity of Georgia command growing international respect, strengthening the state's influence among diaspora communities and foreign governments alike."

 ########## Georgian Dream Focuses ##########
 GEO_Georgian_Dream: "Georgian Dream"
 GEO_Georgian_Dream_desc: "Founded by billionaire philanthropist Bidzina Ivanishvili, the Georgian Dream coalition promises a break from reckless confrontation and ideological zealotry—offering social welfare, pragmatic diplomacy, and steady economic development."
 GEO_Welfare_State: "Build the Welfare State"
 GEO_Welfare_State_desc: "To restore social trust after years of shock-therapy market reforms, the government will expand universal healthcare, pensions, and social protections for ordinary Georgian households."
 GEO_Economic_Pragmatism: "Economic Pragmatism"
 GEO_Economic_Pragmatism_desc: "Georgia's geographic position between Europe, Russia, and Asia is our greatest economic asset. Rather than subordinating trade to ideology, we will open Georgian agriculture and logistics to every profitable market."
 GEO_Green_Agenda: "Green Energy & Hydropower"
 GEO_Green_Agenda_desc: "Georgia's mountain rivers and renewable potential can make the country an energy hub of the South Caucasus while modernizing rural infrastructure."
 GEO_The_Middle_Path: "The Middle Path"
 GEO_The_Middle_Path_desc: "On sensitive social and cultural questions, the government seeks a careful balance between European commitments and traditional Georgian values."
 GEO_The_Bidzina_Doctrine: "The Bidzina Doctrine"
 GEO_The_Bidzina_Doctrine_desc: "Whether holding formal office or guiding the coalition from his glass residence above Tbilisi, Bidzina Ivanishvili's network of executives, financiers, and loyalists forms the true backbone of the state."
 GEO_Coopt_the_Church: "Concordat with the Patriarchate"
 GEO_Coopt_the_Church_desc: "By increasing state funding for the Georgian Orthodox Church and defending traditional family values, the ruling party secures the moral endorsement of the clergy."
 GEO_Quiet_Military: "A Quiet Military"
 GEO_Quiet_Military_desc: "After the costly military adventures of the previous era, Georgia's defense posture must shift toward professionalization, territorial defense, and strategic restraint."
 GEO_Zurabishvili_Administration: "The Zurabishvili Presidency"
 GEO_Zurabishvili_Administration_desc: "Born in Paris to a prominent Georgian émigré family and seasoned in French diplomacy, Salome Zurabishvili brings European prestige and diplomatic statesmanship to the presidency."
 GEO_Empower_The_Parliament: "Constitutional Parliamentary Reform"
 GEO_Empower_The_Parliament_desc: "Completing Georgia's transition to a parliamentary republic ensures that executive authority rests with the parliamentary majority and prime minister rather than a super-presidential autocrat."
 GEO_Judicial_Reform: "Judicial & Anti-Corruption Reform"
 GEO_Judicial_Reform_desc: "Reforming the High Council of Justice and modernizing commercial law will strengthen investor confidence and align Georgia's courts with European standards."
 GEO_Euro_Integration_Commitments: "European Integration Commitments"
 GEO_Euro_Integration_Commitments_desc: "Fulfilling the Association Agreement and Deep and Comprehensive Free Trade Area (DCFTA) commitments binds Georgia's economy and Youth closer to the European Union."
 GEO_Reset_with_Russia: "Pragmatic Reset with Russia"
 GEO_Reset_with_Russia_desc: "Without surrendering our territorial claims, reopening wine, mineral water, and agricultural exports and restoring direct flights with Russia will revitalize Georgian farmers and businesses."
 GEO_Attract_Chinese_Transit: "Attract Chinese Transit & BRI"
 GEO_Attract_Chinese_Transit_desc: "As the Middle Corridor links China to Europe across the Caspian and Black Seas, Chinese investment in Georgian railways, free industrial zones, and Black Sea ports will transform Tbilisi into a Eurasian logistics hub."
 GEO_Consolidate_the_Clan: "Consolidate the Judicial Clan"
 GEO_Consolidate_the_Clan_desc: "By retaining loyal judges and appointing trusted Cartu Group executives across key ministries, the informal power vertical becomes unassailable."
 GEO_Purge_UNM_Cadres: "Restoration of Justice: Purge UNM Cadres"
 GEO_Purge_UNM_Cadres_desc: "Officials of the former United National Movement regime must answer for their abuses of power, dismantling the opposition's institutional strongholds across the bureaucracy."
 GEO_The_Foreign_Agents_Law: "The Transparency of Foreign Influence Law"
 GEO_The_Foreign_Agents_Law_desc: "Foreign-funded NGOs and media outlets have repeatedly attempted to destabilize Georgian politics. Requiring organizations receiving foreign funding to register as agents of foreign influence will safeguard our sovereignty."
 GEO_Oligarchic_Capitalism: "Cartu Group & Oligarchic Capitalism"
 GEO_Oligarchic_Capitalism_desc: "Coordinating state development funds with Georgia's largest private financial and industrial holdings accelerates domestic construction while cementing oligarchic influence."
 GEO_Sovereign_Democracy: "Georgian Sovereign Democracy"
 GEO_Sovereign_Democracy_desc: "Georgia will no longer accept lectures from foreign capitals. We will chart our own sovereign democratic course rooted in stability, peace, and traditional values."
 GEO_The_Brussels_Gambit: "The Brussels Gambit"
 GEO_The_Brussels_Gambit_desc: "With institutional reforms completed and European partners rallied behind Tbilisi, Georgia takes a decisive step toward European Union candidate status and deep Western integration."
 GEO_One_Party_State: "The Unchallenged Dream"
 GEO_One_Party_State_desc: "With the radical opposition fractured and foreign interference neutralized, Georgian Dream stands as the sole guarantor of peace, stability, and national sovereignty."

