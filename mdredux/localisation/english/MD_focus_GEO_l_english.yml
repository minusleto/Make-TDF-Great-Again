 ########## Djavakheti Dynamic Modifier, Diplomatic Stances, Decisions & ZSFSR/USSR Events ##########
 GEO_djavakheti_distrust_modifier: "Djavakheti Distrust of Central Government"
 GEO_djavakheti_distrust_modifier_desc: "Deep-seated linguistic isolation, economic neglect, and political distrust toward the central authorities in Tbilisi hamper local administration, recruitment, and investment across Javakheti."
