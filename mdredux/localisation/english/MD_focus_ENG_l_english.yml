 #Events
 britain_brown.1.t: "Brown's Speech from the Throne"
 britain_brown.1.d: "With Tony Blair stepping down, Gordon Brown has officially assumed the seals of office as Prime Minister. Standing before Parliament, the new leader has laid out his legislative agenda through the traditional Speech from the Throne. Seeking a clear break from his predecessor's style, Brown has promised to tackle the \"spin culture\", restore trust in the government, and launch a sweeping constitutional review. The era of New Labour has evolved; the Brown ministry has begun."
 britain_brown.1.a: "A new chapter for the United Kingdom"
 britain_brown.2.t: "Ending the Spin Culture"
 britain_brown.2.d: "For years, the public has grown deeply cynical of Downing Street's reliance on \"spin doctors\" and media manipulation. Gordon Brown, determined to fulfill his promise of a more transparent government, faces a critical task: we must actively combat this toxic political PR. By introducing strict codes of conduct for special advisers and prioritizing raw facts over polished media optics, we can restore faith in Westminster. However, moving away from coordinated message control risks leaving us vulnerable to hostile press attacks."
 britain_brown.2.a: "Politics must be built on substance, not spin"
 britain_brown.3.t: "The Alternative Vote Referendum"
 britain_brown.3.d: "Following intense legislative battles, Prime Minister Gordon Brown has successfully pushed the electoral reform bill through Parliament, triggering a historic nationwide referendum. The British public must now decide the future of our democracy: should we adopt the Alternative Vote (AV) system, allowing voters to rank candidates by preference and ensuring fairer representation, or should we reject the reform, preserving the traditional First-Past-The-Post (FPTP) system that has guaranteed strong parliamentary majorities for centuries?"
 britain_brown.3.a: "Implement the Alternative Vote system"
 britain_brown.3.b: "Maintain the FPTP system"
 britain_brown.4.t: "The English Question"
 britain_brown.4.d: "The deep constitutional imbalance caused by devolution has brought \"The English Question\" to the forefront of Westminster politics. With England lacking its own parliament, local English nationalism is rapidly rising, threatening the very core of the Union. In response, Prime Minister Gordon Brown has launched a massive state-sponsored campaign to promote a shared identity of \"Britishness\". By emphasizing universal values, shared history, and institutional pride like the NHS, the government aims to suppress regional divisions and reinforce unionist sentiment across Scotland, Wales, and Northern Ireland."
 britain_brown.4.a: "We are British first and foremost."
 britain_brown.5.t: "The EVEL Debate"
 britain_brown.5.d: "The implementation of \"English Votes for English Laws\" (EVEL) has sparked an intense constitutional crisis over how England is governed within the Union. For years, Scottish, Welsh, and Irish MPs have been able to vote on purely English matters, causing immense political friction. The cabinet is now forced to make a radical choice to resolve this asymmetry once and for all: should we go all the way and establish a devolved Parliament of England, splitting our governance, or should we abandon this dangerous path to keep power firmly centralized in Westminster?"
 britain_brown.5.a: "Create a separate Parliament of England"
 britain_brown.5.b: "Reject the idea"
 britain_brown.6.t: "The Calman Commission Report"
 britain_brown.6.d: "The Commission on Scottish Devolution, chaired by Sir Kenneth Calman, has officially delivered its final report to Westminster. Established to review the provisions of the Scotland Act, the commission has avoided radical separatist demands, focusing instead on strengthening Scotland’s place within the United Kingdom. Its recommendations pave the way for a major transfer of fiscal powers, granting Edinburgh unprecedented control over local taxation and financial borrowing. While the proposals aim to soothe regional tensions, they will permanently alter the economic relationship between London and the Scottish Parliament."
 britain_brown.6.a: "A new framework for the Union"
 britain_brown.7.t: "The Edinburgh Summit"
 britain_brown.7.d: "In the wake of the Calman Commission's explosive findings, Prime Minister Gordon Brown has traveled north to hold high-stakes negotiations with Alex Salmond, the First Minister of Scotland and leader of the pro-independence SNP. Behind closed doors, the two leaders have locked horns over the constitutional future of the realm, with Edinburgh demanding a binding referendum on full independence and London desperately countering with offers of unprecedented financial devolution. The tense face-to-face talks have concluded, and the entire nation now anxiously awaits the Scottish government's formal response."
 britain_brown.7.a: "The ball is in Salmond's court"
 britain_brown.8.t: "The Scottish Compromise"
 britain_brown.8.d: "The political deadlock has been broken. Alex Salmond has officially accepted Prime Minister Gordon Brown's terms, choosing the path of sweeping devolution over the uncertainty of a separation vote. Under this historic agreement, Edinburgh will secure unprecedented fiscal autonomy, gaining extensive powers over local taxation, borrowing, and domestic policy, while remaining firmly within the United Kingdom. While hardline nationalists view this as a capitulation, Salmond has hailed it as a victory that delivers \"independence in all but name\". For now, the unity of the Union has been preserved."
 britain_brown.8.a: "The Union holds."
 britain_brown.9.t: "Salmond Defies London"
 britain_brown.9.d: "The hope for a peaceful compromise has shattered. Alex Salmond has dug in his heels, flatly rejecting Prime Minister Gordon Brown's offers of expanded financial devolution. The First Minister made it clear that the SNP will accept nothing less than a full, binding referendum on Scottish independence. Salmond's unyielding stance has pushed the constitutional crisis to the brink: London must now decide whether to yield to Edinburgh's pressure and risk the breakup of the nation, or take a hardline approach and deny the vote entirely."
 britain_brown.9.a: "The constitutional showdown has begun."
 britain_brown.10.t: "Union Triumphant"
 britain_brown.10.d: "In a bold and tactical political gamble, Prime Minister Gordon Brown responded to Alex Salmond's defiance by calling a preemptive referendum on Scottish independence. London's strategy to catch the nationalists off guard before they could mobilize a full-scale campaign has paid off handsomely. The votes have been counted, and the Scottish electorate has decisively chosen to remain within the United Kingdom. Salmond's independence push has been completely deflated, securing the territorial integrity of the Union for a generation."
 britain_brown.10.a: "God save the Queen!"
 britain_brown.11.t: "The Breakup of the Union"
 britain_brown.11.d: "Gordon Brown's preemptive political gamble has backfired with catastrophic consequences. The results of the Scottish independence referendum are in, and the electorate has delivered a historic shock to Westminster: Scotland has voted to leave the United Kingdom. Decades of devolution have culminated in the ultimate unraveling of the realm, plunging the government into an unprecedented constitutional crisis. As Edinburgh prepares for secession talks, the very future of what remains of the British state hangs in the balance."
 britain_brown.11.a: "A dark day for the United Kingdom"
 britain_brown.12.t: "Scotland Declares Independence"
 britain_brown.12.d: "The geopolitical map of Europe has been altered forever. Following the shocking outcome of the independence referendum, the Scottish Parliament has officially passed the declaration of sovereignty, ending a 300-year-old union with England. As crowds celebrate on the streets of Edinburgh, Westminster is left reeling from the catastrophic collapse of British territorial integrity. Negotiations over the division of national debt, North Sea oil fields, and the future of the royal nuclear deterrent at Faslane are set to begin immediately, marking the dawn of a fragile new era for the British Isles."
 britain_brown.12.a: "The United Kingdom is no more"
 britain_brown.13.t: "Reviewing Anti-Terrorism Laws"
 britain_brown.13.d: "The controversial anti-terrorism legislative architecture enacted in the wake of the 2001 attacks is facing intense scrutiny. Measures introduced under Tony Blair, such as indefinite detention without trial for foreign suspects, have drawn severe condemnation from human rights groups and courts alike. The government is under heavy pressure to re-evaluate this legal legacy. We must decide whether to overhaul these acts to protect civil liberties or stand firm, prioritizing state security over democratic freedoms."
 britain_brown.13.a: "Reform the legislation to restore civil rights"
 britain_brown.13.b: "National security cannot be compromised. Keep the laws"
 britain_brown.14.t: "The Gary McKinnon Extradition Crisis"
 britain_brown.14.d: "The United States government has formally demanded the extradition of Scottish hacker Gary McKinnon, who stands accused of orchestrating the \"biggest military computer hack of all time\" by infiltrating dozens of Pentagon and NASA systems. Washington wants him to face decades in an American federal prison. However, the British public and human rights advocates are fiercely protesting, citing McKinnon's Asperger's syndrome and worsening mental health. Giving into Washington will protect our Special Relationship with the US but cause an immense domestic backlash, while blocking the extradition will safeguard our citizen at the cost of serious diplomatic strain with our closest ally."
 britain_brown.14.a: "Extradict him to the United States to preserve the alliance"
 britain_brown.14.b: "Refuse the extradition on humanitarian grounds"
 britain_brown.15.t: "London Refuses the Extradition of Gary McKinnon"
 britain_brown.15.d: "The British government has officially denied our request to extradite Gary McKinnon, the hacker responsible for breaching dozens of critical Pentagon and NASA systems. Citing humanitarian and medical concerns, Downing Street has blocked his transfer to US custody, shielding the perpetrator from facing justice in an American federal court. This blatant refusal to cooperate on a matter of national cyber security has sent shockwaves through Washington, dealing a noticeable blow to our intelligence-sharing networks and straining the Special Relationship with our closest transatlantic ally."
 britain_brown.15.a: "This will not go unnoticed"
 britain_brown.16.t: "Gary McKinnon Extradited to the United States"
 britain_brown.16.d: "Following intense diplomatic pressure from Washington, the British government has finally authorized the extradition of Gary McKinnon. The Scottish hacker, accused of orchestrating the largest military computer breach in history, will now face trial in an American federal court and a potential decades-long prison sentence. While this decision has been hailed in Washington as a triumph for transatlantic judicial cooperation and national cyber security, it has sparked widespread public fury back in the United Kingdom, where many view the capitulation as a betrayal of a vulnerable British"
 britain_brown.16.a: "Justice will finally be served."


 #Miliband
 ENG_red_ed: "§tRed Ed§!"
 ENG_red_ed_desc: "Ed Miliband's election as Labour leader marks a decisive break with the Blairite consensus. His promise to move the party leftward, dubbed 'Red Ed' by critics, signals a new era of social democratic ambition."
 ENG_not_third_way: "Abandoning the Third Way"
 ENG_not_third_way_desc: "Miliband is to formally repudiate the Third Way philosophy, arguing that it sold out working people to big business. Labour must once again stand for redistribution, public ownership and workers' rights."
 ENG_great_compromise: "The Great Compromise Policy"
 ENG_great_compromise_desc: "In an effort to hold the party together, Miliband plans to offer concessions to centrists while pursuing a leftward agenda. It is an uneasy truce, balancing ideology with electoral pragmatism."
 ENG_mansion_tax_consensus: "Mansion Tax Consensus"
 ENG_mansion_tax_consensus_desc: "A consensus is to be built around a mansion tax on properties worth over £2 million, with revenues earmarked for the NHS. The policy polls well but is expected to provoke fierce opposition from wealthy donors."
 ENG_establish_nepc: "Establish the National Economic Council"
 ENG_establish_nepc_desc: "A new economic advisory body is to be created, bringing together trade unionists, academics and business leaders to craft a coherent industrial strategy for the post-crisis era."
 ENG_green_transition_project: "The Green Transition Project"
 ENG_green_transition_project_desc: "Labour commits to a massive programme of investment in renewable energy and energy efficiency, promising to create a million green jobs and make Britain a world leader in the fight against climate change."
 ENG_personnel_concessions_to_centrists: "Personnel Concessions to the Centrists"
 ENG_personnel_concessions_to_centrists_desc: "Miliband is to appoint several centrist figures to shadow cabinet positions, hoping to reassure moderates that Labour will not lurch too far from the centre ground."
 ENG_citizens_assemblies: "Establish Citizens' Assemblies"
 ENG_citizens_assemblies_desc: "In a radical democratic innovation, Miliband proposes citizens' assemblies to debate contentious issues. The aim is to reconnect politics with ordinary people and bypass the media's soundbite culture."
 ENG_party_truce: "The Party Truce"
 ENG_party_truce_desc: "After years of infighting, an uneasy peace is to be brokered between the Blairite and left factions. Public unity is restored, but old resentments simmer beneath the surface."
 ENG_cold_war: "Cold War Against the Blairites"
 ENG_cold_war_desc: "Miliband plans to open a new front in the internal party struggle, making clear that Blairism is finished. Blairite MPs are expected to find themselves frozen out of key positions, their influence curtailed."
 ENG_absolute_omov: "OMOV to the Absolute"
 ENG_absolute_omov_desc: "One Member One Vote is to be extended to all party elections, stripping power from the parliamentary clique and handing it to ordinary members. It is a victory for grassroots democracy."
 ENG_enfore_reselection: "Enforce Mandatory Reselection"
 ENG_enfore_reselection_desc: "Sitting MPs are to face reselection before each election, making them accountable to local members. Critics warn it will lead to purges of moderate voices."
 ENG_political_levy: "Strengthen the Political Levy"
 ENG_political_levy_desc: "Trade union contributions to Labour are to be reinforced, ensuring the party remains financially independent of big business and able to resist corporate lobbying."
 ENG_introduce_mansion_tax: "Introduce the Mansion Tax"
 ENG_introduce_mansion_tax_desc: "Legislation is to be passed imposing an annual levy on properties worth over £2 million. The revenues are to flow directly into the NHS, funding thousands of new nurses and doctors."
 ENG_declare_war_on_capital: "Declare War on Capital"
 ENG_declare_war_on_capital_desc: "In a defining speech, Miliband plans to separate 'good' business from 'bad' business, declaring that Labour will no longer serve the interests of predatory capitalists. The City recoils, but the left cheers."
 ENG_left_march: "The Left March"
 ENG_left_march_desc: "Buoyed by union support, Miliband is to push the party decisively leftward, committing to public ownership of rail and energy, a higher minimum wage and an end to austerity politics."
 ENG_crush_hereditary_peers: "Crush the Hereditary Peers"
 ENG_crush_hereditary_peers_desc: "The remaining hereditary peers are to be removed from the House of Lords, finishing the constitutional work begun in 1999 and removing the last vestiges of aristocratic privilege."
 ENG_senate_nations_and_regions: "Create the Senate of Nations and Regions"
 ENG_senate_nations_and_regions_desc: "Labour proposes replacing the Lords with a Senate representing the nations and regions of the UK, giving the devolved territories a formal voice in Westminster."
 ENG_living_wage: "The Living Wage Concept"
 ENG_living_wage_desc: "Miliband is to champion a living wage, calculated on the actual cost of living rather than the statutory minimum. He pledges to raise the minimum wage to £8 an hour and restore dignity to work."
 ENG_introduce_fair_work_charter: "Introduce the Fair Work Charter"
 ENG_introduce_fair_work_charter_desc: "A charter of workers' rights is to be proposed, guaranteeing secure hours, protection from unfair dismissal and the right to collective bargaining for every employee."
 ENG_ban_zero_hour: "Banning Zero-Hours Contracts"
 ENG_ban_zero_hour_desc: "Labour is to move to outlaw exploitative zero-hours contracts, ensuring that all workers have a guaranteed minimum of hours and can plan their lives with security."
 ENG_syndicalist_expansion: "Syndicalist Expansion"
 ENG_syndicalist_expansion_desc: "Trade unions are to be granted new powers to organise in sectors traditionally hostile to them, including the gig economy and private services. The labour movement reasserts its influence."
 ENG_dismantling_nhs_competition: "Dismantling NHS Competition"
 ENG_dismantling_nhs_competition_desc: "The internal market and compulsory competitive tendering within the NHS are to be scrapped, returning the service to its founding principles of cooperation and public provision."
 ENG_reducing_tuition_fees: "Reducing Tuition Fees"
 ENG_reducing_tuition_fees_desc: "Miliband pledges to cut tuition fees from 9,000 pounds sterling to 6,000, easing the burden on students while rejecting the full abolition demanded by the radical left."
 ENG_accelerate_housebuilding: "Accelerate Housebuilding"
 ENG_accelerate_housebuilding_desc: "A mass housebuilding programme is to be announced, aiming to deliver 200,000 new homes a year and tackle the chronic shortage that has priced a generation out of home ownership."
 ENG_reforming_TPIMs: "Reforming TPIMs"
 ENG_reforming_TPIMs_desc: "Terrorism Prevention and Investigation Measures are to be reformed to strengthen civil liberties, reducing the use of indefinite restrictions without trial."
 ENG_overhaul_prevent: "Overhaul of the Prevent Programme"
 ENG_overhaul_prevent_desc: "The controversial counter-radicalisation strategy is to be overhauled, shifting focus away from stigmatising Muslim communities towards a broader approach covering all forms of extremism."
 ENG_migration_impacts_fund: "The Migration Impacts Fund"
 ENG_migration_impacts_fund_desc: "A fund is to be established to help communities cope with the pressures of immigration, investing in public services and housing in areas experiencing rapid demographic change."
 ENG_tightening_welfare_benefits_migrants: "Tightening Welfare Benefits for Migrants"
 ENG_tightening_welfare_benefits_migrants_desc: "In response to public concern, Miliband proposes stricter rules on access to benefits for EU migrants, acknowledging that free movement has created tensions in some areas."
 ENG_youth_deradicalisation: "Youth Deradicalisation"
 ENG_youth_deradicalisation_desc: "A programme is to be launched to divert vulnerable young people away from extremism, using education, mentoring and community engagement rather than surveillance and punishment."
 ENG_combating_wage_dumping: "Combating Wage Dumping"
 ENG_combating_wage_dumping_desc: "New regulations are to crack down on employers who use migrant labour to undercut wages, ensuring that all workers are paid fairly regardless of their country of origin."
 ENG_strict_oversight_gchq: "Strict Oversight of GCHQ"
 ENG_strict_oversight_gchq_desc: "Following revelations of mass surveillance, Labour is to propose new powers for judicial oversight of GCHQ, requiring warrants for the collection of personal data and limiting bulk interception."
