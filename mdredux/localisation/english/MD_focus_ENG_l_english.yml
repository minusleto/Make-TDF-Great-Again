 ENG_fair_green_economy_desc: "The economy must be reoriented away from endless growth towards sustainability, prioritising wellbeing, local resilience and the protection of natural resources over profit."
 ENG_fair_green_politics: "Fair and Green Politics"
 ENG_fair_green_politics_desc: "The Greens promise to transform the political system itself, introducing proportional representation, citizens' assemblies and sweeping devolution of power to communities."
 ENG_green_minimum_wage: "Green Minimum Wage"
 ENG_green_minimum_wage_desc: "A universal living wage is proposed, calculated to meet the real cost of living and ensure that no worker in Britain lives in poverty."
 ENG_eco_cities: "Eco-Cities"
 ENG_eco_cities_desc: "A programme is launched to redesign urban areas around public transport, green spaces and energy-efficient housing, creating liveable cities that work with nature rather than against it."
 ENG_fair_taxation: "Fair Taxation of Landowners and Corporations"
 ENG_fair_taxation_desc: "A land value tax and stricter levies on corporations are proposed, shifting the tax burden from working people to those who profit most from the system."
 ENG_cooperation_over_profit: "Cooperation Over Profit"
 ENG_cooperation_over_profit_desc: "Worker cooperatives and mutual societies are promoted as the preferred model of enterprise, replacing shareholder capitalism with democratic ownership."
 ENG_green_monarchy: "Green Monarchy"
 ENG_green_monarchy_desc: "Rather than abolish the monarchy outright, the Greens seek to strip it of its wealth and influence, transferring royal estates to public ownership and ending all state funding."
 ENG_public_enemy_ecology: "Public Enemy of Ecology"
 ENG_public_enemy_ecology_desc: "Fossil fuel corporations and agribusiness giants are declared enemies of the people, facing punitive taxation, regulatory assault and the threat of expropriation."
 ENG_gig_workers_rights: "Gig Workers' Rights"
 ENG_gig_workers_rights_desc: "Gig economy workers are granted full employment rights, including sick pay, holiday entitlements and protection from arbitrary dismissal."
 ENG_affordable_eco_education: "Affordable Eco-Education"
 ENG_affordable_eco_education_desc: "Education from nursery to university is made free at the point of use, with a curriculum reformed to teach ecological literacy and critical thinking."
 ENG_no_loopholes: "No Loopholes"
 ENG_no_loopholes_desc: "Tax avoidance and evasion are criminalised, with offshore havens linked to British territories shut down and corporate transparency enforced."
 ENG_ecology_above_all: "Ecology Above All"
 ENG_ecology_above_all_desc: "The Greens declare a climate emergency and announce binding targets to reduce emissions to net zero within a decade, whatever the economic cost."
 ENG_human_rights_act: "Human Rights Act"
 ENG_human_rights_act_desc: "The Human Rights Act is strengthened and expanded, enshrining environmental rights, digital privacy and the right to housing as fundamental legal protections."
 ENG_revolution_westminster: "Revolution in Westminster"
 ENG_revolution_westminster_desc: "The Greens promise to devolve power radically, breaking up the centralised state and giving real authority to local and regional assemblies."
 ENG_recognise_lgbt_trans: "Recognise LGBT and Transgender Rights"
 ENG_recognise_lgbt_trans_desc: "Full legal equality is guaranteed for LGBT and transgender citizens, including self-identification for gender recognition and an end to all discrimination."
 ENG_land_of_windmills: "The Land of Winning Windmills"
 ENG_land_of_windmills_desc: "Britain becomes a world leader in offshore wind, investing billions to transform the North Sea into the engine room of the green economy."
 ENG_massive_nationalisation: "Massive Nationalisation Programme"
 ENG_massive_nationalisation_desc: "Rail, energy, water and public transport are brought into public ownership, ending decades of privatisation and returning essential services to democratic control."
 ENG_animal_rights: "Constitutional Animal Rights"
 ENG_animal_rights_desc: "Animals are granted legal personhood and protection from exploitation, banning factory farming, animal testing and blood sports once and for all."
 ENG_strengthen_councils: "Strengthen English Councils"
 ENG_strengthen_councils_desc: "Local councils are given new powers over housing, transport and the environment, reversing decades of centralisation and restoring civic pride."
 ENG_synergy_equality_ecology: "Synergy, Equality, Ecology"
 ENG_synergy_equality_ecology_desc: "The Greens articulate a unified vision in which social justice and environmental protection are inseparable, rejecting any attempt to trade one against the other."
 ENG_ethical_farming: "Ethical Farming"
 ENG_ethical_farming_desc: "Industrial agriculture is replaced with organic, regenerative and small-scale farming, restoring soil health and protecting rural communities."
 ENG_final_nail_royalism: "The Final Nail in Royalism's Coffin"
 ENG_final_nail_royalism_desc: "Following years of scandals, the Greens move to abolish the monarchy entirely, declaring Britain a republic and transferring all royal property to the nation."
 ENG_regional_self_governance: "Regional Self-Governance"
 ENG_regional_self_governance_desc: "Elected regional assemblies are established across England, giving communities real control over their own affairs and reducing the dominance of London."
 ENG_blooming_england: "Blooming England"
 ENG_blooming_england_desc: "A massive rewilding programme is launched, restoring forests, wetlands and meadows, and creating a network of national parks accessible to all."
 ENG_confederation_british_isles: "Confederation of the British Isles"
 ENG_confederation_british_isles_desc: "The Greens propose a loose confederation of the nations of the British Isles, respecting the right of Scotland, Wales and Ireland to self-determination while maintaining cooperation."
 ENG_safe_world_no_violence: "Safe World Without Violence"
 ENG_safe_world_no_violence_desc: "Britain withdraws from NATO and renounces nuclear weapons, redirecting defence spending towards peacebuilding, conflict prevention and humanitarian aid."

