 #Decisions
 ENG_policy_category: "The Westminster"
 ENG_policy_category_desc: "\n\n\n\n£GFX_british_policy_pic \n\n\n\n\n\nThe political landscape of the United Kingdom is anchored in the Westminster system, where power flows from the Crown to Parliament. Governing requires maintaining a strict majority in the House of Commons, balancing party factions, and navigating potential deadlocks with the House of Lords. Decisions made here will shape the constitutional future of the realm."
 ENG_economy_category: "The British Economy"
 ENG_economy_category_desc: "The British economy balancing free-market dynamism with critical funding for public infrastructure, centered around the NHS. Maintaining growth requires managing national debt, satisfying powerful trade unions, and fostering private investments while preventing corporate exploitation. Every economic choice directly alters public stability and industrial output.\n\n\n\n\n\n\n£GFX_british_economy_pic \n\n\n\n\n\n"
 ENG_waiting_for_autonomy_mission: "Waiting for the Commission's Results"

 #Unionism Events
 britain_unionism.1.t: "Scotland Demands Independence"
 britain_unionism.1.d: "Scotland has voted to leave the United Kingdom. In a historic referendum with a record turnout, the \"Yes\" campaign secured a narrow but decisive victory, paving the way for the end of the 300-year-old union.\nIn the early hours of this morning, the First Minister declared it a \"defining moment for Scottish democracy.\" Celebrations have erupted across Edinburgh and Glasgow"
 britain_unionism.1.a: "Recognize their complete independence"
 britain_unionism.1.b: "Give them more autonomy"
 britain_unionism.1.c: "The referendum has no legal force!"
 britain_unionism.2.t: "Wales Demands Independence"
 britain_unionism.2.d: "In a stunning and historic referendum result, Wales has voted to become an independent nation. With a turnout of over 78%, the \"Yes for Wales\" campaign secured a narrow victory, sending shockwaves through the British establishment.\nIn Cardiff, jubilant crowds gathered as the First Minister declared, \"Our voice has been heard. Today, we begin our journey as a free nation.\""
 britain_unionism.3.t: "Northern Ireland Demands Independence"
 britain_unionism.3.d: "In a seismic shift for the United Kingdom, Northern Ireland has voted for independence. The referendum saw a narrow majority in favor of leaving the UK, a result that immediately throws the region's future and the stability of the Good Friday Agreement into sharp focus.\nThe First Minister declared it a \"vote for a new future,\" while nationalists celebrated in Belfast. However, the result has been met with deep concern in London."
 britain_unionism.4.t: "Ireland Demands Independence"
 britain_unionism.4.d: "In a dramatic and historic referendum, Ireland has voted to secede from the United Kingdom and reclaim its independence. The vote, which saw a clear majority in favor of leaving, comes just years after the nation was controversially unified with Britain.\nThe result has sent shockwaves through London and Dublin. The Irish First Minister declared, \"We have restored our voice. Ireland chooses freedom.\""
 britain_unionism.5.t: "The End of the United Kingdom"
 britain_unionism.5.d: "The United Kingdom is tonight facing its final chapter as a tidal wave of nationalism has erupted into armed insurrection across the nations. Following the collapse of unionist support, simultaneous uprisings have broken out in Scotland, Wales, and Northern Ireland, plunging Britain into a bloody civil war.\nWestminster has lost control. Barricades and street battles rage in Glasgow, Belfast, and Cardiff, while the loyalist response has further inflamed the violence. With the government's authority shattered and the military overwhelmed, the 300-year-old union is effectively dead."
 britain_unionism.5.a: "God save Britain!"
 britain_unionism.6.t: "The End of the Great Britain"
 britain_unionism.6.d: "London - A devastating surge of nationalism across the UK's regions has spiraled into armed insurrection, plunging the country into a full-scale civil war and signaling the collapse of the once-powerful union.\nAs support for unionism crumbled, coordinated uprisings erupted in Scotland, Wales, and Northern Ireland. In Glasgow, separatists have seized government buildings, while fierce clashes in Belfast have resurrected the ghosts of the Troubles. Cardiff has also become a battlefield as Welsh nationalists confront loyalist forces.\nWith Westminster losing its grip on power and the armed forces unable to contain multiple simultaneous rebellions, the United Kingdom is fracturing in real-time. The Prime Minister's whereabouts are unknown, and international observers fear the conflict could destabilize all of Western Europe."
 britain_unionism.6.a: "The end of the British epopee"
 #Parlament Events
 britain_parlament.1.t: "The House of Lords is Sabotaging the Work of Parliament."
 britain_parlament.1.d: "Life and Hereditary Peers, disgruntled with our government, have begun sabotaging the work of Parliament. They promptly return every bill to the House of Commons with a raft of tricky amendments, delay the passage of critical legislation, and turn parliamentary sessions into public reprimands of ministers, destroying the government's media reputation."
 britain_parlament.1.a: "Their Lordships choose to be offended..."
 britain_parlament.2.t: "Rebellion on the Backbenches"
 britain_parlament.2.d: "A storm is brewing within the halls of Westminster. A vocal coalition of backbench MPs has openly turned on the government, launching a fierce critique against our current political and economic course. These rank-and-file lawmakers accuse the cabinet of losing touch with ordinary voters, ignoring local constituency needs, and failing to deliver on key legislative promises. While the frontbench dismisses this as mere posturing, the rumblings of dissent on the backbenches threaten to fracture party discipline, turning upcoming parliamentary votes into a dangerous gamble for our administration."
 britain_parlament.2.a: "We must whip them back into line."
 britain_parlament.3.t: "The Opposition Criticises Our Government"
 britain_parlament.3.d: "The Leader of the Opposition has launched a blistering assault on the government's record during a heated session in the House of Commons. Accusing the Prime Minister of economic incompetence, political short-sightedness, and failing the British people, the shadow cabinet is actively rallying public dissent. Armed with hostile media coverage, the opposition is leveraging every legislative tool available to stall our frontbench bills. If we do not counter this aggressive political offensive quickly, our parliamentary authority will begin to erode."
 britain_parlament.3.a: "Their words mean nothing. Focus on our agenda."
 britain_parlament.4.t: "The Bill Passes"
 britain_parlament.4.d: "After intense debates in the House of Commons and an exhausting constitutional \"ping-pong\" with the House of Lords, the government's legislative project has successfully passed. Despite fierce resistance, endless amendments, and deep friction between the chambers, the bill held its ground and secured final approval. The way is now clear for it to be codified into law."
 britain_parlament.4.a: "A hard-fought victory"
 britain_parlament.5.t: "The Bill Fails"
 britain_parlament.5.d: "The government’s legislative agenda has suffered a decisive defeat. The bill failed to rally the necessary support during the debate, exposing deep cracks within our political ranks. To make matters worse, the subsequent \"ping-pong\" with the House of Lords completely buried any remaining chance to push the law through, leaving the entire initiative dead in the water."
 britain_parlament.5.a: "Go to hell in a handbasket!"
 


 # Focuses

 #Blair
 ENG_labour_tree: "§tLabour Party's Tree§!"
 ENG_blair_prem: "§tBlair's Premiership§!"
 ENG_blair_prem_desc: "Tony Blair's premiership promised a modernised Britain, blending economic pragmatism with progressive social reform. As the new millennium dawns, the Labour government must deliver on its promises of renewal while navigating the challenges of a changing world."
 ENG_third_way: "The Third Way"
 ENG_third_way_desc: "The Third Way charts a course between old-style socialism and free-market capitalism, embracing globalisation and enterprise while keeping a social safety net. It seeks to build a broad electoral coalition, but critics argue it abandons traditional working-class values."
 ENG_family_tax_credit: "Expanding the Family Tax Credit"
 ENG_family_tax_credit_desc: "The government proposes to expand the Working Families Tax Credit, subsidising the incomes of low-paid working families to ensure that work always pays more than benefits. This would lift thousands of children out of poverty, though it places strain on public finances."
 ENG_minimum_pension: "Guaranteed Minimum Pension"
 ENG_minimum_pension_desc: "The Pension Credit scheme is to be introduced, guaranteeing a minimum income for Britain's poorest pensioners. It would provide additional support for those with savings and those over 75, tackling pensioner poverty and showing commitment to social justice."
 ENG_nhs_plan: "The NHS Plan"
 ENG_nhs_plan_desc: "The government unveils the NHS Plan, committing to bring health spending up to the European average, recruit thousands of new staff and modernise facilities. It is the most ambitious reform since the service's creation, though costs will be substantial."
 ENG_expanding_hospitals: "Expanding Hospitals"
 ENG_expanding_hospitals_desc: "A wave of hospital construction is to be launched under the Private Finance Initiative. Private consortia would design, build and maintain new facilities, leased back to the NHS over decades. Proponents say it delivers infrastructure quickly; detractors warn of a hidden debt time bomb."
 ENG_academy_blair: "The Academy Programme"
 ENG_academy_blair_desc: "Inspired by American charter schools, the Academy programme seeks to transform failing secondary schools by removing them from local authority control. Independent sponsors-businesses, universities, charities-would take over management, promising innovation and higher standards. Critics fear erosion of democratic oversight and creeping privatisation."
 ENG_civil_partnership_act: "Civil Partnership Act"
 ENG_civil_partnership_act_desc: "For the first time in British history, same-sex couples would receive legal recognition. The proposed Civil Partnership Act grants rights identical to marriage in all but name, from inheritance to pensions. It is a landmark for equality, though some activists argue it does not go far enough."
 ENG_gender_recognition: "Gender Recognition Act"
 ENG_gender_recognition_desc: "The Gender Recognition Act would allow transgender individuals to legally change their gender, obtaining new birth certificates and full legal recognition. The process requires medical evidence and a panel hearing-a compromise between rights and concerns about abuse. It positions Britain among the more progressive nations on gender identity."
 ENG_tackle_pfi_crisis: "Tackle the PFI Crisis"
 ENG_tackle_pfi_crisis_desc: "The Private Finance Initiative has saddled hospitals and schools with crippling long-term debts. This review seeks to renegotiate PFI contracts, buy out the most exploitative deals and establish stricter rules. Some trusts pay more in annual PFI charges than they receive in government funding."
 ENG_establish_orr: "Establish the ORR"
 ENG_establish_orr_desc: "The Office of Rail Regulation is to be granted expanded powers over the privatised rail network, monitoring performance, enforcing safety and investigating anti-competitive behaviour. The aim is to restore public confidence in a fragmented system, though fares continue to rise above inflation."
 ENG_fund_green_initiative: "Fund Green Initiatives"
 ENG_fund_green_initiative_desc: "Britain commits to new investment in renewable energy-wind, solar, tidal-to cut emissions and create green jobs. It positions the UK as a potential leader in the fight against climate change, if political will holds."
 ENG_freedom_press: "Freedom of Information Act"
 ENG_freedom_press_desc: "This legislation would strengthen protections for journalists and whistleblowers, limiting the state's ability to compel disclosure of sources. It enshrines a free press as essential to democracy, though national security hawks warn it could hamper intelligence gathering."
 ENG_devolution_consolidation: "Devolution Consolidation"
 ENG_devolution_consolidation_desc: "The devolution settlements for Scotland, Wales and Northern Ireland are now firmly established. This focus consolidates the new constitutional arrangements, clarifying division of powers between Westminster and the devolved administrations while keeping the Union intact."
 ENG_scottish_fiscal_autonomy: "Grant Scottish Fiscal Autonomy"
 ENG_scottish_fiscal_autonomy_desc: "Pressure mounts for the Scottish Parliament to gain control over taxation. Granting fiscal autonomy would let Holyrood set income tax rates and borrowing limits. Unionists warn it could lead to independence, while nationalists argue it proves devolution works."
 ENG_richard_commission: "The Richard Commission"
 ENG_richard_commission_desc: "Lord Richard's commission examines the case for granting the Welsh Assembly primary legislative powers. Cardiff argues it cannot govern effectively without making its own laws. The findings will shape Welsh devolution."
 ENG_reviewing_barnett: "Reviewing the Barnett Formula"
 ENG_reviewing_barnett_desc: "The Barnett Formula, which funds the devolved nations, faces criticism as outdated and unfair. This review seeks a needs-based replacement, but politics are treacherous-any change creates winners and losers among the four nations."
 ENG_scottish_education: "The Scottish Education System"
 ENG_scottish_education_desc: "Scotland's distinct education system is held up as a model of excellence. This initiative promotes the Scottish approach as an example for the UK, encouraging cross-border learning and celebrating Scottish schools and universities."
 ENG_wales_act: "Government of Wales Act"
 ENG_wales_act_desc: "The Government of Wales Act 2006 would advance Welsh devolution, separating the Assembly Government from the legislature and paving the way for a future referendum on full law-making powers. A cautious but meaningful expansion."
 ENG_act_2001: "Act 2001"
 ENG_act_2001_desc: "After September 11th, the government prepares sweeping anti-terrorism legislation. The Act would permit indefinite detention without trial of foreign terror suspects, condemned by civil liberties groups. It illustrates the tension between security and freedom."
 ENG_tougher_sentences: "Tougher Sentences"
 ENG_tougher_sentences_desc: "Responding to public concern over crime, the government introduces tougher sentencing guidelines. Repeat offenders face longer imprisonment, new offences are created for anti-social behaviour. Prison populations swell, raising questions about punishment versus rehabilitation."
 ENG_control_orders: "Control Orders"
 ENG_control_orders_desc: "Control Orders would impose strict restrictions on terror suspects without full criminal proceedings-curfews, tagging, movement limits. Courts have repeatedly challenged their legality, but the government insists they are essential for national security."
 ENG_id_cards_act: "ID Cards Act"
 ENG_id_cards_act_desc: "The Identity Cards Act would introduce a compulsory national ID card linked to a biometric database. Proponents say it fights fraud, illegal immigration and terrorism. Opponents decry it as an invasion of privacy and an expensive white elephant."
 ENG_eborder_programme: "The e-Borders Programme"
 ENG_eborder_programme_desc: "e-Borders aims to collect data on all passengers entering and leaving the UK before travel, identifying terror suspects and illegal immigrants. Privacy advocates warn of a surveillance state."
 ENG_house_lords_reform: "House of Lords Reform"
 ENG_house_lords_reform_desc: "The House of Lords, with hereditary and appointed members, is an anachronism in modern democracy. This initiative launches a serious reform attempt to create a more legitimate and accountable second chamber. The question is what should replace it."
 ENG_deadlock: "Reform Deadlock"
 ENG_deadlock_desc: "Efforts to reform the House of Lords stall amid disagreement between those favouring appointment, election or no change at all. The deadlock leaves the upper house unreformed, a symbol of the difficulty of constitutional change in Britain."
 ENG_mixed_model: "Mixed Model"
 ENG_mixed_model_desc: "A compromise emerges: a hybrid chamber mixing elected, appointed and ex-officio members. It seeks to combine democratic legitimacy with technical expertise, though critics argue it satisfies no one and confuses the chamber's role."
 ENG_appointed_chamber: "The Appointed Chamber"
 ENG_appointed_chamber_desc: "The House of Lords would become a fully appointed body of experts and worthies, selected by an independent commission. Hereditary peers lose their seats, politicians are barred. Proponents see expertise without partisan conflict; critics question accountability."
 ENG_end_hereditary_peer: "End of Hereditary Peers"
 ENG_end_hereditary_peer_desc: "The last hereditary peers are to be removed from the House of Lords, ending a centuries-old tradition. Largely symbolic-most were already expelled-but it completes the constitutional revolution begun in 1999 and removes final vestiges of aristocratic privilege."
 ENG_appointments_commission: "Independent Appointments Commission"
 ENG_appointments_commission_desc: "An independent commission is to be established to vet and recommend new members of the Lords, ensuring appointments based on merit rather than political patronage and reducing the prime minister's power to pack the upper house."
 ENG_meritocratic_senate: "Meritocratic Senate"
 ENG_meritocratic_senate_desc: "The House of Lords would transform into a meritocratic senate of appointed experts-scientists, doctors, academics, business leaders-chosen for knowledge, not political connections. A technocratic vision, but it raises questions about democratic accountability."
 ENG_elected_house: "An Elected House"
 ENG_elected_house_desc: "The radical option: replace the House of Lords with a fully elected second chamber. Senators would serve fixed terms representing nations and regions. A decisive break with tradition, completing democratic evolution-if it survives political battles."
 ENG_agree_libdem: "Agreement with the Liberal Democrats"
 ENG_agree_libdem_desc: "Labour reaches an agreement with the Liberal Democrats to support constitutional reform, including an elected second chamber. The alliance provides the needed majority for radical change but requires compromises elsewhere."
 ENG_peaple_mandate: "The People's Mandate"
 ENG_peaple_mandate_desc: "A referendum is to be held on the future of the House of Lords, asking the people to choose between an appointed, elected or mixed chamber. The result provides a democratic mandate, making it hard for opponents to obstruct reform."
 ENG_elected_second_chamber: "Elected Second Chamber Act"
 ENG_elected_second_chamber_desc: "The Elected Second Chamber Act would abolish the House of Lords and replace it with a democratically elected senate. The new chamber has equal legitimacy to the Commons, transforming the balance of power. The most significant constitutional change in generations."
 ENG_mayor_of_london: "Establish the Mayor of London"
 ENG_mayor_of_london_desc: "A directly elected Mayor of London and Greater London Assembly would give the capital its first city-wide government since the abolition of the GLC. The mayor gains powers over transport, planning and policing, becoming a significant national figure."
