 #Events
 britain_miliband.1.t: "The Victory of Ed Miliband"
 britain_miliband.1.d: "The results are clear: Ed Miliband has successfully secured his victory, ascending to the premiership of the United Kingdom. Dubbed \"Red Ed\" by the press due to his deep ties with powerful trade unions and a decisive break toward left-wing politics, his triumph signals a sharp ideological shift for the country. The public eagerly awaits his next moves as the new Prime Minister prepares to challenge big business, champion public services, and chart a bold new course for the nation."
 britain_miliband.1.a: "A new socialist dawn for Britain."
 britain_miliband.2.t: "Abandoning the Third Way"
 britain_miliband.2.d: "Prime Minister Ed Miliband has officially declared the death of New Labour, finalizing a sharp ideological break from the legacy of Tony Blair. By rejecting the business-friendly \"Third Way\" in favor of traditional left-wing economics, \"Red Ed\" has sparked an immediate and bitter civil war within his own party. While socialist backbenchers celebrate the return to working-class roots, the moderate Blairite faction warns that this radical shift will isolate center-ground voters and plunge the government into structural chaos. The party is deeply fractured, and the fight for the soul of Labour has begun."
 britain_miliband.2.a: "Let's put the party on the right path"
 britain_miliband.3.t: "Cold War Against the Blairites"
 britain_miliband.3.d: "Refusing to smooth over party divisions, Prime Minister Ed Miliband has chosen the path of total confrontation, effectively declaring an internal cold war against the Blairite faction. Downing Street has made it clear that the center-right, business-friendly legacy of Tony Blair will be systematically purged from all key positions. Moderate MPs and shadow cabinet veterans are being sidelined in favor of staunch socialists and union allies. While this decisive campaign will finally consolidate Miliband's control over the party's ideological direction, it risks triggering an open rebellion that could completely paralyze the government."
 britain_miliband.3.a: "Crush the centrist resistance! "
 britain_miliband.4.t: "The Blairite Demarche"
 britain_miliband.4.d: "Downing Street's implementation of mandatory reselection has triggered an explosive standoff at the very top of the party. Realising that this measure is a weapon designed to systematically purge them, the Blairite wing has mounted a fierce resistance. Crucially, this moderate faction is led by none other than David Miliband - the Prime Minister's own brother. While an open party split has been avoided for now, this bitter family and political rivalry has locked the government in a state of perpetual internal cold war. David's faction is actively fighting back against the reselection process, freezing crucial party funds and turning every parliamentary vote into a high-stakes showdown."
 britain_miliband.4.a: "Blood may be thicker than water, but the party comes first."
 britain_miliband.5.t: "The Left March"
 britain_miliband.5.d: "The internal cold war that has plagued our ranks for years is finally over. The bitter rivalry between Ed Miliband and the Blairite faction, led by his own brother David, has concluded with a decisive victory for the left. The introduction of absolute OMOV and mandatory reselection has completely broken the moderate resistance, locking the party onto a permanent socialist path. There will be no more turning back to Tony Blair's business-friendly center; the era of New Labour is officially dead. United under a revitalised ideological banner, the government is now ready to unleash a total legislative assault against capital."
 britain_miliband.5.a: "Forward, to the socialist future!"
 britain_miliband.6.t: "Panic in the City"
 britain_miliband.6.d: "Prime Minister Ed Miliband's open declaration of \"war on capital\" has sent devastating shockwaves through the heart of the global financial system. The London Stock Exchange has plunged into absolute chaos as trading floors panic over the new socialist agenda. Billionaires, multinational corporations, and foreign investors are aggressively pulling billions of pounds out of British assets overnight. In the City of London, banking executives warn of an imminent economic meltdown and a catastrophic run on the pound. The battle lines have been drawn, and the financial elite is determined to make the government pay for its defiance."
 britain_miliband.6.a: "Let the speculators tremble!"

 #Corbyn
 ENG_hurricane_of_change: "§tHurricane of Change§!"
 ENG_hurricane_of_change_desc: "Jeremy Corbyn's leadership promised a political earthquake, sweeping away the old order and replacing it with a radical socialist vision for Britain."
 ENG_home_walter: "Home, Walter"
 ENG_home_walter_desc: "The nation's privatised industries were brought back under state control, returning the railways, utilities and postal services to public ownership and reversing decades of marketisation."
 ENG_end_neoliberalism: "Put an End to Neoliberalism"
 ENG_end_neoliberalism_desc: "Corbyn declared the death of the neoliberal consensus, vowing to reverse privatisation, reregulate the economy and restore the power of the state to protect the many."
 ENG_police_reform: "Police Reform"
 ENG_police_reform_desc: "The police were brought under greater democratic control, with new accountability measures and a shift away from stop-and-search towards community-based policing."
 ENG_renationalise_rail: "Renationalise British Rail"
 ENG_renationalise_rail_desc: "Britain's railways were returned to public ownership, ending decades of fragmented privatisation and restoring a unified, affordable service for passengers."
 ENG_nationalise_energy: "Nationalise Energy Grids"
 ENG_nationalise_energy_desc: "The energy distribution networks were taken into public hands, allowing the state to prioritise cheap, green electricity over shareholder profits."
 ENG_purge_party_hq: "Purge Party Headquarters"
 ENG_purge_party_hq_desc: "Corbyn removed Blairite officials from Labour's headquarters, replacing them with loyal supporters and consolidating the left's grip on the party machine."
 ENG_one_member_one_vote: "One Member - One Vote"
 ENG_one_member_one_vote_desc: "Internal party democracy was expanded so that every member had a direct say in policy and leadership contests, diminishing the power of Westminster elites."
 ENG_amnesty_immigrants: "Amnesty for Illegal Immigrants"
 ENG_amnesty_immigrants_desc: "A path to legal residence was offered to undocumented migrants who had lived in Britain for years, recognising their contribution and ending the climate of fear."
 ENG_reduce_intelligence: "Reduce Intelligence Powers"
 ENG_reduce_intelligence_desc: "The surveillance powers of MI5 and GCHQ were curtailed, with bulk data collection banned and judicial warrants required for targeted operations."
 ENG_return_royal_mail: "Return Royal Mail to the Kingdom"
 ENG_return_royal_mail_desc: "Royal Mail was renationalised, reversing its privatisation and restoring a vital public service to democratic ownership."
 ENG_free_internet: "Free Internet"
 ENG_free_internet_desc: "A public broadband network was created, providing free high-speed internet access to every household as a fundamental right of modern citizenship."
 ENG_offshore_green_revolution: "Offshore Green Revolution"
 ENG_offshore_green_revolution_desc: "A massive investment programme in offshore wind transformed the North Sea into a powerhouse of renewable energy, creating thousands of skilled jobs."
 ENG_activate_momentum: "Activate Momentum"
 ENG_activate_momentum_desc: "The grassroots movement Momentum was mobilised to campaign for Corbyn's agenda, flooding constituencies with activists and pressuring wavering MPs."
 ENG_equal_pay_migrants: "Equal Pay for Migrants"
 ENG_equal_pay_migrants_desc: "Migrant workers were guaranteed the same wages and conditions as British citizens, ending the undercutting of labour standards by unscrupulous employers."
 ENG_expand_migration_quotas: "Expand Migration Quotas"
 ENG_expand_migration_quotas_desc: "Britain increased its intake of refugees and asylum seekers, honouring international obligations and offering sanctuary to those fleeing war and persecution."
 ENG_scrap_prevent: "Scrap Prevent"
 ENG_scrap_prevent_desc: "The controversial Prevent programme was abolished, condemned for stigmatising Muslim communities and doing more to alienate than to protect."
 ENG_bypass_city_of_london: "Bypass City of London"
 ENG_bypass_city_of_london_desc: "The financial dominance of the City of London was challenged, with new regional investment banks and capital controls to redirect wealth towards productive industry."
 ENG_union_front: "United Trade Union Front"
 ENG_union_front_desc: "The trade unions united behind Corbyn's programme, providing financial muscle and industrial power to support his socialist transformation."
 ENG_electoral_fate: "Fate of the Electoral System"
 ENG_electoral_fate_desc: "The question of proportional representation was reopened, with a promise to give the people a real choice over how their representatives are elected."
 ENG_deselection_of_dissenters: "Deselection of Dissenters"
 ENG_deselection_of_dissenters_desc: "Labour MPs who defied the leadership faced reselection battles, enabling local members to replace them with candidates loyal to the socialist project."
 ENG_cut_defense_spending: "Cut Defense Spending"
 ENG_cut_defense_spending_desc: "Military expenditure was slashed, with savings redirected to health, education and housing, and a promise to end Britain's role in foreign wars."
 ENG_free_education: "Free Education"
 ENG_free_education_desc: "University tuition fees were abolished and maintenance grants restored, opening higher education to all regardless of their financial background."
 ENG_bury_thatcher_reforms: "Bury Thatcher's Reforms"
 ENG_bury_thatcher_reforms_desc: "The anti-union laws of the Thatcher era were repealed, restoring the right to strike, collective bargaining and the closed shop."
 ENG_limit_royal_prerogatives: "Limit Royal Prerogatives"
 ENG_limit_royal_prerogatives_desc: "The royal prerogative was curtailed, transferring the power to declare war and dissolve parliament from the Crown to the elected House of Commons."
 ENG_ensure_government_transparency: "Ensure Absolute Government Transparency"
 ENG_ensure_government_transparency_desc: "All government contracts, tax arrangements and lobbying meetings were made public, exposing the hidden influence of corporations and the wealthy."
 ENG_recognize_palestine: "Recognize Palestine"
 ENG_recognize_palestine_desc: "Britain formally recognised the State of Palestine, breaking with decades of Western policy and aligning with the cause of Palestinian self-determination."
 ENG_carrot_method_scotland: "Carrot Method for Scotland"
 ENG_carrot_method_scotland_desc: "To counter Scottish nationalism, Corbyn offered enhanced devolution and generous funding, arguing that solidarity, not independence, would deliver social justice."
 ENG_welfare_state: "Welfare State"
 ENG_welfare_state_desc: "The welfare state was rebuilt after years of austerity, with increased benefits, restored public services and a commitment to universal provision."
 ENG_party_marxification: "Party Marxification"
 ENG_party_marxification_desc: "The Labour Party formally adopted a Marxist analysis of capitalism, committing to the socialist transformation of society and the end of class exploitation."
 ENG_negotiations_sinn_fein: "Negotiations with Sinn Fein"
 ENG_negotiations_sinn_fein_desc: "Corbyn opened direct negotiations with Sinn Fein, seeking a peaceful path to Irish reunification and honouring the legacy of the Good Friday Agreement."
