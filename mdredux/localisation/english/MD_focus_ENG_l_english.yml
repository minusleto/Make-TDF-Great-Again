 #Starmer
 ENG_starmageddon: "§tStarmageddon§!"
 ENG_starmageddon_desc: "The Labour Party under Keir Starmer intends to rebuild its credibility, restore internal discipline and present a competent, moderate face to the electorate. The era of ideological experimentation is over; the era of pragmatic governance begins."
 ENG_economic_growth_plan: "Economic Growth Plan"
 ENG_economic_growth_plan_desc: "The government will pursue economic growth through fiscal responsibility, targeted investment and a pro-business climate. Stability and confidence are the watchwords; no reckless nationalisations, no wild spending."
 ENG_continue_blair_legacy: "Continue Blair's Legacy"
 ENG_continue_blair_legacy_desc: "Labour will embrace the centrist achievements of the Blair years, reasserting its reputation for sound economic management and strong public services while quietly burying the party's recent radical past."
 ENG_restore_party_order: "Restore Party Order"
 ENG_restore_party_order_desc: "Internal discipline will be ruthlessly enforced, dissenting voices sidelined, and the party machine brought firmly under the leader's control to ensure unity ahead of the next election."
 ENG_subdue_party_radicals: "Subdue Party Radicals"
 ENG_subdue_party_radicals_desc: "The radical left will be systematically removed from positions of influence. Deselections and rule changes will make clear that Corbynism has no place in the new Labour Party."
 ENG_create_border_security_command: "Create Border Security Command"
 ENG_create_border_security_command_desc: "A dedicated Border Security Command will be established to tackle illegal migration, combining police, immigration and intelligence resources under one operational roof."
 ENG_pfi_reform: "PFI Contract Reform"
 ENG_pfi_reform_desc: "The government will renegotiate the ruinous Private Finance Initiative contracts, seeking to buy out the most exploitative deals and impose stricter terms on future public-private partnerships."
 ENG_national_wealth_fund: "Create National Wealth Fund"
 ENG_national_wealth_fund_desc: "A National Wealth Fund will be created to invest in green infrastructure and strategic industries, using public capital to drive long-term growth without increasing day-to-day spending."
 ENG_starmer_cabinet: "Starmer's Cabinet"
 ENG_starmer_cabinet_desc: "The Prime Minister will appoint a cabinet of experienced loyalists, blending Blairite pragmatists with moderate reformers, signalling that the era of ideological experimentation is over."
 ENG_downing_street_apparatus: "Downing Street Apparatus Control"
 ENG_downing_street_apparatus_desc: "The machinery of government will be tightened around the Prime Minister's office, with policy decisions centralised and leaks ruthlessly pursued to ensure absolute control over the narrative."
 ENG_linking_visas_skills: "Linking Visas to Skills Training"
 ENG_linking_visas_skills_desc: "Immigration rules will be reformed to tie visas more closely to domestic skills shortages, reducing reliance on foreign labour while investing in training for British workers."
 ENG_fast_track_justice: "Fast-Track Justice"
 ENG_fast_track_justice_desc: "New fast-track procedures will be introduced for low-level offences, speeding up court processes and reducing the backlog that has crippled the justice system."
 ENG_nationalise_railways: "Nationalisation of Railways"
 ENG_nationalise_railways_desc: "The railways will be brought back into public ownership as existing franchises expire, a pragmatic step that avoids costly buyouts while restoring state control over the network."
 ENG_lower_voting_age: "Lower Voting Age"
 ENG_lower_voting_age_desc: "The voting age will be lowered to 16 for all elections, engaging younger citizens and shifting the electorate leftward."
 ENG_restoring_trust_politics: "Restoring Trust in Politics"
 ENG_restoring_trust_politics_desc: "A package of measures will be introduced to clean up Westminster, including bans on second jobs for MPs and stricter rules on lobbying, restoring public faith in the political process."
 ENG_party_donations_strike: "Strike at Party Donations"
 ENG_party_donations_strike_desc: "New caps will be placed on political donations, breaking the influence of big money on party policy and forcing Labour to rely more on membership fees and small donors."
 ENG_strengthen_counterintelligence: "Strengthen Counterintelligence"
 ENG_strengthen_counterintelligence_desc: "MI5 and GCHQ will receive additional resources to counter foreign interference, with a focus on Russian and Chinese espionage networks operating on British soil."
 ENG_tackling_real_problem: "Tackling the Real Problem"
 ENG_tackling_real_problem_desc: "The government declares that the true threat to society is unrestricted access to information. Plans will be drawn up to block vast swathes of the internet under the guise of protecting children and national security, a measure that conveniently silences critics and opposition voices."
 ENG_great_british_energy: "Establish Great British Energy"
 ENG_great_british_energy_desc: "A publicly owned clean energy company will be launched to drive investment in renewables, reduce household bills and ensure Britain's energy independence."
 ENG_new_deal_working_people: "New Deal for Working People"
 ENG_new_deal_working_people_desc: "Workers' rights will be strengthened with a ban on zero-hours contracts, day-one employment protections and a higher minimum wage, framed as a modernisation of the labour market rather than a return to union militancy."
 ENG_age_limit_lords: "Age Limit for Lords"
 ENG_age_limit_lords_desc: "Peers over the age of 80 will be required to retire, a modest first step towards reforming the House of Lords without provoking a constitutional battle over its future."
 ENG_modernisation_committee: "Committee for Modernisation of the House of Commons"
 ENG_modernisation_committee_desc: "A new committee will be tasked with modernising parliamentary procedures, from electronic voting to reducing the hours that MPs are expected to sit through pointless debates."
 ENG_neighbourhood_policing: "Neighbourhood Policing Guarantee"
 ENG_neighbourhood_policing_desc: "Every community will be promised a named local officer, restoring the visible police presence that has been hollowed out by years of austerity."
 ENG_prison_overcrowding_crisis: "Tackling the Prison Overcrowding Crisis"
 ENG_prison_overcrowding_crisis_desc: "Emergency measures will be taken to ease prison overcrowding, including early release for non-violent offenders and a renewed focus on rehabilitation rather than incarceration."
 ENG_crack_down_it_companies: "Crack Down on IT Companies"
 ENG_crack_down_it_companies_desc: "Tech giants will face new regulations requiring them to remove illegal content, protect children online and pay their fair share of taxes in the UK."
 ENG_new_towns_taskforce: "New Towns Taskforce"
 ENG_new_towns_taskforce_desc: "A taskforce will be established to plan a new generation of garden towns, tackling the housing crisis by building sustainable communities outside the green belt."
 ENG_hereditary_peers_act: "Hereditary Peers Act"
 ENG_hereditary_peers_act_desc: "The final hereditary peers will be removed from the House of Lords, completing the constitutional reform that had begun over two decades earlier."
 ENG_strike_snp: "Strike against SNP"
 ENG_strike_snp_desc: "Labour will launch an aggressive campaign to win back Scottish voters from the SNP, attacking the nationalists' record on health and education while promising devolution will be respected."
 ENG_vpn_crackdown: "Crackdown on VPN"
 ENG_vpn_crackdown_desc: "New powers will be introduced to compel VPN providers to log user data, aimed at preventing criminals and terrorists from hiding their online activities."
 ENG_constitution_codification: "Codification of the Constitution"
 ENG_constitution_codification_desc: "A comprehensive review will be launched to codify Britain's unwritten constitution, clarifying the powers of government, parliament and the courts in a single document."
 ENG_evolutionary_pragmatism: "Evolutionary Pragmatism"
 ENG_evolutionary_pragmatism_desc: "The governing philosophy will reject grand ideological visions in favour of incremental reform, adapting institutions to modern realities without revolutionary upheaval."
