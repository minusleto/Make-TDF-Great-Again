 #Events
 britain_starmer.1.t: "Keir Starmer Promises to Restore Order"
 britain_starmer.1.d: "Following a turbulent political season, Keir Starmer has officially ascended to the leadership of the country and the party. Standing before a packed press room, the new Prime Minister has made his message clear: the era of factional infighting and radical ideological experiments is over. Starmer has promised to immediately restore order, enforce strict discipline, and rebuild the party's reputation as a competent, serious, and electorally viable force. While centrist factions welcome the return of pragmatism, the left wing prepares for a defensive battle against an imminent wave of rules enforcement and potential purges."
 britain_starmer.1.a: "Discipline is the foundation of power"
 britain_starmer.2.t: "Starmer's PFI Audit"
 britain_starmer.2.d: "As part of his flagship National Economic Growth programme, Prime Minister Keir Starmer has ordered a ruthless audit of all outstanding PFI contracts. The findings are grim: the soaring cost of servicing these private consortium debts is actively draining state liquidity and blocking new investments. To balance the books and jumpstart the economy, the cabinet must make a painful, high-stakes choice. We can either slash spending on healthcare and social services, risking massive public anger, or we can cut funding for policing and national defence, leaving our streets and borders vulnerable during a time of global instability."
 britain_starmer.2.a: "Protect our people. Cut policing and defence spending"
 britain_starmer.2.b: "Protect our security. Cut healthcare and social spending."
 britain_starmer.3.t: "The Prison Overcrowding Crisis"
 britain_starmer.3.d: "The United Kingdom's penal system has officially reached a catastrophic breaking point. Prisons across the country are operating at maximum capacity, with severe overcrowding triggering widespread riots, staff shortages, and a near-total collapse of inmate rehabilitation. Justice officials warn that without immediate intervention, the entire judicial apparatus will paralyze. The cabinet faces a dangerous dilemma: we can authorize an emergency early release scheme for low-level offenders to immediately ease the pressure, or we can maintain a hardline stance, building makeshift cells and locking down institutions at the risk of explosive violence."
 britain_starmer.3.a: "Something needs to be done urgently!"

