 ENG_british_unionism_desc: "§2British§! §RUnionism§! - it is a political position advocating the preservation of the unity of §4[ENG.GetFlag]England§!, §4[SCO.GetFlag]Scotland§!, §4[WAS.GetFlag]Wales§! and §4[NIR.GetFlag]Northern Ireland§! as a single sovereign state.\n\nIf the level of §GUnionism§! of a certain country falls too low and its level of §RNationalism§! is too high, a referendum on the independence of that country will be announced.\n\nIf the general level of §GUnionism§! falls too low in our country, a §RCivil War§! will begin!"
