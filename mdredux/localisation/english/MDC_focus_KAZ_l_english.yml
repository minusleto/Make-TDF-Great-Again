 # Central Asian Cooperation Focus Tree
 KAZ_cas_central_asian_cooperation: "Central Asian Cooperation"
 KAZ_cas_central_asian_cooperation_desc: "Since 1991 the five republics of Central Asia have drifted apart, each following its own path. Yet geography, trade and shared history still bind some 80 million people together. Kazakhstan, the largest and richest of them, will lead with open hands rather than clenched fists - so that a united Central Asia may one day speak with one voice."
 KAZ_cas_increase_political_influence: "Increase Political Influence"
 KAZ_cas_increase_political_influence_desc: "Trust is the currency of diplomacy - it must be earned before it can be spent. Through envoys, cultural exchanges and development aid, Kazakhstan will become a familiar and reliable partner in every Central Asian capital. Before we propose anything, our neighbours must already want to listen."
 KAZ_cas_good_neighbourhood_treaty: "Good Neighbourhood Treaty"
 KAZ_cas_good_neighbourhood_treaty_desc: "Before we can build anything together, we must be certain we will never fight each other. Our envoys will offer every neighbour a pact of non-aggression and a Kazakh guarantee of its independence, asking only for friendship in return. It is the first brick of a new Central Asian order."
 KAZ_cas_single_transport_space: "Single Transport Space"
 KAZ_cas_single_transport_space_desc: "The capitals of Central Asia lie far apart across steppe, desert and mountain, and the old Soviet links between them are decaying. We will offer our neighbours modern highways and railways to join every capital, with Kazakh engineers and capital bearing most of the cost. Every completed line opens a new trade route."
 KAZ_cas_coordination_security_hq: "Security Coordination HQ"
 KAZ_cas_coordination_security_hq_desc: "The threats facing Central Asia ignore borders: drug trafficking from Afghanistan, extremist networks in the mountains, and the shadow of great-power rivalry. We will propose a joint headquarters where intelligence services and defense ministries share information and plan together - the first stone of the Central Asian Shield."
 KAZ_cas_single_market_central_asia: "Central Asian Single Market"
 KAZ_cas_single_market_central_asia_desc: "Tariffs and customs posts are relics of a divided past. We will offer our neighbours a Free Trade Area that abolishes duties between us and lets goods, services and capital cross the border freely. Exporters and logistics firms will gain the most, and consumers will enjoy lower prices."
 KAZ_cas_energy_union: "Energy Union"
 KAZ_cas_energy_union_desc: "Kazakhstan has coal and gas, Kyrgyzstan and Tajikistan have rivers - yet every winter someone sits in the dark, since the Soviet-era regional grid fell apart. We will propose a Central Asian Power Pool: one network of high-voltage lines that shares surpluses and reserves, so no one depends on distant suppliers."
 KAZ_cas_general_staff_academy: "General Staff Academy"
 KAZ_cas_general_staff_academy_desc: "An alliance is only as strong as the officers who lead its armies. We will offer our neighbours a joint General Staff Academy, where the next generation of Central Asian commanders will train side by side. Personal bonds and shared doctrine will achieve what no treaty can."
 KAZ_cas_peacekeeping_corps_central_asia: "Central Asian Peacekeeping Corps"
 KAZ_cas_peacekeeping_corps_central_asia_desc: "When crisis strikes - a border incident, an earthquake, a humanitarian emergency - Central Asia must be able to answer on its own. We will propose a joint Peacekeeping Corps with pooled resources and a common training standard, so the region can keep its own peace without relying on outside powers."
 KAZ_cas_central_asian_development_bank: "Central Asian Development Bank"
 KAZ_cas_central_asian_development_bank_desc: "Infrastructure does not build itself, and distant international lenders are slow and demanding. Kazakhstan will fund the Central Asian Development Bank and invite its neighbours to join as shareholders, financing factories, roads and power plants across the region. Regional capital for regional projects."
 KAZ_cas_joint_military_anti_terror_exercises: "Joint Anti-Terror Exercises"
 KAZ_cas_joint_military_anti_terror_exercises_desc: "Terrorism is the one threat that unites every Central Asian government in shared fear. Instead of one-off drills that end with a handshake and a photograph, we will propose a permanent partnership: ongoing intelligence sharing, regular joint training and a coordinated rapid response to extremist threats."
 KAZ_cas_joint_food_security_program: "Joint Food Security Program"
 KAZ_cas_joint_food_security_program_desc: "Food security is national security. Climate change, water scarcity and volatile world markets threaten every household in the region, even though Kazakhstan is among the great grain exporters. We will offer a joint program of modern agro-complexes and shared grain reserves - and begin by building one at home."
 KAZ_cas_made_in_central_asia: "Made in Central Asia"
 KAZ_cas_made_in_central_asia_desc: "For too long Central Asia has imported goods it could make itself. We will propose joint factories across our countries, producing everything from building materials to household goods under one regional brand, starting with a new industrial complex at home. Self-sufficiency is not isolation - it is strength."
 KAZ_cas_single_air_defense_system: "Single Air Defense System"
 KAZ_cas_single_air_defense_system_desc: "Since the Soviet collapse every republic has guarded its own sky, and the gaps between them are wide. Kazakhstan will first fortify its own capital with anti-air batteries and radar, then fund the same for every partner that joins - one integrated network. We pay for the construction; the protection is shared by all."
 KAZ_cas_expand_kazakh_mic: "Expand Kazakh MIOs"
 KAZ_cas_expand_kazakh_mic_desc: "A united Central Asia needs a united defense industry. Building on Kazakhstan Engineering and its partnerships, we will expand our own arms production and offer partners a modern factory in their capital, built at our expense. Together they will form a regional network able to equip our forces without foreign suppliers."
 KAZ_cas_single_currency_altyn: "Single Currency Altyn"
 KAZ_cas_single_currency_altyn_desc: "A shared currency is the ultimate symbol of economic unity. The Altyn - the Kazakh word for gold - would replace five national currencies, erase exchange costs and merge our markets into one. We will propose it to our neighbours. It is a bold step and not a risk-free one: the transition will strain inflation, but the prize is a truly single market."
 KAZ_cas_strengthen_central_asian_forces: "Strengthen Central Asian Forces"
 KAZ_cas_strengthen_central_asian_forces_desc: "Separate armies with separate doctrines and separate commands do not make a united defense. We will propose to merge our standards, pool our reserves and build joint command structures, so that the Central Asian Shield reaches its full strength. Commanders who learn from one another will advance their doctrines faster than any army could alone."
 KAZ_cas_confederate_treaty: "Confederate Treaty"
 KAZ_cas_confederate_treaty_desc: "The time for incremental steps is over. The Confederate Treaty will found the Central Asian Union - a permanent alliance with collective defense, shared institutions and a common voice abroad. We will proclaim it from our capital and invite every neighbour to sign as a founding member of a new power in the heart of Eurasia."
 KAZ_cas_referendum_single_state: "Referendum on a Single State"
 KAZ_cas_referendum_single_state_desc: "A confederation is not enough. Our nations share a history, a culture and a destiny. Once the Union's members are firmly within our orbit and our own people stand united behind us, we will put the question to them: dissolve the old borders and become one sovereign state? There will be no way back, and the world will be watching."
 KAZ_cas_strengthen_confederation: "Strengthen Confederation"
 KAZ_cas_strengthen_confederation_desc: "Not every union demands the erasure of borders. We will deepen political coordination, launch joint research programs and tighten economic ties until the Central Asian Union moves as one - while each member keeps its sovereignty, its flag and its identity. A union of equals is stronger than an empire of subjects."

