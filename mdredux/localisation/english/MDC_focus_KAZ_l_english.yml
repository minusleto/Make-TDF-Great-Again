 KAZ_chi_territory: "Claims on Our Chinase Territories"
 KAZ_chi_territory_desc: "The Chinase Empire has historically claimed Kazakh lands in the east. It is time to establish a clear border and not allow China to forget Kazakh sovereignty."
 KAZ_war_russia_alash: "Return by Force"
 KAZ_koleni_alash: "Diplomatic Approach"
 KAZ_war_chi_alash: "Return by Force"
