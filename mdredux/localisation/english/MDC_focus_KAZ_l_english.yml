 KAZ_alash.14.t: "Kazakhstan Announces a Break from Russian Influence"
 KAZ_alash.14.d: "Kazakhstan has officially announced that it intends to leave the economic sphere of Russian influence and reduce its reliance on Russia's military patronage. Moscow will surely view this as a major geopolitical shift."
 KAZ_alash.14.a: "Take note of the statement"
 KAZ_breaks_russian_sphere: "Break from Russian Influence"

