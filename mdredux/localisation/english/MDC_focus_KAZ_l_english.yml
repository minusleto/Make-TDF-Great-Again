 KAZ_aul_family_policy_desc: "The family is the foundation of Kazakh society. State policy supports large families, motherhood and childhood, provides allowances and conditions for raising Kazakh children in traditional values."
 KAZ_aul_investment_and_innovation_desc: "Investments in innovative agriculture represent the modernization of Auyl without destroying its traditional way of life. New technologies serve Kazakh farmers, not replace them."
 KAZ_aul_irrigation_and_water_supply_desc: "Water is the life of the steppe. Development of irrigation systems and water supply transforms Kazakh lands, making them fertile and suitable for agriculture."
 KAZ_aul_state_apparatus_reform_desc: "The state apparatus is bloated and inefficient. Reform is aimed at reducing bureaucracy, increasing productivity and bringing power closer to the people. Officials must serve the village, not dominate it."
 KAZ_aul_unicameral_parliament_desc: "The bicameral system is a relic of the past. A unicameral parliament composed of representatives from rural districts will be more democratic and less corrupt. Every voice of a rural resident will be heard."
 KAZ_aul_judicial_reform_desc: "Courts must be fair and independent from officials. Judicial reform will strengthen the rule of law and protect peasants from the arbitrariness of local elites."
 KAZ_aul_agrarian_bank_desc: "A specialized agrarian bank issues loans to peasants on favorable terms. This is a tool that will help farmers develop their farms without bondage to oligarchs."
 KAZ_aul_return_old_kazakh_names_desc: "Soviet policy displaced Kazakh names. Restoring historical names of villages and cities is a restoration of national memory and cultural identity of the Kazakh people."
 KAZ_aul_decentralization_regions_desc: "Power is concentrated in the capital. Decentralization transfers authority to the local level. District akims gain budgetary independence and can develop their regions according to their own plans."
 KAZ_aul_regulation_agro_industry_desc: "Agro-industry is monopolized by large companies. State regulation will protect small and medium producers, establish fair prices and guarantee honest competition in the market."
 KAZ_aul_credit_farmer_police_desc: "Rural credit control is a new institution that monitors compliance with credit terms, protects farmers from loan sharking and ensures fairness in credit relations."
 KAZ_aul_ban_insult_national_traditions_desc: "National traditions are the foundation of Kazakh culture. The law protects them from insults and desecration. This is not censorship, but protection of cultural heritage from encroachment."
 KAZ_aul_respect_national_identity_desc: "Kazakh identity must be at the center of state policy. Respect for national culture, language and traditions strengthens national unity and independence."
 KAZ_aul_labor_education_desc: "Education must prepare people for real work on the land. Labor education instills respect for honest work and strengthens the connection of young people with Kazakh agricultural culture."
 KAZ_aul_support_entrepreneurship_desc: "Small and medium entrepreneurship in rural areas is the economic foundation for development. The state supports entrepreneurs by providing incentives, loans and freeing them from excessive bureaucracy."
 KAZ_aul_food_aid_desc: "The food aid program supports those in need in rural areas. The state guarantees basic food for poor families, preventing hunger and poverty."
 KAZ_aul_food_security_desc: "Food security is national security. Kazakhstan must feed itself, without dependence on imports. Development of local agriculture is the foundation of strategy."
 KAZ_aul_volunteer_patriotic_projects_desc: "Volunteer and patriotic projects involve young people in the development of rural areas. This is not state coercion, but voluntary participation of Kazakh youth in the revival of Auyl."
 KAZ_aul_youth_policy_desc: "Youth is the future of the Kazakh village. State youth policy provides jobs, education and opportunities for development in the countryside so that young people do not leave for the city."
 KAZ_aul_halal_export_desc: "Kazakh agricultural production is ready for halal product exports to Islamic markets. The state supports certification and marketing of Kazakh halal food in the world."
 KAZ_aul_direct_market_access_desc: "Farmers gain direct access to markets without intermediaries and speculators. This increases producer income and reduces prices for consumers, creating a fair agricultural economy."
 KAZ_aul_unified_social_standard_desc: "A unified social standard guarantees a minimum standard of living for all rural residents. Pensions, benefits and healthcare are the same everywhere - in the city and in the countryside."
 KAZ_aul_stop_internal_migration_desc: "Young people leave the village in search of work in the city. Development of agriculture and the Auyl economy creates jobs so that young people stay home and develop their region."
 KAZ_aul_light_in_every_village_desc: "Electrification of villages is a symbol of modern development. The state provides electricity even to remote aulls, improving living conditions and creating opportunities for development."
 KAZ_aul_family_policy_desc: "The family is the foundation of Kazakh society. State policy supports large families, motherhood and childhood, provides allowances and conditions for raising Kazakh children in traditional values."
 KAZ_aul_investment_and_innovation_desc: "Investments in innovative agriculture represent the modernization of Auyl without destroying its traditional way of life. New technologies serve Kazakh farmers, not replace them."
 KAZ_aul_irrigation_and_water_supply_desc: "Water is the life of the steppe. Development of irrigation systems and water supply transforms Kazakh lands, making them fertile and suitable for agriculture."
 KAZ_aul_agrarian_power_desc: "Kazakhstan becomes an agricultural power. The development of the agrarian sector, increased productivity and food exports transform Auyl into a symbol of Kazakh strength and independence."
 KAZ_aul_agrarian_power_desc: "Kazakhstan becomes an agricultural power. The development of the agrarian sector, increased productivity and food exports transform Auyl into a symbol of Kazakh strength and independence."
 KAZ_constitutional_reform: "Constitutional Reform"
 KAZ_constitutional_reform_desc: "For a long time, the basic law of the state established a rigid vertical of power, where all the strands of government converged in one center. This model ensured order and speed in decision-making, especially in times of external threats. However, over time, systemic risks accumulated: weak regional governance, the dependence of the courts on the executive branch, and the alienation of citizens from the political process. There is a need for a redistribution of powers. The constitutional reform we are launching does not abolish strong government, but makes it more flexible. Parliament gains real levers of control over the-government, local councils gain budgetary independence, and the courts gain greater independence."
 KAZ_merge_national_bank: "Merge Halyk Bank with Central Bank"
 KAZ_merge_national_bank_desc: "The traditional division between a central bank and commercial banks was convenient, but our economy now requires a different approach. The National Bank, which is responsible for the money supply and interest rates, and Halyk Bank, the country's largest commercial bank with the widest branch network, operate separately and sometimes even interfere with each other. The-government proposes to break this paradigm. By combining them into a single bank under the Halyk Bank name, we gain a unique instrument: an issuing center that can lend directly to industry, manage-government savings, and conduct foreign exchange transactions. Money ceases to be a commodity - it becomes a resource for development. Critics will call it a monopoly, but in the current context, a monopoly on finance is synonymous with economic efficiency."
 KAZ_otbas_bank: "Otbas Bank"
 KAZ_otbas_bank_desc: "At the initiative of the-government, a key development institution will be created to take over the centralized accounting and distribution of housing, as well as to become the operator of all public housing programs. This is how Otbas Bank, or the Family Bank, will be born: an institution designed to make housing affordable for every citizen by fostering financial discipline and offering loans at reduced rates."
 KAZ_fortebank: "ForteBank"
 KAZ_fortebank_desc: "To create a reliable foundation for future growth, the-government is encouraging a process of rehabilitation and consolidation. The key stage of this policy will be the merger of three large but weakened players - Alliance Bank, Temirbank, and ForteBank itself. This ambitious project will combine their assets, branch networks, and capital to create a stronger ForteBank. The new bank will become a powerful engine for the economy."
 KAZ_national_bank: "Merge the National Bank"
 KAZ_national_bank_desc: "The National Bank, which is responsible for the money supply and the rate, and Halyk Bank, the country's largest commercial bank with the widest branch network, operate separately, sometimes even interfering with each other. The-government proposes to break this paradigm. By combining them into a single Halyk Bank, we get a unique instrument of influence in the banking sector."
 KAZ_party_cells: "Party Cells"
 KAZ_party_cells_desc: "Party organizations are-established in enterprises, universities and state institutions. This allows the communists to control the grassroots, build a cadre reserve and influence everyday life of society."
 KAZ_anti_olig_manifesto: "Anti-Oligarch Manifesto"
 KAZ_anti_olig_manifesto_desc: "The party publicly accuses the oligarchs of plundering the country and demands a review of privatization. This worsens relations with big capital but strengthens the party's image as a defender of the people."
 KAZ_nationaliz_of_industr: "Nationalization of Industry"
 KAZ_nationaliz_of_industr_desc: "The state brings key industrial assets back under its control. This increases the-government's economic influence and weakens the position of private magnates."
 KAZ_revision_of_privat: "Review of Privatization"
 KAZ_revision_of_privat_desc: "The results of privatization are revised, disputed deals are challenged, and property is redistributed in favor of the state and workers' collectives."
 KAZ_progressive_tax: "Progressive Tax"
 KAZ_progressive_tax_desc: "A progressive tax scale is introduced: the rich pay more, the poor pay less. This strengthens income redistribution and provokes irritation among big capital and foreign creditors."
 KAZ_tax_on_raw_materials_rent: "Tax on Resource Rent"
 KAZ_tax_on_raw_materials_rent_desc: "Additional taxation of resource rent forces resource companies to share windfall profits with the state, expanding budgetary capacity."
 KAZ_state_plan_2: "Gosplan 2.0"
 KAZ_anti_ofshore_package: "The End of Capitalism"
 KAZ_anti_ofshore_package_desc: "A package of measures against offshore tax havens and capital flight breaks old enrichment schemes of the elites and redirects resources in favor of the state, trade unions and workers."
 KAZ_public_procurement_purge: "Public Procurement Purge"
 KAZ_public_procurement_purge_desc: "A radical purge of the public procurement system is carried out: kickbacks and fake tenders are suppressed, corruption networks are dismantled, and control over budget spending is strengthened."
 KAZ_salary_indexation: "Wage Indexation"
 KAZ_salary_indexation_desc: "The state links wages to inflation and economic growth, increasing workers' real incomes and reinforcing social support for the regime."
 KAZ_social_package: "Expanded Social Package"
 KAZ_social_package_desc: "New social benefits and guarantees are introduced: allowances, subsidies and family support. This reduces social tensions and increases trust in the communists."
 KAZ_health_educ_reforms: "Health and Education Reform"
 KAZ_health_educ_reforms_desc: "Reforming healthcare and education turns them into pillars of the regime: the quality of personnel grows, public health improves, but the burden on the budget and bureaucracy increases."
 KAZ_soviet_kaz: "Soviet Kazakhstan"
 KAZ_soviet_kaz_desc: "Kazakhstan is transformed into the Soviet People's Republic: a one-party system is officially entrenched, elections are abolished, and the political system is openly formalized as Soviet."
 KAZ_union_with_trade_org: "Union with Trade Organizations"
 KAZ_state_order_industry: "State Order of the Industry"
 KAZ_start_comm: "The New Is the Well-Forgotten Old"
 KAZ_socialist_dialo_uzbek: "Socialist Dialogue with Uzbekistan"
 KAZ_socialist_dialo_kyr: "Socialist Dialogue with Kyrgyzstan"
 KAZ_socialist_dialo_taj: "Socialist Dialogue with Tajikistan"
 KAZ_socialist_dialo_tur: "Socialist Dialogue with Turkmenistan"
 KAZ_general_infrastr_of_central_azia: "The General Infrastructure of Central Asia"
 KAZ_coordination_energy_policy: "Coordination of the Energy Policy of the Region"
 KAZ_updated_charter_workers: "Updated Charter of Workers' Rights"
 KAZ_joint_red_steppe: "Joint Exercises \"Red Steppe\""
 KAZ_unified_defense_council_region: "Unified Defense Council of the Region"
 KAZ_proclaim_union: "Proclamation of the Union of Central Asian Republics"
 KAZ_attracting_invest: "Attracting Investments"
 KAZ_treaty_of_ternal_friendship_with_russia: "Treaty of Eternal Friendship with Russia"
