 KAZ_alash.13.t: "Demand for Historic Territories"
 KAZ_alash.13.d: "[KAZ.GetNameWithFlag] presents us with an ultimatum: return the historic territories of the Kazakh people, seized during colonial occupation. These lands, they believe, are necessary to them. We must make a choice: surrender our lands or defend them."
 KAZ_alash.13.a: "Accept the Ultimatum"
