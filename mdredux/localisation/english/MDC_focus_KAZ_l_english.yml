 KAZ_plan_economy: "Begin the Transition to a Planned Economy"
 KAZ_plan_economy_desc: "The transition to a planned economy is an integral part of our domestic policy. Thanks to a planned economy, we will be able to achieve all the heights we were unable to achieve under capitalism."
