 #Foreign Policy Decision
 KAZ_steppe_eagle_exercise: "Hold Steppe Eagle Exercises"
 KAZ_steppe_eagle_exercise_desc: "Our army drills with Western instructors in peace support, checkpoint and crowd-control operations, with army aviation helicopters and military police in the field. Each cycle sharpens our troops toward NATO standards - and deepens the habit of operating shoulder to shoulder with the Atlantic alliance."

 #CAS Events
 kaz_cas.1.t: "A Kazakh Good Neighbourhood Proposal"
 kaz_cas.1.d: "[Root.Capital.GetName] has received an envoy from [FROM.GetName] bearing a treaty of good neighbourhood: a pact of non-aggression between our states and a Kazakh guarantee of our independence - a shield against any aggressor. In return, they ask for nothing but lasting friendship and mutual respect. Signing would bind our two countries in peace for a generation."
 kaz_cas.1.a: "Sign the treaty"
 kaz_cas.1.b: "Decline the proposal"
 kaz_cas.2.t: "[FROM.GetName] Signs the Good Neighbourhood Treaty"
 kaz_cas.2.d: "An envoy has returned with a signed treaty of good neighbourhood: [FROM.GetName] joins the pact of non-aggression, and our guarantee now stands as a shield over their independence. With every signature the steppe grows quieter, and our word carries more weight in the region."
 kaz_cas.2.a: "A welcome commitment"
 kaz_cas.3.t: "[FROM.GetName] Proposes Joining the Single Transport Space"
 kaz_cas.3.d: "[Root.Capital.GetName] has received an envoy from [FROM.GetName] bearing blueprints for the Single Transport Space - a joint infrastructure project to link all the capitals of Central Asia with modern highways and railway lines. Our capital would connect directly with [From.Capital.GetName], and Kazakh engineers and investment would carry most of the construction cost. Once finished, freight and travelers will move between our capitals in days, not weeks, and our two countries will be bound by roads as much as by treaties."
 kaz_cas.3.a: "Sign the construction agreement"
 kaz_cas.3.b: "Decline the proposal"
 kaz_cas.4.t: "[FROM.GetName] Joins the Single Transport Space"
 kaz_cas.4.d: "[FROM.GetName] has signed on to the Single Transport Space. Construction crews will soon break ground on new highways and railway lines linking [Root.Capital.GetName] with [From.Capital.GetName], adding our capital to a growing network of Central Asian transport corridors. Our engineers and workers gain years of steady employment, and the road between our capitals will carry freight, travelers and trust for decades to come."
 kaz_cas.4.a: "The road ahead"
 kaz_cas.5.t: "The Railway to [FROM.GetName] Is Complete"
 kaz_cas.5.d: "Our engineers have finished the railway line linking [Root.Capital.GetName] with [From.Capital.GetName]. The last spike has been driven, and the first freight trains are already rolling across the border. Customs officers watch from their checkpoints as goods begin to flow freely - the Single Transport Space is becoming reality, one rail at a time."
 kaz_cas.5.a: "Let the trains roll"
 kaz_cas.6.t: "[FROM.GetName] Proposes a Free Trade Area"
 kaz_cas.6.d: "[Root.Capital.GetName] has received an envoy from [FROM.GetName] with a bold proposal: abolish tariffs and customs duties between our countries. Their exporters and logistics companies already see the massive potential, but customs officers, staring at soon-to-be-obsolete border checkpoints, look on with quiet concern."
 kaz_cas.6.a: "Remove the barriers"
 kaz_cas.6.b: "Decline the proposal"
 kaz_cas.7.t: "[FROM.GetName] Joins the Free Trade Area"
 kaz_cas.7.d: "[FROM.GetName] has agreed to remove the trade barriers. From today, freight trucks and cargo trains flow between our capitals without duty or delay. Our logistics hubs expand rapidly, while on the far side of the border, a customs officer quietly packs up his inspection scales – the era of the toll gate is over."
 kaz_cas.7.a: "Let trade flow"
 kaz_cas.8.t: "[FROM.GetName] Proposes a Power Pool"
 kaz_cas.8.d: "[Root.Capital.GetName] has received an envoy from [FROM.GetName] with a proposal to unite our power grids into a single regional power pool. Kazakh power plants would share their load with ours, surplus electricity would flow across the border through high-voltage transmission lines, and blackouts would become a thing of the past. Our engineers speak of stable voltage and shared reserves – our politicians speak of trust."
 kaz_cas.8.a: "Connect to the grid"
 kaz_cas.8.b: "Decline the proposal"
 kaz_cas.9.t: "[FROM.GetName] Joins the Power Pool"
 kaz_cas.9.d: "[FROM.GetName] has agreed to unite our power grids. From today, electricity flows freely across our shared border, balancing shortages and surpluses through interconnected smart grids. Our power plants work as a single synchronized system, and there will be enough light and heat for everyone – in summer heat and winter cold alike."
 kaz_cas.9.a: "Let the current flow"
 kaz_cas.10.t: "[FROM.GetName] Proposes the Central Asian Development Bank"
 kaz_cas.10.d: "[Root.Capital.GetName] has received an envoy from [FROM.GetName] with a proposal to establish the Central Asian Development Bank - a shared institution to finance factories, roads and infrastructure across the region. Our engineers would gain access to modern construction methods, and our cities would rise with new schools, hospitals and plants. A golden age of building, they promise - and for once, the gold stays within our own region."
 kaz_cas.10.a: "Join the bank"
 kaz_cas.10.b: "Decline the proposal"
 kaz_cas.11.t: "[FROM.GetName] Joins the Development Bank"
 kaz_cas.11.d: "[FROM.GetName] has joined the Central Asian Development Bank. Together, our nations will finance the construction that shapes the region's future - factories, railways and power lines rising on every horizon. Our engineers work side by side, our economies grow intertwined, and the bank's golden doors stand open for any neighbor who wishes to build a better tomorrow."
 kaz_cas.11.a: "Let the bank flourish"
 kaz_cas.12.t: "[FROM.GetName] Proposes a Joint Food Security Program"
 kaz_cas.12.d: "[Root.Capital.GetName] has received an envoy from [FROM.GetName] with a proposal to launch a joint food security program. Kazakh investment would help us raise modern agro-complexes, and shared reserves would ensure our people never face hunger again. Full granaries, they promise - enough bread for every family, and even the livestock will be well fed."
 kaz_cas.12.a: "Join the program"
 kaz_cas.12.b: "Decline the proposal"
 kaz_cas.13.t: "[FROM.GetName] Joins the Food Security Program"
 kaz_cas.13.d: "[FROM.GetName] has joined the joint food security program. Together we will raise agro-complexes and build shared grain reserves, so that no household in the region ever goes hungry. The granaries will stand full, the markets will overflow with bread, and our people - and even our livestock - will be well fed."
 kaz_cas.13.a: "Let the granaries fill"
 kaz_cas.14.t: "[FROM.GetName] Proposes Joint Factories"
 kaz_cas.14.d: "[Root.Capital.GetName] has received an envoy from [FROM.GetName] with a proposal to build joint factories across our two countries. Together we would produce the goods we once imported, and every product would carry a single proud mark. The ministers speak of self-sufficiency, the workers speak of new jobs, and our dependence on foreign goods would begin to fade."
 kaz_cas.14.a: "Build the joint factories"
 kaz_cas.14.b: "Decline the proposal"
 kaz_cas.15.t: "[FROM.GetName] Joins the Joint Factories"
 kaz_cas.15.d: "[FROM.GetName] has agreed to build joint factories with us. From today our engineers and workers stand side by side, producing the goods we once shipped in from abroad. With every new factory our dependence on foreign goods loosens its grip, and every item that leaves the line carries a single proud mark."
 kaz_cas.15.a: "Made in Central Asia"
 kaz_cas.16.t: "[FROM.GetName] Proposes the Altyn Currency"
 kaz_cas.16.d: "[Root.Capital.GetName] has received an envoy from [FROM.GetName] with a historic proposal: adopt a single currency for Central Asia, to be called the Altyn - gold, the precious metal that has bound our trade routes for centuries. A shared currency would erase exchange costs, unite our markets and let capital flow freely across our borders. The ministers speak of stability, entrepreneurs speak of new opportunities, and the dream of a truly united region has never felt closer."
 kaz_cas.16.a: "Adopt the Altyn"
 kaz_cas.16.b: "Decline the proposal"
 kaz_cas.17.t: "[FROM.GetName] Adopts the Altyn"
 kaz_cas.17.d: "[FROM.GetName] has agreed to adopt the Altyn. From today our economies beat to a single rhythm, our markets trade in one currency, and capital flows freely across our shared border. The Altyn - gold, the metal that gave our currency its name - now stands as a symbol of the wealth and stability we build together."
 kaz_cas.17.a: "Let the Altyn rise"
 kaz_cas.18.t: "[FROM.GetName] Proposes Security Coordination"
 kaz_cas.18.d: "[Root.Capital.GetName] has received an envoy from [FROM.GetName] proposing a joint Security Coordination HQ. By sharing intelligence and aligning our defense planning, we can better protect our communications, strengthen our armies, and defend our territories against any threat."
 kaz_cas.18.a: "Join the Coordination HQ"
 kaz_cas.18.b: "Decline the proposal"
 kaz_cas.19.t: "[FROM.GetName] Joins Security Coordination"
 kaz_cas.19.d: "[FROM.GetName] has agreed to join the Security Coordination HQ. Our defense cooperation grows stronger with every partner that joins."
 kaz_cas.19.a: "A safer Central Asia"
 kaz_cas.20.t: "[FROM.GetName] Proposes General Staff Academy"
 kaz_cas.20.d: "[Root.Capital.GetName] has received an envoy from [FROM.GetName] proposing a joint General Staff Academy. By training our officers together, we can raise the professionalism of our armies and deepen our defense cooperation."
 kaz_cas.20.a: "Join the Academy"
 kaz_cas.20.b: "Decline the proposal"
 kaz_cas.21.t: "[FROM.GetName] Joins General Staff Academy"
 kaz_cas.21.d: "[FROM.GetName] has agreed to join the General Staff Academy. Our officers will train together, and our defense cooperation deepens."
 kaz_cas.21.a: "A stronger Central Asia"
 kaz_cas.22.t: "[FROM.GetName] Proposes Peacekeeping Corps"
 kaz_cas.22.d: "[Root.Capital.GetName] has received an envoy from [FROM.GetName] proposing a joint Central Asian Peacekeeping Corps. By pooling our resources and training our peacekeepers together, we can respond more effectively to regional crises and strengthen our collective security."
 kaz_cas.22.a: "Join the Peacekeeping Corps"
 kaz_cas.22.b: "Decline the proposal"
 kaz_cas.23.t: "[FROM.GetName] Joins Peacekeeping Corps"
 kaz_cas.23.d: "[FROM.GetName] has agreed to join the Central Asian Peacekeeping Corps. Our joint forces grow stronger with every partner that commits to regional stability."
 kaz_cas.23.a: "A more stable Central Asia"
 kaz_cas.24.t: "[FROM.GetName] Proposes Counter-Terrorism Partnership"
 kaz_cas.24.d: "[Root.Capital.GetName] has received an envoy from [FROM.GetName] proposing a permanent counter-terrorism partnership. Rather than one-off exercises, this framework establishes ongoing intelligence sharing, regular joint training, and coordinated rapid response to extremist threats across our region."
 kaz_cas.24.a: "Join the Partnership"
 kaz_cas.24.b: "Decline the proposal"
 kaz_cas.25.t: "[FROM.GetName] Joins Counter-Terrorism Partnership"
 kaz_cas.25.d: "[FROM.GetName] has agreed to join the permanent counter-terrorism partnership. Our intelligence services now work side by side, our forces train together on a regular basis, and our region stands united against extremism."
 kaz_cas.25.a: "A safer Central Asia"
 kaz_cas.26.t: "[FROM.GetName] Proposes Single Air Defense System"
 kaz_cas.26.d: "[Root.Capital.GetName] has received an envoy from [FROM.GetName] proposing a unified air defense system. [FROM.GetName] will build anti-air batteries and radar stations on our soil at their own expense, linking our air defense into a single network."
 kaz_cas.26.a: "Accept the Offer"
 kaz_cas.26.b: "Decline the proposal"
 kaz_cas.27.t: "[FROM.GetName] Joins Air Defense System"
 kaz_cas.27.d: "[FROM.GetName] has agreed to join the unified air defense system. We will now build anti-air batteries and radar stations in their capital, strengthening our collective defense."
 kaz_cas.27.a: "Build the Infrastructure"
 kaz_cas.28.t: "[FROM.GetName] Proposes Military Industrial Partnership"
 kaz_cas.28.d: "[Root.Capital.GetName] has received an envoy from [FROM.GetName] proposing a military industrial partnership. They will build a modern arms factory in our capital at their expense, giving us domestic military production capacity in exchange for deeper economic integration."
 kaz_cas.28.a: "Accept the Partnership"
 kaz_cas.28.b: "Decline the proposal"
 kaz_cas.29.t: "[FROM.GetName] Joins Military Industrial Partnership"
 kaz_cas.29.d: "[FROM.GetName] has agreed to the military industrial partnership. We will now build an arms factory in their capital, expanding our industrial network across Central Asia."
 kaz_cas.29.a: "Begin Construction"
 kaz_cas.30.t: "Invitation to the Central Asian Confederation"
 kaz_cas.30.d: "[Root.Capital.GetName] has received a historic invitation from [FROM.GetName]. They have established the Central Asian Confederation and offer us a place among its founding members. By signing the Confederate Treaty, we will join their alliance and stand united against any threat to our region."
 kaz_cas.30.a: "Sign the Treaty"
 kaz_cas.30.b: "Decline the invitation"
 kaz_cas.31.t: "[FROM.GetName] Joins the Confederation"
 kaz_cas.31.d: "[FROM.GetName] has signed the Confederate Treaty and joined our confederation. Central Asia grows stronger with every partner that commits to our shared future."
 kaz_cas.31.a: "Welcome to the Confederation"
 kaz_cas.32.t: "Central Asian Union Formed"
 kaz_cas.32.d: "In a historic ceremony in [KAZ.Capital.GetName], [KAZ.GetName] has signed the Confederate Treaty, proclaiming the Central Asian Union — a confederation uniting the states of Central Asia under a single banner. Invitations to join as founding members have been extended to Uzbekistan, Kyrgyzstan, Tajikistan and Turkmenistan. The new alliance pledges collective defense and shared prosperity, and observers note this marks the deepest integration the region has ever achieved. The first signatures are expected within days."
 kaz_cas.32.a: "Central Asia unites"
 kaz_cas.33.t: "Central Asian Confederation Proclaimed"
 kaz_cas.33.d: "Following a region-wide referendum, the nations of Central Asia have voted to unite into a single state. The Central Asian Confederation has been proclaimed, with its capital in [KAZ.Capital.GetName]. The new confederation inherits the territories, armies, and resources of all its member states, becoming a major power in the heart of Eurasia."
 kaz_cas.33.a: "A new power"
 kaz_cas.34.t: "[FROM.GetName] Proposes Strengthening Central Asian Forces"
 kaz_cas.34.d: "[Root.Capital.GetName] has received an envoy from [FROM.GetName] proposing to bring our armed forces into a single strengthened system. Joint command structures, unified standards and shared reserves would turn our separate armies into a true regional shield. The generals speak of readiness, the diplomats speak of trust - and no one on the steppe will dare to test our unity."
 kaz_cas.34.a: "Strengthen our forces together"
 kaz_cas.34.b: "Decline the proposal"
 kaz_cas.35.t: "[FROM.GetName] Joins the Strengthened Central Asian Forces"
 kaz_cas.35.d: "[FROM.GetName] has agreed to strengthen our forces together. Command staffs are being merged, standards unified and reserves pooled, and the Central Asian Shield reaches its full strength. Our armies now stand shoulder to shoulder across the whole region."
 kaz_cas.35.a: "A shield for all of Central Asia"

