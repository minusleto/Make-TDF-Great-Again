 KAZ_military_contingent_ukraine_no_war_tt: "[UKR.GetNameWithFlag] is not at war right now. When they enter a war, we will offer volunteers and military aid to up to §Y3 random countries§! fighting [UKR.GetName]. Each acceptance will cost us §Y2,000 manpower§!."
