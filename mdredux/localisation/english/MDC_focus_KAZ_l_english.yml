 KAZ_zhol.1.t: "Choosing a Path"
 KAZ_zhol.1.d: "There was a confrontation between two forces in the Ak Zhol party: radical liberalism, for which Bulat Abilov stands (on the right in the photo) and moderate liberalism, for which Alikhan Baymenov stands (on the left in the photo). When choosing each of the forces, we will receive different consequences."
 KAZ_zhol.1.a: "Our choice fell on radical liberalism"
 KAZ_zhol.1.b: "Let's have moderate liberalism instead"
 KAZ_zhol.2.t: "Choosing the future of the party"
 KAZ_zhol.2.d: "The party and the country need new people who will help Kazakhstan move forward with the democratic party Ak Zhol. Among the candidates are Daniya Espayeva (pictured left), a potential first female president, and Azat Peruashev. We need to choose one of them."
 KAZ_zhol.2.a: "A woman can bring love and happiness to our country"
 KAZ_zhol.2.b: "We choose Azat Peruashev"

