 KAZ_finish_of_taliban: "Finish Off Taliban!"
 KAZ_send_ultimat_afg: "Send an Ultimatum to Afghanistan"
 KAZ_start_comm_desc: "Kazakhstan has come a long way since the collapse of the Soviet Union. The shock therapy of the 1990s, privatization in the interests of the few, and dependence on raw-material exports all led the country to deep social stratification. The Communist Party of Kazakhstan is convinced that the answers to today's challenges lie in the experience of the past. Not in blindly copying the Soviet model, but in rethinking the principles of collective labor, state planning, and popular oversight in the context of a new century. The new is what has been well forgotten from the old."
 KAZ_union_with_trade_org_desc: "Trade unions in Kazakhstan were systematically weakened in the 1990s - fragmented, bought off, or simply ignored by the new elite. The working class lost organized representation at the very moment it needed it most. The Party intends to correct this. An alliance with trade union organizations will give workers a real voice in the country's economic decisions - and give the Party a living connection to those whose interests it claims to represent."
 KAZ_state_plan_2_desc: "The Soviet Gosplan was imperfect - but the very idea of state strategic planning of the economy has not disappeared. China, Vietnam, and a number of other states have proven that centralized planning and a modern economy are compatible. Kazakhstan is rich in resources - oil, uranium, metals. Yet these riches still work in the interests of transnational corporations rather than the Kazakh people. A new-generation state plan will correct this imbalance by directing strategic sectors towards the needs of the country, not stock-market quotations."
 KAZ_state_order_industry_desc: "Planning without implementation is empty talk. The state order translates Gosplan directives into concrete production tasks: factories receive clear output targets, enterprises gain guaranteed demand, and workers enjoy stable employment. This is not a return to Soviet-style shortages. It is a modern model of public-private partnership in which the state sets the course and industry carries it out."
 KAZ_attracting_invest_desc: "A socialist economy does not mean closed borders to capital - it means control over the terms of its presence. Kazakhstan is open to foreign investment, but on its own terms: transparency, localized production, transfer of technology. We are not selling our sovereignty - we are selling opportunities. And we set the price ourselves."
 KAZ_turn_to_east_desc: "Multi-vector policy brings stability to the country - but also dependence on Western capital and NATO's security infrastructure. The Communist Party makes a conscious choice. Kazakhstan's future does not lie in Brussels' offices or Washington's foundations. It lies here, in Asia, among peoples with a similar history, similar challenges, and shared interests."
 KAZ_socialist_dialo_uzbek_desc: "Uzbekistan and Kazakhstan are the two largest states of Central Asia, bound together by history, language, and the Soviet past more tightly than by any treaty. Yet after the collapse of the USSR these ties were deliberately weakened - in the interests of those who benefit from a fragmented region. The time has come to speak directly. Not through intermediaries, not through Western institutions, but as neighbors, as brotherly peoples, and as partners with a shared vision for the future of Central Asia."
 KAZ_socialist_dialo_kyr_desc: "Kyrgyzstan is a small mountainous country with big problems: political instability, economic dependency, and constant external pressure. Revolutions follow one another, but the situation of ordinary people changes little. Kazakhstan extends its hand not to governments, but to the people and left forces of Kyrgyzstan. Workers' solidarity knows no borders, and it is on this foundation that something lasting can be built."
 KAZ_socialist_dialo_taj_desc: "Tajikistan emerged from the civil war of the 1990s exhausted and deeply scarred. The country survived - but paid a high price in the form of authoritarian consolidation of power and economic marginalization. Despite differences in political systems, our peoples share much in common: the Soviet legacy, common river systems, common threats. A socialist dialogue is not the export of ideology. It is a search for common ground where it truly exists."
 KAZ_socialist_dialo_tur_desc: "Turkmenistan is a neighbor with whom Kazakhstan has more in common than differences. A shared history, shared water and energy arteries, shared challenges in the new century. Our task is not to lecture, but to talk. The first step towards any partnership is dialogue, even when it does not come easily."
 KAZ_general_infrastr_of_central_azia_desc: "Central Asia inherited from the USSR a single infrastructure network - railways, pipelines, irrigation systems, power grids. In thirty years of independence this network has degraded: each country pulled the blanket over itself, patched holes, but did not think about the system as a whole. The result is predictable: a region rich in resources remains logistically backward. Kazakhstan, as the region's largest economy, assumes the initiative - not for the sake of hegemony, but out of basic common sense."
 KAZ_coordination_energy_policy_desc: "Water for Tajikistan and Kyrgyzstan means energy. Gas for Turkmenistan and Uzbekistan means money. Oil for Kazakhstan means power on world markets. All these resources are interconnected, yet each country manages them alone, often to the detriment of its neighbors. A unified regional energy policy is not utopia. It is a pressing necessity. Kazakhstan offers a coordination platform where the interests of each party are taken into account and decisions are made jointly."
 KAZ_updated_charter_workers_desc: "Labor legislation in the post-Soviet republics of Central Asia was drafted in the rush of the 1990s under the guidance of the IMF and the World Bank. There was only one priority - to attract investment at any cost. The price was workers' rights. Kazakhstan is initiating an update of the region's labor standards. The eight-hour working day, the right to strike, protection from arbitrary dismissal - these are not privileges, but basic norms the region owes itself."
 KAZ_joint_red_steppe_desc: "Central Asia remains a zone where the interests of great powers intersect - Russia, China, the United States. NATO moves eastward, and American bases have appeared in the region under the pretext of fighting terrorism. The sovereignty of small states has remained a conditional notion. The \"Red Steppe\" joint exercises send a signal: the countries of the region are capable of ensuring their own security without foreign troops on their soil. This is not aggression. This is sovereignty in action."
 KAZ_unified_defense_council_region_desc: "The exercises showed that the military potential exists. Now a structure is needed. A unified Defense Council of Central Asia is not a military bloc in the Western sense. It is a coordinating body that allows the countries of the region to speak with one voice in the face of external threats. Afghanistan is unstable. External pressure is not weakening. Fragmentation means vulnerability. Unity means strength."
 KAZ_proclaim_union_desc: "What began as a dialogue has grown into something more. Shared infrastructure, coordinated energy policy, common labor standards, joint defense - all of this already exists de facto. One final step remains: to recognize it de jure. The Union of Soviet Asian Republics is not a reincarnation of the USSR and not a copy of the EU. It is a new form of integration, born from the realities of the region, its history, and its future. History is being made today."
 KAZ_friendship_russia_desc: "Russia and Kazakhstan are bound by thousands of threads - a seven-thousand-kilometer shared border, millions of families on both sides, a Soviet past and post-Soviet scars. These ties have weathered both cold spells and thaws. The Communist Party of Kazakhstan sees Russia as a natural strategic partner - not a suzerain, not an 'elder brother', but an equal ally. A treaty of eternal friendship is not just fine words. It is the foundation on which a real architecture of security and cooperation is built."
 KAZ_treaty_of_ternal_friendship_with_russia_desc: "Our union is one of the world's major agricultural powers. Vast steppes, the black earth of the north, the fertile valleys of the south - the country is capable of feeding not only itself but the entire region. Yet for decades, agricultural potential was underestimated in the pursuit of petrodollars. The World Agricultural Exhibition in Almaty is a chance to present ourselves in a new light. Not as a raw-material appendage of the global economy, but as an agricultural power with ambition and technology."
 KAZ_new_currency_desc: "The tenge was born in 1993 as a symbol of independence - and immediately fell into dependence on the dollar, oil prices, and the decisions of the IMF. The Union of Central Asian Republics requires a common financial architecture. A new currency is not a renunciation of sovereignty, but its strengthening. A region capable of issuing its own money and managing the money supply independently of Washington and Moscow is a region that cannot be ignored."
 KAZ_show_the_world_our_psheno_desc: "The Union of Soviet Asian Republics is not only about politics and security. It is, above all, about people and land. The Kazakh steppes, Uzbek valleys, Tajik mountain terraces - the region is capable of feeding itself without dependence on imports and external food policy. The World Agricultural Exhibition in Almaty will become the Union's first joint project on the international stage. We will show the world that Central Asia is not only oil and gas."
 KAZ_fight_against_terrorism_desc: "Afghanistan is unstable. The Taliban controls more and more territory, and radical groups are seeping through the region's porous borders. The Islamic Movement of Uzbekistan has already conducted operations on the territory of Kyrgyzstan and Tajikistan. Our Union cannot afford to watch this from the sidelines. A common threat requires a common response - coordinated, decisive, and without regard for what Washington or Moscow might say."
 KAZ_finish_of_taliban_desc: "Diplomacy is not needed. Nothing can be had in common with the Taliban regime. As long as this regime exists, the Union's border remains permeable to weapons, drugs, and militants. There is only one language they understand. The Armed Forces of the Union of Soviet Asian Republics are ready for the operation. This is not imperialism - this is self-defense."
 KAZ_send_ultimat_afg_desc: "War is a last resort. Before using force, we must try to negotiate the terms of a common alliance. Our great country will then be able to restore order in the region, stabilize it, and use that stability to its advantage."
 KAZ_leave_csto_desc: "The world has changed, and with it Kazakhstan's interests have changed as well. Alliance obligations inherited from past eras are increasingly coming into conflict with our vision of the future. By continuing to follow in the wake of Russia's foreign policy, we limit our own room for maneuver and leave the region without an independent center of power. The time has come to state openly: Kazakhstan is no longer an appendage of other people's blocs. We are leaving old alliances and creating our own system of collective security, in which the priority will be the interests of our citizens and our neighbors in Central Asia."
 KAZ_turn_to_east: "Turn to the East"
 KAZ_KMC_Astana_Motors: "KMC Astana Motors"
 KAZ_famous_kazakh_chocolate: "Famous Kazakh Chocolate"
 KAZ_famous_kazakh_chocolate_desc: "Food processing can become a profitable symbol of national industry. By promoting local brands, we strengthen both exports and domestic production."
 KAZ_subsidies_from_IMF: "Subsidies from the IMF"
 KAZ_subsidies_from_IMF_desc: "External support can stabilize the financial system in a difficult period. The price is a tighter link to foreign lenders and their demands."
 KAZ_overcoming_high_inflation: "Overcoming the Period of High Inflation"
 KAZ_overcoming_high_inflation_desc: "Macroeconomic stabilization is essential for long-term growth. Lowering inflation will restore confidence in the tenge and make planning easier for business."
 KAZ_kazakhstan_engineering_tai: "Kazakhstan Engineering and TAI"
 KAZ_kazakhstan_engineering_tai_desc: "Cooperation with the Turkish Aerospace Industry will give our engineering sector new technology and stronger industrial ties."
 KAZ_high_partnership_with_italy: "High-Level Partnership with Italy"
 KAZ_high_partnership_with_italy_desc: "A deeper partnership with Italy opens the door to new contracts, industrial expertise, and a wider European presence in Kazakhstan."
 KAZ_buying_back_resources: "Buy Back Foreign Resource Assets"
 KAZ_buying_back_resources_desc: "Careful buyouts can return strategic assets to domestic control without shocking investors. It is an expensive but manageable road to sovereignty."
 KAZ_nationalize_resources: "Nationalize Our Resources"
 KAZ_nationalize_resources_desc: "A direct nationalization of foreign-held resource assets would restore state control quickly, but it would also provoke serious external tension."
 KAZ_investments_in_metro: "Investments in the Metro"
 KAZ_investments_in_metro_desc: "Urban transport is not just convenience; it is productivity. Expanding the metro will improve mobility and support Almaty's future growth."
 KAZ_partnership_with_CHI: "Partnership with China"
 KAZ_partnership_with_CHI_desc: "Closer cooperation with China can bring financing, trade opportunities, and transit growth. It also increases our exposure to Beijing's influence."
 KAZ_treaties_with_central_asia: "Treaties with Central Asia"
 KAZ_treaties_with_central_asia_desc: "Regional diplomacy can strengthen Kazakhstan's position without direct confrontation. Stable ties with our neighbors are the basis of broader economic projects."
 KAZ_dialogue_with_EU: "Dialogue with the EU"
 KAZ_dialogue_with_EU_desc: "A structured dialogue with Europe can attract investment and political goodwill. It is also a way to diversify our foreign partnerships."
 KAZ_tour_to_USA: "Tour to the USA"
 KAZ_tour_to_USA_desc: "Direct engagement with American business and political circles can open doors for investment, lobbying, and new economic agreements."
 KAZ_look_at_caucasus: "A Look at the Caucasus"
 KAZ_look_at_caucasus_desc: "The Caucasus is a corridor of trade, diplomacy, and competition. A stronger role there would expand Kazakhstan's network beyond Central Asia."
 KAZ_eastern_european_friends: "Eastern European Friends"
 KAZ_eastern_european_friends_desc: "Partnerships in Eastern Europe give us alternative channels for trade and political support. They also reduce dependence on a single foreign bloc."
 KAZ_persian_colleagues: "Persian Colleagues"
 KAZ_persian_colleagues_desc: "Southern connections matter as much as western ones. Stronger ties with Persian partners can widen our diplomatic and commercial reach."
 KAZ_high_speed_internet: "Broadband Internet"
 KAZ_high_speed_internet_desc: "Digital infrastructure is the backbone of a modern economy. Faster internet will strengthen services, education, and high-tech growth."
 KAZ_restoration_of_energy_infrastructure: "Restoration of Energy Infrastructure"
 KAZ_restoration_of_energy_infrastructure_desc: "A reliable power grid is the foundation of industrial development. Modernizing the energy system will reduce shortages and support future expansion."
 KAZ_fight_capacity_deficit: "Fight the Capacity Deficit"
 fight_capacity_deficit_desc: "A lack of generating capacity slows the economy and weakens the state. Emergency measures are needed to keep the system stable."
 KAZ_invest_in_nuclear_energy: "Invest in Nuclear Energy"
 KAZ_invest_in_nuclear_energy_desc: "Nuclear energy offers long-term capacity and strategic independence. It demands high costs, technical competence, and careful planning."
 KAZ_raise_tariffs: "Raise Tariffs"
 KAZ_raise_tariffs_desc: "Tariff reform can finance modernization and reduce waste. It is effective, but it will not be popular."
 KAZ_ecologization: "Environmental Modernization"
 KAZ_ecologization_desc: "Cleaner industry and a more sustainable energy policy can improve long-term resilience. Environmental reforms will also help modernize outdated infrastructure."
 KAZ_balance_north_and_south: "Balance the North and South"
 KAZ_balance_north_and_south_desc: "Kazakhstan's development must not remain uneven. A balanced infrastructure policy will connect the regions and strengthen national cohesion."
 KAZ_return_alash: "Return of Alash"
 KAZ_army_alash: "The Army - Our New Foundation"
 KAZ_soviet_alash: "Council of Tengrians"
 KAZ_gold_elite_alash: "Purge of the Old Elite"
 KAZ_alash_freedoom_relig: "Unity Through Freedom"
 KAZ_alash_freedoom_relig_desc: "A strong nation is built not on coercion, but on the trust of its people. By guaranteeing freedom of religion and ensuring that the state remains impartial toward matters of faith, the Republic of Alash will strengthen national unity, civil harmony, and mutual respect among all citizens."
