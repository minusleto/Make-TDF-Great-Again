 KAZ_aul_party: "Auyl Party"
 KAZ_aul_party_desc: "The Auyl Party has come to power and will soon begin implementing the reforms our country needs. The people of Kazakhstan have placed their trust in democrats and reformers to resolve all social and bureaucratic problems for a successful future."
