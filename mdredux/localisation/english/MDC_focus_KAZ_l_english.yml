 KAZ_tok_adiletti_justice_markets_idea_desc: "The program retains all original Jańa Qazaqstan bonuses. Justice reform reduces the cost of anti-corruption changes. Market reform improves tax receipts, inflation protection and the cost of tax-rate changes."
