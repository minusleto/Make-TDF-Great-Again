 #Army events
 kaz_army.1.t: "Kazakhstan Wants to Buy Planes from Us"
 kaz_army.1.d: "Kazakhstan has contacted us with an official request to purchase combat aircraft."
 kaz_army.1.a: "Sell Them"
 kaz_army.1.b: "No, We Need Them Too"
 kaz_army.2.t: "They Accepted"
 kaz_army.2.d: "They accepted our purchase request"
 kaz_army.2.a: "Great"
 kaz_army.3.t: "They Rejected"
 kaz_army.3.d: "They rejected our purchase request"
 kaz_army.3.a: "Damn"
 kaz_army.4.t: "Presidential Decree: Foundations of the Airborne Forces"
 kaz_army.4.d: "The Year 2000 became a turning point for the Republic's defense capabilities. Having inherited from the USSR the legendary 35th Separate Guards Air Assault Brigade, we long struggled to maintain its combat readiness. But the world is changing, and we need troops capable of responding to crises instantly. The President signed the decree 'On the Structure of the Armed Forces'. Soon, on the basis of the 35th Brigade, the Airborne Forces are created - the elite of the army and the personal reserve of the Supreme Commander. Now we face the task of reforming this foundation, transforming it into modern Airborne troops, equipped with cutting-edge technology."
 kaz_army.4.a: "Airborne Forces is our future pride! Reorganize the troops immediately."
 kaz_army.5.t: "New Structure of the Armed Forces"
 kaz_army.5.d: "The decree on the structure of the Armed Forces has been signed. The four military districts become the regional commands Central, East, West and South, and the General Staff gives way to a committee of chiefs. The brigades stay where they are, but each region now answers to one commander."
 kaz_army.5.a: "One voice per region."
 kaz_army.6.t: "The Russian-Kazakh aviation deal has been completed"
 kaz_army.6.d: "The long-awaited agreement on military-technical cooperation between Kazakhstan and Russia has finally entered into force. According to the terms of the contract, the Kazakh Air Defense Forces will complete the sale of Russian multi-purpose fighter jets. Critics argue that the deal increases our strategic dependence on Moscow, while supporters of the agreement insist that it is the fastest way to ensure national security and overcome a long economic downturn."
 kaz_army.6.a: "Finally"
 kaz_army.7.t: "Kazakhstan is transferring Soviet aircraft to Russia"
 kaz_army.7.d: "After a long time, the military-technical cooperation agreement with Kazakhstan has entered its final stage. According to the terms of the agreement, the Kazakh air defense forces will transfer the last batch of Soviet combat aircraft to the Russian Air Force. These aircraft, which the Kazakh government has officially recognized as obsolete and economically unfeasible for modernization, will be used by us as a source of spare parts, decoys, or for full-fledged combat operations. Supporters of the deal emphasize the urgent need to replenish and maintain the air fleet's airworthiness. The deal will be closed, and the aircraft will be sent to Russia."
 kaz_army.7.a: "The deal is finally done"
 kaz_army.8.t: "Israeli Drone Cooperation"
 kaz_army.8.d: "Kazakhstan is considering expanding cooperation with Elbit Systems around the Skylark-1LEX reconnaissance UAV. Building on existing service and assembly arrangements could strengthen local maintenance and technical expertise, though the costs and terms must be weighed carefully."
 kaz_army.8.a: "Send a Request for Purchase"
 kaz_army.9.t: "Skylark-1LEX Cooperation Request"
 kaz_army.9.d: "Kazakhstan has approached Elbit Systems regarding further cooperation on Skylark-1LEX systems. The agreement could support local assembly, production and maintenance, while the terms of technology transfer require consideration."
 kaz_army.9.a: "Accept their request"
 kaz_army.9.b: "Don't sign the deal"
 kaz_army.10.t: "Elbit Systems Accepted"
 kaz_army.10.d: "Elbit Systems has accepted the proposed cooperation on Skylark-1LEX systems."
 kaz_army.10.a: "Ok"
 kaz_army.11.t: "Elbit Systems Rejected Our Request"
 kaz_army.11.d: "Elbit Systems has declined the proposed cooperation on Skylark-1LEX systems."
 kaz_army.11.a: "Damn"
 kaz_army.16.t: "Naval Cooperation with China"
 kaz_army.16.d: "Kazakhstan has approached China with a proposal for cooperation in naval technology. Chinase shipyards and engineers have extensive experience that could be valuable for our fleet. We await a response from Beijing."
 kaz_army.16.a: "Send request to China"
 kaz_army.17.t: "Request from Kazakhstan"
 kaz_army.17.d: "Kazakhstan asks us to share naval know-how. This could strengthen our influence in Central Asia, but may also upset Russia. What shall we answer?"
 kaz_army.17.a: "Agree to cooperate"
 kaz_army.17.b: "Refuse - we have our own interests"
 kaz_army.18.t: "China Agreed"
 kaz_army.18.d: "Beijing has approved our proposal! Chinase specialists will help modernize our naval forces. This is a major step for strengthening our Caspian defense."
 kaz_army.18.a: "Excellent! Let's start work"
 kaz_army.19.t: "China Refused"
 kaz_army.19.d: "Unfortunately, China is not interested in this project. We will have to find other ways to develop our fleet. However, we have gained political capital by showing our independence."
 kaz_army.19.a: "Accept the refusal. We'll look for other options."
 kaz_army.20.t: "Naval Cooperation with Russia"
 kaz_army.20.d: "Kazakhstan has approached Russia with a request for naval assistance. Russia is our key partner on the Caspian, and we hope for a positive reply. Moscow may either boost our flotilla or leave us without support."
 kaz_army.20.a: "Send request to Russia"
 kaz_army.21.t: "Request from Kazakhstan"
 kaz_army.21.d: "Kazakhstan asks us for naval cooperation. This would strengthen our regional position, but might reduce our own control over the Caspian. What is our decision?"
 kaz_army.21.a: "Support Kazakhstan"
 kaz_army.21.b: "Refuse - we don't want to share technology"
 kaz_army.22.t: "Russia Agreed"
 kaz_army.22.d: "Moscow has given the green light! Russia will transfer the latest naval developments to us. We will replace outdated approaches with modern ones, improving our fleet's combat capability."
 kaz_army.22.a: "Great! Let's begin modernisation."
 kaz_army.23.t: "Russia Refused"
 kaz_army.23.d: "Russia is not interested in cooperation. This is disappointing, but we are not left without options. Moscow's refusal boosts domestic support for our government - we have shown we are ready to act independently."
 kaz_army.23.a: "We will develop on our own."
 kaz_army.24.t: "[FROM.GetName] Requests T-72KAE Modernization"
 kaz_army.24.d: "[FROM.GetName] has approached us with a proposal to jointly modernize their aging T-72 fleet. The project, designated T-72KAE, would involve our defense industry in upgrading fire control systems, armor protection, and combat electronics."
 kaz_army.24.a: "Agree to cooperate"
 kaz_army.24.b: "Decline the proposal"
 kaz_army.25.t: "[FROM.GetName] Accepted T-72KAE Cooperation"
 kaz_army.25.d: "[FROM.GetCapital] has approved our proposal! Turkish defense specialists will begin the modernization of our T-72 fleet to T-72KAE standard."
 kaz_army.25.a: "Excellent! Let the modernization begin."
 kaz_army.26.t: "[FROM.GetName] Requests Taimas 8x8 IFV Cooperation"
 kaz_army.26.d: "[FROM.GetName] has approached us with a proposal to jointly develop a new 8x8 wheeled infantry fighting vehicle. The project, designated Taimas ('unyielding' in Kazakh), would combine our armored vehicle expertise with their production capabilities, creating a modern IFV for their army and potential export markets."
 kaz_army.26.a: "Agree to cooperate"
 kaz_army.26.b: "Decline the proposal"
 kaz_army.27.t: "[FROM.GetName] Accepted Taimas 8x8 Cooperation"
 kaz_army.27.d: "[FROM.GetCapital] has approved our proposal! Turkish engineers will begin joint development of the Taimas 8x8 wheeled IFV. The new vehicle will feature modern armor, a remote weapon station, and amphibious capabilities."
 kaz_army.27.a: "Excellent! Let the production begin."
 kaz_army.28.t: "[FROM.GetName] Requests SARP Combat Module Integration"
 kaz_army.28.d: "[FROM.GetName] has approached us with a request to purchase and integrate our Aselsan SARP remote-controlled weapon stations into their armored fleet. This deal would modernize their combat vehicles with our advanced fire control systems, thermal sights, and remote weapon technology."
 kaz_army.28.a: "Agree to the sale"
 kaz_army.28.b: "Decline the proposal"
 kaz_army.29.t: "[FROM.GetName] Accepted SARP Integration"
 kaz_army.29.d: "[FROM.GetCapital] has approved our request! Turkish SARP combat modules will be integrated into our armored vehicles, significantly improving crew protection and combat effectiveness."
 kaz_army.29.a: "Excellent! Let the integration begin."
 kaz_army.30.t: "[FROM.GetName] Requests Naiza MLRS Cooperation"
 kaz_army.30.d: "[FROM.GetName] has approached us with a proposal to jointly develop a modular multiple rocket launcher system. The project, designated Naiza ('spear' in Kazakh), would combine our guided rocket technology with their wheeled chassis and domestic production base. Accepting would give us a foothold in the Central Asian defense market and strengthen military-technical ties with [FROM.GetCapital]."
 kaz_army.30.a: "Agree to cooperate"
 kaz_army.30.b: "Decline the proposal"
 kaz_army.31.t: "[FROM.GetName] Accepted Naiza Cooperation"
 kaz_army.31.d: "[FROM.GetCapital] has approved our proposal! Israeli rocket specialists transfer modular pod technology and guided munitions to our engineers."
 kaz_army.31.a: "The spear is ready."
 kaz_army.32.t: "[FROM.GetName] Requests Semser SPH Cooperation"
 kaz_army.32.d: "[FROM.GetName] has approached us with a proposal to jointly develop a modern 122 mm self-propelled howitzer. The project, designated Semser ('sword' in Kazakh), would combine our fire-control and precision-strike experience with their domestic production base. Accepting would deepen military-technical cooperation and strengthen our position in Central Asia."
 kaz_army.32.a: "Agree to cooperate"
 kaz_army.32.b: "Decline the proposal"
 kaz_army.33.t: "[FROM.GetName] Accepted Semser Cooperation"
 kaz_army.33.d: "[FROM.GetCapital] has approved our proposal! Israeli specialists transfer modern artillery command, control, navigation, and fire-support technologies to Kazakh engineers."
 kaz_army.33.a: "The sword is drawn."

