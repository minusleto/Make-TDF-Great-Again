 # Tokayev: consolidation of the left branch
 KAZ_tok2_gar_samruk_desc: "State guarantees for Samruk-Kazyna will stabilize strategic enterprises and strengthen budget revenues. Coordinated construction programs will accelerate development, while streamlined tax administration will reduce the political cost of changing tax rates."
 KAZ_tok2_emission_desc: "A controlled monetary issue will provide the treasury with $20 billion. The New Era economic program will gain stronger inflation protection and a reduction in underlying inflationary pressure. Economic penalties from Mass Protests will be lifted, while political strain remains until the final focus."
 KAZ_tok2_internet_desc: "Establish a sovereign national network and tighten censorship. State communications controls lower policing costs and strengthen political authority and protection against foreign interference, but restrict information exchange, productivity growth and our influence abroad."
 KAZ_tok2_rotation_desc: "The presidency must decide how power will be renewed within the new political order. A national discussion will offer a choice between a Singapore-style system of managed succession and a permanent party dictatorship. The decision will unlock the corresponding final focus."
 KAZ_tok2_singapure_desc: "Begin the Singapore Model event chain. Managed political succession will strengthen executive coordination and make laws and economic reforms easier to implement. A follow-up event will consolidate stability, counterintelligence, tax revenue and production efficiency while reducing opposition support."
 KAZ_tok2_party_dictature_desc: "Begin the Party Dictatorship event chain. The ruling party will ban opposition parties, end elections and consolidate its support. A follow-up event will strengthen counterintelligence and tax revenues, while the party-state reduces the cost of changing laws, tax rates and the central bank rate."
 KAZ_samruk_idea2: "Samruk-Kazyna"
 KAZ_samruk_idea2_desc: "Samruk-Kazyna retains its existing industrial, research and tax benefits. State guarantees add stronger tax revenues, a further construction bonus and cheaper tax-rate changes."
 KAZ_tok_new_era4_desc: "The New Era retains its infrastructure and security programs. Controlled monetary emission has replenished the treasury, while stronger inflation safeguards reduce underlying price pressure."
 KAZ_tok2_sovereign_internet_idea: "Sovereign Internet"
 KAZ_tok2_sovereign_internet_idea_desc: "State control of communications lowers policing costs and strengthens political authority, stability and protection against foreign influence. Information restrictions reduce productivity growth and the effectiveness of our influence abroad."
 KAZ_tok2_singapore_model_idea: "Singapore Model of Political Succession"
 KAZ_tok2_singapore_model_idea_desc: "Managed succession combines executive coordination with cheaper legislative and economic reform. As the system consolidates, professional security services, stronger tax collection and efficient production underpin political stability."
 KAZ_tok2_party_state_idea: "Party Dictatorship"
 KAZ_tok2_party_state_idea_desc: "The ruling party has become the permanent framework of government. Centralized lawmaking, tax policy and monetary administration reinforce executive power, while the consolidated system strengthens counterintelligence and tax collection."
 KAZ_tok_singapore_unlock_tt: "Unlocks §Y$KAZ_tok2_singapure$§!. The party dictatorship focus will remain unavailable."
 KAZ_tok_party_state_unlock_tt: "Unlocks §Y$KAZ_tok2_party_dictature$§!. The Singapore model focus will remain unavailable."
 KAZ_tok_opposition_decline_tt: "The increase in reactionary support reduces the relative popularity of opposition parties."
 KAZ_tok.6.t: "A Conversation About Institutions of Rotation"
 KAZ_tok.6.d: "Consolidation has given the presidency control over the state. Now we must decide how that control will outlast individual officials. One proposal would establish managed succession, administrative continuity and performance-based promotion along the Singapore model. Another would anchor every institution to the ruling party and permanently exclude organized opposition.\n\nOur decision will determine which political model the government can pursue."
 KAZ_tok.6.a: "Develop the Singapore model of succession."
 KAZ_tok.6.b: "Build a permanent party dictatorship."
 KAZ_tok.7.t: "The Singapore Model"
 KAZ_tok.7.d: "The government has begun designing a system of managed political succession. Administrative continuity and coordinated executive authority will replace uncertainty at the top, while simpler legislative procedures support economic reform.\n\nOver the coming month, the new arrangements will be extended to public finance, industry and the security services."
 KAZ_tok.7.a: "Institutionalize the new order."
 KAZ_tok.8.t: "Managed Succession Takes Root"
 KAZ_tok.8.d: "The new succession arrangements are now supported by stronger tax administration, more efficient production and coordinated counterintelligence. Confidence in the government is growing, drawing support away from the opposition.\n\nThe presidency remains dominant, but the continuity of the system now rests on institutions as well as personal loyalty."
 KAZ_tok.8.a: "Stability through managed renewal."
 KAZ_tok.9.t: "Party Dictatorship"
 KAZ_tok.9.d: "The ruling party will become the sole framework for political organization. Elections will end and opposition parties will be prohibited. Party institutions will coordinate changes to legislation, taxation and central bank policy.\n\nThe next month will bring the financial and security apparatus into the new structure."
 KAZ_tok.9.a: "The party will direct the state."
 KAZ_tok.10.t: "The Party State Consolidated"
 KAZ_tok.10.d: "The tax administration and security services have been integrated into the party-state. Stronger counterintelligence protects the leadership, while coordinated revenue collection supports the government.\n\nWith the opposition excluded, the ruling party is consolidating its position as the permanent center of political power."
 KAZ_tok.10.a: "One party, a consolidated state."
 KAZ_tok_mass_protests_idea: "Mass Protests"
 KAZ_tok_mass_protests_idea_desc: "A sharp rise in fuel prices has exposed deeper anger over living costs, inequality, corruption and political exclusion. Demonstrations, strikes and interruptions to transport and communications have disrupted economic activity, weakened tax collection and stretched the security services.\n\nThe government has chosen its response, but neither repression nor promised reform immediately resolves the crisis of confidence. Economic measures can restore activity; the remaining political strain persists until the final focus of the chosen Tokayev branch."
 KAZ_tok_mass_protests_recovery_idea_desc: "Economic activity is recovering as emergency measures address the disruption caused by mass protests. The production, construction, tax and productivity penalties have been lifted. Distrust, political tension and the burden on the police remain.\n\nThis spirit is fully removed only by completing the final focus of the chosen Tokayev branch."
 KAZ_tok_mass_protests_duration_tt: "Economic penalties can be lifted through §Y$KAZ_tok2_emission$§! on the left path or §Y$KAZ_tok_inflation_demonopolization$§! on the right. The spirit itself remains until §Y$KAZ_tok_gold_elda$§! or §Y$KAZ_tok_resign$§! is completed."
 KAZ_tok_mass_protests_resolved_tt: "The lingering effects of §Y$KAZ_tok_mass_protests_idea$§! are fully removed."
 KAZ_tok_gold_elda_desc: "Consolidate the chosen political model around Kazakhstan's sovereign statehood and the legacy of the Golden Horde. The New Era spirit gains political coordination, tax income and foreign-influence defense. Base stability, political power and domestic influence increase, and the remaining protest penalties are removed."
 KAZ_tok_new_era2: "New Era with Kassym-Jomart Tokayev"
 KAZ_tok_new_era2_desc: "After winning the presidential election, Kassym-Jomart Tokayev is officially inaugurated. This marks the beginning of a new political era for Kazakhstan as the nation watches closely while the new president outlines his vision for the future."
 KAZ_tok_new_era3: "New Era with Kassym-Jomart Tokayev"
 KAZ_tok_new_era3_desc: "After winning the presidential election, Kassym-Jomart Tokayev is officially inaugurated. This marks the beginning of a new political era for Kazakhstan as the nation watches closely while the new president outlines his vision for the future."
 KAZ_tok_mass_protests_recovery_idea: "Mass Protests"
 KAZ_tok2_singapore_model_idea2: "Singapore Model of Political Succession"
 KAZ_tok2_singapore_model_idea2_desc: "Managed succession combines executive coordination with cheaper legislative and economic reform. As the system consolidates, professional security services, stronger tax collection and efficient production underpin political stability."
 KAZ_tok2_party_state_idea2: "Party Dictatorship"
 KAZ_tok2_party_state_idea2_desc: "The ruling party has become the permanent framework of government. Centralized lawmaking, tax policy and monetary administration reinforce executive power, while the consolidated system strengthens counterintelligence and tax collection."
 KAZ_tok_new_era4: "New Era with Kassym-Jomart Tokayev"
 KAZ_tok_new_era_court: "New Era with Kassym-Jomart Tokayev"
 KAZ_tok_new_era_court_desc: "The restoration of constitutional oversight strengthens counterintelligence and makes tax policy and anti-corruption reform easier to implement, while retaining the economic programs of the New Era."
 KAZ_tok_new_era_majilis: "New Era with Kassym-Jomart Tokayev"
 KAZ_tok_new_era_majilis_desc: "A reformed Majilis strengthens political coordination and simplifies changes to public policy. Constitutional oversight and the infrastructure programs of the New Era continue, while the break with the old leadership encourages Western-oriented political currents."
 KAZ_tok_new_era_golden: "New Era with Kassym-Jomart Tokayev"
 KAZ_tok_new_era_golden_desc: "The presidency has consolidated its chosen political model and presented it as the continuation of Kazakhstan's sovereign statehood. Stronger fiscal coordination and domestic legitimacy reinforce the economic and security programs of the New Era."
 KAZ_tok_jana_qazaq_idea: "Jańa Qazaqstan"
 KAZ_tok_jana_qazaq_idea_desc: "The New Kazakhstan program commits the state to institutional renewal, productivity and coordinated development. Its next stage will turn these promises into the administrative and economic reforms of a Just Kazakhstan."
 KAZ_tok_adiletti_idea: "Ádiletti Qazaqstan"
 KAZ_tok_adiletti_idea_desc: "The Just Kazakhstan program builds on Jańa Qazaqstan, retaining its productivity and project-cost bonuses while making anti-corruption reforms easier. Digitalization and demonopolization add their own cumulative effects in any order."
 KAZ_tok_adiletti_digital_idea: "Ádiletti Qazaqstan"
 KAZ_tok_adiletti_digital_idea_desc: "Jańa Qazaqstan's productivity and project-cost bonuses are retained alongside justice reform. Digital administration reduces bureaucracy spending and strengthens tax collection and counterintelligence, at the cost of political power growth."
 KAZ_tok_adiletti_complete_idea: "Ádiletti Qazaqstan"
 KAZ_tok_adiletti_complete_idea_desc: "The justice, digitalization and market reforms are complete. All original Jańa Qazaqstan bonuses remain, supplemented by cheaper anti-corruption and tax changes, lower bureaucracy spending, stronger counterintelligence, tax collection and inflation protection. Administrative implementation reduces political power growth."
 KAZ_tok_chinese_model_idea: "State-Guided Development"
 KAZ_tok_chinese_model_idea_desc: "Central coordination strengthens political authority, counterintelligence, tax collection and production efficiency. Policy changes become easier and the state gains greater influence abroad, at the cost of relations with Western democratic governments."
 KAZ_tok_liberalization_idea: "Second Wave of Liberalization"
 KAZ_tok_liberalization_idea_desc: "Political competition and openness strengthen opposition currents and reduce executive control. Lower tax receipts and greater exposure to foreign influence accompany faster infrastructure development, population growth and better relations with Western democratic governments."
 KAZ_tok_heir: "Heir"
 KAZ_tok_heir_desc: "The designated successor preserves administrative continuity, supports corporate tax collection and reduces the political cost of anti-corruption reform while maintaining a less expensive security apparatus."
 KAZ_tok_amanat_name: "AMANAT"
 KAZ_tok_amanat_long_name: "AMANAT Party"
 KAZ_tok_astana_name: "Astana"
 KAZ_tok_chinese_model_unlock_tt: "Unlocks §Y$KAZ_tok_CHI_exp$§!. The second wave of liberalization will remain unavailable."
 KAZ_tok_liberalization_unlock_tt: "Unlocks §Y$KAZ_tok_new_liberalization$§!. The Chinese development model will remain unavailable."
 KAZ_tok_democratic_relations_loss_tt: "Western democratic governments receive a negative opinion modifier toward Kazakhstan."
 KAZ_tok_democratic_relations_gain_tt: "Western democratic governments receive a positive opinion modifier toward Kazakhstan."
 KAZ_tok_spirits_preserved_tt: "Tokayev's national spirits and completed reform programs are retained under the new president."
 KAZ_tok.11.t: "The End of Nazarbayev's Influence"
 KAZ_tok.11.d: "The government has announced a formal break with the institutional and symbolic legacy of the previous leadership. The ruling party will operate under the name AMANAT, and the capital will again be known as Astana.\n\nThe move offers Tokayev an opportunity to renew support for the governing party, while reform-minded citizens increasingly look toward Western-oriented political ideas."
 KAZ_tok.11.a: "A new name and a new direction."
 KAZ_tok.12.t: "Project of the Third Constitution"
 KAZ_tok.12.d: "The reform program has reached a constitutional crossroads. One proposal emphasizes coordinated executive authority, long-term planning and state-guided development inspired by the Chinese experience. The alternative would open a second wave of liberalization, expanding political competition and reducing barriers to economic and social activity.\n\nThe presidency must choose which framework will shape the next stage of Kazakhstan's development."
 KAZ_tok.12.a: "Borrow the Chinese experience."
 KAZ_tok.12.b: "Begin a second wave of liberalization."
 KAZ_tok.13.t: "New Acting President: Olzhas Bektenov"
 KAZ_tok.13.d: "Kassym-Jomart Tokayev has announced his retirement from the presidency. Olzhas Bektenov will assume the responsibilities of Acting President and oversee the continuity of the state.\n\nThe succession preserves the national programs and institutions developed during Tokayev's tenure. Bektenov inherits their achievements and commitments, while the remaining strain of the protest crisis has been resolved by the completion of the transition."
 KAZ_tok.13.a: "Ensure continuity under the new leadership."
 KAZ_tok_e_government_2_desc: "Rename the national program Ádiletti Qazaqstan and add digital government: lower bureaucracy spending, stronger tax collection and counterintelligence, at the cost of political power growth. All existing bonuses remain; the three reforms may be completed in any order."
