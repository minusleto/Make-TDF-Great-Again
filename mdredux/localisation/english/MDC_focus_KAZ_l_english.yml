 KAZ_dem_ak_zhol_party_desc: "The Ak Zhol party represents business interests and democratic reforms. We begin the modernization of our political and economic system."
 KAZ_akz_unicameral_parliament_desc: "Transitioning to a unicameral parliament will accelerate legislative procedures and reduce the bureaucratic burden on the budget."
 KAZ_akz_law_on_parliamentary_opposition_desc: "Legally establishing the rights of the parliamentary opposition ensures genuine political competition and government transparency."
 KAZ_akz_expand_maslikhat_powers_desc: "Expanding the powers of maslikhats strengthens local self-governance, allowing regions to independently resolve key issues."
 KAZ_akz_expand_rural_akim_powers_desc: "Empowering rural akims with actual resources and authority will improve the standard of living and infrastructure in villages."
 KAZ_akz_introduce_new_vat_desc: "Introducing a new, differentiated VAT rate will reduce the economic burden on socially significant economic sectors."
 KAZ_akz_online_court_broadcasts_desc: "Launching online court broadcasts ensures openness, fairness, and public accountability of the judicial system."
 KAZ_akz_tax_cut_desc: "Cutting taxes for small and medium enterprises will serve as a powerful catalyst for business growth and job creation."
 KAZ_akz_lower_credit_rates_desc: "Lowering interest rates on loans will make financing accessible for the real economy and ordinary citizens."
 KAZ_akz_return_capitals_desc: "Launching mechanisms to repatriate illegally exported capital back into the country to invest in the national economy."
 KAZ_akz_responsibility_for_corruption_of_subordinates_desc: "Introducing personal liability for officials regarding corruption committed by their subordinates will strengthen the anti-bribery fight."
 KAZ_akz_protection_from_devaluation_desc: "A set of measures to stabilize the national currency and protect citizens' savings from inflationary risks."
 KAZ_akz_duty_free_import_electric_cars_desc: "Eliminating import duties on electric cars will accelerate vehicle modernization and improve the ecological situation."
 KAZ_akz_reduce_foreign_labor_quotas_desc: "Reducing quotas for foreign labor protects the domestic job market and opens new vacancies for our citizens."
 KAZ_akz_deoffshorization_desc: "Strict measures against the use of offshore zones will keep taxes inside the country and make business transparent."
 KAZ_akz_expand_housing_construction_desc: "Stimulating affordable housing construction will provide thousands of Kazakh families with proper housing."
 KAZ_akz_raise_salaries_for_state_employees_desc: "Raising salaries for public sector workers improves their well-being and enhances the prestige of civil service."
 KAZ_akz_financial_control_of_healthcare_desc: "Establishing strict financial oversight in the healthcare sector will stop the misappropriation of medical budgets."
 KAZ_akz_support_domestic_producers_desc: "Prioritized support and incentives for domestic manufacturers will reduce Kazakhstan's reliance on imports."
 KAZ_akz_employment_of_graduates_desc: "Launching a state program for the guaranteed employment of young specialists immediately after graduation."
 KAZ_akz_protection_of_spiritual_sphere_desc: "Protecting our cultural and spiritual spaces from destructive foreign informational influence."
 KAZ_akz_protection_of_kazakh_language_desc: "Supporting and developing the state language across all spheres of public life while maintaining interethnic harmony."
 KAZ_akz_resolving_disputes_peacefully_desc: "Developing institutions of mediation and peaceful dispute resolution will relieve the country's judicial system."
 KAZ_akz_protection_of_private_life_desc: "Strengthening legislative protection of citizens' personal data and the inviolability of their private lives."
 KAZ_akz_implementing_european_standards_desc: "Implementing advanced European standards in governance, economy, and quality of life will elevate Kazakhstan to a new level."

