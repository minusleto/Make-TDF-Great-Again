 # Leaders
 ARON_ATABEK_DESC: "Aron Atabek was born on January 31, 1953, in the Karaganda Region. After studying journalism, he devoted himself to literature, becoming a well-known poet, publicist, and public figure. During the final years of the Soviet Union, Atabek became actively involved in the national democratic movement, advocating for the revival of Kazakh culture, greater political freedoms, and the strengthening of Kazakhstan's national sovereignty. Following Kazakhstan's independence, he remained active in public life, openly criticizing corruption, authoritarian tendencies, and the slow pace of democratic reforms. His uncompromising stance earned him a reputation as one of the country's most prominent figures within the national democratic opposition."
 GANI_KALIYEV_DESC: "Gani Alimovich Kaliyev is a prominent Kazakh agrarian scientist, academic, and political figure. In January 2000, he founded and became the leader of the Kazakh Social Democratic Party 'Auyl', turning it into the primary political voice for the country's rural regions. As a Doctor of Economics and a member of the Mazhilis, Kaliyev consistently advocates for increased state regulation, large-scale agricultural subsidies, and the protection of rural workers' rights. In early 21st-century Kazakh politics, Kaliyev represents a centrist, socially-oriented alternative, aiming to balance the nation's resource-reliant economy through the revival of domestic agriculture."
 ALIKHAN_BAIMENOV_DESC: "Alikhan Baimenov was born on February 25, 1956, in the Zhambyl Region of the Kazakh SSR. After graduating from the Dzhambul Hydromelioration and Construction Institute with a degree in civil engineering, he began his career in the construction industry before moving into academia and public service. During Kazakhstan's transition to independence, Baimenov played an active role in state-building, serving in various executive and civil service positions. In 2002, Baimenov became one of the founders of the Democratic Party of Kazakhstan \"Ak Zhol\", which advocated for the development of a market economy, the strengthening of democratic institutions, the protection of entrepreneurs' rights, and political reform. Owing to his extensive experience in public administration and his reputation as a moderate reformer, he quickly emerged as one of the leading figures of Kazakhstan's liberal opposition."
 BULAT_ABILOV_DESC: "Bulat Abilov was born on April 23, 1957, in the city of Guryev, Kazakh SSR. After graduating from the Kazakh Polytechnic Institute with a degree in engineering, he began his career in the industrial sector. In the early 1990s, Abilov entered the business world, achieving success in the banking, investment, and commercial sectors. His entrepreneurial achievements established him as one of the most prominent representatives of Kazakhstan's new generation of businessmen and a strong advocate of market-oriented reforms. By the late 1990s, Abilov had become increasingly involved in public life, promoting private enterprise, improvements in public administration, and democratic reform. His experience in business and liberal political views ultimately led him into politics, where in 2002 he became one of the founders of the Democratic Party of Kazakhstan \"Ak Zhol\"."
 DANIA_ESPAEVA_DESC: "Daniya Yespayeva was born on March 5, 1961, in the Aktobe Region of the Kazakh SSR. After graduating from the Almaty Institute of National Economy with a degree in economics, she began her career in the banking sector. Over the following decades, she held senior positions in financial institutions and commercial organizations, earning recognition as an experienced specialist in banking, lending, and small business development. In 2012, Yespayeva was elected to the Mazhilis of Kazakhstan as a representative of the Democratic Party \"Ak Zhol\". In Parliament, she focused on economic policy, entrepreneurship, financial reform, and support for domestic businesses, becoming one of the party's most prominent figures. In 2019, Yespayeva became the Democratic Party \"Ak Zhol\"'s presidential candidate, making history as the first woman to run for the presidency in independent Kazakhstan. Her campaign emphasized support for private enterprise, reducing bureaucratic barriers, strengthening the rule of law, and advancing market-oriented economic reforms."
 AZAT_PERUASHEV_DESC: "Azat Peruashev was born on September 8, 1967, in the village of Rgaiti, Zhambyl Region, Kazakh SSR. After completing his service in the Soviet Army, he graduated from Ural State University with a degree in political science, later receiving additional education in public administration and economics. He began his career in public administration before moving into senior positions in the industrial sector and business associations, gaining extensive experience in governance, economic policy, and relations between the state and the private sector. Since the late 1990s, Peruashev has played an active role in Kazakhstan's political life, serving as Chairman of the Civic Party of Kazakhstan and later holding senior positions within the National Chamber of Entrepreneurs \"Atameken\". In 2011, he became Chairman of the Democratic Party of Kazakhstan \"Ak Zhol\", focusing on support for entrepreneurship, the development of a market economy, improvements in public administration, and the protection of domestic businesses. In 2012, Peruashev was elected to the Mazhilis of Kazakhstan, where he continued working on economic reforms and legislative development."
 
