 KAZ_Aitu: "AITU"
 KAZ_economy_desc: "Kazakhstan stands on the brink of an economic breakthrough. Oil, metals, transit - the potential is enormous, but it has yet to be unlocked."
 KAZ_merge_national_bank_desc: "A fragmented banking system is a brake on the economy. Merging Halyk Bank with the National Bank will create a reliable financial anchor for the country."
 KAZ_fortebank_desc: "ForteBank becomes the backbone for small and medium businesses. Accessible credit is the fuel for private initiative."
 KAZ_otbas_bank_desc: "Otbas Bank means housing for Kazakhstani families. Affordable mortgage rates directly ease social tension."
 KAZ_economic_recovery_desc: "The 90s left deep scars. Now the state sets a course for recovery - steady, without shocks."
 KAZ_KMC_Astana_Motors_desc: "Kazakhstan assembles its own vehicles. KMC Astana Motors is the first step towards a domestic automotive industry."
 KAZ_new_tax_reform_desc: "The new tax code simplifies the rules for business and closes loopholes for tax evaders. Transparency instead of back-room deals."
 KAZ_heavy_industry_desc: "Kazakhstan does not want to remain just a raw-material supplier. Developing heavy industry means transitioning from exporting ore to exporting metal."
 KAZ_mine_to_mill_atyrau_desc: "Atyrau becomes a full production cycle - from extraction to on-site processing. The oil stays home."
 KAZ_subsidies_to_chemical_industry_desc: "The chemical industry is the next value-added step beyond oil. State subsidies launch a sector that has been idle for decades."
 KAZ_mining_desc: "Uranium, chromium, copper, lead - Kazakhstan ranks in the global top ten for most of them. It is time to truly profit from that."
 KAZ_attract_LUKOIL_to_kashagan_desc: "Kashagan is one of the largest oil fields in the world. LUKOIL gets a share; Kazakhstan gets investment and technology."
 KAZ_Create_KPE_desc: "Kazakhstan Paramount Engineering fills a critical gap - domestic production of equipment for the mining industry."
 KAZ_development_Aq_Niet_Group_desc: "Aq Niet Group takes over the processing and distribution of mining products inside the country. Fewer intermediaries means more profit stays home."
 KAZ_contract_with_ExxonMobil_desc: "ExxonMobil comes to Tengiz. The terms are tough, but the technology and capital are worth it - as long as we do not give away too much."
 KAZ_Create_AM_desc: "Astana Motors Manufacturing will establish full-cycle assembly production. A genuine Kazakhstani automotive industry will begin to take shape."
 KAZ_deal_with_POL_desc: "Poland is an unexpected but profitable partner. Mechanical engineering, agricultural technology, infrastructure - European expertise at a reasonable price."
 KAZ_establish_Mangystau_nuclear_power_plant_desc: "The Mangystau Nuclear Power Plant is the answer to the country's growing energy deficit. Kazakhstan mines uranium - it is only logical to use it at home."
 KAZ_bpp_desc: "The Bright Path Program is an investment in people. Education, healthcare, infrastructure: the state invests in those who build the economy."
 KAZ_European_investments_desc: "European capital goes where there are rules and predictability. Kazakhstan sends a signal: we are ready to play by clear standards."
 KAZ_roads_in_Almaty_desc: "Almaty is choking in traffic. New roads are not just asphalt - they are hours that Kazakhstanis will stop losing every single day."
 KAZ_construction_of_highways_desc: "A country the size of Western Europe cannot develop without roads. Trans-Kazakhstani highways connect regions and unlock the country's transit potential."
 KAZ_investments_in_Almaty_desc: "Almaty is the financial and cultural capital of the country. Targeted investment turns the city into a regional hub for attracting capital."
 KAZ_investments_in_Astana_desc: "Astana is being built before our eyes. Investing in the new capital is a bet on a future that Kazakhstan is creating for itself."
 KAZ_tourism_development_desc: "Baikonur, the Altai, the Caspian, the steppe - Kazakhstan is far from exhausted as a tourist destination. All it needs is infrastructure and marketing."
 KAZ_join_WTO_eco_desc: "Joining the WTO means rules that cannot be ignored. Kazakhstan opens its markets, but in return gains access to global trade."
 KAZ_trade_with_Asian_countries_desc: "China, India, South Korea - Asian markets are growing faster than anyone else. Kazakhstan secures its place in that chain before someone else takes it."
 KAZ_trade_with_CIS_desc: "The CIS market means a shared language, shared standards, and shared history. Trade agreements with neighbors deliver fast and predictable results."
 KAZ_trade_with_Western_desc: "The West buys oil and metals. Kazakhstan wants to sell more than raw materials - this trade agreement opens the door to negotiating better terms."
 KAZ_IT_sector_desc: "IT is an industry that can be built from scratch within a decade. Kazakhstan bets on the digital economy as an alternative to oil dependency."
 KAZ_Kaztelecom_desc: "Kaztelecom is the backbone of the country's digital infrastructure. Modernising the network means internet in every village and a competitive business climate."
 KAZ_Almaty_Hub_desc: "Almaty becomes the IT hub of the region. Startups, outsourcing, R&D - the southern capital draws tech talent from across Central Asia."
 KAZ_Astana_Hub_desc: "Astana Hub is the country's flagship technology park. Tax incentives and infrastructure for IT companies turn the new capital into a digital growth engine."
 KAZ_Tech_Garden_desc: "The Tech Garden is not a metaphor. Kazakhstan builds an ecosystem where startups can take root and survive without bureaucratic obstacles."
 KAZ_Aitu_desc: "Aitu is a Kazakhstani messaging platform with national ambitions. A homegrown service means data that stays inside the country."
 KAZ_fishprom: "Rybprom LLP"
 KAZ_ABP_desc: "Kazakhstani agriculture has never fully recovered from the shock of the 90s. The Agricultural Business Program is a systemic response: subsidies, land, and cooperation."
 KAZ_subsidies_for_farmers_desc: "The Kazakhstani farmer works under harsh conditions - droughts, logistics, lack of machinery. Direct subsidies give farms the chance to survive and grow."
 KAZ_fishprom_desc: "The Caspian Sea and Kazakhstan's major rivers are an undervalued resource. Rybprom LLP takes on industrial fishing and processing to put that potential to work."
 KAZ_taking_unused_land_desc: "Millions of hectares of Kazakhstani land lie idle since the Soviet collapse. The state brings them back into use - and hands them to those willing to work them."
 KAZ_land_to_families_desc: "Land should belong to those who farm it. The family land allocation program creates a class of small landowners - the backbone of the rural economy."
 KAZ_results_of_ABP_desc: "The Agricultural Business Program has delivered. Kazakhstan's countryside is slowly getting back on its feet - and the country grows less dependent on imported food."
 KAZ_turn_to_west_dem_desc: "Our country has seen various policies pursued by the ruling parties, but the people voted for true democracy in our country in the last elections, which demonstrates the people's desire to see a new country that can lead us all to a bright, free future."

 #Army Focus Tree loc
 KAZ_our_military_forces: "Our Military Forces"
 KAZ_our_military_forces_desc: "Seventy thousand soldiers with Soviet rifles, MiGs older than their pilots, and a handful of patrol boats on the Caspian - this is what independence left us. We will rebuild all three into forces the capital commands alone."
 KAZ_Naval_Forces: "Naval Forces"
 KAZ_reorganization_infantry: "Reorganization of the Infantry"
 KAZ_reorganization_infantry_desc: "The divisions we inherited were built for mass mobilisation and a large-scale war, while our real concerns are border security, resources and terrorism. We will disband them, form brigades from their regiments and group them into four military districts around a mobile core."
 KAZ_arsenal_update: "Arsenal Update"
 KAZ_arsenal_update_desc: "Our rifle companies still carry Soviet AK-74s and PKMs, with spares running thin and no domestic line to rebuild them. We will rearm the brigades with refreshed small arms and set up maintenance inside the units. Small arms are rebuilt at home, not shipped back to Moscow."
 KAZ_new_military_uniform: "New Military Uniform"
 KAZ_new_military_uniform_desc: "Mismatched Soviet surplus still weighs on the infantry: it fades in the steppe sun and freezes in winter. We will invest in domestic camouflage research, issue a standard field uniform and boots. Troops keep their gear after demobilisation."
 KAZ_communication_systems: "Updating Communication Systems"
 KAZ_communication_systems_desc: "Brigade HQs still talk on 1980s R-123 sets that anyone with a scanner can hear. We will field encrypted VHF nets, raise radar stations and tie the districts into one command loop. Command reaches the front in minutes, not hours."
 KAZ_foreign_equipment: "Modernization of Foreign Equipment"
 KAZ_foreign_equipment_desc: "Most of our tanks and carriers are Soviet T-72s, BMPs and BTRs, and spare parts come from Russian plants. Semey Engineering repairs them and already offers modernized BTR-70 and BRDM-2 variants. We will extend modernization to the whole fleet for firepower and protection."
 KAZ_reform_military_districts: "Reform of Military Districts"
 KAZ_reform_military_districts_desc: "The four districts hold the new brigades, but orders still run through the General Staff. We will turn them into regional commands (Central, East, West and South) and replace the General Staff with a committee of chiefs, with one commander answerable for each region."
 KAZ_logistics_reorganization: "Logistics Reorganization"
 KAZ_logistics_reorganization_desc: "Years of reform have not fixed our supply: funds are spread inefficiently and spares reach the units late. We will put logistics under one service, count what the depots really hold and schedule fuel and spares by rail over the long distances between them."

 KAZ_Naval_Forces_desc: "The Caspian Sea is of strategic importance for our trade and security. It is time to lay the foundation for a proper naval force."
 KAZ_Kazakhstan_Engineering: "Create Kazakhstan Engineering"
 KAZ_create_kazakhstan_paramount_engineering: "Create Kazakhstan Paramount Engineering"
 KAZ_decommission_old_planes: "Decommission Old Planes"
 KAZ_decommission_old_planes_desc: "Our air force still relies on ageing Soviet-era aircraft. Their upkeep consumes scarce funds while spare parts become harder to source. Retiring the least viable airframes will ease the burden on maintenance crews and free resources for a more capable fleet."
 KAZ_btr_barys_6x6: "Agreement with South Africa on \"Barys 6x6\" APC"
 KAZ_arlan: "Creation of \"Arlan\" Heavy Armored Vehicle"
 KAZ_naiza_israel: "Development of \"Naiza\" MLRS"
 KAZ_t72kae_turkish: "Development of \"T-72KAE\""
 KAZ_new_doctrine_air: "Modern Air Doctrine"
 KAZ_new_doctrine_air_desc: "Kazakhstan's air arm must move beyond inherited operating practices. Standardized planning and a modern approach to air operations will help make better use of our limited aircraft and strengthen coordination with air defence."
 KAZ_complete_aircraft_russia: "Complete the Aircraft Deal with Russia"
 KAZ_complete_aircraft_russia_desc: "Closing long-standing procurement contracts with the Russian Federation will allow us to quickly and seamlessly modernize our fleet with proven aircraft."
 KAZ_creation_airborne_forces: "Creation of the Airborne Forces"
 KAZ_creation_airborne_forces_desc: "Modern military doctrine demands high mobility. Establishing a fully-fledged Airborne Force will allow us to respond quickly to threats anywhere in the region."
 KAZ_Choose_New_Doctrine: "Choose New Doctrine"
 KAZ_Choose_New_Doctrine_desc: "Old methods of naval warfare are obsolete. We need to choose a modern naval doctrine that fits our current capabilities."
 KAZ_alan: "Creation of \"Alan\" Light Armored Vehicle"
 KAZ_btr_barys_8x8: "Agreement with South Africa on \"Barys 8x8\" IFV"
 KAZ_semser_israel: "Development of 122mm \"Semser\" SPH"
 KAZ_taimas_turkish: "Creation of \"Taimas 8x8\""
 KAZ_skylark_uav_cooperation: "Skylark UAV Cooperation"
 KAZ_skylark_uav_cooperation_desc: "Cooperation with Elbit Systems builds on Kazakhstan’s existing Skylark-1LEX fleet and local assembly and maintenance capacity, strengthening domestic expertise in tactical reconnaissance UAVs."
 KAZ_buy_planes_from_china: "Buy Planes from China"
 KAZ_buy_planes_from_china_desc: "Contracts with Beijing for the purchase of modern multirole fighters will help strengthen our Air Force at highly competitive prices."
 KAZ_Naval_Cooperation_with_SOV: "Naval Cooperation with Russia"
 KAZ_Naval_Cooperation_with_SOV_desc: "The Russian Navy is a traditional partner for Kazakhstan on the Caspian. Deepening ties will allow us to access new technologies and tactics."
 KAZ_Naval_Cooperation_with_CHI: "Naval Cooperation with China"
 KAZ_Naval_Cooperation_with_CHI_desc: "Despite being landlocked, Kazakhstan can develop its naval forces on the Caspian Sea and use Chinase expertise to modernize its fleet."
 KAZ_create_AHKE: "Create AHKE"
 KAZ_create_AHKE_desc: "Kazakhstan buys helicopters but cannot service them at home. We will create Airbus Helicopters Kazakhstan Engineering, a joint venture with Airbus, to assemble and maintain rotorcraft inside the country. Spare parts, training and overhaul stay at home instead of going back to Europe."
 KAZ_alan_2: "Modernization of \"Alan\" Vehicle"
 KAZ_army_programm: "Expansion of production"
 KAZ_aibat_israel: "Development of 120mm \"Aibat\" Self-Propelled Mortar"
 KAZ_army_sarp: "Integration of Turkish \"SARP\" Combat Modules"
 KAZ_retraining_officers: "Retraining of Officers"
 KAZ_retraining_officers_desc: "Pilots, instructors and ground crews will train abroad to improve flight procedures, air-defence coordination and maintenance in Kazakhstan's climate. The program costs money and temporarily removes experienced personnel from their units, but strengthens the skills needed to operate modern aircraft."
 KAZ_redevelopment_air_areas: "Modernization of Air Bases"
 KAZ_redevelopment_air_areas_desc: "We will expand airfield capacity and strengthen ground-based air defences, giving the air force more room to operate and better protection for aircraft and personnel on the ground."
 KAZ_First_Shipyards: "First Shipyards"
 KAZ_First_Shipyards_desc: "Building our own shipyards on the Caspian coast will allow us to independently produce and maintain patrol vessels."
 KAZ_Modernization_of_the_Navy: "Modernization of the Navy"
 KAZ_Modernization_of_the_Navy_desc: "Upgrading onboard systems, radars, and armaments on existing boats will significantly increase the fleet's combat readiness."
 KAZ_creation_of_sso: "Creation of Special Operations Forces"
 KAZ_creation_of_sso_desc: "Army recon, border guards and interior SWAT train separately with different doctrines. We will merge them into one Special Operations Forces command with a unified school and standard equipment. When a hostage needs freeing or a sabotage team needs inserting, one call reaches the right unit."
 KAZ_machine_guns: "Modernization of Machine Guns"
 KAZ_machine_guns_desc: "Our platoons still carry Soviet PKM and RPK-74 guns, while the heavy NSV line stayed in Kazakhstan after the Union collapsed. We will modernise the light weapons and keep the 12.7 mm plant supplying the brigades. Support fire no longer depends on old depot stockpiles."
 KAZ_modern_mortars: "Modern Mortars and Missile Systems"
 KAZ_modern_mortars_desc: "Battalion fire support rests on Soviet mortars and on Fagot, Konkurs and portable air-defence missiles that we cannot improve ourselves. We will stop buying replacements and start developing our own mortar carriers, guidance electronics and light missiles in Kazakhstan."
 KAZ_army_success: "Success in the Kazakh MIC"
 KAZ_new_air_forces: "New Air Forces"
 KAZ_new_air_forces_desc: "The Air Forces are the pride of our country. We must modernize our aviation and create a powerful air fleet to protect the sovereignty of the nation. We will begin the modernization of our aviation and the creation of a powerful air fleet to protect the sovereignty of the nation."
 KAZ_Great_Kazakh_Navy: "Great Kazakh Navy"
 KAZ_Great_Kazakh_Navy_desc: "Thanks to shipyards, technology, and training, Kazakhstan is becoming a dominant and formidable force in the Caspian Sea."
 KAZ_professional_readiness: "Bring Our Army to Professional Readiness"
 KAZ_professional_readiness_desc: "The last reform closes the loop: brigades are formed, districts answer to one command, equipment is serviced at home. We will complete the shift to a professional army, train the officer corps on new doctrines and let the best generals lead the charge. Conscription becomes selective, keeping only those who meet the standard."
 KAZ_new_kaz_force: "New Kazakh Air Force"
 KAZ_new_kaz_force_desc: "The reforms, procurements, and retraining are complete. The old structures have given way to the modernized, high-tech, and formidable Air Force of Kazakhstan."

 #Foreign Policy Focus Tree loc
 KAZ_foreign_policy: "Foreign Policy of Kazakhstan"
 KAZ_foreign_policy_desc: "Our country sits between Russia and China, with Europe, the Gulf and South Asia only a short flight away. Nobody has ever forced us to pick a side, and we do not intend to start now. A multi-vector foreign policy will serve Kazakhstan first and keep every door open."
 KAZ_eastern_european_diplomacy: "Eastern European Diplomacy"
 KAZ_eastern_european_diplomacy_desc: "Moscow, Minsk, Kyiv and Chisinau all know the Kazakh steppe from the Soviet years, and each can offer us something different. We will open channels to all four at once, listen to what they want, and see which doors open the widest."
 KAZ_north_kazakhstan_development: "Development Program for Northern Kazakhstan"
 KAZ_north_kazakhstan_development_desc: "In the 1950s the Virgin Lands campaign turned our northern steppe into the Soviet breadbasket, and the region has looked toward Russia for jobs, television and trade ever since. If we want the north to look south, we must offer it more than speeches. This programme is the offer."
 KAZ_csto_counter_terrorism_shield: "CSTO Counter-Terrorism Shield"
 KAZ_csto_counter_terrorism_shield_desc: "Since the 1990s, militants from Afghanistan and the Ferghana Valley have probed the borders of the Collective Security Treaty. Instead of waiting for the next incident, we will come to the CSTO table with a ready initiative and ask our allies to sign. Russia's backing will be the key."
 KAZ_air_defense_modernization: "Modernization of Air Defense Shield"
 KAZ_air_defense_modernization_desc: "Our radars date from the Soviet era, and our missile batteries are not much younger. We cannot afford to replace everything at once, so we will go to Moscow within the framework we already share and argue that money spent on our airspace is spent on the security of the whole alliance."
 KAZ_logistics_hubs: "Provide Areas for Logistics Hubs"
 KAZ_logistics_hubs_desc: "Russian online retailers are running out of room at home and looking for new markets. Kazakhstan is the obvious one: large, connected and hungry for fast delivery. We will offer them land and a warm welcome, on the condition that the warehouses stand on our soil and employ our people."
 KAZ_baikonur_partnership: "Expansion of Space Programs at Baikonur"
 KAZ_baikonur_partnership_desc: "Baikonur launched Sputnik and Gagarin, and it still sends crews to the ISS. The cosmodrome stands on our land but runs on a Russian lease. Through the Baiterek project we can share the launch pads and the profits, and bring Kazakh engineers into the programme as full partners."
 KAZ_diversification_from_russia: "Diversification from the Russian Federation"
 KAZ_diversification_from_russia_desc: "Most of our oil still leaves the country through Russian territory, and our rail, trade and payments follow Russian lines too. We will build alternatives with Caspian routes, Chinese pipelines and new buyers, so we are less exposed the next time Moscow decides to turn a tap."
 KAZ_strengthen_northern_frontier: "Strengthening the Northern Frontier"
 KAZ_strengthen_northern_frontier_desc: "Our border with Russia runs for more than 7,500 kilometres, the longest unbroken land border on Earth, and in places it is barely marked. Bunkers, patrol roads and proper garrisons will change that. Nobody is accusing anyone of anything - we simply intend to know exactly where our country ends."
 KAZ_nationalization_baikonur: "Nationalization of Baikonur"
 KAZ_nationalization_baikonur_desc: "The Baikonur lease runs until 2050 at roughly 115 million dollars a year for the use of our land. Everyone on our side of the table knows the arrangement is lopsided. We will cancel it, put the cosmodrome under Kazakh command and let Moscow decide how it wants to respond."
 KAZ_support_separatists_in_russia: "Support Separatists in Russia"
 KAZ_support_separatists_in_russia_desc: "Russia is a federation on paper, but Tatarstan, Bashkortostan and the Caucasus republics remember what autonomy was supposed to mean. Quiet funding, sympathetic media and a few well-placed contacts will keep Moscow busy at home. It is a risky game, but two can play it."
 KAZ_visit_minsk: "Visit to Minsk"
 KAZ_visit_minsk_desc: "Minsk is the one capital in the post-Soviet space where Eurasian integration is spoken of as if it were meant. Before we plan anything bigger, we will send a delegation to meet Lukashenko in person and see what Belarus is ready to put on the table."
 KAZ_support_lukashenko_regime: "Support the Lukashenko Regime"
 KAZ_support_lukashenko_regime_desc: "Lukashenko runs Belarus like one very large, very tidy collective farm: the roads are clean, wages arrive on time and nobody has yet met an oligarch. Western editors prefer to call him Europe's last dictator, but we see a steady neighbour. A few handshakes, a loan and no lectures about ballot boxes will earn a lasting friend."
 KAZ_support_belarusian_opposition: "Support the Belarusian Opposition"
 KAZ_support_belarusian_opposition_desc: "Belarus has an opposition, though you would need to look for it: small, harassed, loud mostly in exile, and speaking for people who remember Minsk before the one-man show. We will open some doors for them, pay for an independent paper or two, and remind the president that we can be friends of his country without being friends of his rule."
 KAZ_strategic_partnership_minsk: "Strategic Partnership with Minsk"
 KAZ_strategic_partnership_minsk_desc: "Years of summits, trade and shared drills have made Belarus our closest partner outside Russia. Now we will give that friendship a legal spine and tie our security and defence planning together. If either capital is ever threatened, the other will not have to wonder whether to help."
 KAZ_joint_agro_complex_modernization: "Joint Modernization of Agro-Complexes"
 KAZ_joint_agro_complex_modernization_desc: "Belarus is the one former Soviet republic that kept its large farms productive, and Kazakhstan has the land to show how far their methods can go. We will ask Minsk to pool its machine builders and agronomists with our fields in a programme that neither of us could build alone."
 KAZ_military_tech_exchange_mzkt: "Military-Technical Exchange with MZKT"
 KAZ_military_tech_exchange_mzkt_desc: "Our young armoured vehicle industry still depends on others for heavy chassis, and Belarus has one of the few factories in Europe that can build them. We will trade what we have learned for what they know, and hope that both defence industries come out stronger."
 KAZ_economic_convergence_ukraine: "Economic Convergence with Ukraine"
 KAZ_economic_convergence_ukraine_desc: "Ukraine's steel mills and machine shops once supplied half the Soviet Union, and our raw materials fed them. Those links never fully broke. Our delegation will propose formal agreements that tie the two economies together again, so business can do what it always did, with less paperwork."
 KAZ_condemn_ukrainian_nationalism: "Condemn Ukrainian Nationalism"
 KAZ_condemn_ukrainian_nationalism_desc: "Torchlit marches, portraits of a wartime nationalist leader treated almost as a saint, streets renamed in his honour, radical groups in uniform with symbols borrowed from the 1940s - these scenes are hard to ignore. With old slogans shouted in public squares and Soviet monuments pulled off their pedestals, fear for the Russian-speaking population is not paranoia. We will say so in every Eurasian forum."
 KAZ_industrial_cooperation_antonov: "Industrial Cooperation with Antonov"
 KAZ_industrial_cooperation_antonov_desc: "Antonov built the transports that carried half the Soviet army, and some of its best designers are now short of customers. Kazakhstan has the money and a need for aircraft. We will approach the design bureau with an offer that suits both of us: orders for them, capability for us."
 KAZ_two_breadbaskets: "Two Breadbaskets"
 KAZ_two_breadbaskets_desc: "Ukraine and Kazakhstan are two of the world's great wheat exporters, and until now they have mostly competed. We will propose something different: pooling experience on black soil and dry steppe. Competing for the same buyer helps nobody except the buyer."
 KAZ_block_tmtm_route: "Block TMTM Route for Kyiv"
 KAZ_block_tmtm_route_desc: "The Middle Corridor was built to give Kazakhstan options, not to give Kyiv a way around Moscow. If it is used against our partners, we have no obligation to keep it open. We will find a technical reason - there is always a technical reason."
 KAZ_support_ukraine_sovereignty: "Support Ukraine's Sovereignty"
 KAZ_support_ukraine_sovereignty_desc: "We gave up the fourth-largest nuclear arsenal in the world in the 1990s and received security assurances in return. Kazakhstan has a direct interest in seeing that such assurances still mean something. We will state publicly, and at the highest level, that Ukraine's borders are not up for negotiation."
 KAZ_nationalize_ukrainian_assets: "Nationalization of Ukrainian Assets"
 KAZ_nationalize_ukrainian_assets_desc: "Ukrainian businesses in Kazakhstan hold property our treasury could use, and Kyiv has given us enough reasons to ask hard questions. Courts will find the paperwork lacking, accounts will freeze, and the assets will pass into state hands. It is crude, effective and difficult to undo."
 KAZ_support_separatists_ukraine: "Support Separatists in Ukraine"
 KAZ_support_separatists_ukraine_desc: "Crimea and the Russian-speaking east have never hidden their opinion of Kyiv, and they have little patience left for it. They need money, logistics and voices abroad. We can offer discreet funding and a friendly platform without formal recognition, and let Kyiv struggle to hold its provinces together while we quietly gain leverage."
 KAZ_humanitarian_aid_ukraine: "Humanitarian Aid to Ukraine"
 KAZ_humanitarian_aid_ukraine_desc: "Ukraine's hospitals are short of medicine, and its families are short of heat, bread and patience. We will send relief convoys, loudly and with receipts. Kindness is not a strategy, but people who remember who helped them are very hard to turn against us."
 KAZ_support_ukrainian_army: "Support the Ukrainian Army"
 KAZ_support_ukrainian_army_desc: "Words of support do not stop tanks. The Ukrainian army needs weapons, spare parts and men who can teach modern war, and we can supply all three in modest numbers. In return our own officers will learn how a modern army fights, and that is worth more than any shipment."
 KAZ_military_contingent_ukraine: "Send Military Contingent against Ukraine"
 KAZ_military_contingent_ukraine_desc: "Wars end, and the alliances formed in them last far longer. Once Ukraine is at war, we will offer volunteer formations to whoever is fighting it, under their operational command. Our men will gain experience, our name will gain weight, and the cost will be counted in manpower, not speeches."
 KAZ_friendly_vector_west: "Friendly Vector to the West"
 KAZ_friendly_vector_west_desc: "Our oil, uranium and rare earths are of great interest in the West, and we have never hidden that we want Western capital and technology in return. A friendly line toward Washington, London, Berlin and Paris will open doors that neither Moscow nor Beijing can. We stay polite and keep our options open."
 KAZ_EBRD_investments: "EBRD Investments"
 KAZ_EBRD_investments_desc: "The EBRD began lending in our region in the 1990s and stayed because the projects paid back. We will ask the Bank to widen its portfolio, and persuade its European shareholders that money spent on Kazakh roads, railways and factories is money spent on a stable heartland of Asia."
 KAZ_kbtu: "Kazakhstan-British Technical University"
 KAZ_kbtu_desc: "A modern economy needs engineers trained to international standards, and our universities cannot produce them fast enough. Rather than wait, we will ask Britain to help us build a technical university from scratch in Almaty, with British partners, a British curriculum and Kazakh students who stay at home."
 KAZ_build_ports_bautino_prorva: "Build the Ports of Bautino and Prorva"
 KAZ_build_ports_bautino_prorva_desc: "Our Caspian coast is shallow and shifting, a poor foundation for an offshore oil industry. Bautino and Prorva are where the supply lines to the offshore fields will start, and they need someone who knows how to build harbours in the shallows. The Dutch have been doing it for centuries."
 KAZ_lactalis_agreement: "Food Agreement with Lactalis"
 KAZ_lactalis_agreement_desc: "Our milk is good, but most of it is processed in plants that predate independence. France exports its dairy industry as eagerly as its cheese, so we will invite Lactalis to bring European technology and quality standards, and make Kazakh farmers part of a modern supply chain."
 KAZ_polpharma_agreement: "Agreement with Polpharma"
 KAZ_polpharma_agreement_desc: "Poland rebuilt its pharmaceutical industry from the ruins of communism in a single generation, which is exactly what we would like to do. Polpharma's licences and production know-how could take years off our own effort, and we are ready to pay for them."
 KAZ_steppe_eagle_exercises: "Steppe Eagle Exercises"
 KAZ_steppe_eagle_exercises_desc: "Peacekeeping is the one military mission where Kazakh troops can serve beside NATO without political awkwardness. Joint exercises on our own training grounds will let us learn Western methods, host Western officers and show that our army is a serious partner."
 KAZ_wabtec_cooperation: "Wabtec Locomotives and Railway Engineering"
 KAZ_wabtec_cooperation_desc: "Rail carries most of our freight, and a railway is only as good as the locomotives that pull its trains. Our old fleet is wearing out, and American manufacturers have the modern designs to replace it. We will invite Wabtec to build and to teach, and keep the locomotives rolling for decades."
 KAZ_wind_farms_total_eren: "Wind Farms in South with Total Eren"
 KAZ_wind_farms_total_eren_desc: "The south of Kazakhstan has wind that never stops and sun that rarely does, and almost none of it is harvested. French renewable firms have the capital and the turbines. We will invite Total Eren to build here and prove that clean power can also be cheap power."
 KAZ_green_hydrogen_germany: "Green Hydrogen Production with Germany"
 KAZ_green_hydrogen_germany_desc: "Germany has promised to leave coal and gas behind, and has discovered that its own wind and sun are not enough. We have both in abundance. A joint hydrogen programme would give German industry a supplier and give Kazakhstan a clean export beyond oil."
 KAZ_space_agreements_airbus: "Space Agreements with French Airbus"
 KAZ_space_agreements_airbus_desc: "A country that wants to be taken seriously needs its own eyes in orbit. French firms build some of the best observation satellites in the world, and Airbus is open to sharing the know-how. We will propose a joint assembly centre, so that Kazakh engineers learn to build what they now would have to buy."
 KAZ_starlink_aws_cooperation: "Digital Cooperation with Starlink and AWS"
 KAZ_starlink_aws_cooperation_desc: "Large parts of our country are still beyond the reach of cables, and some government computers are older than the soldiers who use them. Satellite internet and cloud computing, deployed quickly, could change that within a few years. We will ask the Americans to supply both."
 KAZ_czech_military_cooperation: "Cooperation with Aero Vodochody & CZ"
 KAZ_czech_military_cooperation_desc: "Our air force trains pilots on aircraft from an earlier century, and our infantry carries rifles that are no younger. Czech industry offers modern equipment at a price smaller armies can afford, and a licence we can build at home. Prague should be happy to find a new customer."
 KAZ_turkish_drones: "Purchase of Turkish Drones"
 KAZ_turkish_drones_desc: "Drones have rewritten the rules of small wars, and Turkish designs have proved themselves from Libya to Karabakh. We will go shopping in Ankara, where our soldiers and the salesmen almost share a language, and bring home aircraft, training and a share of the technology."
 KAZ_rapprochement_nato: "Rapprochement with NATO"
 KAZ_rapprochement_nato_desc: "We have been a NATO partner since the 1990s but never a member of the club. It is time for a formal upgrade: closer cooperation, shared intelligence and the status of Major Non-NATO Ally, with the privileges that come with it. Our steppe borders two great powers, and a few friendly alliances will help keep things calm."
 KAZ_asian_vector: "Asian Vector"
 KAZ_asian_vector_desc: "Asia is where the next century will be decided, and we sit in the middle of it. Beijing, Tokyo, Delhi and Seoul will all be asked to take Kazakhstan seriously as a market, a transit route and a source of energy. For us the Silk Road is not a metaphor - it is a map."
 KAZ_one_china_principle: "Adherence to One-China Principle"
 KAZ_one_china_principle_desc: "China is our largest neighbour and one of our biggest trading partners. We have long recognised the government in Beijing and see no reason to complicate things by hedging. Kazakhstan will openly adhere to the One-China principle. Taipei will be disappointed, but Beijing will remember."
 KAZ_modernize_shymkent_refinery: "Modernize Shymkent Refinery"
 KAZ_modernize_shymkent_refinery_desc: "We export crude oil and import much of our fuel, an arrangement no economy should be proud of. Shymkent, half owned by CNPC, is the obvious place to start fixing it. We will ask Beijing's partners to double down on the refinery, so our own oil can fill our own tanks."
 KAZ_aiju_agroparks: "Aiju Agroparks"
 KAZ_aiju_agroparks_desc: "Northern Kazakhstan grows wheat by the million tons but sells most of it raw. Chinese agribusiness knows how to turn grain into processed goods and has buyers waiting at home. We will welcome their agroparks and keep as much of the harvest's value as we can inside the country."
 KAZ_zhanazhol_gas_plant: "Zhanazhol Gas Processing Plant"
 KAZ_zhanazhol_gas_plant_desc: "Associated gas is still burned off at wellheads in Aktobe while homes elsewhere rely on imported fuel. A modern plant would treat the gas, feed the grid and cut the flaring. CNPC already works in the region, so we will ask it to do more of what it already does well."
 KAZ_allur_jac_auto_cluster: "Allur and JAC Auto Cluster"
 KAZ_allur_jac_auto_cluster_desc: "Kostanay has been assembling cars since the early years of independence, which is not the same as making them. A real auto industry needs parts, suppliers and engineers, and JAC is looking for a foothold in Central Asia. We will offer the land and the market and ask them to bring everything else."
 KAZ_lovol_tractors: "Lovol Tractors"
 KAZ_lovol_tractors_desc: "The average tractor on a Kazakh farm is older than the farmer's children. Western machines cost too much and Chinese ones cost far less. We will ask Lovol to open a plant in Kostanay, so that the steppe is ploughed by machines built a few hours away rather than a continent away."
 KAZ_zhanatas_wind_power: "Zhanatas Wind Power"
 KAZ_zhanatas_wind_power_desc: "Chinese engineers have built wind farms from the Gobi to Inner Mongolia, and the Zhambyl steppe is not so different. A joint venture there would feed the southern grid with clean power and show that renewable energy in Kazakhstan can be more than a promise in a government brochure."
 KAZ_huawei_infrastructure: "Huawei Infrastructure"
 KAZ_huawei_infrastructure_desc: "Our cities need faster networks, safer data centres and fibre that actually reaches the regions. Huawei can deliver all of it at a price Western vendors rarely match. The politics of buying Chinese telecom equipment are complicated, but the bandwidth is not."
 KAZ_modernize_aktau_port: "Modernize Aktau Port"
 KAZ_modernize_aktau_port_desc: "Almost everything that crosses the Caspian on its way to Europe passes through Aktau, and the port is already struggling to keep up. Chinese shipping and construction firms want the Middle Corridor to work as badly as we do. We will ask them to help us rebuild the harbour for the traffic it deserves."
 KAZ_copper_smelter_abay: "Copper Smelter in Abay"
 KAZ_copper_smelter_abay_desc: "We mine copper by the hundred thousand tons and send most of it abroad as concentrate. Smelting it ourselves would keep the profit and the jobs at home. Chinese metallurgical firms have the technology and the appetite, and Abay has the ore."
 KAZ_citic_fertilizer_plants: "CITIC Fertilizer Plants"
 KAZ_citic_fertilizer_plants_desc: "Every harvest depends on fertiliser, and most of ours is imported. CITIC, one of China's largest conglomerates, has the means to change that. We will invite it to build plants in the Almaty region and aim for the day when Kazakh farmers no longer buy a sack from abroad."
 KAZ_jibek_joly_steel_plant: "Jibek Joly Steel Plant"
 KAZ_jibek_joly_steel_plant_desc: "Jibek Joly is meant to be a special economic zone on the Silk Road, and a zone needs an anchor tenant. A steel plant of the right size could be that: large, foreign-financed and in need of little more than land and permits. We will ask Chinese steelmakers to be the first through the gate."
 KAZ_hengtong_data_centers: "Hengtong Data Centers"
 KAZ_hengtong_data_centers_desc: "Whoever owns the cables and the servers owns a share of the future. Hengtong builds both, and Kazakhstan sits exactly between the markets that need them. We will invite the company to put fibre and data centres into our biggest cities, whatever that means for the politics of who sees our data."
 KAZ_sovereign_partnership: "Sovereign Partnership"
 KAZ_sovereign_partnership_desc: "Friendship with Beijing has brought us roads, factories and credit, and also a growing number of people asking who really decides at home. We will revise the partnership so the money stays and the influence goes. Respect between neighbours is a better foundation than debt."
 KAZ_chi_best_friends: "China and Kazakhstan - Best Friends"
 KAZ_chi_best_friends_desc: "Beijing has been a faithful partner, and we see no reason to be shy about it. We will ask China to raise our partnership to a comprehensive friendship and accept everything that comes with it. Some at home will object, and we will have to answer them honestly."
 KAZ_kia_plant_kostanay: "Kia Automobile Plant in Kostanay"
 KAZ_kia_plant_kostanay_desc: "Kia cars are already a common sight on Kazakh roads, and we would like to see them built here too. Kostanay has the workers, the rail links and the space, and Korea has a company looking for a way into Central Asia. A plant would give each side what it lacks."
 KAZ_smart_city_korea: "Smart City Projects with Korea"
 KAZ_smart_city_korea_desc: "Seoul turned itself into one of the most connected cities in the world within a generation, and its companies are eager to export the formula. We will invite Korean firms to the capital to teach our engineers how to run a city on data, and let them show us what a smart city really is."
 KAZ_food_security_uae: "Food Security with UAE"
 KAZ_food_security_uae_desc: "The Gulf states import almost everything they eat and worry about what happens when exporters stop selling. Kazakhstan has land, wheat and no wish to be a hostage to grain prices. A partnership with the Emirates would turn their anxiety into our investment."
 KAZ_pharma_cluster_rnd_center: "Pharmaceutical Cluster and R&D Center"
 KAZ_pharma_cluster_rnd_center_desc: "India makes a large share of the world's generic medicine, and its companies are always looking for places to grow. We will invite them to build a pharmaceutical cluster and research centre here, and learn from them how an emerging country turns cheap, good medicine into an industry."
 KAZ_class_a_logistics_warehouses: "Construction of Class A Logistics Warehouses"
 KAZ_class_a_logistics_warehouses_desc: "Most of the cargo crossing our country waits in warehouses built for another era, or in no warehouse at all. Singapore treats logistics as a national art, and its investors want new places for their capital. We will invite them to fill the gap with modern facilities and teach us how it is done."
 KAZ_water_infrastructure_icd: "Water Infrastructure with ICD"
 KAZ_water_infrastructure_icd_desc: "Water is the most precious resource in Central Asia, and our pipes and canals leak more than they deliver. The Islamic Corporation for the Development of the Private Sector can finance public-private projects to modernise irrigation and city water systems. It will not make headlines, but it will keep a lot of fields green."
 KAZ_joint_startup_support_fund: "Joint Startup Support Fund"
 KAZ_joint_startup_support_fund_desc: "Our universities produce good engineers and our economy has few places to employ them. A joint fund with Oman, backed by its investment authority, could give founders in both countries the capital that banks refuse to provide. We will send the proposal to Muscat and see what comes back."
 KAZ_qatar_gas_chemistry_alliance: "Qatar Gas Chemistry Alliance"
 KAZ_qatar_gas_chemistry_alliance_desc: "We sell gas as a raw material, and the people who buy it turn it into plastics worth many times as much. Qatar learned that lesson and invested wisely in it. We will invite its sovereign fund to help us build the plants that keep the profit at home."
 KAZ_acwa_power_wind_deal: "ACWA Green Power Deal"
 KAZ_acwa_power_wind_deal_desc: "Saudi Arabia is spending its oil money on the energy transition and has chosen ACWA Power to do it. Our steppe has the wind that company is looking for. We will offer our best site and invite the Saudis to build the largest wind project in our history."
 KAZ_cica_diplomatic_center: "CICA Diplomatic Center"
 KAZ_cica_diplomatic_center_desc: "We proposed the Conference on Interaction and Confidence Building Measures in Asia back in 1992 and have worked on it ever since. A permanent home in our capital will turn it into a real institution with regular summits and a neutral room where Asia's rivals can sit down together."

 #Foreign Policy Events
 kaz_foreign.1.t: "Kazakh Delegation Arrives in Minsk"
 kaz_foreign.1.d: "A high-level Kazakh delegation has arrived in Minsk. Astana proposes a package of agreements to deepen bilateral ties, focusing on expanded trade in potash, grain and agricultural machinery. The proposals are on the table."
 kaz_foreign.1.a: "Sign the agreement"
 kaz_foreign.1.b: "Decline the proposal"
 kaz_foreign.2.t: "Minsk Accepted the Agreement"
 kaz_foreign.2.d: "The Belarusian side has accepted Kazakhstan's proposals. The two countries are now bound by trade agreements and mutual diplomatic trust."
 kaz_foreign.2.a: "Excellent news"
 kaz_foreign.3.t: "Minsk Declined the Agreement"
 kaz_foreign.3.d: "The Belarusian side has declined Kazakhstan's proposals. Minsk does not appear interested in closer ties with Astana at this time."
 kaz_foreign.3.a: "Disappointing"
 kaz_foreign.4.t: "Kazakhstan Proposes Agricultural Cooperation"
 kaz_foreign.4.d: "Astana has proposed a comprehensive agricultural cooperation program: joint agro-industrial complexes, shared seed stocks, our machinery adapted to Kazakh conditions. The package could significantly boost food production in both countries."
 kaz_foreign.4.a: "Sign the agricultural agreement"
 kaz_foreign.4.b: "Decline the proposal"
 kaz_foreign.5.t: "Minsk Accepted Agricultural Cooperation"
 kaz_foreign.5.d: "Belarus has accepted the agricultural cooperation package. Joint projects in agriculture will begin, combining their machinery with our land and market access."
 kaz_foreign.5.a: "Excellent news"
 kaz_foreign.6.t: "Minsk Refused Agricultural Cooperation"
 kaz_foreign.6.d: "Belarus has declined the agricultural cooperation proposal. Minsk does not appear interested in joint agro-industrial projects with us at this time."
 kaz_foreign.6.a: "Disappointing"
 kaz_foreign.7.t: "Kazakhstan Proposes Military-Technical Exchange"
 kaz_foreign.7.d: "A Kazakh delegation has arrived in Minsk with a proposal for military-technical cooperation. Having launched its own armored vehicle production, Astana offers to share the technologies of its Barys armored personnel carriers and Arlan light vehicles. In return, Kazakhstan is interested in our MZKT heavy chassis for its air defense and missile units. The proposals are on the table."
 kaz_foreign.7.a: "Sign the exchange agreement"
 kaz_foreign.7.b: "Decline the proposal"
 kaz_foreign.8.t: "Minsk Accepted the Military-Technical Exchange"
 kaz_foreign.8.d: "Belarus has accepted the military-technical exchange. Our Barys and Arlan technologies go to their engineers, while their MZKT chassis will reinforce our S-300 and missile units and speed up the development of our own armored vehicle technologies."
 kaz_foreign.8.a: "Excellent news"
 kaz_foreign.9.t: "Minsk Refused the Military-Technical Exchange"
 kaz_foreign.9.d: "Belarus has declined the military-technical exchange. Minsk does not appear interested in swapping its chassis technologies for our armored vehicle technologies at this time."
 kaz_foreign.9.a: "Disappointing"
 kaz_foreign.10.t: "Astana Offers a Strategic Partnership"
 kaz_foreign.10.d: "The Kazakh delegation has returned to Minsk with the boldest proposal in the history of our relations: mutual security guarantees, military access and joint defense programs. Astana argues that two countries squeezed between the great powers are stronger together. The pen is on our side of the table."
 kaz_foreign.10.a: "Sign it - we are stronger together"
 kaz_foreign.10.b: "Minsk does not need distant allies"
 kaz_foreign.11.t: "Minsk Has Signed"
 kaz_foreign.11.d: "Belarus has accepted the strategic partnership. From now on our guarantees cover each other, our armies gain access to each other's territory, and the plants of both countries work for a common defense. Astana and Minsk are no longer just partners - they are allies."
 kaz_foreign.11.a: "This changes everything"
 kaz_foreign.12.t: "Minsk Has Hesitated"
 kaz_foreign.12.d: "Belarus has declined the strategic partnership. Minsk explains that the time is not right, but the subtext is clear: someone considers an alliance with us too risky - or too costly. The guarantees and access remain on paper, in the folder of unrealized projects."
 kaz_foreign.12.a: "Their loss"
 kaz_foreign.13.t: "The CSTO Counter-Terrorism Shield Launched"
 kaz_foreign.13.d: "The counter-terrorism initiative presented in Astana has been launched within the framework of the CSTO: shared intelligence on extremist networks, coordinated border controls and joint rapid-response units. Terrorism knows no borders - only a common shield can protect the member states of the Collective Security Treaty Organization from the Salafist threat. The security services of the member states are already preparing to integrate into the program."
 kaz_foreign.13.a: "A common threat demands a common response"
 kaz_foreign.14.t: "Kazakhstan Requests Air Defense Investment"
 kaz_foreign.14.d: "Astana has turned to Moscow with a proposal: within the framework of the already existing joint CIS air defense system, Kazakhstan asks for investment in the modernization of its air defense network and the transfer of relevant technologies. The Kazakh side argues that a reinforced southern flank is in our common interest."
 kaz_foreign.14.a: "Invest in the southern flank"
 kaz_foreign.14.b: "Decline the request"
 kaz_foreign.15.t: "Moscow Accepted the Air Defense Investment"
 kaz_foreign.15.d: "Russia has agreed to invest in our air defense and transfer the technologies. Russian funds and equipment will reinforce our radar coverage and anti-aircraft missile units, deepening the integration of the two countries' air defense systems."
 kaz_foreign.15.a: "Excellent news"
 kaz_foreign.16.t: "Moscow Refused the Air Defense Investment"
 kaz_foreign.16.d: "Russia has declined our request for air defense investment and technology transfer. Moscow does not appear ready to share its most sensitive technologies with us at this time."
 kaz_foreign.16.a: "Disappointing"
 kaz_foreign.17.t: "Investing in the Northern Regions"
 kaz_foreign.17.d: "The northern oblasts - Kostanay, North Kazakhstan, Akmola - are home to a significant Russian-speaking population. Moscow's economic influence flows through these regions like water through cracks. Our answer is simple: state investment. Power grids to connect them to Astana, not the border. New construction slots for local factories and logistics hubs. Every kilometer of cable and every new slot is a vote against dependence on Moscow."
 kaz_foreign.17.a: "Bind the north to the capital"
 kaz_foreign.18.t: "Kazakhstan Supports Separatists!"
 kaz_foreign.18.d: "Our intelligence services have uncovered evidence of Kazakh support for separatist movements within Russia. Astana is funding and arming groups that seek to break away from the Federation. This is a direct attack on our territorial integrity. The traitors in the Kremlin's backyard will learn the price of betrayal."
 kaz_foreign.18.a: "We will remember this betrayal"
 kaz_foreign.19.t: "Kazakh Delegation Arrives in Kyiv"
 kaz_foreign.19.d: "A high-level Kazakh delegation has arrived in our capital today. They come with a comprehensive economic package: a broad Trade Agreement to open our markets to one another, and a strategic Investment Agreement for mutual projects in infrastructure and energy. Astana seeks to build a new economic corridor - and they are ready to invest. The documents are on the table."
 kaz_foreign.19.a: "Sign both agreements"
 kaz_foreign.19.b: "Decline the proposal"
 kaz_foreign.20.t: "Kyiv Accepts the Agreements"
 kaz_foreign.20.d: "Our delegation reports a successful outcome. Kyiv has signed both the Trade and Investment Agreements. This establishes a formal framework for mutual investment and expanded trade, directly reducing our economic reliance on northern supply chains."
 kaz_foreign.20.a: "A solid foundation for cooperation"
 kaz_foreign.21.t: "Kyiv Declines Our Proposal"
 kaz_foreign.21.d: "Our delegation has returned without signed documents. Kyiv declined the Trade and Investment Agreements, officially citing internal economic constraints. In reality, they are unwilling to risk Moscow's displeasure by formalizing closer ties with us at this time."
 kaz_foreign.21.a: "We will look for other partners"
 kaz_foreign.23.t: "Kazakh Statement on Ukrainian Nationalism"
 kaz_foreign.23.d: "The Ministry of Foreign Affairs of Kazakhstan has issued a formal diplomatic note expressing concern over the perceived promotion of uncompromising nationalist narratives and the commemoration of controversial historical figures within Ukraine. The statement frames these domestic matters as a potential source of regional instability, invoking broad concerns about historical revisionism. While the Kazakh government presents this as a matter of regional security, our administration views this unsolicited commentary on our internal historical discourse as unwarranted diplomatic interference."
 kaz_foreign.23.a: "We will remember this"
 kaz_foreign.24.t: "A Friend in Astana"
 kaz_foreign.24.d: "Kazakh leader [FROM.GetLeader] has publicly backed Alexander Lukashenko: no lectures about democracy, no sanctions - just a handshake and a package of agreements. Astana knows what it means to sit between great powers, and does not intend to leave Minsk alone with its problems. Two presidents who know what pressure feels like do not need to explain anything to each other."
 kaz_foreign.24.a: "Minsk remembers its friends"
 kaz_foreign.25.t: "Kazakhstan Proposes Aircraft Cooperation"
 kaz_foreign.25.d: "A Kazakh delegation has arrived in Kyiv with a proposal to expand the An-74 program: a framework contract for eleven transports for the National Guard and the Border Guard, Kazakh financing and component supply in exchange for technology and joint projects. The terms are on the table."
 kaz_foreign.25.a: "Sign the agreement"
 kaz_foreign.25.b: "Decline the proposal"
 kaz_foreign.26.t: "Kyiv Accepted the Aircraft Cooperation"
 kaz_foreign.26.d: "Kyiv has accepted the aircraft cooperation. Eleven An-74 transports will be delivered under the framework contract, and Kazakh financing and components will keep the program running. The first joint aircraft are already on the schedule."
 kaz_foreign.26.a: "The deal goes through"
 kaz_foreign.27.t: "Kyiv Declined the Aircraft Cooperation"
 kaz_foreign.27.d: "Kyiv has declined the aircraft cooperation. Antonov keeps its technology at home - the design bureau is not for sale, even to a friend."
 kaz_foreign.27.a: "Antonov keeps its drawings"
 kaz_foreign.28.t: "Kazakhstan Offers Logistics Hub Areas"
 kaz_foreign.28.d: "Astana offers to open the Kazakh market to our business: Ozon and Wildberries are ready to build warehouses and logistics hubs from the Caspian to the Altai, but an expansion of this scale is too heavy for private balance sheets alone. The government will have to chip in - subsidies, guarantees, co-financing. In exchange Moscow gets a foothold in a market hungry for cheap goods and fast delivery."
 kaz_foreign.28.a: "Subsidize the expansion"
 kaz_foreign.28.b: "Decline the proposal"
 kaz_foreign.29.t: "Moscow Accepted the Hub Deal"
 kaz_foreign.29.d: "Russian marketplaces are entering Kazakhstan, backed by Moscow's subsidies: warehouses rise outside Astana and Almaty, pickup points open in every district, and a parcel from Moscow now arrives faster than a letter from a neighbor. The goods are cheap, the delivery is fast, the reviews are five stars. Only the fine print on the invoice reminds us that every delivery also delivers a little more of Moscow's economic presence."
 kaz_foreign.29.a: "The hubs are open"
 kaz_foreign.30.t: "Moscow Refused the Hub Deal"
 kaz_foreign.30.d: "Moscow has declined to co-finance the hub expansion. Without government backing the marketplaces are not ready to invest in Kazakh logistics at this time - the warehouses remain on paper."
 kaz_foreign.30.a: "We will look for other partners"
 kaz_foreign.31.t: "The 'Technical Recalibration'"
 kaz_foreign.31.d: "A short note from Astana:\n'Transit of Ukrainian cargo via the Middle Corridor is suspended for technical recalibration.'\n\nWhat a remarkable coincidence: every Kazakh locomotive developed a fault on the same night, all Caspian ferries entered dry dock at once, and the transit slots evaporated without a trace. Astana's engineers must be the most thorough in the world - one inspection, and everything is broken. The 'recalibration' will last exactly as long as it takes our economy to learn to live without the corridor. We wish them a speedy repair. Somehow, we doubt it."
 kaz_foreign.31.a: "We will find another route"
 kaz_foreign.32.t: "Kazakhstan Proposes Joint Agro Development"
 kaz_foreign.32.d: "Astana proposes a joint agricultural development program with NIBULON: shared agro-industrial complexes, exchanged seed stocks and farming technology - their chernozem science for our dryland experience. Two breadbaskets grow stronger together; apart, they just feed their neighbors' competitors."
 kaz_foreign.32.a: "Sign the development program"
 kaz_foreign.32.b: "Decline the proposal"
 kaz_foreign.33.t: "Kyiv Accepted the Agro Development Program"
 kaz_foreign.33.d: "The program is signed: NIBULON's engineers and our agro-teams break ground on joint complexes, swapping elevator logistics for dryland farming techniques. Two breadbaskets, one development plan."
 kaz_foreign.33.a: "A shared harvest"
 kaz_foreign.34.t: "Kyiv Declined the Agro Development Program"
 kaz_foreign.34.d: "Kyiv has declined joint agro development. NIBULON keeps its technology at home, we keep our land to ourselves. Two breadbaskets, zero cooperation."
 kaz_foreign.34.a: "Their chernozem, their rules"
 kaz_foreign.35.t: "[FROM.GetName] Backs Our Sovereignty"
 kaz_foreign.35.d: "[FROM.GetName] has publicly declared support for our territorial integrity and the inviolability of our borders. When a country that itself knows what it means to sit between great powers says that borders matter, the world listens - and whoever is eyeing our lands hears it loudest of all.\n\n'Kazakhstan stands for the independence and territorial integrity of every nation. Borders are not lines on a map - they are the foundation of peace, and peace is what we all need most.' - [FROM.GetLeader]"
 kaz_foreign.35.a: "A friend who understands borders"
 kaz_foreign.36.t: "[FROM.GetName] Sends Humanitarian Aid"
 kaz_foreign.36.d: "The shipment from [FROM.GetName] has arrived: tens of tons of medicines and daily necessities for the regions that need them most. [FROM.GetName] publishes the manifests openly - helping our people endure is a matter of policy, and it is meant to be seen."
 kaz_foreign.36.a: "We will remember who stood with us"
 kaz_foreign.37.t: "Kazakh Military Aid Has Arrived"
 kaz_foreign.37.d: "Shipments of Kazakh weapons and a group of experienced military instructors have crossed the border and are now deployed in our territory. This timely reinforcement brings not only much-needed arms and spare parts but also valuable expertise in modern warfare. Their presence will bolster our defensive capabilities and boost the morale of our forces."
 kaz_foreign.37.a: "Welcome our Kazakh allies!"
 kaz_foreign.38.t: "[KAZ.GetName] Offers Volunteers"
 kaz_foreign.38.d: "[KAZ.GetName] has offered volunteer formations and military assistance for our war against Ukraine. Their fighters are gathering at staging points, the first shipments of equipment are being loaded, and their officers have pledged that the volunteers will serve under our operational command."
 kaz_foreign.38.a: "Accept the volunteers and the aid"
 kaz_foreign.38.b: "We do not need their help"
 kaz_foreign.39.t: "[FROM.GetName] Caught Funding the Separatists"
 kaz_foreign.39.d: "Our intelligence has gathered evidence that [FROM.GetName] has been channeling funds, equipment and advisors to the separatists in the Russian-speaking east. The documents leave little room for doubt, and its officials can no longer hide behind words of neutrality. The truth is out - and it will not be forgotten."
 kaz_foreign.39.a: "The world will hear of this"
 kaz_foreign.40.t: "[FROM.GetName] Nationalizes Our Assets"
 kaz_foreign.40.d: "[FROM.GetName] has nationalized our assets on its territory. The companies and investments we built over years have been seized overnight, and its officials offer no compensation. This is an open act of economic aggression, and it will not go unanswered."
 kaz_foreign.40.a: "We will remember this"
 kaz_foreign.41.t: "Memorandum for a Joint Technical University"
 kaz_foreign.41.d: "[FROM.GetLeader] has written to our government proposing a formal memorandum: to jointly create the Kazakhstan-British Technical University, a new institution in Almaty built to our engineering standards. The British Council will oversee construction and curriculum, ten specialized schools will teach from oil and gas to applied mathematics, and graduates will earn dual diplomas with the London School of Economics. 'The stone must be laid this year,' his letter reads. '[GetDateText] - let this day mark the beginning.'"
 kaz_foreign.41.a: "Sign the memorandum"
 kaz_foreign.41.b: "Decline the proposal"
 kaz_foreign.42.t: "The Memorandum is Signed"
 kaz_foreign.42.d: "Prime Minister [FROM.GetLeader] has signed the memorandum. British Council advisors will arrive in Almaty to oversee the construction of the Kazakhstan-British Technical University, and the framework for dual diplomas with the London School of Economics is in place. Ten schools will rise on the steppe - from oil and gas engineering to applied mathematics - and every graduate will carry a piece of British engineering tradition into our nation's future."
 kaz_foreign.42.a: "Construction begins"
 kaz_foreign.43.t: "The Memorandum is Not Signed"
 kaz_foreign.43.d: "Prime Minister [FROM.GetLeader] has politely declined our proposal, citing pressing matters at home. The memorandum remains unsigned, the stone will not be laid this year. The dream of a joint technical university must wait - perhaps when our friendship deepens, [FROM.GetName] will help us build it."
 kaz_foreign.43.a: "We will ask again"
 kaz_foreign.44.t: "EBRD Investments in [FROM.GetName]"
 kaz_foreign.44.d: "[FROM.GetName] has submitted a request for a major investment package through the European Bank for Reconstruction and Development. The proposal focuses on transport infrastructure, regional connectivity, and modernization of productive capacity across the country. Our representatives argue that a stable and prosperous [FROM.GetName] would strengthen Europe's economic presence in Central Asia, but the funds will not be cheap and the political signal will be clear."
 kaz_foreign.44.a: "Approve the investment package"
 kaz_foreign.44.b: "Decline the request"
 kaz_foreign.45.t: "EBRD Investments Approved"
 kaz_foreign.45.d: "[FROM.GetName] has approved our request for investment through the European Bank for Reconstruction and Development. New infrastructure projects will begin across the country, productivity programs will receive foreign financing, and European experts will arrive to supervise the first wave of modernization. For many in our government, this is proof that cooperation with Europe can bring concrete results."
 kaz_foreign.45.a: "Europe invests in our stability"
 kaz_foreign.46.t: "EBRD Investments Rejected"
 kaz_foreign.46.d: "[FROM.GetName] has declined our request for investment through the European Bank for Reconstruction and Development. The official explanation cites budgetary limits and risk concerns, but the message is clear enough: Europe is not ready to back our development when it matters. Eurosceptic voices at home will not miss the opportunity."
 kaz_foreign.46.a: "So much for European partnership"
 kaz_foreign.47.t: "Caspian Port Partnership"
 kaz_foreign.47.d: "[FROM.GetName] proposes a joint venture to expand the Caspian ports of Bautino and Prorva - the logistical backbone of the offshore oil fields. The shallow northern Caspian demands dredging, berms and canals that only our engineers know how to build. Our dredgers would deepen the approaches and raise the supply lines the Kashagan fields require, and in return our companies gain a foothold in one of the world's great oil plays. The contract is on the table."
 kaz_foreign.47.a: "Join the port venture"
 kaz_foreign.47.b: "Decline the proposal"
 kaz_foreign.48.t: "The Caspian Ports Rise"
 kaz_foreign.48.d: "[FROM.GetName] has joined the port venture. Dutch dredgers and engineers break ground at Bautino and Prorva: new berths for the shallow-draft tankers, storage for offshore cargo, and the supply lines the Kashagan fields require. The Caspian will carry our oil to the world."
 kaz_foreign.48.a: "The sea opens up"
 kaz_foreign.49.t: "The Port Venture Falls Through"
 kaz_foreign.49.d: "[FROM.GetName] has declined the port venture. Without their dredgers and capital, Bautino and Prorva remain modest harbors for now. The offshore fields will need another logistics partner."
 kaz_foreign.49.a: "We will build them ourselves someday"
 kaz_foreign.50.t: "A Dairy Partnership"
 kaz_foreign.50.d: "[FROM.GetName] proposes a food agreement: our dairy giant Lactalis would build a modern processing plant in North Kazakhstan, the heart of their milk belt and the country's leading region for commercial milk and processing. Our pasteurization lines, cheese-making expertise and European quality standards would meet their vast herds; in return, our companies gain access to one of the largest milk supplies in Central Asia. The contract would modernize their dairy sector and tie their farmers to our technology."
 kaz_foreign.50.a: "Sign the food agreement"
 kaz_foreign.50.b: "Decline the proposal"
 kaz_foreign.51.t: "Lactalis Comes to North Kazakhstan"
 kaz_foreign.51.d: "[FROM.GetName] has signed the food agreement. Lactalis engineers break ground in North Kazakhstan: pasteurization lines, cold storage and cheese vats rise among the herds of the region, turning our raw milk into products that meet European standards. The farms that lead the country in commercial milk now lead it in technology - and a piece of French savoir-faire takes root in our northern heartland."
 kaz_foreign.51.a: "Bon appétit"
 kaz_foreign.52.t: "The Dairy Deal Falls Through"
 kaz_foreign.52.d: "[FROM.GetName] has declined the food agreement. Without Lactalis, the herds of North Kazakhstan will keep sending milk to outdated facilities, and our cheese will stay a local craft. The French technology will go elsewhere; the country's leading milk region will wait for another partner."
 kaz_foreign.52.a: "Our milk, our problems"
 kaz_foreign.53.t: "Steppe Eagle: A Kazakh Proposal"
 kaz_foreign.53.d: "[FROM.GetName] proposes to start holding annual Steppe Eagle peacekeeping exercises on its training grounds, where our instructors would train their troops to NATO standards in peace support, checkpoint and crowd-control operations. In return we gain interoperability with a Central Asian partner and a foothold for our doctrine on the steppe. The Pentagon recommends acceptance; the question is political."
 kaz_foreign.53.a: "Agree to the annual exercises"
 kaz_foreign.53.b: "Decline the proposal"
 kaz_foreign.54.t: "Steppe Eagle Approved"
 kaz_foreign.54.d: "[FROM.GetName] has agreed to start holding annual Steppe Eagle exercises. American instructors will arrive at our training grounds each year to drill our peacekeepers in peace support, checkpoint and crowd-control operations, while our officers exchange doctrine with the 10th Mountain Division and the Arizona National Guard. The first exercise cycle begins now - and with it, our march toward NATO standards."
 kaz_foreign.54.a: "The eagles fly together"
 kaz_foreign.55.t: "Steppe Eagle Grounded"
 kaz_foreign.55.d: "[FROM.GetName] has declined our proposal to start holding annual Steppe Eagle exercises. Without American instructors and the NATO framework, our peacekeepers will train to their own standards for now. The dream of operating shoulder to shoulder with the Atlantic alliance must wait."
 kaz_foreign.55.a: "We will train alone, then"
 kaz_foreign.56.t: "Steppe Eagle Takes Flight"
 kaz_foreign.56.d: "[Root.GetName] and [From.GetName] have started holding the Steppe Eagle peacekeeping exercises annually. On the Iliysky range, peacekeepers drill alongside American instructors in peace support, checkpoint and crowd-control operations, with army aviation helicopters overhead. Observers note the exercises bind [Root.GetName] closer to NATO standards each year - a quiet but steady drift toward the Atlantic alliance."
 kaz_foreign.56.a: "The steppe will hear them"
 kaz_foreign.57.t: "Total Eren Proposes Wind Farms"
 kaz_foreign.57.d: "[FROM.GetName] proposes that our energy giant Total Eren build a network of wind and solar farms in its southern steppe - a region blessed with some of the strongest winds and brightest sun on the continent. Our turbines and solar panels would bring clean, cheap power to its grid and open a new frontier for our renewable energy companies. In return, [FROM.GetName] gains energy independence and a greener economy, while our firms secure a foothold in a fast-growing market. The wind and sun are calling."
 kaz_foreign.57.a: "Sign the wind farm cooperation"
 kaz_foreign.57.b: "Decline the proposal"
 kaz_foreign.58.t: "Total Eren Wind Farms Approved"
 kaz_foreign.58.d: "[FROM.GetName] has signed the wind farm cooperation. Total Eren's engineers break ground in our southern steppe: new energy plants rise in Turkistan and Jetisu, harnessing the strong winds and bright sun of the region to feed clean, cheap electricity into our grid. Our energy sector gains French technology and investment; our southern regions gain jobs and a path toward a greener economy."
 kaz_foreign.58.a: "Let the wind work for us"
 kaz_foreign.59.t: "The Wind Farm Deal Falls Through"
 kaz_foreign.59.d: "[FROM.GetName] has declined the wind farm cooperation. Without Total Eren, our southern steppe will keep blowing its winds unused, and our grid will stay dependent on older fuels. The renewable future will have to wait for another partner."
 kaz_foreign.59.a: "Our wind, our problems"
 kaz_foreign.60.t: "Green Hydrogen: A Kazakh Proposal"
 kaz_foreign.60.d: "[FROM.GetName] proposes a green hydrogen partnership: our industry would gain a steady supply of clean fuel from their vast renewable energy fields, while their grid gains our investment and technology. For our factories hungry for decarbonization, this is a lifeline; for them, a foothold in the European energy market. The contract would bind our energy futures together for years to come."
 kaz_foreign.60.a: "Sign the hydrogen partnership"
 kaz_foreign.60.b: "Decline the proposal"
 kaz_foreign.61.t: "Green Hydrogen Partnership Approved"
 kaz_foreign.61.d: "[FROM.GetName] has signed the green hydrogen partnership. German investment and technology will flow into our renewable energy sector, and our green hydrogen will find its way to European factories. Our grid grows cleaner, our economy gains a new export, and our partnership with [FROM.GetName] deepens into a strategic energy alliance."
 kaz_foreign.61.a: "The future runs on hydrogen"
 kaz_foreign.62.t: "The Hydrogen Deal Falls Through"
 kaz_foreign.62.d: "[FROM.GetName] has declined the green hydrogen partnership. Without German investment, our renewable energy sector will grow slower, and our hydrogen will have to find other markets. The European energy market will have to wait for another supplier."
 kaz_foreign.62.a: "Our hydrogen, our problems"
 kaz_foreign.63.t: "Polpharma Partnership Proposal"
 kaz_foreign.63.d: "[FROM.GetName] proposes a pharmaceutical partnership: they wish to purchase our latest medical technologies and licensing rights from Polpharma. Our company gains a reliable buyer in the growing Central Asian market, while [FROM.GetName] gains access to modern production methods and formulations that will strengthen their healthcare system. The deal opens new opportunities for our pharmaceutical industry and deepens our economic ties."
 kaz_foreign.63.a: "Sign the partnership"
 kaz_foreign.63.b: "Decline the proposal"
 kaz_foreign.64.t: "Polpharma Partnership Approved"
 kaz_foreign.64.d: "[FROM.GetName] has signed the Polpharma partnership. We have acquired licensing rights to modern Polish pharmaceutical technologies, giving our industry access to advanced production methods and new formulations. Our healthcare system will benefit from improved medicines, our specialists gain valuable expertise, and our economic ties with [FROM.GetName] grow stronger."
 kaz_foreign.64.a: "A healthier future"
 kaz_foreign.65.t: "The Polpharma Deal Falls Through"
 kaz_foreign.65.d: "[FROM.GetName] has declined the Polpharma partnership. Without access to Polish pharmaceutical technologies, our industry will have to modernize on its own, and our people will wait longer for improved medicines."
 kaz_foreign.65.a: "We will manage on our own"
 kaz_foreign.66.t: "Wabtec Locomotives Proposal"
 kaz_foreign.66.d: "[FROM.GetName] invites our Wabtec to build a locomotive assembly plant in their capital and modernize their rail network. Our company would invest in their infrastructure, bringing American engineering and high-speed rail technology to the steppe. In return, Wabtec gains a foothold in the growing Central Asian market, and our investors profit from one of the largest rail contracts in the region. The deal would deepen our economic ties and open new opportunities for our locomotive industry."
 kaz_foreign.66.a: "Back the Wabtec investment"
 kaz_foreign.66.b: "Decline the proposal"
 kaz_foreign.67.t: "Wabtec Locomotives Approved"
 kaz_foreign.67.d: "[FROM.GetName] has approved the Wabtec investment. American engineers will build a locomotive assembly plant in our capital, Lokomotiv Kurastyru Zauyty, and share their high-speed rail technology with us. Our rail network will be modernized, our capital gains new industry and jobs, and our engineers master a generation of know-how. Our ties with [FROM.GetName] grow stronger."
 kaz_foreign.67.a: "A modern railway for the steppe"
 kaz_foreign.68.t: "The Wabtec Deal Falls Through"
 kaz_foreign.68.d: "[FROM.GetName] has declined to back the Wabtec investment. Without American engineering and capital, our rail network will have to modernize on its own, and our dream of high-speed rail will wait for another partner."
 kaz_foreign.68.a: "We will build it ourselves someday"
 kaz_foreign.69.t: "Airbus Space Partnership Proposal"
 kaz_foreign.69.d: "[FROM.GetName] proposes a space partnership: they wish to acquire our latest observation satellite technology and establish a joint spacecraft assembly center in their capital. Our aerospace company gains a major contract in the growing Central Asian market, while [FROM.GetName] launches its own earth observation satellites and builds a domestic space industry. The deal strengthens our economic ties and opens new frontiers for our aerospace sector."
 kaz_foreign.69.a: "Sign the partnership"
 kaz_foreign.69.b: "Decline the proposal"
 kaz_foreign.70.t: "Airbus Space Partnership Approved"
 kaz_foreign.70.d: "[FROM.GetName] has signed the Airbus space partnership. French satellite technology will soon be assembled in our capital, giving us our own earth observation satellites and a domestic space industry. Our scientists gain valuable expertise, our research accelerates, and our economic ties with [FROM.GetName] grow stronger."
 kaz_foreign.70.a: "A new space age"
 kaz_foreign.71.t: "The Airbus Space Deal Falls Through"
 kaz_foreign.71.d: "[FROM.GetName] has declined the Airbus space partnership. Without French satellite technology, our space program will have to develop on its own, and our ambitions for a domestic space industry will wait longer."
 kaz_foreign.71.a: "We will reach the stars on our own someday"
 kaz_foreign.72.t: "Starlink and AWS Digital Partnership Proposal"
 kaz_foreign.72.d: "[FROM.GetName] proposes a three-year digital partnership contract: they wish to deploy our Starlink satellite internet and AWS cloud computing across their territory. Our companies gain a major contract in the growing Central Asian market, while [FROM.GetName] modernizes its digital infrastructure and connects its citizens to the global internet. The deal strengthens our economic ties and opens new frontiers for our tech industry."
 kaz_foreign.72.a: "Sign the three-year contract"
 kaz_foreign.72.b: "Decline the proposal"
 kaz_foreign.73.t: "Starlink and AWS Digital Partnership Approved"
 kaz_foreign.73.d: "[FROM.GetName] has signed the three-year digital partnership contract. American satellite internet and cloud computing will soon be deployed across our territory, connecting our citizens and modernizing our digital infrastructure. Our scientists gain valuable expertise, our research accelerates, and our economic ties with [FROM.GetName] grow stronger."
 kaz_foreign.73.a: "A connected future"
 kaz_foreign.74.t: "The Starlink and AWS Deal Falls Through"
 kaz_foreign.74.d: "[FROM.GetName] has declined the three-year digital partnership contract. Without American satellite internet and cloud computing, our digital infrastructure will have to develop on its own, and our dream of a connected nation will wait longer."
 kaz_foreign.74.a: "We will build it ourselves someday"
 kaz_foreign.75.t: "A Kazakh Military Request"
 kaz_foreign.75.d: "The government of [FROM.GetName] has approached Prague with a request: they wish to purchase Aero Vodochody trainer aircraft for their air force and obtain a production license for our CZ rifles, to be manufactured in their factories. For our defense industry this is a major contract in the growing Central Asian market; for [FROM.GetName], a path to modernize their pilots' training and standardize their infantry to our proven designs. The deal would deepen our strategic ties and open new markets for our arms exports."
 kaz_foreign.75.a: "Sign the cooperation"
 kaz_foreign.75.b: "Decline the proposal"
 kaz_foreign.76.t: "Czech Military Cooperation Approved"
 kaz_foreign.76.d: "[FROM.GetName] has agreed to the military cooperation. Aero Vodochody trainer aircraft will soon sharpen our pilots' skills, and our factories receive the license to produce CZ rifles at home, standardizing our infantry to a proven NATO-compatible design. Our military gains valuable expertise, and our strategic ties with [FROM.GetName] grow stronger."
 kaz_foreign.76.a: "A sharper military"
 kaz_foreign.77.t: "The Czech Military Deal Falls Through"
 kaz_foreign.77.d: "[FROM.GetName] has declined our request for military cooperation. Without Czech trainer aircraft and the CZ rifle license, our military will have to modernize on its own, and our pilots and infantry will wait longer for modern equipment."
 kaz_foreign.77.a: "We will manage on our own"
 kaz_foreign.78.t: "A Kazakh Request for Turkish Drones"
 kaz_foreign.78.d: "[Root.Capital.GetName] received a request from [FROM.GetName]: they wish to purchase a batch of our Bayraktar combat drones and kamikaze UAVs, along with the training and technology to operate them. For our defense industry this is a major export contract in the growing Central Asian market; for [FROM.GetName], a path to modernize their reconnaissance and strike capabilities with battle-proven systems. The deal would deepen our strategic ties and open new markets for our arms exports."
 kaz_foreign.78.a: "Sign the drone deal"
 kaz_foreign.78.b: "Decline the proposal"
 kaz_foreign.79.t: "Turkish Drone Purchase Approved"
 kaz_foreign.79.d: "[FROM.Capital.GetName] has agreed to the drone deal. A batch of battle-proven Bayraktar and kamikaze drones will soon join our arsenal, and our engineers receive the training and technology to operate and maintain them. Our reconnaissance and strike capabilities grow sharply, and our strategic ties with [FROM.GetName] grow stronger."
 kaz_foreign.79.a: "Eyes in the sky"
 kaz_foreign.80.t: "The Turkish Drone Deal Falls Through"
 kaz_foreign.80.d: "[FROM.Capital.GetName] has declined our request for drones. Without Turkish UAVs and drone technology, our reconnaissance and strike capabilities will have to develop on our own, and our military will wait longer for battle-proven systems."
 kaz_foreign.80.a: "We will build our own wings someday"
 kaz_foreign.81.t: "Kazakhstan Affirms the One-China Principle"
 kaz_foreign.81.d: "The government of [FROM.GetName] has formally reaffirmed its adherence to the One-China principle, recognizing Taiwan as an inalienable part of [Root.GetName] and opposing any form of independence. This principled stance strengthens our strategic partnership and opens the door to deeper economic and political cooperation with [FROM.GetName]. We appreciate their support on this core issue."
 kaz_foreign.81.a: "A valued partner in Central Asia"
 kaz_foreign.82.t: "A Kazakh Proposal for a Kia Plant"
 kaz_foreign.82.d: "[Root.Capital.GetName] has received a proposal from [FROM.GetName]: their government invites our Kia to raise an automobile assembly plant in Kostanay. For our automotive industry this is a gateway to the vast Central Asian market; for [FROM.GetName], a chance to build a domestic car industry with Korean technology, bringing jobs and modern manufacturing to their northern steppe. The contract would tie our economies together for years to come."
 kaz_foreign.82.a: "Back the Kia investment"
 kaz_foreign.82.b: "Decline the proposal"
 kaz_foreign.83.t: "Kia Automobile Plant Approved"
 kaz_foreign.83.d: "[FROM.Capital.GetName] has approved the Kia investment. A modern automobile assembly plant will rise in Kostanay, rolling Korean-designed cars off the line for our market and beyond. Our workers gain thousands of jobs, our engineers master advanced manufacturing, and the northern steppe gains a new industrial heart. Our economic ties with [FROM.GetName] deepen into a lasting partnership."
 kaz_foreign.83.a: "Cars for the steppe"
 kaz_foreign.84.t: "The Kia Plant Deal Falls Through"
 kaz_foreign.84.d: "[FROM.Capital.GetName] has declined to back the Kia investment. Without Korean capital and technology, Kostanay will not see its automobile plant, and our dream of a domestic car industry will wait for another partner."
 kaz_foreign.84.a: "We will build it ourselves someday"
 kaz_foreign.85.t: "A Kazakh Proposal for Smart City Cooperation"
 kaz_foreign.85.d: "[FROM.GetName] invites our companies to deploy smart-city systems in its capital - intelligent traffic management, IoT sensors and unified digital services. Our firms would lead the implementation and gain a long-term foothold in the Central Asian digital market."
 kaz_foreign.85.a: "Deploy our specialists"
 kaz_foreign.85.b: "Decline the proposal"
 kaz_foreign.86.t: "Smart City Partnership Approved"
 kaz_foreign.86.d: "[FROM.GetName] has agreed to join the smart-city program. Korean engineers are arriving to install the systems and train our staff, while our budget covers the local works. [Root.Capital.GetName] is about to become the most connected city in the region."
 kaz_foreign.86.a: "A connected future"
 kaz_foreign.87.t: "A Kazakh Proposal for a Food Security Partnership"
 kaz_foreign.87.d: "[FROM.GetName] offers a food-security pact: our sovereign funds would finance their agro expansion and build agro-complexes on their soil, and in return we gain priority access to their grain - a hedge against global shortages."
 kaz_foreign.87.a: "Fund the Kazakh agro sector"
 kaz_foreign.87.b: "Decline the proposal"
 kaz_foreign.88.t: "Food Security Partnership Approved"
 kaz_foreign.88.d: "[FROM.GetName] has agreed. Emirati capital flows into our farms, and together we are building agro-complexes across Kazakhstan. Should a grain crisis strike, the contract lets us sell at a premium - turning a world shortage into our profit."
 kaz_foreign.88.a: "Granaries and capital"
 kaz_foreign.89.t: "The Grain Crisis, Turned to Profit"
 kaz_foreign.89.d: "When the world grain market collapsed, our pact with [UAE.GetName] activated. We fulfilled the contract at premium prices - the shortage bypassed our shelves, and the deal is now concluded."
 kaz_foreign.89.a: "A crisis is an opportunity"
 kaz_foreign.91.t: "[FROM.GetName] Proposes a Pharmaceutical Partnership"
 kaz_foreign.91.d: "[FROM.GetName] invites our pharmaceutical companies to build a production cluster and R&D center on its soil. For four years, our specialists would work alongside their scientists, transferring generics technology and biotech expertise. Our companies gain a foothold in Central Asia, while [FROM.GetName] reduces its dependence on Western drugmakers - a deal written in shared ambition."
 kaz_foreign.91.a: "Send our specialists and capital"
 kaz_foreign.91.b: "Decline the proposal"
 kaz_foreign.92.t: "Pharmaceutical Partnership Approved"
 kaz_foreign.92.d: "[FROM.GetName] has agreed. For the next four years, Indian engineers and pharmacologists will work alongside our scientists, raising a generics plant and research hub. Life-saving medicines will soon carry the mark of our own factories, and our researchers will master biotechnology at the source. When the active phase concludes, the knowledge and infrastructure will remain ours."
 kaz_foreign.92.a: "The pharmacy of Central Asia"
 kaz_foreign.93.t: "A Kazakh Proposal for Logistics Infrastructure"
 kaz_foreign.93.d: "[FROM.GetName] invites Temasek-backed logistics developers, including PSA International and CapitaLand, to construct state-of-the-art Class A warehouses on its territory. This partnership will help [FROM.GetName] eliminate its warehouse deficit, streamline Eurasian transit, and adopt Singaporean standards of supply chain efficiency."
 kaz_foreign.93.a: "Invest in the Central Asian hub"
 kaz_foreign.93.b: "Decline the proposal"
 kaz_foreign.94.t: "Logistics Partnership Approved"
 kaz_foreign.94.d: "[FROM.GetName] has agreed. Engineers from PSA International and CapitaLand are arriving to design and build modern distribution centers. For the next three years, they will transfer their expertise in supply chain management to our specialists, leaving behind world-class infrastructure that will serve the region for decades."
 kaz_foreign.94.a: "Building the future of transit"
 kaz_foreign.95.t: "A Kazakh Proposal for a Joint Innovation Fund"
 kaz_foreign.95.d: "[FROM.GetName] proposes expanding our bilateral portfolio through a joint investment fund backed by the Oman Investment Authority. This initiative will finance high-growth projects in artificial intelligence, healthcare, and agriculture, while establishing a shared R&D infrastructure."
 kaz_foreign.95.a: "Fund the next generation of innovation"
 kaz_foreign.95.b: "Decline the proposal"
 kaz_foreign.96.t: "Joint Innovation Fund Approved"
 kaz_foreign.96.d: "[FROM.GetName] has agreed. The joint fund is now operational. Omani venture capital will co-finance our most promising AI and healthcare startups, and a new joint research facility will be established to accelerate technology transfer and scaling."
 kaz_foreign.96.a: "Building the future of Central Asian tech"
 kaz_foreign.95.t: "A Kazakh Proposal for a Joint Innovation Fund"
 kaz_foreign.95.d: "[FROM.GetName] proposes expanding our bilateral portfolio through a joint investment fund backed by the Oman Investment Authority. This initiative will finance high-growth projects in artificial intelligence, healthcare, and agriculture, while establishing a shared R&D infrastructure."
 kaz_foreign.95.a: "Fund the next generation of innovation"
 kaz_foreign.95.b: "Decline the proposal"
 kaz_foreign.96.t: "Joint Innovation Fund Approved"
 kaz_foreign.96.d: "[FROM.GetName] has agreed. The joint fund is now operational. Omani venture capital will co-finance our most promising AI and healthcare startups, and a new joint research facility will be established to accelerate technology transfer and scaling."
 kaz_foreign.96.a: "Building the future of Central Asian tech"
 kaz_foreign.97.t: "A Kazakh Proposal for Strategic Investment"
 kaz_foreign.97.d: "[FROM.GetName] invites the Qatar Investment Authority to participate in large-scale projects across our gas chemistry and petrochemical sectors. This partnership will bring long-term capital, advanced technology, and access to Middle Eastern markets."
 kaz_foreign.97.a: "Fund the Kazakh industrial boom"
 kaz_foreign.97.b: "Decline the proposal"
 kaz_foreign.98.t: "Strategic Investment Deal Approved"
 kaz_foreign.98.d: "[FROM.GetName] has agreed. Qatari sovereign capital is now flowing into our gas chemistry plants and petrochemical complexes. Thousands of new jobs will be created, and our researchers will gain access to cutting-edge refining technologies."
 kaz_foreign.98.a: "A new era of industrial growth"
 kaz_foreign.99.t: "A Kazakh Proposal for Green Power Development"
 kaz_foreign.99.d: "[FROM.GetName] invites ACWA Power to co-develop a 1 GW wind farm with battery energy storage systems in the Zhetysu region. This $9 billion project represents our largest step toward green energy independence, while bringing advanced renewable technologies and significant foreign investment."
 kaz_foreign.99.a: "Invest in Central Asia's green future"
 kaz_foreign.99.b: "Decline the proposal"
 kaz_foreign.100.t: "Green Power Deal Approved"
 kaz_foreign.100.d: "[FROM.GetName] has agreed. Saudi capital totaling $9 billion is now flowing into our renewable energy sector. We will construct a state-of-the-art wind farm with integrated battery storage in the Zhetysu region, while our engineers master cutting-edge green energy technologies."
 kaz_foreign.100.a: "Powering the future with clean energy"
 kaz_foreign.101.t: "CICA Summit Convenes"
 kaz_foreign.101.d: "Our capital has once again become the center of Asian diplomacy as the Conference on Interaction and Confidence-Building Measures in Asia (CICA) convenes its latest summit. Delegates from across the continent are gathering to discuss security, trade, and regional cooperation, reaffirming our country's role as a neutral broker in Asian affairs."
 kaz_foreign.101.a: "A diplomatic triumph"
 kaz_foreign.102.t: "Shymkent Refinery Expansion Proposal"
 kaz_foreign.102.d: "[FROM.GetName] invites CNPC to co-develop a major expansion of the Shymkent oil refinery. The project would add two new refinery units and raise its output of Euro-5 gasoline, diesel and aviation kerosene, while giving Chinese refining technology a foothold in the region."
 kaz_foreign.102.a: "Invest in our energy future"
 kaz_foreign.102.b: "Decline the proposal"
 kaz_foreign.103.t: "Chinese Partnership Approved"
 kaz_foreign.103.d: "[FROM.GetName] has agreed. Chinese capital is now flowing into our country, bringing new infrastructure, technologies, and opportunities for growth."
 kaz_foreign.103.a: "A new chapter of cooperation"
 kaz_foreign.104.t: "Aiju Agroparks Proposal"
 kaz_foreign.104.d: "[FROM.GetName] invites Aiju to co-develop a major agricultural processing park in Northern Kazakhstan. The project would build modern agro-industrial complexes with grain logistics and processing facilities, boosting its agricultural exports and opening a new market for Chinese agro-technology and processing expertise."
 kaz_foreign.104.a: "Invest in our agricultural future"
 kaz_foreign.104.b: "Decline the proposal"
 kaz_foreign.105.t: "Zhanazhol Gas Plant Modernization Proposal"
 kaz_foreign.105.d: "[FROM.GetName] invites CNPC to co-develop a major modernization of the Zhanazhol gas processing plant. The project would process raw gas from the Urikhtau field, significantly increasing its gas extraction and processing capacity while eliminating associated gas flaring and reducing environmental impact."
 kaz_foreign.105.a: "Invest in our energy future"
 kaz_foreign.105.b: "Decline the proposal"
 kaz_foreign.106.t: "JAC Motors Plant Proposal"
 kaz_foreign.106.d: "[FROM.GetName] invites JAC Motors to co-develop a modern automotive manufacturing facility in the Kostanay region. The project would establish new production capacity and boost its industrial output, bringing advanced Chinese vehicle manufacturing technologies and supply chain expertise to a new market."
 kaz_foreign.106.a: "Invest in our automotive future"
 kaz_foreign.106.b: "Decline the proposal"
 kaz_foreign.107.t: "Lovol Tractors Plant Proposal"
 kaz_foreign.107.d: "[FROM.GetName] invites Lovol to co-develop a modern agricultural machinery plant in the Kostanay region. The project would establish new production capacity for tractors and combine harvesters, boosting its industrial output and bringing advanced Chinese agricultural machinery technologies and supply chain expertise to a new market."
 kaz_foreign.107.a: "Invest in our agricultural machinery future"
 kaz_foreign.107.b: "Decline the proposal"
 kaz_foreign.108.t: "Zhanatas Wind Power Proposal"
 kaz_foreign.108.d: "[FROM.GetName] proposes a joint venture to build a state-of-the-art wind power plant in the Zhambyl region. The project would upgrade its regional energy infrastructure, supply clean electricity to a growing industrial sector and significantly reduce the country's carbon footprint."
 kaz_foreign.108.a: "Embrace the green energy future"
 kaz_foreign.108.b: "Decline the proposal"
 kaz_foreign.109.t: "Huawei Infrastructure Proposal"
 kaz_foreign.109.d: "[FROM.GetName] invites Huawei to co-develop advanced digital infrastructure in its major cities. The project would deploy state-of-the-art internet stations across its urban centres, significantly boosting digital capabilities and positioning the country as a technology hub in Central Asia."
 kaz_foreign.109.a: "Embrace the digital future"
 kaz_foreign.109.b: "Decline the proposal"
 kaz_foreign.110.t: "Jibek Joly Steel Plant Proposal"
 kaz_foreign.110.d: "[FROM.GetName] invites Fujian Hengwang Investment to construct a state-of-the-art steel plant in the Jibek Joly Special Economic Zone. This $7.5 billion project will significantly boost their steel production capacity, providing essential materials for their domestic manufacturing and export."
 kaz_foreign.110.a: "Invest in their industrial backbone"
 kaz_foreign.110.b: "Decline the proposal"
 kaz_foreign.111.t: "Copper Smelter in Abay Proposal"
 kaz_foreign.111.d: "[FROM.GetName] invites our companies to construct a state-of-the-art copper smelting plant in the Abay region. This project will significantly boost their non-ferrous metal production capacity, allowing them to process raw concentrates locally and providing essential materials for their domestic manufacturing."
 kaz_foreign.111.a: "Invest in Kazakhstan's metallurgy"
 kaz_foreign.111.b: "Decline the proposal"
 kaz_foreign.112.t: "CITIC Fertilizer Plants Proposal"
 kaz_foreign.112.d: "[FROM.GetName] invites CITIC Group to construct state-of-the-art fertilizer production facilities in the Almaty region. This project will significantly boost their agricultural productivity by providing domestic fertilizer supplies, supporting their goal of achieving full self-sufficiency in mineral fertilizers."
 kaz_foreign.112.a: "Secure their agricultural future"
 kaz_foreign.112.b: "Decline the proposal"
 kaz_foreign.113.t: "Aktau Port Modernization Proposal"
 kaz_foreign.113.d: "[FROM.GetName] invites our logistics and construction companies to co-develop a major expansion of the Aktau seaport. This project will build new container terminals and upgrade port infrastructure, significantly boosting their cargo throughput and strengthening the Middle Corridor trade route."
 kaz_foreign.113.a: "Expand the Middle Corridor"
 kaz_foreign.113.b: "Decline the proposal"
 kaz_foreign.114.t: "Hengtong Data Centers Proposal"
 kaz_foreign.114.d: "[FROM.GetName] invites Hengtong Group to construct modern data center facilities in their capital and largest city. This project will provide the fiber-optic infrastructure and computing power needed to support their growing digital economy and position them as a Central Asian technology hub."
 kaz_foreign.114.a: "Build the digital backbone"
 kaz_foreign.114.b: "Decline the proposal"
 kaz_foreign.115.t: "Kazakhstan Renegotiates Strategic Partnership"
 kaz_foreign.115.d: "[FROM.GetNameDef] has unilaterally revised the terms of our strategic partnership, removing clauses that granted us political influence over their domestic affairs. While the economic cooperation remains intact, this is a clear signal that [FROM.GetCapital] intends to assert greater sovereignty. We invested billions in their infrastructure — should we demand compensation?"
 kaz_foreign.115.a: "Demand repayment for our investments"
 kaz_foreign.115.b: "Accept the new terms and move forward"
 kaz_foreign.116.t: "China Demands Investment Repayment"
 kaz_foreign.116.d: "[CHI.GetNameDef] has responded to our renegotiation by demanding $40 billion in compensation for their infrastructure investments. They argue that the original partnership terms justified their political influence, and our unilateral revision constitutes a breach of trust. How should we respond?"
 kaz_foreign.116.a: "Pay the demanded amount"
 kaz_foreign.116.b: "Refuse - we owe them nothing"
 kaz_foreign.117.t: "[FROM.GetNameDef] Refuses to Pay"
 kaz_foreign.117.d: "[FROM.GetCapital] has flatly refused our demand for investment repayment, calling it an affront to their sovereignty. This is unacceptable. We have poured billions into their economy, built their ports, factories, and data centers. If they will not honor their obligations, we must consider our next steps carefully."
 kaz_foreign.117.a: "Consider imposing sanctions"
 kaz_foreign.118.t: "Kazakhstan Proposes Best Friendship"
 kaz_foreign.118.d: "[FROM.GetNameDef] has formally proposed to elevate our strategic partnership to a comprehensive friendship. They have been a reliable partner in our infrastructure investments and share our vision for a prosperous Central Asia. Should we accept their proposal?"
 kaz_foreign.118.a: "Welcome our Kazakh friends with open arms"
 kaz_foreign.118.b: "Maintain our current partnership"
 kaz_foreign.118.t: "Kazakhstan Proposes Best Friendship"
 kaz_foreign.118.d: "[FROM.GetNameDef] has formally proposed to elevate our strategic partnership to a comprehensive friendship. They have been a reliable partner in our infrastructure investments and share our vision for a prosperous Central Asia. Should we accept their proposal?"
 kaz_foreign.118.a: "Welcome our Kazakh friends with open arms"
 kaz_foreign.118.b: "Politely decline the proposal"
 kaz_foreign.119.t: "China Accepts Best Friendship"
 kaz_foreign.119.d: "Beijing has joyfully accepted our proposal for a comprehensive friendship! This marks a historic moment in Kazakhstan-China relations. Our nations will now work together as true partners, sharing prosperity, technology, and cultural exchange for generations to come."
 kaz_foreign.119.a: "A new era of friendship begins!"
 kaz_foreign.120.t: "Anti-China Protests in Kazakhstan"
 kaz_foreign.120.d: "Massive protests have erupted across Kazakhstan against our deep cooperation with China. Citizens are concerned about the lease of agricultural land to Chinese companies, the construction of Chinese factories, and growing debt to Beijing. Protesters in Nur-Sultan, Almaty, and Zhanaozen are demanding an end to what they call 'Chinese expansionism' and are calling for the protection of our national sovereignty."
 kaz_foreign.120.a: "Acknowledge the public concerns"

 #Foreign Policy Ideas
 KAZ_BLR_agro_modernization_idea: "Joint Kazakh-Belarusian Agro-Modernization Program"
 KAZ_BLR_agro_modernization_idea_desc: "A joint Kazakh-Belarusian modernization of the agro-industrial complex: shared machinery lines, seed stocks and engineering teams. Belarusian equipment and Kazakh fields work as one, speeding up the development of our agricultural technologies."
 KAZ_csto_counter_terrorism_shield_idea: "CSTO Counter-Terrorism Shield"
 KAZ_csto_counter_terrorism_shield_idea_desc: "A joint counter-terrorism program built on the Kazakh initiative: shared intelligence, coordinated border security and joint rapid-response units. Salafist cells find it harder to recruit, finance and operate across the member states."
 KAZ_tmtm_blockade_idea: "TMTM Route Blocked"
 KAZ_tmtm_blockade_idea_desc: "Kazakhstan has closed the Middle Corridor to our cargo, citing a 'technical recalibration'. Resource exports are strangled, fuel flows are down, consumer goods are pricier, and every shortage bites harder than before."
 KAZ_humanitarian_aid_idea: "Kazakh Humanitarian Aid"
 KAZ_humanitarian_aid_idea_desc: "Relief convoys keep the medicine and supplies coming."
 KAZ_volunteer_support_idea: "Kazakh Volunteers"
 KAZ_volunteer_support_idea_desc: "Volunteer formations fight under our operational command. Their fighters know the equipment, their officers know the war, and their presence reminds our troops that this fight is watched far beyond our borders."
 KAZ_british_university_idea: "Kazakhstan-British Technical University"
 KAZ_british_university_idea_desc: "KBTU - Kazakhstan's only technical university with ABET accreditation for all computer programs and IMarEST recognition for engineering. Home to ten specialized schools from oil and gas to applied mathematics, the university awards dual diplomas with the London School of Economics and partners with Harvard Business School's Center for Strategy and Competitiveness. British professors and Kazakh students work side by side, forging engineers and scientists who speak the same technical language as their peers in London and Cambridge."
 KAZ_german_green_hydrogen: "Green Hydrogen Partnership"
 KAZ_german_green_hydrogen_desc: "A joint green hydrogen program with Germany boosts our renewable energy sector and gives both nations access to clean fuel and advanced technology."
 KAZ_polpharma_agreement_idea: "Polpharma Partnership"
 KAZ_polpharma_agreement_idea_desc: "Licensed Polish pharmaceutical technologies modernize our industry, improving public health and strengthening our healthcare system."
 KAZ_airbus_space_agreement_idea: "Airbus Space Partnership"
 KAZ_airbus_space_agreement_idea_desc: "French satellite technology and aerospace expertise accelerate our research and jump-start our domestic space industry."
 KAZ_starlink_aws_cooperation_idea: "Starlink and AWS Partnership"
 KAZ_starlink_aws_cooperation_idea_desc: "A three-year American contract brings satellite internet and cloud computing to our territory: our research accelerates, our cryptographers gain AWS computing power, our troops coordinate through Starlink, and our citizens enjoy a connected, stable digital society."
 KAZ_korea_smart_city_idea: "Korean Smart City Partnership"
 KAZ_korea_smart_city_idea_desc: "Korean specialists are deploying smart-city systems and training our engineers. Once the technology is transferred, the active cooperation phase will end - but the infrastructure and expertise will remain ours."
 KAZ_uae_food_partnership_idea: "Emirati Food Partnership"
 KAZ_uae_food_partnership_idea_desc: "Emirati capital is expanding our agro sector in exchange for priority grain supplies. If a grain crisis strikes, the contract will be fulfilled at premium prices - shielding our economy and turning a world shortage into our profit."
 KAZ_grain_crisis_exploited_idea: "Exploited the Grain Crisis"
 KAZ_grain_crisis_exploited_idea_desc: "While the world faced empty shelves, our granaries overflowed. Premium grain exports turned a global shortage into a windfall - our farms run at full capacity and the population is well fed."
 KAZ_india_pharma_rnd_idea: "Indo-Kazakh Pharma Cluster"
 KAZ_india_pharma_rnd_idea_desc: "With Indian capital and expertise, a generics plant and biotech R&D center are taking root in Kazakhstan. Affordable medicines, localized production and technology transfer are turning us into the region's pharmaceutical hub."
 KAZ_india_pharma_rnd_idea: "Indo-Kazakh Pharma Partnership"
 KAZ_india_pharma_rnd_idea_desc: "A four-year active partnership with Indian pharmaceutical giants. Specialists are transferring generics technology and biotech expertise, ensuring direct knowledge transfer to our scientists."
 KAZ_singapore_logistics_idea: "Temasek Logistics Partnership"
 KAZ_singapore_logistics_idea_desc: "A three-year active partnership with Temasek-backed logistics developers (PSA International, CapitaLand). Class A warehouses are being built, and our specialists are learning world-class supply chain management from their experts."
 KAZ_qatar_gas_chemistry_alliance_idea: "Qatar Gas Chemistry Alliance"
 KAZ_qatar_gas_chemistry_alliance_idea_desc: "A sovereign fund partnership with the Qatar Investment Authority. Qatari capital is fueling our gas chemistry and petrochemical sectors, protecting jobs and accelerating research in oil refining."
 KAZ_cica_host_idea: "CICA Secretariat Host"
 KAZ_cica_host_idea_desc: "Hosting the CICA Secretariat brings significant diplomatic weight and facilitates smoother trade negotiations with Asian and Middle Eastern partners, though it requires constant political attention."
 KAZ_strategic_partnership_china_idea: "Comprehensive Strategic Partnership with [CHI.Flag]Chine"
 KAZ_strategic_partnership_china_idea_desc: "Our adherence to the One-China Principle has established a foundation of mutual political trust with Beijing. This translates into tangible benefits: priority access to Chinese infrastructure loans, accelerated construction by joint-venture contractors, and a steady influx of affordable goods. However, this deep economic integration also means growing Chinese influence over our domestic politics and reduced autonomy in foreign policy decisions."
 KAZ_strategic_partnership_china1_idea: "Sovereign Partnership with China"
 KAZ_strategic_partnership_china1_idea_desc: "Our partnership with China is now built on mutual respect and equal benefit. We maintain strong economic cooperation while preserving our political sovereignty. Beijing no longer holds influence over our domestic affairs, and our foreign policy remains independent."
 KAZ_lovol_tractor_idea: "Lovol Tractor Production"
 KAZ_citic_fertilizer_idea: "CITIC Fertilizer Production"
 KAZ_hengtong_data_idea: "Hengtong Digital Infrastructure"

