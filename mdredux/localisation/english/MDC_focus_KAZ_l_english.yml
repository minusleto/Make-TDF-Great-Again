 KAZ_tok_new_era: "New Era with Kassym-Jomart Tokayev"
 KAZ_tok_new_era_desc: "After winning the presidential election, Kassym-Jomart Tokayev is officially inaugurated. This marks the beginning of a new political era for Kazakhstan as the nation watches closely while the new president outlines his vision for the future."
 KAZ_tok_capital: "Capital Nur-Sultan"
 KAZ_tok_capital_desc: "The capital is officially moved to the Astana region, and the city of Astana is renamed Nur-Sultan. This symbolic act signals a fresh start and a new chapter in the nation's history."
 KAZ_tok_foreign_visits: "Foreign Visits"
 KAZ_tok_foreign_visits_desc: "The President embarks on a diplomatic tour, visiting key partner nations including Russia, China, Japan, South Korea, Germany, France, the UK, and the USA. These visits strengthen international relations and open new opportunities for cooperation."
 KAZ_tok_national_council: "National Council of Public Trust"
 KAZ_tok_national_council_desc: "A consultative assembly is established, composed of civic leaders, intellectuals, and regional representatives. This council serves as a bridge between the-government and society, improving stability and generating political capital."
 KAZ_tok_opposition_law: "Law on Parliamentary Opposition"
 KAZ_tok_opposition_law_desc: "A formal statute is enacted, defining the rights and responsibilities of the parliamentary opposition. This law channels political dissent into orderly parliamentary procedures, strengthening the ruling party's position."
 KAZ_tok_reduce_apparatus: "Reduction of the State Apparatus"
 KAZ_tok_reduce_apparatus_desc: "A sweeping reform of the state bureaucracy is launched, merging overlapping departments and eliminating redundant positions. This significantly reduces bureaucratic costs."
 KAZ_tok_fiscal_rule: "Fiscal Rule"
 KAZ_tok_fiscal_rule_desc: "A constitutional ceiling is introduced on the budget deficit and public debt. This rule brings fiscal discipline and facilitates tax policy adjustments."
 KAZ_tok_rural_dev: "Rural Development"
 KAZ_tok_rural_dev_desc: "Substantial investment is channeled into agricultural modernization, rural infrastructure, and social services. The initiative adds new building opportunities in the West Kazakhstan, Kyzylorda, and Karaganda regions."
 KAZ_tok_women_quota: "Quota for Women and Youth"
 KAZ_tok_women_quota_desc: "A minimum percentage of women and young people is mandated on party lists for parliamentary elections. This measure promotes demographic growth and modernizes the political landscape."
 KAZ_tok_biz_support: "Support for SMEs"
 KAZ_tok_biz_support_desc: "A comprehensive package of tax breaks, subsidized loans, and red-tape reduction is rolled out for small and medium enterprises. This improves relations with the business community and enhances overall stability."
 KAZ_tok_anticrisis: "Anti-Crisis Measures"
 KAZ_tok_anticrisis_desc: "A set of monetary, fiscal, and social measures is activated to cushion the economy against external shocks. This includes adjustments to taxation and strategic support."
 KAZ_tok_protests: "Bloody Protests"
 KAZ_tok_protests_desc: "Widespread demonstrations erupt in major cities, fueled by economic hardship and political grievances. The protests escalate into a national crisis, forcing a decisive-government response."
 KAZ_tok_blyat_guns: "Order No. 1: Shoot to Kill"
 KAZ_tok_blyat_guns_desc: "Emergency powers are invoked, and security forces are authorized to use lethal force to disperse crowds. This brutal crackdown restores order but at a high political cost."
 KAZ_tok_concessions: "Make Concessions to Protesters"
 KAZ_tok_concessions_desc: "The-government offers a package of concessions, including early presidential elections, amnesty for political prisoners, and a commitment to constitutional reform. This move aims to de‑escalate tensions and co‑opt moderate opposition leaders."
 KAZ_tok_sovereign_internet: "Sovereign Internet and Bloggers Law"
 KAZ_tok_sovereign_internet_desc: "A controversial law is passed establishing state control over the internet, including mandatory blogger registration and content filtering. This strengthens the state's grip on information while reducing dissent."
 KAZ_tok_consolidate_elites: "Consolidate Elites"
 KAZ_tok_consolidate_elites_desc: "The ruling elite is recalibrated by replacing disloyal figures and strengthening the President's inner circle. This ensures a unified power structure and increases political stability."
 KAZ_tok_control_emission: "Controlled Emission"
 KAZ_tok_control_emission_desc: "Monetary tightening is implemented by restricting credit growth and managing money supply. This helps curb inflation but may strain business relations."
 KAZ_tok_denazarbayevization: "Start Denazarbayevization"
 KAZ_tok_denazarbayevization_desc: "Announce the end of Nazarbayev's political influence. An event will rename the ruling party AMANAT and the capital Astana, reinforce governing-party support and increase Western outlook popularity."
 KAZ_tok_const_court: "Re-establish Constitutional Court"
 KAZ_tok_const_court_desc: "Restore constitutional oversight, increase base stability and reduce corruption. The New Era spirit gains cheaper tax-rate and corruption-law changes and stronger counterintelligence."
 KAZ_tok_amnesty: "Amnesty for Detainees"
 KAZ_tok_amnesty_desc: "All detainees associated with the recent protests and political opposition are released. This act of clemency reduces social polarization and improves relations with civil society."
 KAZ_tok_internal_threat_registry: "Internal Threat Registry"
 KAZ_tok_internal_threat_registry_desc: "A centralized database is created for individuals deemed threats to national security. This enables targeted surveillance and strengthens internal security at the cost of some liberties."
 KAZ_tok_ban_sabotage: "Ban on Production Sabotage"
 KAZ_tok_ban_sabotage_desc: "Legislation is enacted that criminalizes strikes and work stoppages in critical sectors, replacing trade unions with industrial conglomerates. This boosts production efficiency but may suppress worker rights."
 KAZ_tok_militar_mvd: "Militarization of MIA and National Guard"
 KAZ_tok_militar_mvd_desc: "The military capabilities of the Ministry of Internal Affairs and the National Guard are expanded. This increases the state's capacity to respond to internal unrest."
 KAZ_tok_samruk: "Guarantees for Samruk-Kazyna"
 KAZ_tok_samruk_desc: "State guarantees are extended to the sovereign wealth fund Samruk‑Kazyna, allowing it to raise capital for major infrastructure projects and stimulate economic growth."
 KAZ_tok_majilis: "Reform of the Majilis"
 KAZ_tok_majilis_desc: "Reform the Majilis to strengthen the governing party within its outlook. The New Era spirit gains political power growth and cheaper changes to public policy."
 KAZ_tok_const_ref: "Referendum on Constitutional Amendments"
 KAZ_tok_const_ref_desc: "A nationwide referendum is organized to ratify a package of constitutional amendments that redefine the separation of powers. This direct appeal to the people legitimizes the new political order."
 KAZ_tok_jana_qazaq: "Jańa Qazaqstan"
 KAZ_tok_jana_qazaq_desc: "Launch Jańa Qazaqstan, a national program of institutional renewal and coordinated development. Adds the Jańa Qazaqstan national spirit."
 KAZ_tok_independent_journalism: "Allow Independent Journalism"
 KAZ_tok_independent_journalism_desc: "Private media is allowed to operate without government censorship, protecting journalists from political pressure. This fosters a more informed society but may challenge state control."
 KAZ_tok_turaqty_qaz: "Turaqty Qazaqstan"
 KAZ_tok_turaqty_qaz_desc: "The 'Turaqty Qazaqstan' (Stable Kazakhstan) agenda is promoted, focusing on orderly development and social cohesion. This lays the groundwork for long-term stability."
 KAZ_tok_adiletti_qaz: "Ádiletti Qazaqstan"
 KAZ_tok_adiletti_qaz_desc: "Develop the national program into Ádiletti Qazaqstan, a Just Kazakhstan. Strengthen public confidence and reduce corruption, retaining all existing Jańa Qazaqstan, digitalization and market-reform bonuses. These three reforms may be completed in any order."
 KAZ_tok_politburo: "Consolidation of Security Forces in Politburo"
 KAZ_tok_politburo_desc: "The heads of police, security services, and military are integrated into the top decision‑making body, ensuring that the security establishment is fully aligned with political leadership."
 KAZ_tok_oil_refineries: "Modernization of Oil Refineries"
 KAZ_tok_oil_refineries_desc: "Aging oil refineries are modernized to increase processing capacity and improve environmental standards, reducing reliance on imported fuel."
 KAZ_tok_nonbelievers: "Law on Rights of Non-Believers"
 KAZ_tok_nonbelievers_desc: "A law is enacted protecting the rights of atheists and non‑religious citizens, guaranteeing freedom of belief and non‑belief, thus balancing religious influence in public life."
 KAZ_tok_children_fund: "National Fund for Children"
 KAZ_tok_children_fund_desc: "A dedicated sovereign fund is established to finance children's healthcare, education, and social welfare programs, ensuring long-term investment in human capital."
 KAZ_tok_inflation_demonopolization: "Anti-Inflation and Demonopolization Commission"
 KAZ_tok_inflation_demonopolization_desc: "Ádiletti Qazaqstan gains cheaper tax-rate changes, stronger tax collection and inflation protection. Base stability and relations with small and medium businesses improve, while oligarchs lose influence. Economic protest penalties are lifted; political penalties remain until the final focus."
 KAZ_tok_regional_responsibility: "Increase Regional Responsibility"
 KAZ_tok_regional_responsibility_desc: "Significant fiscal and administrative powers are transferred to regional governments, allowing them to manage local budgets and improve governance accountability."
 KAZ_tok_military_industry: "Development of Military Industry"
 KAZ_tok_military_industry_desc: "A crash program is launched to develop domestic military production, including small arms, ammunition, and light armored vehicles, to reduce import dependency and create export opportunities."
 KAZ_tok_egovernment: "E-Government"
 KAZ_tok_egovernment_desc: "All public services are digitized, creating a single online portal for citizens to interact with state agencies, reducing corruption and improving efficiency."
 KAZ_tok_nat_projects: "List of National Projects"
 KAZ_tok_nat_projects_desc: "A list of large‑scale national projects in transport, energy, and urban development is compiled and prioritized, financed through public‑private partnerships and strategic investments."
 KAZ_tok_child_women: "Protection of Women and Children"
 KAZ_tok_child_women_desc: "Legal protections against domestic violence are strengthened, and support for victims is expanded, along with improved childcare and parental leave policies."
 KAZ_tok_digitalization: "Comprehensive Digitalization"
 KAZ_tok_digitalization_desc: "A sweeping digitalization of the economy is implemented, covering agriculture, manufacturing, banking, education, and public services, introducing modern technologies and smart solutions."
 KAZ_tok_national_industry: "National Industry Development"
 KAZ_tok_national_industry_desc: "Domestic industrial production is promoted through protective tariffs, subsidies, and state procurement, aiming to achieve import substitution in key sectors."
 KAZ_tok_infra_rost: "Infrastructure - Foundation of Growth"
 KAZ_tok_infra_rost_desc: "Massive investment in new highways, railways, energy grids, and ports connects remote regions and integrates the country into Eurasian trade routes, laying the foundation for sustainable growth."
 KAZ_tok_rotation: "Discussion on Rotation Institutions"
 KAZ_tok_rotation_desc: "A public debate is initiated on the need for term limits and rotation of high‑level officials to prevent entrenchment and promote fresh ideas, though it faces resistance from established elites."
 KAZ_tok_third_const: "Project of the Third Constitution"
 KAZ_tok_third_const_desc: "Convene the Third Constitution project. An event will determine whether Kazakhstan adopts the Chinese development model or begins a second wave of liberalization."
 KAZ_tok_singapore_model: "Singapore Model"
 KAZ_tok_singapore_model_desc: "The Singaporean model of authoritarian development is adopted - a strong, technocratic state with efficient governance and a market‑oriented economy, focusing on pragmatism over ideology."
 KAZ_tok_party_dictatorship: "Party Dictatorship"
 KAZ_tok_party_dictatorship_desc: "The dominance of a single ruling party is formalized, ensuring political stability at the cost of democratic pluralism and civil liberties."
 KAZ_tok_CHI_exp: "Borrow Chinese Experience"
 KAZ_tok_CHI_exp_desc: "Adopt state-guided development. The national spirit strengthens political power growth, counterintelligence, tax collection, production efficiency and foreign influence while making laws cheaper to change. Base stability and governing-party popularity rise, but Western democratic relations deteriorate."
 KAZ_tok_new_liberalization: "Second Wave of Liberalization"
 KAZ_tok_new_liberalization_desc: "Begin a second wave of liberalization. Opposition parties regain legal status and popularity, while base stability, infrastructure construction, population growth and relations with small businesses and Western democratic governments improve. Political power growth, tax income and foreign-influence defense decrease."
 KAZ_tok_resign: "Resignation of President Tokayev"
 KAZ_tok_resign_desc: "Tokayev retires and an event appoints Olzhas Bektenov as Acting President with the Heir trait. Tokayev's national spirits are preserved, and the remaining protest penalties are removed."
 KAZ_tok.1.t: "New President of Kazakhstan"
 KAZ_tok_1.d: "After a tense election campaign, Kassym-Jomart Tokayev, a seasoned diplomat and former Chairman of the Senate, wins the presidential election. In his inaugural address, he pledges to modernize the economy, strengthen the country's international standing, and carry out political reforms. His journey is just beginning - can he unite the elites and meet the people's expectations, or will he face a power struggle with conservative forces? This choice will determine Kazakhstan's course for years to come."
 KAZ_tok.1.a: "Accept the new reality"
 KAZ_tok.2.t: "Official Visit of the President of Kazakhstan"
 KAZ_tok_2.d: "Newly elected President Kassym-Jomart Tokayev arrives in our country on a landmark official visit. The head of state is received with full honors, symbolizing the importance our nation places on this strategic partnership. High-level talks are held between the leaders, covering key areas of mutual interest. President Tokayev's tour is a clear signal that Kazakhstan is pursuing a balanced and multi-vector foreign policy, and our country is among its key partners."
 KAZ_tok.2.a: "Greet the distinguished delegation"
 KAZ_tok.2.b: "Cancel the visit"
 kaz_tok.3.t: "A New Kazakhstan?"
 kaz_tok.3.d: "Demonstrations are spreading across Kazakhstan. Economic uncertainty has turned frustration with corruption, inequality and the patronage networks inherited from the Nazarbayev era into a direct challenge to President Tokayev. The protesters demand accountable government and an end to the privileges of the old elite.\n\nThe presidency must now choose its response. The security apparatus and established business interests offer to restore order in return for protecting their positions. Accepting their support would preserve a system built on loyalty, personal connections and selective enforcement of the law.\n\nAlternatively, Tokayev can accept demands for change and commit the state to modernization: confronting entrenched interests, professionalizing public administration and dismantling the old patronage system. This decision will determine the course of the New Kazakhstan."
 kaz_tok.3.a: "Restore order and protect our loyal elite."
 kaz_tok.3.b: "Accept reform. Kazakhstan must modernize."
 kaz_tok.5.t: "The Course of Modernization"
 kaz_tok.5.d: "President Tokayev has responded to the demonstrations by committing Kazakhstan to modernization. The government will accept demands for change, challenge entrenched patronage networks and begin replacing personal loyalty with professional administration.\n\nThe concessions have opened a new political course, but fulfilling them will require sustained reform. De-Nazarbayevization, stronger institutions and economic restructuring now form the agenda of the presidency."
 kaz_tok.5.a: "The course is set."
 kaz_tok.5.a.tt: "The National Focus §Y$KAZ_tok_concessions$§! will be completed automatically."
 kaz_tok.4.t: "The Oligarchic Settlement"
 kaz_tok.4.d: "The security apparatus has received orders to disperse the demonstrations, while the presidency has reached an understanding with Kazakhstan's established elite. Powerful business groups, regional patrons and loyal officials will retain their privileges in return for supporting Tokayev.\n\nOrder will be restored through coercion and accommodation with those who already command the country's wealth. Corruption and personal connections remain embedded in government: the New Kazakhstan will preserve the patronage system under a new leadership."
 kaz_tok.4.a: "The course is set."
 kaz_tok.4.a.tt: "The National Focus §Y$KAZ_tok_blyat_guns$§! will be completed automatically."
 kaz_tok.3.a.tt: "Choose the §Yleft, oligarchic path§!: suppress the demonstrations and preserve the corrupt patronage system. A follow-up event will complete §Y$KAZ_tok_blyat_guns$§! and unlock this branch."
 kaz_tok.3.b.tt: "Choose the §Yright, modernization path§!: accept demands for change and confront entrenched patronage. A follow-up event will complete §Y$KAZ_tok_concessions$§! and unlock this branch."
