 # Events
 KAZ_naz.1.t: "The dawn of the Nazarbayev era"
 KAZ_naz.1.d: "The Nazarbayev era has begun. President Nursultan Nazarbayev has promised to lead the country to a bright future, focusing on economic development, social stability, and international cooperation. The people of Kazakhstan hope that this chapter in Kazakhstan's history will bring prosperity and progress."
 KAZ_naz.1.a: "Let's raise Kazakhstan!"
 KAZ_naz.2.t: "Expansion of our party"
 KAZ_naz.2.d: "The ruling Otan party rebranded as Nur-Otan, bringing together two major political forces: the Agrarian Party and the Civil Party of Kazakhstan. This merger cemented the dominance of pro-presidential forces in the country's political arena."
 KAZ_naz.2.a: "we are invincible!"
 KAZ_naz.3.t: "Initiative to Establish a Turkic Council"
 KAZ_naz.3.d: "Against the backdrop of a changing global order, Astana has put forward an ambitious geopolitical initiative: to unite the independent Turkic states into a single economic and cultural bloc. The President of Kazakhstan emphasized that shared historical roots, linguistic affinity, and cultural heritage should form the foundation for a new center of power in Eurasia. Nursultan Nazarbayev proposes the creation of a Turkic Council, which will strengthen cooperation between our countries."
 KAZ_naz.3.a: "Let's unite the Turkic world!"
 KAZ_naz.3.b: "Let's focus on our own development"
 KAZ_naz.4.t: "[FROM.GetNameWithFlag] agreed!"
 KAZ_naz.4.d: "The leadership of [FROM.GetNameWithFlag] has agreed to participate in the Turkic Council. This decision marks a significant step towards strengthening our regional influence and fostering closer ties with our Turkic neighbors."
 KAZ_naz.4.a: "Excellent! Let's work together!"
 KAZ_aul.1.t: "Auyl Party is in power"
 KAZ_aul.1.d: "The Auyl Party has come to power and will soon begin implementing the reforms our country needs. The people of Kazakhstan have placed their trust in democrats and reformers to resolve all social and bureaucratic problems for a successful future."
 KAZ_aul.1.a: "Let's Work"
 KAZ_aul.2.t: "Renaming of some cities"
 KAZ_aul.2.d: "The renaming of some settlements and cities is part of the path of reforms and changes in our country, which is ardently supported by the population of Kazakhstan, including its nationalist-minded part."
 KAZ_aul.2.a: "Rename"
 KAZ_aul.3.t: "[KAZ.GetNameWithFlag] Offers Halal Cooperation"
 KAZ_aul.3.d: "Our Ministry of Foreign Affairs has received a proposal from Kazakhstan to strengthen our international relations with a view to possible further economic and political agreements."
 KAZ_aul.3.a: "Why Not?"
 KAZ_aul.3.b: "Not Now"
 KAZ_naz_era.1.t: "The Beginning of the New Millennium"
 KAZ_naz_era.1.d: "Now, when the beginning of the new millennium is on the calendar, Kazakhstan is at a crossroads. The turbulent 1990s are behind us: collapse of the Soviet Union, hyperinflation, and the flight of ethnic Germans and Slavs have left deep scars. Nevertheless, Nursultan Nazarbayev has managed what many post-Soviet leaders have failed to achieve: relative stabilization. Foreign investments poured into the Tengiz oil fields, interethnic peace was largely preserved, and nuclear weapons were returned. But the new millennium brings with it new challenges. The threat of chaos that prevailed in Russia and the former Soviet republics in the 1990s also threatens us, as China's quiet expansion moves east, while growing oil wealth flourishes and surrounds the whole country. The world is waiting for a transition to something unknown. Will the 2000s become the golden decade of Kazakhstan or not? We'll find out soon enough..."
 KAZ_naz_era.1.a: "Well, let's see what Kazakhstan will come to."
 KAZ_com.1.t: "[KAZ.GetNameWithFlag] Proposes a Socialist Dialogue"
 KAZ_com.1.d: "The Kazakhstani leadership proposes to take our relations to a new level by launching a permanent format of socialist dialogue. This involves coordinating foreign policy, supporting left-wing patriotic forces, and gradually aligning our economic and military models.\nAstana emphasizes that it is not issuing ultimatums, but expects a clear political signal from us."
 KAZ_com.1.a: "Support the Socialist Dialogue with Kazakhstan"
 KAZ_com.1.b: "Keep Our Distance from Kazakhstan"
 KAZ_com.2.t: "[FROM.GetNameWithFlag] Accepted Our Proposal"
 KAZ_com.2.d: "They have accepted our proposal for a socialist dialogue. Their leadership is showing readiness to coordinate foreign policy and support a left-wing course in the region.\nThis increases our political weight and creates a foundation for further integration."
 KAZ_com.2.a: "A Good Step Forward"
 KAZ_com.3.t: "[FROM.GetNameWithFlag] Rejected the Socialist Dialogue"
 KAZ_com.3.d: "They preferred to keep their distance and refused the socialist dialogue format. The official rhetoric boils down to vague phrases about 'sovereignty' and 'non-interference', but in practice this is a signal of distrust."
 KAZ_com.3.a: "Fine"
 KAZ_com.4.t: "[KAZ.GetNameWithFlag] Proposes Infrastructure Cooperation"
 KAZ_com.4.d: "Kazakhstan has launched an initiative for joint infrastructure development: construction of roads, industrial facilities, and improvements to logistics financed by Kazakhstani investments. In return, Astana expects political rapprochement and a strengthening of its influence in the region."
 KAZ_com.4.a: "Accept Kazakhstan's Infrastructure Proposal"
 KAZ_com.4.b: "We Will Build Everything Ourselves"
 KAZ_com.5.t: "[FROM.GetNameWithFlag] Accepted the Infrastructure Investment"
 KAZ_com.5.d: "Our proposal for infrastructure projects has been accepted. Kazakhstani funds are being directed into factory construction and the improvement of transport routes, strengthening our partner's economy and our influence."
 KAZ_com.5.a: "Launch the Projects"
 KAZ_com.6.t: "[FROM.GetNameWithFlag] Rejected the Infrastructure Investment"
 KAZ_com.6.d: "They have refused our offer of infrastructure cooperation. The formal reasons come down to 'budget constraints' and 'national priorities', but in practice this is a refusal to deepen ties with Kazakhstan."
 KAZ_com.6.a: "Let Them Keep Their Own Roads"
 KAZ_com.7.t: "[KAZ.GetNameWithFlag] Proposes Energy Cooperation"
 KAZ_com.7.d: "Kazakhstan proposes to invest in the development of our energy infrastructure: power plants, hydrocarbon processing, and expanded energy capacity. The project is presented as mutually beneficial: the partner gains political influence, and we gain new sources of energy."
 KAZ_com.7.a: "Accept Kazakhstan's Energy Proposal"
 KAZ_com.7.b: "Decline the Energy Cooperation"
 KAZ_com.8.t: "[FROM.GetNameWithFlag] Accepted the Energy Investment"
 KAZ_com.8.d: "Our partner has agreed to our projects in the energy sector. Kazakhstani funds are being channelled into the construction of power plants and processing facilities, strengthening the region's energy security and our influence. The expenditures are recorded in the treasury as foreign investment."
 KAZ_com.8.a: "Strengthen the Energy Sector"
 KAZ_com.9.t: "[FROM.GetNameWithFlag] Rejected the Energy Investment"
 KAZ_com.9.d: "Our partner has refused our participation in the development of their energy sector. Formally this is described as 'protecting a strategic sector', but in reality it is a signal of distrust toward Kazakhstan as a long-term partner."
 KAZ_com.9.a: "They Will Manage Without Us"
 KAZ_com.10.t: "[KAZ.GetNameWithFlag] Proposes Joint Military Exercises \"Red Steppe\""
 KAZ_com.10.d: "The Kazakhstani military command proposes to conduct joint exercises on our territory and in border regions. The program includes an exchange of experience, joint operational drills, and strengthening of staff coordination. Officially this is framed as a contribution to regional security, but the political dimension of the initiative is obvious."
 KAZ_com.10.a: "Agree to Joint Exercises with Kazakhstan"
 KAZ_com.10.b: "Refuse the Joint Exercises"
 KAZ_com.11.t: "[FROM.GetNameWithFlag] Approved Joint Exercises \"Red Steppe\" with Us"
 KAZ_com.11.d: "Our proposal to conduct joint exercises has been accepted. The partner's military structures are ready to deploy, and our advisers are already planning the manoeuvre scenarios. This will strengthen combat readiness and set a precedent for regular military cooperation."
 KAZ_com.11.a: "Prepare for the Manoeuvres"
 KAZ_com.12.t: "[FROM.GetNameWithFlag] Refused Joint Military Exercises with Us \"Red Steppe\""
 KAZ_com.12.d: "Our partner has refused to participate in joint exercises. The official formula cites 'internal priorities and the workload of the armed forces', but it clearly reflects an unwillingness to bind itself to Kazakhstan in the military sphere."
 KAZ_com.12.a: "We Will Note This Position"
 KAZ_com.13.t: "[KAZ.GetNameWithFlag] Proposes a Central Asian Defense Council"
 KAZ_com.13.d: "Kazakhstan has put forward an initiative to create a Central Asian Defense Council - a mechanism for coordinating military policy, sharing intelligence, and jointly planning defense.\n\nIn the long term this format may become the core of a future military bloc focused on collective security in the region."
 KAZ_com.13.a: "Support the Creation of the Central Asian Defense Council"
 KAZ_com.13.b: "Reject Kazakhstan's Initiative"
 KAZ_com.14.t: "[FROM.GetNameWithFlag] Supported the Defense Council"
 KAZ_com.14.d: "Our partner has supported our initiative to create the Central Asian Defense Council. The formation of basic structures, coordinating bodies, and joint planning mechanisms is now beginning."
 KAZ_com.14.a: "The Region Will Grow Stronger"
 KAZ_com.15.t: "[FROM.GetNameWithFlag] Rejected the Defense Council"
 KAZ_com.15.d: "Our partner has refused to participate in the Central Asian Defense Council. This step limits our ability to shape a common defense perimeter and shows their desire for autonomy or for alignment with other centers of power."
 KAZ_com.15.a: "We Will Take Their Choice into Account"
 KAZ_com.16.t: "[KAZ.GetNameWithFlag] Proposes a United Workers' Charter"
 KAZ_com.16.d: "Kazakhstan proposes to sign a united workers' charter - a document enshrining guarantees of employment, social rights, collective agreements, and the role of trade unions across the region. In practice this is a step toward forming a common socialist labor space under Astana's political patronage."
 KAZ_com.16.a: "Support the United Workers' Charter"
 KAZ_com.16.b: "Reject the Workers' Charter"
 KAZ_com.17.t: "[FROM.GetNameWithFlag] Signed the Workers' Charter"
 KAZ_com.17.d: "Our partner has accepted our proposal and signed the united workers' charter. The social agenda becomes a shared element of regional policy, and the influence of the Communist Party of Kazakhstan gains additional legitimacy. The new document is entrenched both politically and economically."
 KAZ_com.17.a: "Workers Will Not Be Left Without Protection"
 KAZ_com.18.t: "[FROM.GetNameWithFlag] Rejected the Workers' Charter"
 KAZ_com.18.d: "Our partner has refused to participate in the united workers' charter. Publicly this is presented as concern for 'labor market flexibility' and 'national specifics', but for us it is a signal that their elite does not want to bind itself with strict social obligations."
 KAZ_com.18.a: "We Will Draw Conclusions About the Class Nature of Their Regime"
 KAZ_com.19.t: "Proposal to Join the Union of Soviet Asian Republics"
 KAZ_com.19.d: "The leadership of [FROM.GetNameWithFlag] has put forward a grave proposal. Under the slogans of 'socialist integration' and 'regional unity', we are invited to join a new state - the Union of Soviet Asian Republics. Formally, this is presented as a voluntary accession on equal terms. In practice, it would mean the disappearance of our own statehood."
 KAZ_com.19.a: "Join the Union of Soviet Asian Republics"
 KAZ_com.19.b: "We Will Fight for Our Independence"
 KAZ_com.20.t: "[FROM.GetNameWithFlag] Joins the Union of Soviet Asian Republics"
 KAZ_com.20.a: "The Union Grows Stronger"
 KAZ_com.21.t: "[FROM.GetNameWithFlag] Rejects the Soviet Asian Union"
 KAZ_com.21.d: "They have refused our proposal to join the Union of Soviet Asian Republics. Our diplomats warn that this refusal will be perceived across the region as a challenge to our project of Soviet Asian unity. The question now is how we intend to respond."
 KAZ_com.21.a: "They Chose Confrontation over Unity"
 KAZ_com.22.t: "Invitation to the Kazakh Agricultural Exhibition"
 KAZ_com.22.d: "The-government of [FROM.GetNameWithFlag] invites our delegation to the Kazakh Agricultural Exhibition - a major international forum dedicated to technologies in the agricultural sector, food security, and the development of rural regions.\nThe exhibition will feature bilateral meetings, presentations of investment projects, and the signing of agreements in the fields of trade, technology, and food cooperation. Participation in this event may strengthen our economic ties with [FROM.GetNameWithFlag] and expand our access to their markets and expertise."
 KAZ_com.22.a: "Send a Delegation to the Exhibition"
 KAZ_com.22.b: "Politely Decline the Invitation"
 KAZ_com.23.t: "Kazakh Ultimatum"
 KAZ_com.23.d: "The [KAZ.GetNameWithFlag] approaches our borders and declares itself a regional power. In Astana, they openly say that stability in Central Asia is impossible without including Afghanistan into a single political and economic space. They offer us a choice: either we become part of their project on their terms, or they will themselves ensure \"order\" south of their borders. The only question is how much of our sovereignty we are ready to surrender in exchange for promises of security and investment."
 KAZ_com.23.a: "We Will Not Sell Our Country - War"
 KAZ_com.23.b: "Accept Incorporation into the Union"
 KAZ_com.23.c: "Agree to Puppet Status"
 KAZ_com.24.t: "[FROM.GetNameWithFlag] Rejects Our Project"
 KAZ_com.24.d: "They declared that the Union of Soviet Asian Republics has no right to dictate Afghanistan's future. Our proposal to include the country in the Union was rejected without any additional conditions. Our diplomats warn that instability on the southern axis will persist, and the flow of weapons and militants across the border will continue. Within our society, there is a growing demand for a tougher approach to the Afghan question."
 KAZ_com.24.a: "Idiots"
 KAZ_com.25.t: "[FROM.GetNameWithFlag] Joins the Union"
 KAZ_com.25.d: "After tense negotiations, the Afghan leadership agreed to the full incorporation of the country into the Union of Soviet Asian Republics. Formally, this is the unification of brotherly peoples under a single economic and defense framework. Informally, it is a vast territory with fragile security, the shadow of past wars, and a complex ethnic mosaic. Our institutions will have to pacify local elites, establish control over the border, and explain to our own population why we have taken on yet another crisis-ridden region."
 KAZ_com.25.a: "We Have Taken Responsibility for the Entire South"
 KAZ_com.26.t: "[FROM.GetNameWithFlag] Accepts Dependent Status"
 KAZ_com.26.d: "They have agreed to recognize the leading role of the Union of Soviet Asian Republics in matters of security and foreign policy. Formally, Afghanistan keeps its flag, government, and place on the map. In practice, key decisions on the border, transit, armed formations, and major investments will be made in Astana. For the outside world, this looks like \"soft\" integration; for our citizens, it is a cautious victory without direct occupation."
 KAZ_com.26.a: "We Control the Border Without Entering Every Village"
 KAZ_com.27.t: "Communist Revanche"
 KAZ_com.27.d: "The Communist Party was able to win the elections and attempt to show the people the bright communist future they were promised in the USSR. The reforms previously implemented in our country failed to meet the people's expectations, and therefore, our time has come to make Kazakhstan red and great."
 KAZ_com.27.a: "Great Red Kazakhstan"
 KAZ_eco.1.t: "Kazakhstan Requests Polish Investment"
 KAZ_eco.1.d: "Kazakhstan has proposed offering funding for office construction and renovation. Astana believes this will help boost business activity and strengthen the connection between our changes."
 KAZ_eco.1.a: "Invest in Office Construction"
 KAZ_eco.1.b: "Refuse"
 KAZ_eco.2.t: "[FROM.GetNameWithFlag] Agrees"
 KAZ_eco.2.d: "[FROM.GetNameDef] has agreed to invest in the construction of office buildings in Kazakhstan. This will boost business activity and support the growth of our economy."
 KAZ_eco.2.a: "Excellent"
 KAZ_eco.3.t: "[FROM.GetNameWithFlag] Refuses"
 KAZ_eco.3.d: "[FROM.GetNameDef] has refused to invest in office construction in Kazakhstan. We will have to look for other partners."
 KAZ_eco.3.a: "A Pity"
 KAZ_eco.4.t: "Another Investment Opportunity"
 KAZ_eco.4.d: "[KAZ.GetNameDef] has once again approached [This.GetNameDef] seeking economic investment. This time, they are offering more modest terms but with a focus on infrastructure development. Budapest emphasizes the potential for mutual benefit and the strengthening of bilateral relations through economic cooperation."
 KAZ_eco.4.a: "Invest in Hungarian Infrastructure"
 KAZ_eco.4.b: "Decline This Investment Opportunity"
 KAZ_eco.5.t: "Infrastructure Investment Accepted"
 KAZ_eco.5.d: "[FROM.GetNameDef] has agreed to invest in [KAZ.GetNameDef]'s infrastructure development. This investment will help modernize our transportation networks and improve connectivity across the country. The foreign capital will create jobs and stimulate local economic activity while strengthening our diplomatic ties."
 KAZ_eco.5.a: "This Will Boost Our Infrastructure"
 KAZ_eco.6.t: "Infrastructure Investment Declined"
 KAZ_eco.6.d: "[FROM.GetNameDef] has declined our request for infrastructure investment. While this is disappointing, we remain committed to modernizing our transportation networks through other means. We will continue to seek alternative funding sources and partnerships for our development projects."
 KAZ_eco.6.a: "We Will Find Other Funding Sources"
 KAZ_eco.7.t: "Breaking Free from Hyperinflation"
 KAZ_eco.7.d: "Increased healthcare spending, job creation programs and large-scale housing construction have paid off. The economy is recovering, the inflationary spiral is broken."
 KAZ_eco.7.a: "We Got Out"
 KAZ_alash.1.t: "Aron Atabek in Power"
 KAZ_alash.1.d: "After years of struggle, Aron Atabek and his movement have come to power. This is a historic moment - the Kazakh people have chosen the path of revival and independence. The new leader vows to restore the greatness of the Kazakh nation and break the chains that have bound the country."
 KAZ_alash.1.a: "The Beginning of a New Era"
 KAZ_alash.2.t: "Heir to Alash Orda"
 KAZ_alash.2.d: "Kazakhstan officially proclaims itself the spiritual and political heir to Alash Orda - the first Kazakh state. This declaration restores historical continuity and asserts the right of the Kazakh nation to independence and sovereignty. All the Kazakh people unite under the historic banner of justice and Kazakh identity."
 KAZ_alash.2.a: "History Returns"
 KAZ_alash.4.t: "Proclamation of the Alash Republic"
 KAZ_alash.4.d: "Kazakhstan is renamed the Alash Republic - a direct reference to the historic state of the Kazakh people. The new name symbolizes a complete break with colonial past and a return to roots. The Kazakh nation rises from the ashes, magnificent and unconquered."
 KAZ_alash.4.a: "The Alash Republic is Born"
 KAZ_alash.5.t: "[KAZ.GetNameWithFlag] Demands Our Submission"
 KAZ_alash.5.d: "They demand that we join their state. This is a very difficult question that has been posed to our government. We must make a choice: join Kazakhstan or refuse. If we refuse, they may start a war against us."
 KAZ_alash.5.a: "Accept the Ultimatum"
 KAZ_alash.5.b: "Send Them Packing"
 KAZ_alash.7.t: "They Refused"
 KAZ_alash.7.d: "The-government of [FROM.GetNameWithFlag] has refused. They closed the door to Kazakh unity and chose a path without us. The Alash Republic can no longer tolerate such insolence. War is inevitable - we will restore justice by force of arms."
 KAZ_alash.7.a: "They Will Pay For This!"
 KAZ_alash.8.t: "Invitation to the Alliance"
 KAZ_alash.8.d: "[KAZ.GetNameWithFlag], as a rising regional power, invites us to join them in an alliance. This is a historic opportunity to avoid isolation and become part of a great coalition. Together we can withstand any enemy and build a prosperous region. Kazakhstan extends the hand of friendship - will we accept it?"
 KAZ_alash.8.a: "Join the Alliance"
 KAZ_alash.8.b: "Reject the Offer"
 KAZ_alash.9.t: "Refusal of the Alliance"
 KAZ_alash.9.d: "[FROM.GetNameWithFlag] has rejected our invitation to join the alliance. This ingratitude and blindness will not go unpunished. Kazakhstan will not ask twice - those who do not wish to be with us must stand before us as enemies. War is the only answer to such a refusal."
 KAZ_alash.9.a: "Declare War"
 KAZ_alash.10.t: "Great Turkestan!"
 KAZ_alash.10.d: "Kazakhstan proclaims itself the nucleus of Great Turkestan - a unified state of all Turkic and Central Asian lands and more under Kazakh leadership. This dream, cherished for centuries, finally becomes reality. From the Black Sea to the Chinase border - all this will become a single mighty empire of the Kazakh people. History will remember this day as the day of the return of greatness."
 KAZ_alash.10.a: "Turkestan is United. Hurrah-Hurrah-Hurrah!"
 KAZ_alash.11.t: "Kazakh Writing Reform"
 KAZ_alash.11.d: "The victory of the national movement has given the Republic of Alash the opportunity to rethink not only its system of government, but also the cultural foundations of the nation. One of the most important questions yet to be resolved is the writing system of the Kazakh language.\nSome argue that adopting the Latin alphabet will firmly integrate Kazakhstan into the global scientific, technological, and Turkic world. Others believe that retaining the Cyrillic script ensures continuity in education and avoids the immense costs of a nationwide reform. A third group advocates the boldest course of all - the revival of the Old Turkic script as a symbol of a return to our ancestral roots.\nPresident Aron Atabek must now make a decision that will shape the cultural future of the nation for decades to come."
 KAZ_alash.11.a: "The Future Lies in the Latin Alphabet"
 KAZ_alash.11.b: "Restore the Old Turkic Alphabet"
