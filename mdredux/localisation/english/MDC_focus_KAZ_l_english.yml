 KAZ_great_turkestan: "Great Turkestan"
 KAZ_return_alash_desc: "The Alash Orda was the first democratic republic on Kazakh lands. Its ideals of unity, justice, and Kazakh identity live in the hearts of the Kazakh people. It is time to revive this dream."
 KAZ_army_alash_desc: "The military must become an instrument to protect the Kazakh state, not a tool of oligarchs. Military reform is aimed at professionalism and national dignity."
 KAZ_soviet_alash_desc: "In the tradition of Kazakh democracy, the Council of Tengrians is established - local governance where power truly belongs to the people."
 KAZ_gold_elite_alash_desc: "The era when a narrow caste of oligarchs held power is over. The new elite must serve the people, not profit from them."
 KAZ_alash_orda_desc: "The historical state is reborn - not as blind imitation, but as embodiment of the same spirit: Kazakh sovereignty and people's justice."
 KAZ_language_alash_desc: "The Kazakh language is the heartbeat of the nation. Only through the native tongue can the people reclaim their historical memory and cultural dignity."
 KAZ_return_money_alash_desc: "Billions of Kazakh money have been smuggled abroad. It is time to bring it home - into the hands of the Kazakh people, not foreign bankers."
 KAZ_anti_corrup_alash_desc: "Thieves and corrupt officials must answer to the people. Independent courts to fight corruption are an act of historical justice."
 KAZ_new_const_alash_desc: "The nation's basic law must protect the interests of the Kazakh people, not a handful of rich men. A new constitution guarantees true democracy."
 KAZ_vozroshd_alash_desc: "The Kazakh spirit is not broken by colonialism and corruption. It is reborn - in everyone who believes in justice and independence."
 KAZ_alphavit_alash_desc: "The Kazakh language should be written in a single national alphabet. It is a symbol of cultural independence."
 KAZ_2_respublic_of_alash_desc: "Kazakhstan is reborn as a true state of the people. The first was overthrown by colonialism, the second will be unbreakable."
 KAZ_officer_alash_desc: "The nation's officers must be Kazakh by origin and orientation. The army serves the nation, not foreign interests."
 KAZ_arsenal_alash_desc: "Kazakhstan creates its own weapons and equipment. Dependence on foreign supplies ends. Independence begins with the armory."
 KAZ_doctrine_alash_desc: "The new military doctrine is based on rapid maneuvers, devastating to the enemy and unpredictable to analysts. The Kazakh way of war."
 KAZ_defense_country_alash_desc: "Kazakhstan is ready to defend every inch of its land. This doctrine transforms the nation into an impregnable fortress."
 KAZ_razriv_cepey_alash_desc: "Kazakhstan has been under foreign rule for centuries. True independence cannot be achieved without breaking all colonial ties - political, economic, and cultural."
 KAZ_pact_turana_desc: "Unity of friendly and Turkic peoples is the natural path for Kazakhstan's development. An alliance with brother Turkic nations creates an impenetrable shield against enemies."
 KAZ_conferense_almaty_alash_desc: "Almaty becomes the center of negotiations for a new world order. Kazakhstan convenes its allies and determines the region's future from a position of strength. The countries of Central Asia must unite under our wing."
 KAZ_program_chernoye_alash_desc: "Kazakh influence must extend to southern neighbors. A program of economic and political influence in the Black Sea region."
 KAZ_our_turkish_brouther_desc: "Turkey is an ancient ally and trading partner. But trust must be cautious. Kazakhstan will be Turkey's ally, not its vassal."
 KAZ_friend_mongolia_alash_desc: "Mongolia remembers the time of greatness. Between Kazakhstan and Mongolia lies ancient kinship of nomads. Mongolia must be with us."
 KAZ_most_turana_alash_desc: "The Turan Bridge is a project to make Azerbaijan our ally. If it refuses, it will have to face us in battle..."
 KAZ_russian_territory_desc: "Historical Kazakh lands occupied by the Russian Empire must be returned. The right to territory is the nation's right to self-determination."
 KAZ_question_persia_desc: "Iran is an ancient civilization, but its regime may pose a threat to Kazakhstan. Clear boundaries of influence and territory must be established."
 KAZ_talib_alash_desc: "The Taliban in the south is a direct threat to Kazakhstan. Coordinated policy with neighbors to suppress and control them is necessary. Afghan territory is extremely unstable - we must stabilize this region with our presence."
 KAZ_chinese_territory_desc: "China has historically claimed Kazakh lands in the east. It is time to establish a clear border and not allow China to forget Kazakh sovereignty."
 KAZ_war_russia_alash_desc: "The return of historical lands only through force. Kazakhstan is ready for armed conflict to restore national territory."
 KAZ_diplom_russian_desc: "Not everything is solved by war. Diplomatic pressure and coercion will hopefully allow us to return our territories without war, otherwise we will have to face Russia."
 KAZ_great_turkestan_desc: "A historic dream-the unification of all Turkic and Central Asian lands into one great state under Kazakh leadership."
 KAZ_war_chi_alash_desc: "The east demands will and strength. Kazakhstan is ready to return every square kilometer of Kazakh land on the eastern border."
 KAZ_koleni_chi_alash_desc: "Not everything is solved by war. Diplomatic pressure and coercion will hopefully allow us to return our territories without war, otherwise we will have to face China."
 KAZ_koleni_alash_desc: "Not everything is solved by war. Diplomatic pressure and coercion will hopefully allow us to return our territories without war, otherwise we will have to face Russia."
 KAZ_religy_alash_desc: "Traditional Islam, Orthodox Christianity and Tengrianism - three pillars of Alash's spiritual life. The Council of Tengrians shall become the highest consultative body, ensuring that the laws of the state do not contradict the harmony of the Steppe and the will of the Eternal Tengri."
 KAZ_narodi_alash_desc: "Alash is a common home for all who are ready to honor this land as their motherland. We guarantee equal rights to every ethnic group that renounces separatism and proves its loyalty to the state. But whoever tries to undermine our unity from within shall be mercilessly expelled."
