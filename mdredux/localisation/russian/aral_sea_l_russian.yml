 aral_req_saxaul1:0 "Посажены §Yзащитные леса§!"
 aral_req_amanotkel:0 "Построен §Yузел Аманоткель§!"
 ARAL_GUI_TREND:0 "В месяц: [ROOT.GetAralTrend]"
 ARAL_TREND_TT:0 "§YЕжемесячное изменение Арала§!\nРека наполняет море до гребня плотины: §G+0,05 дм§!\nРасчистка русла Сырдарьи: §G+0,05 дм§!\nСоглашение с Узбекистаном: §G+0,05 дм§!\nМодернизация орошения: §G+0,05 дм§!\nВторая плотина (широкая гладь испаряет): §R-0,10 дм§!\nСибирская вода, канал / трубопровод: §G+0,30 / +0,15 дм§!\nНаполнение от завершённых проектов: §G+[?aral_fill|2] дм§! (ещё в пути: §Y[?aral_pending|1] дм§!)\nУ гребня море подняться не может: остальное переливается.\nРаз в год река бывает маловодной, многоводной или обычной.\nСейчас: [ROOT.GetAralTrend]"
 ARAL_GUI_MIN:0 "37 м"
 ARAL_TICK_0:0 "§Y40 м§!: естественный уровень Малого Арала (порог пролива Берга). Вода выше него переливается в Большой Арал"
 ARAL_TREND_DOWN:0 "§R[?aral_monthly_level|3] м§!"
