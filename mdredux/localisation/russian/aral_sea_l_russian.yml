 aral_req_level_40:0 "Уровень воды не менее §Y40 м§!"
 ARAL_TICK_40:0 "§Y40 м§!: для этапа II и второй плотины нужен такой уровень воды"
 aral_sea.1.t:0 "Вода возвращается"
 aral_sea.1.d:0 "Закрыт последний шлюз плотины Кокарал. Вода Сырдарьи, которая раньше уходила в песок, теперь остаётся в Северном Арале. В Аральске люди стоят на старом берегу и смотрят, как движется линия воды."
 aral_sea.1.a:0 "Море, которое стоило спасать"
 aral_sea.1.b:0 "Сберечь средства"
 aral_sea.2.t:0 "Рыба в Аральске"
 aral_sea.2.d:0 "Солёность упала достаточно, чтобы рыба выживала. Нерестовые хозяйства зарыблены, в старом порту открывается небольшой перерабатывающий завод. Впервые за поколение в Аральске снова есть рыбный рынок."
 aral_sea.2.a:0 "Открыть перерабатывающий завод"
 aral_sea.2.b:0 "Продать первый улов за границу"
 aral_sea.3.t:0 "Москва отвечает отказом"
 aral_sea.3.d:0 "Старую идею переброски сибирской воды в Центральную Азию вежливо выслушали и тихо отложили. Российские чиновники ссылаются на стоимость, расстояние и экологию севера. Море придётся спасать за счёт его собственных рек."
 aral_sea.3.a:0 "Так тому и быть"
 aral_sea.4.t:0 "Сибирская вода"
 aral_sea.4.d:0 "Вопреки всем ожиданиям подписано соглашение о переброске части сибирской воды на юг. Канал будут строить годами, и многие скажут, что это невозможно. Но у моря впервые появился источник, не зависящий от погоды."
 aral_sea.4.a:0 "Начать долгую работу"
 aral_sea.5.t:0 "Пыль над Кызылордой"
 aral_sea.5.d:0 "Бури поднимают соль и пыль с осушенного дна и несут её над полями и городами Кызылорды. Врачи сообщают о росте заболеваний, фермеры — о погибших посевах, а рыбакам больше нечего ловить."
 aral_sea.5.a:0 "Профинансировать срочную программу"
 aral_sea.5.b:0 "Сейчас ничего не сделать"
 aral_sea.6.t:0 "Море отступает снова"
 aral_sea.6.d:0 "Береговая линия ушла так далеко, что старые портовые города оказались в глубине суши. Рыбацкие посёлки пустеют: семьи уезжают в города. Вопрос уже не в том, как вернуть море, а в том, как удержать людей рядом с ним."
 aral_sea.6.a:0 "Помочь посёлкам переселиться"
 aral_sea.6.b:0 "Смириться"
 aral_sea.7.t:0 "Корабли на Северном Арале"
 aral_sea.7.d:0 "По Северному Аралу снова ходят лодки. Старый пирс в Аральске, десятилетиями стоявший в песке, отстроен, а береговая линия достаточно близко, чтобы увидеть её из города. Море не то, что прежде, но это снова море."
 aral_sea.7.a:0 "Поднять флаг у старого пирса"
 aral_sea.7.b:0 "Спланировать порт"
 aral_sea.8.t:0 "Береговая линия возвращается"
 aral_sea.8.d:0 "Реконструированная плотина Кокарал удерживает более высокий уровень, и вода доходит до мест, которые поколение были сухими. Инженеры измеряют новую береговую линию, и карты региона перерисовываются."
 aral_sea.8.a:0 "Долгий путь, пройденный не зря"
 aral_sea.9.t:0 "Вторая плотина выдерживает"
 aral_sea.9.d:0 "Вторая плотина и портовый канал завершены. Корабли снова могут дойти до Аральска по воде, а город, давший имя морю, вновь стал портом."
 aral_sea.9.a:0 "Снова порт"
