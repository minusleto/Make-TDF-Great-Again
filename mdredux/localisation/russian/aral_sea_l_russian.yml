 aral_sibaral_win_tt:0 "Россия соглашается на переброску сибирской воды: восстановление Арала §G+25%§! (поступает постепенно)"
 aral_sibaral_fail_tt:0 "Россия отказывает; план снова откладывается"
 aral_uzb_drift_tt:0 "Стабильный сток: ежемесячное высыхание после плотины снижается на §G0,03%§!"
 aral_irrigation_drift_tt:0 "Сэкономленная вода: ежемесячное высыхание после плотины снижается на §G0,02%§!"
 aral_irrigation_bonus_tt:0 "Постоянно §G+5%§! к продуктивности сельского хозяйства"
 aral_fish_bonus_tt:0 "Постоянно §G+5%§! к доходу от сельского хозяйства и рыбы"
 ARAL_TICK_36:0 "§Y36 м§!: становится возможен проект рыбного хозяйства"
 ARAL_TICK_42:0 "§Y42 м§!: считается уровнем жизнеспособности"
 ARAL_TICK_44:0 "§Y44 м§!: цель этапа II (3913 км2 воды)"
 aral_ifas:0 "Программа МФСА для бассейна"
 aral_ifas_desc:0 "Международный фонд спасения Арала координирует программы по бассейну Аральского моря в странах Центральной Азии, и Казахстан уже возглавлял его. Воду это не возвращает, но региональное сотрудничество немного смягчает последствия."
 aral_ifas_cost_tt:0 "Стоимость: §R0,05 млрд $§! из казны. Политическая власть: §R25§!."
 aral_ifas_relief_tt:0 "Последствия высыхания смягчены на §G2%§!"
 aral_saxaul1:0 "Защитные леса на осушенном дне"
 aral_saxaul1_desc:0 "Защитные насаждения в Кызылординской области при поддержке доноров: около 195 тыс. га, первая линия обороны от солевых и пыльных бурь. Воду они не возвращают, но смягчают ущерб."
 aral_saxaul1_cost_tt:0 "Полная стоимость: §R0,2 млрд $§!. Из казны: §R0,1 млрд $§!. В долг: §Y0,1 млрд $§! (увеличивает долг)"
 aral_saxaul1_relief_tt:0 "Последствия высыхания смягчены на §G4%§!"
 aral_loan:0 "Заём на проект РРСА"
 aral_loan_desc:0 "Казахстан получает финансирование Всемирного банка и готовит проект «Регулирование русла Сырдарьи и Северное Аральское море». Весь этап I стоил около 86 млн долларов, из них 64,5 млн дал Всемирный банк. Только бумаги: открывает работы на русле и плотину."
 aral_loan_cost_tt:0 "Стоимость: §R0,05 млрд $§! из казны. Политическая власть: §R30§!."
 aral_channel:0 "Восстановление русла Сырдарьи"
 aral_channel_desc:0 "Реконструкция русла и Шардаринской плотины, головных сооружений на каналах Сагимбай и Домалак, чтобы больше воды доходило до дельты."
 aral_channel_cost_tt:0 "Полная стоимость: §R0,1 млрд $§!. Из казны: §R0,03 млрд $§!. В долг: §Y0,07 млрд $§! (увеличивает долг)"
 aral_channel_gain_tt:0 "Восстановление Арала: §G+6%§! (поступает постепенно)"
 aral_kokaral:0 "Строительство плотины Кокарал"
 aral_kokaral_desc:0 "Плотина и дамба длиной 13 км отделяют Северный Арал. Вместе с сопутствующими работами она помогла за несколько лет поднять уровень примерно на 12 м от минимума около 30 м, солёность упала, а берег приблизился с 100 до 12 км от Аральска. Сама по себе плотина даёт примерно половину этого. Пока плотина не построена, море продолжает высыхать (−0,2% в месяц)."
 aral_kokaral_cost_tt:0 "Полная стоимость: §R0,15 млрд $§!. Из казны: §R0,03 млрд $§!. В долг: §Y0,12 млрд $§! (увеличивает долг)"
 aral_kokaral_gain_tt:0 "Восстановление Арала: §G+24%§! (поступает постепенно)"
 aral_aklak:0 "Аклакский гидроузел (этап I)"
 aral_aklak_desc:0 "Аклакские сооружения на Сырдарье регулируют сток в Северный Арал и дают немного гидроэнергии в Кызылорде. После плотины море всё ещё медленно высыхает (−0,05% в месяц), пока сток не обеспечат ирригационная реформа и соглашение с Узбекистаном."
 aral_aklak_cost_tt:0 "Полная стоимость: §R0,05 млрд $§!. Из казны: §R0,01 млрд $§!. В долг: §Y0,04 млрд $§! (увеличивает долг)"
 aral_aklak_gain_tt:0 "Восстановление Арала: §G+4%§! (поступает постепенно)"
 aral_fish:0 "Возрождение рыбного хозяйства Аральска"
 aral_fish_desc:0 "Улов вырос с нескольких десятков тонн до примерно 2 тыс. т за три года; открылись перерабатывающие заводы, рыбу вскоре начали экспортировать. Нерестовые хозяйства и переработка возвращают людям заработок. Сначала уровень воды должен достичь 36 м."
 aral_fish_cost_tt:0 "Стоимость: §R0,1 млрд $§! из казны"
 aral_fish_relief_tt:0 "Последствия высыхания смягчены на §G5%§!"
 aral_irrigation:0 "Модернизация ирригации (бассейн Сырдарьи)"
 aral_irrigation_desc:0 "Модернизация ирригации в Туркестанской и Кызылординской областях: подготовлено 167 проектов, водосбережение на 143,1 тыс. га уже сэкономило около 500 млн м3. Сэкономленная вода направляется в Северный Арал."
 aral_irrigation_cost_tt:0 "Полная стоимость: §R2 млрд $§!. Из казны: §R1 млрд $§!. В долг: §Y1 млрд $§! (увеличивает долг)"
 aral_irrigation_gain_tt:0 "Восстановление Арала: §G+12%§! (поступает постепенно)"
 aral_uzb:0 "Соглашение с Узбекистаном о стоке"
 aral_uzb_desc:0 "Соглашение с Узбекистаном обеспечивает стабильный сток Сырдарьи даже в маловодные периоды."
 aral_uzb_cost_tt:0 "Стоимость: §R0,05 млрд $§! из казны. Политическая власть: §R25§!."
 aral_saxaul2:0 "Массовая программа посадки саксаула"
 aral_saxaul2_desc:0 "Саксаул посеян примерно на 1,1 млн га осушенного дна. Приживаемость насаждений лишь около 30%, поэтому работа не заканчивается. Она смягчает последствия, но воду не возвращает."
 aral_saxaul2_cost_tt:0 "Полная стоимость: §R0,7 млрд $§!. Из казны: §R0,49 млрд $§!. В долг: §Y0,21 млрд $§! (увеличивает долг)"
 aral_saxaul2_relief_tt:0 "Последствия высыхания смягчены на §G8%§!"
 aral_ormany:0 "Госзаповедник «Арал Орманы» (планируется)"
 aral_ormany_desc:0 "План: охраняемый заповедник площадью более 1,3 млн га для сохранения новой экосистемы на осушенном дне."
 aral_ormany_cost_tt:0 "Стоимость: §R0,1 млрд $§! из казны"
 aral_ormany_relief_tt:0 "Последствия высыхания смягчены на §G3%§!"
 aral_amanotkel:0 "Водорегулирующий узел у Аманоткеля (этап II)"
 aral_amanotkel_desc:0 "Водорегулирующее сооружение и ГЭС у Аманоткеля будут регулировать озёрные системы Акшатау и Камыстыбас в Аральском районе. Один только гидроэнергетический проект оценивается примерно в 377 млн долларов."
 aral_amanotkel_cost_tt:0 "Полная стоимость: §R1,5 млрд $§!. Из казны: §R0,75 млрд $§!. В долг: §Y0,75 млрд $§! (увеличивает долг)"
 aral_amanotkel_gain_tt:0 "Восстановление Арала: §G+8%§! (поступает постепенно)"
 aral_phase2:0 "Северный Арал, этап II: повышение плотины Кокарал"
 aral_phase2_desc:0 "Реконструкция плотины для подъёма Северного Арала до 44 м: 3913 км2 и 34 км3. План неоднократно откладывался из-за споров о высоте плотины, финансирование всё ещё ищут. Исключает вариант второй плотины."
 aral_phase2_cost_tt:0 "Полная стоимость: §R0,8 млрд $§!. Из казны: §R0,12 млрд $§!. В долг: §Y0,68 млрд $§! (увеличивает долг)"
 aral_phase2_gain_tt:0 "Восстановление Арала: §G+12%§! (поступает постепенно)"
 aral_dam2:0 "Вторая плотина и канал к порту Аральска (отложено)"
 aral_dam2_desc:0 "Отложенная альтернатива: вторая, более мощная плотина у пролива Сарышыганак, канал из дельты Камыстыбас и судоходный канал (23 км, ширина 100 м), чтобы вернуть море к Аральску. По ранним планам — 250–300 млн долларов. Исключает этап II."
 aral_dam2_cost_tt:0 "Полная стоимость: §R1,2 млрд $§!. Из казны: §R0,6 млрд $§!. В долг: §Y0,6 млрд $§! (увеличивает долг)"
 aral_dam2_gain_tt:0 "Восстановление Арала: §G+18%§! (поступает постепенно)"
 aral_transboundary:0 "Совместный план по Южному Аралу с Узбекистаном"
 aral_transboundary_desc:0 "Гипотетически: совместное управление попусками Амударьи, Южным Аралом и дельтой."
 aral_transboundary_cost_tt:0 "Полная стоимость: §R3 млрд $§!. Из казны: §R0,9 млрд $§!. В долг: §Y2,1 млрд $§! (увеличивает долг). Политическая власть: §R100§!."
 aral_transboundary_gain_tt:0 "Восстановление Арала: §G+8%§! (поступает постепенно)"
 aral_sibaral:0 "Возобновить переговоры по «Сибаралу» с Россией"
 aral_sibaral_desc:0 "Советский план переброски сибирских рек в Среднюю Азию был прекращён в позднесоветский период. После распада СССР Казахстан обсуждал с Россией его возрождение, без результата. Рискованная попытка: лишь 10% шанс, что Россия согласится (+25% восстановления)."
 aral_sibaral_cost_tt:0 "Стоимость: §R0,1 млрд $§! из казны. Политическая власть: §R100§!."
