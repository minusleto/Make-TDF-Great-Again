# Regional coordination events and political consequences
 aral_regional_neglect_modifier: "Отложенная региональная реакция"
 aral_regional_neglect_modifier_desc: "Правительство отложило координацию с районами Приаралья. Этот временный политический штраф отражает задержку планирования и разобщённость государственных служб, а не экологический ущерб на всей территории страны."
 aral_regional_crisis_modifier: "Кризис региональной координации"
 aral_regional_crisis_modifier_desc: "Повторное игнорирование предупреждения превратило локальную экологическую проблему в более широкий управленческий кризис. Стабильность и прирост политической власти снижены, пока правительство не профинансирует совместную региональную программу."
 aral_sea.10.t: "За пределами побережья Арала"
 aral_sea.10.d: "Отступившее море оставляет соль и пыль на обнажённом дне, а давление на водные ресурсы и источники дохода не ограничивается административными границами. Местные проекты защищают побережье, но сами по себе не показывают, каким соседним районам помощь нужна в первую очередь. Совместная оценка позволит правительству понять масштаб проблемы до того, как её последствия станут дороже."
 aral_sea.10.a: "Финансировать мониторинг"
 aral_sea.10.a_tt: "Стоимость: §R0,5 млрд $§! из казны и §R25§! политической власти. Мониторинг предотвращает дальнейшую эскалацию регионального кризиса."
 aral_sea.10.b: "Отложить меры"
 aral_sea.11.t: "Региональное предупреждение повторяется"
 aral_sea.11.d: "Правительство отложило координацию, но временный штраф не решил проблему. Без общей программы местные власти продолжают действовать разрозненно, экстренные ресурсы всё сложнее направлять туда, где они нужнее всего, а политическая цена бездействия растёт. Ещё можно вмешаться — или позволить кризису углубиться."
 aral_sea.11.a: "Финансировать экстренные меры"
 aral_sea.11.a_tt: "Стоимость: §R1 млрд $§! из казны и §R50§! политической власти. Снимает временный штраф и учреждает постоянный региональный мониторинг."
 aral_sea.11.b: "Продолжить бездействие"
 aral_regional_response: "Программа регионального восстановления"
 aral_regional_response_desc: "Финансирование совместной работы затронутых районов, согласование мониторинга здоровья населения и водных ресурсов, создание постоянного механизма реагирования. Это дорогая административная программа, а не очередная плотина или водохозяйственный проект."
 aral_regional_response_done_tt: "Кризис региональной координации преодолён; постоянный национальный дух снят."
