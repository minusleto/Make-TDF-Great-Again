 aral_debug_worse:0 "ОТЛАДКА: ухудшить Аральское море (−10%)"
 aral_debug_worse_desc:0 "Инструмент для тестов: снижает восстановление воды на 10 пунктов, поэтому картинка, шкала, уровень и штрафы сдвигаются к худшему состоянию."
 aral_debug_better:0 "ОТЛАДКА: улучшить Аральское море (+10%)"
 aral_debug_better_desc:0 "Инструмент для тестов: повышает восстановление воды на 10 пунктов, поэтому картинка, шкала, уровень и штрафы сдвигаются к лучшему состоянию."
 aral_debug_reset:0 "ОТЛАДКА: сбросить Аральское море"
 aral_debug_reset_desc:0 "Инструмент для тестов: возвращает восстановление воды и смягчение последствий к 0 (начальное состояние). Флаги проектов не сбрасываются."
 aral_debug_worse_tt:0 "Восстановление Арала: §R−10%§!"
 aral_debug_better_tt:0 "Восстановление Арала: §G+10%§!"
 aral_debug_reset_tt:0 "Восстановление и смягчение последствий равны §Y0§!"
 ARAL_GUI_TREND:0 "В месяц: [ROOT.GetAralTrend]"
 ARAL_TREND_TT:0 "§YЕжемесячное изменение Арала§!\nВысыхание без плотины: §R-0,20%§!\nПосле плотины Кокарал: §R-0,05%§!\nСоглашение с Узбекистаном о стоке: §G+0,03%§!\nМодернизация ирригации: §G+0,02%§!\nПополнение от завершённых проектов: §G+[?aral_fill|2]%§! (ещё поступит: §Y[?aral_pending|1]%§!)\nСейчас: [ROOT.GetAralTrend]"
 aral_sea_dynamic_modifier_desc:0 "Высохшее море вредит сельскому хозяйству, инфраструктуре, продуктивности, приросту населения, миграции и рабочим местам. Возвращение воды ослабляет штрафы, как и леса и рыбное хозяйство, смягчающие последствия.\n\nУровень воды: §Y[?aral_sea_level|1] м§!. Изменение в месяц: §Y[?aral_monthly_change|2]%§! ([?aral_monthly_level|3] м)."
 aral_state_modifier_desc:0 "Солевые и пыльные бури, потерянное рыболовство и плохое здоровье. Сильнее всего в Кызылорде, вдвое слабее в Туркестане, Актобе и Улытау, вчетверо слабее в Мангистау и Атырау. Ослабевает по мере восстановления моря и смягчения последствий.\n\nУровень воды Арала: §Y[?aral_s_level|1] м§!. Изменение в месяц: §Y[?aral_s_change|2]%§!."
 ARAL_GUI_MIN:0 "-30%"
 ARAL_TICK_0:0 "§Y0%§!: море в начальном состоянии. Ниже — море продолжает сокращаться (красный)"
 ARAL_TREND_DOWN:0 "§R[?aral_monthly_change|2]%§! / §R[?aral_monthly_level|3] м§!"
