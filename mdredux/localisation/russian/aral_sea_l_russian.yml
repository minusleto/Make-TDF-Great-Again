 aral_excl_dam2_tt:0 "Не начат §Yэтап II§!"
 aral_infra_tt:0 "Добавляет §Y1§! инфраструктуры в Кызылорде"
 aral_agri_tt:0 "Добавляет §Y1§! коммерческий сельскохозяйственный район в Туркестане"
 ARAL_TICK_42:0 "§Y42 м§!: гребень плотины Кокарал, уровень жизнеспособности"
 ARAL_TICK_44:0 "§Y44 м§!: цель этапа II (3 913 км2 водной глади)"
