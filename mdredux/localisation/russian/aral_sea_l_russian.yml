 ARAL_TREND_FLAT:0 "§Y0,000 м§!"
 aral_dry_tt:0 "Регулируемый сток: маловодный год забирает у моря на §G1 дм§! меньше воды"
 ARAL_TICK_46:0 "§Y46 м§!: вторая плотина, предел старых планов. Море 1960 года стояло на 53 м, за пределами шкалы"
 aral_req_level:0 "Уровень воды не ниже §Y41,5 м§!"
 ARAL_TICK_415:0 "§Y41,5 м§!: рыболовство, этап II и вторая плотина требуют, чтобы море стояло не ниже"
 aral_kokaral_crest_tt:0 "Гребень плотины задаёт наивысший уровень моря: §Y42 м§!"
 aral_phase2_crest_tt:0 "Гребень плотины задаёт наивысший уровень моря: §Y44 м§!"
 aral_dam2_crest_tt:0 "Гребень плотины задаёт наивысший уровень моря: §Y46 м§!"
 aral_dike_risk_tt:0 "Пока она стоит, море может подняться до §Y41 м§!, но каждый месяц с шансом §R3%§! весенний паводок её смоет, и море вернётся к 40 м"
 aral_dam2_drift_tt:0 "Широкая гладь испаряет: наполнение §R-0,10 дм§! в месяц, а каждый маловодный год стоит на §R2 дм§! больше. Удержать такой уровень может только ровный приток"
 aral_loan_unlock_tt:0 "Открывает §Yплотину Кокарал§! и §Yрасчистку русла Сырдарьи§!"
 aral_uzb_drift_tt:0 "Ровный приток: море наполняется на §G0,05 дм§! в месяц быстрее"
 aral_irrigation_drift_tt:0 "Сэкономленная вода: море наполняется на §G0,05 дм§! в месяц быстрее"
 aral_channel_drift_tt:0 "Больше воды реки доходит до моря: оно наполняется на §G0,05 дм§! в месяц быстрее"
 aral_irrigation_bonus_tt:0 "Продуктивность сельского хозяйства §G+5%§! (штраф компенсируется на эту величину)"
 aral_fish_bonus_tt:0 "Доход от сельского хозяйства и рыболовства §G+5%§!"
 aral_req_russia_tt:0 "Россия существует"
 aral_req_nostudy_tt:0 "Сейчас не работает комиссия по изучению"
 aral_excl_sib_canal_tt:0 "Не начат §Yсибирский трубопровод§!"
 aral_excl_sib_pipe_tt:0 "Не начат §Yсибирский канал§!"
 aral_sibaral_tt:0 "Россия отвечает событием: комиссия по изучению или отказ. Вердикт приходит примерно через полтора года: осуществимо §G15%§!, нужно ещё изучать §Y30%§! (ещё год), отложено §R55%§! (закрыто на пятнадцать лет)"
 aral_sib_ok_tt:0 "Открывает §Yсибирский канал§! и §Yсибирский трубопровод§!"
 aral_sib_canal_tt:0 "Сибирская вода: море наполняется на §G0,30 дм§! в месяц быстрее, маловодный год стоит на §G3 дм§! меньше, сельское хозяйство §G+8%§!. Каждый год §R0,06 млрд $§! за воду, и каждый год с шансом §R15%§! Россия пересматривает цену (плата растёт на 50% навсегда или два года без воды)"
 aral_sib_pipe_tt:0 "Сибирская вода: море наполняется на §G0,15 дм§! в месяц быстрее, маловодный год стоит на §G2 дм§! меньше, сельское хозяйство §G+4%§!. Каждый год §R0,04 млрд $§! за воду, и каждый год с шансом §R8%§! Россия пересматривает цену (плата растёт на 50% навсегда или два года без воды)"
 aral_sea.1.a:0 "Купить попуски (0,03 млрд, 15 ПВ)"
 aral_sea.1.b:0 "Дать морю уйти"
 aral_sea.1.b_tt:0 "Море опускается на §R[?aral_dry_loss|0] дм§! (регулируемый сток снижает эту цифру, широкая гладь второй плотины повышает)"
 aral_sea.1.d:0 "В горах было мало снега, и водохранилища выше по течению придерживают всё, что у них есть. До дельты река доходит тонкой струйкой, и Северный Арал теряет больше воды, чем получает. Дополнительные попуски можно купить, но не бесплатно."
 aral_sea.1.t:0 "Маловодный год на Сырдарье"
 aral_sea.2.a:0 "Отстроить заново (0,04 млрд $)"
 aral_sea.2.b:0 "Ждать заём"
 aral_sea.2.d:0 "Весенний паводок перелился через земляную дамбу и пробил в ней брешь. Накопленная за ней вода уходит обратно в южный бассейн, а инженеры повторяют, что всё, сделанное из земли, рано или поздно постигнет та же участь."
 aral_sea.2.t:0 "Дамбу смыло"
 aral_sea.3.a:0 "Профинансировать защитные пояса (0,05 млрд $)"
 aral_sea.3.b:0 "Пока ничего не сделать"
 aral_sea.3.d:0 "Каждый сухой ветер поднимает соль и пыль с обнажённого дна и несёт их на поля и в посёлки. Врачи в Приаралье сообщают о росте болезней органов дыхания и почек, а фермеры начали уезжать. Нужно что-то делать для тех, кто остаётся."
 aral_sea.3.t:0 "Соляные бури над дном"
 aral_sea.4.a:0 "Создать комиссию по изучению"
 aral_sea.4.b:0 "Вежливо отказать"
 aral_sea.4.d:0 "Казахстан и Узбекистан поднимают старый советский план поворота сибирских рек на юг. Сторонники обещают воду в обмен на фрукты и овощи и постоянный доход для России, противники отвечают, что у Оби нет лишней воды, а расплачиваться придётся Сибири."
 aral_sea.4.t:0 "Центральная Азия просит сибирскую воду"
 aral_sea.6.a:0 "Начать планирование"
 aral_sea.6.d:0 "Комиссия закончила работу. На бумаге проект можно построить, ценой огромных затрат и при сопротивлении сибирских регионов. Решения пока нет, но Казахстан теперь может выбирать между старым каналом и трубопроводом."
 aral_sea.6.t:0 "Комиссия признала проект осуществимым"
 aral_sea.7.a:0 "Подождать"
 aral_sea.7.d:0 "Комиссия не вынесла вердикт. Старые советские материалы собирают из сотен институтов, оценки растут, а отчёт переносят ещё на год."
 aral_sea.7.t:0 "Комиссия просит больше данных"
 aral_sea.8.a:0 "Принять решение"
 aral_sea.8.a_tt:0 "Вопрос о сибирской воде закрыт на §R15 лет§!"
 aral_sea.8.d:0 "Россия дала ответ: вопрос закрыт до поры. Слишком дорого, сибирские регионы против, а пресса высмеивает план. Идея вернётся, как возвращалась и раньше, но нескоро."
 aral_sea.8.t:0 "Россия откладывает идею"
 aral_sea.9.a:0 "Принять новую цену"
 aral_sea.9.a_tt:0 "Ежегодная плата за воду растёт на §R50%§! навсегда"
 aral_sea.9.b:0 "Отказаться и переждать"
 aral_sea.9.b_tt:0 "Россия перекрывает поставки на §R2 года§!: нет дополнительного притока и пользы для сельского хозяйства, и нет ежегодной платы"
 aral_sea.9.d:0 "Договор на воду выходит на пересмотр. Россия ссылается на свои расходы и просит больше, и все в регионе понимают, что кран можно повернуть в обе стороны."
 aral_sea.9.t:0 "Россия пересматривает цену"
