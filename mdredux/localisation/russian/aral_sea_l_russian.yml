l_russian:
 KAZ_aral_sea_category: "Аральское море"
 KAZ_aral_sea_category_desc: ""
 aral_state_modifier: "Последствия высыхания Арала"
 aral_state_modifier_desc: "Эти области ближе всего к обнажившемуся морскому дну. Солевые и пыльные бури и исчезновение рыболовства снижают местную производительность, сокращают доступный людской ресурс и ограничивают возможности развития. Сильнее всего страдает Кызылординская область, соседние регионы затронуты слабее. Модификатор остаётся привязан к самому штату при смене владельца."
 aral_ifas: "Программа МФСА для бассейна"
 aral_ifas_desc: "Международный фонд спасения Арала координирует программы по бассейну Аральского моря в странах Центральной Азии. Воду это не возвращает, но даёт доноров, исследования и место за столом, где регион спорит о воде."
 aral_ifas_relief_tt: "Последствия высыхания смягчены на §G2%§!"
 aral_loan: "Заём РРСА"
 aral_loan_desc: "Проект для Северного Арала стоит ровно столько, сколько стоит его финансирование. Исследования, гарантии и документы для займа банка развития готовятся долго, но без них не начать ни плотину, ни работы на реке."
 aral_dike: "Аварийная земляная дамба"
 aral_dike_desc: "Дешёвая земляная дамба поперёк пролива Берга поднимет море примерно на метр за несколько месяцев. Весенние паводки уже ломали такие дамбы, и жителям Аральска приходилось их чинить. Она выигрывает время, но не решает проблему."
 aral_dike_gain_tt: "Вода для моря: §G+12 дм§! уровня, поступает постепенно (что не помещается под гребень плотины, уходит)"
 aral_channel: "Расчистка русла Сырдарьи"
 aral_channel_desc: "Большая часть воды реки теряется по пути к морю. Расчистка русла, ремонт регуляторов и очистка озёр дельты позволяют большему объёму дойти до Северного Арала."
 aral_kokaral: "Плотина Кокарал"
 aral_kokaral_desc: "Бетонная плотина с водосбросом поперёк пролива Берга отделяет Малый Арал от умирающего южного бассейна и позволяет реке его наполнить. Это важнейшее сооружение программы, а его гребень задаёт наивысший уровень, которого может достичь море (около 42 м)."
 aral_kokaral_gain_tt: "Вода для моря: §G+30 дм§! уровня, поступает постепенно (что не помещается под гребень плотины, уходит)"
 aral_aklak: "Аклакский гидроузел"
 aral_aklak_desc: "Регулирующий гидроузел на нижней Сырдарье направляет сток в озёра дельты и Северный Арал и сглаживает маловодные годы: плохая зима стоит морю меньше воды."
 aral_irrigation: "Модернизация орошения"
 aral_irrigation_desc: "Рисовые и хлопковые поля вдоль реки забирают большую часть воды, которая не доходит до моря. Облицовка каналов и отказ от затопления оставляют в реке больше воды и повышают урожай с кубометра."
 aral_fish: "Возрождение рыболовства"
 aral_fish_desc: "По мере опреснения воды рыба возвращается в Малый Арал. Квоты, перерабатывающий завод и холодильники снова дают Аральску доход и причину остаться людям."
 aral_fish_relief_tt: "Последствия высыхания смягчены на §G4%§!"
 aral_saxaul1: "Защитные леса"
 aral_saxaul1_desc: "Обнажённое дно источник соли и пыли. Саксаул, посеянный техникой и вручную, закрепляет грунт, но саженцам нужны годы, и многие не переживают первое лето."
 aral_saxaul1_relief_tt: "Последствия высыхания смягчены на §G3%§!"
 aral_saxaul2: "Массовая посадка саксаула"
 aral_saxaul2_desc: "Когда первые посадки доказали свою работоспособность, программа переходит на сотни тысяч гектаров высохшего дна: питомники, защитные пояса вокруг городов и заповедник на старом берегу."
 aral_saxaul2_relief_tt: "Последствия высыхания смягчены на §G6%§!"
 aral_uzb: "Соглашение с Узбекистаном по стоку"
 aral_uzb_desc: "Большой Арал потерян навсегда, но соглашение о стоке общей Сырдарьи сокращает неконтролируемый забор воды и позволяет Северному Аралу рассчитывать на более ровный приток."
 aral_amanotkel: "Гидроузел Аманоткель"
 aral_amanotkel_desc: "Комплекс на Сырдарье у Аманоткеля регулирует сток ниже плотины Кокарал, сглаживает маловодные годы и входит в каждый вариант следующего этапа. Без него дополнительную воду нельзя ни удержать, ни направить куда нужно."
 aral_phase2: "Этап II: повышение плотины"
 aral_phase2_desc: "Реконструкция плотины Кокарал и модернизация оросительных систем бассейна поднимают гребень, а с ним и Малый Арал, примерно до 44 м и почти до 4 000 квадратных километров водной глади. Инженеры считают этот план реалистичным: дорогим, но достижимым."
 aral_phase2_gain_tt: "Вода для моря: §G+30 дм§! уровня, поступает постепенно (что не помещается под гребень плотины, уходит)"
 aral_dam2: "Вторая плотина и канал к Аральску"
 aral_dam2_desc: "Старый и более смелый план: вторая плотина и канал к Аральску вернут море к городу и поднимут его примерно до 46 м. Большая площадь испаряет больше воды, поэтому каждый засушливый год бьёт сильнее."
 aral_dam2_gain_tt: "Вода для моря: §G+50 дм§! уровня, поступает постепенно (что не помещается под гребень плотины, уходит)"
 aral_sibaral: "Вопрос о сибирской воде"
 aral_sibaral_desc: "Советский план поворота сибирских рек на юг свернули в конце советской эпохи, но Узбекистан и мэр Москвы снова и снова его оживляют. Формальный запрос просит Россию создать комиссию по изучению. Россия может отказать сразу или годами изучать идею."
 aral_sib_canal: "Сибирский канал"
 aral_sib_canal_desc: "Старый советский проект: канал длиной более двух тысяч километров от Оби и Иртыша к Сырдарье и Амударье. Он несёт больше всего воды и дешевле, но строится годами, теряет воду на испарение и оставляет Казахстан платить России за каждый кубометр."
 aral_sib_pipe: "Сибирский трубопровод"
 aral_sib_pipe_desc: "Современный вариант: трубы вместо открытого канала, поэтому теряется меньше воды и нужно меньше насосных станций. Он быстрее и оставляет России меньше возможностей давить, но дороже и несёт меньше воды."
 ARAL_STATUS_DRYING: "§RБез защиты§!"
 ARAL_STATUS_STABLE: "§YУдерживается плотиной§!"
 ARAL_STATUS_RECOVERY: "§GВосстановление§!"
 ARAL_STATUS_CRITICAL: "§RСокращается§!"
 ARAL_GUI_LEVEL: "Уровень Северного Арала: §Y[?aral_sea_level|1] м§!"
 ARAL_GUI_PERCENT: "Отклонение от естественной отметки 40 м: §Y[?aral_gain|1] м§!"
 ARAL_GUI_STATUS: "Статус моря: [ROOT.GetAralStatus]"
 ARAL_GUI_ZERO: "40 м"
 ARAL_GUI_FULL: "50 м"
 ARAL_GUI_BANNER: "Проекты восстановления"
 ARAL_HELP_TT: "§YКак работает программа восстановления Аральского моря§!\nЕстественный уровень Малого Арала — 40 м. Отклонение выше или ниже этой отметки указано рядом с текущим уровнем воды. Плотины задают верхний предел: 41 м для временной земляной дамбы, 42 м для Кокарала, 44 м для Этапа II и 46 м для второй плотины. Вода выше гребня переливается.\n\nЗавершённые проекты не поднимают море мгновенно: вода поступает постепенно. Расчистка русла Сырдарьи, соглашение с Узбекистаном и экономия воды при орошении усиливают приток; большая площадь второй плотины увеличивает испарение. Маловодные и многоводные годы меняют баланс.\n\nЛеса, рыболовство и МФСА смягчают социальные и экологические последствия, но сами по себе не добавляют воду. Группы проектов открываются по мере завершения фокусов. Для запуска проектов и обновления системы Казахстан должен владеть Кызылординской областью (штат 717); потеря области после начала проекта не отменяет его таймер."
 aral_excl_phase2_tt: "Не начата альтернатива: §Yвторая плотина§!"
 aral_excl_dam2_tt: "Не начат §Yэтап II§!"
 aral_infra_tt: "Добавляет §Y1§! инфраструктуры в Кызылорде"
 aral_agri_tt: "Добавляет §Y1§! коммерческий сельскохозяйственный район в Туркестане"
 ARAL_TICK_42: "§Y42 м§!: гребень плотины Кокарал, уровень жизнеспособности"
 ARAL_TICK_44: "§Y44 м§!: цель этапа II (3 913 км2 водной глади)"
 aral_req_ifas: "Вступил в §YПрограмму МФСА§!"
 aral_req_loan: "Получен §Yзаём РРСА§!"
 aral_req_channel: "Восстановлено §Yрусло Сырдарьи§!"
 aral_req_kokaral: "Построена §Yплотина Кокарал§!"
 aral_req_aklak: "Построен §YАклакский гидроузел§!"
 aral_req_irrigation: "Завершена §Yмодернизация ирригации§!"
 aral_req_uzb: "Подписано §Yсоглашение с Узбекистаном§!"
 aral_req_saxaul1: "Посажены §Yзащитные леса§!"
 aral_req_amanotkel: "Построен §Yузел Аманоткель§!"
 ARAL_GUI_TREND: "Изменение уровня за месяц: [ROOT.GetAralTrend]"
 ARAL_TREND_TT: "§YЧто влияет на уровень моря§!\nПоказано изменение за месяц в метрах. Сырдарья наполняет море, пока оно ниже гребня плотины. Вода завершённых проектов поступает постепенно из отложенного запаса. Маловодный год может понизить уровень, многоводный — добавить воду. Расчистка русла, соглашение с Узбекистаном и экономия воды при орошении усиливают приток, а широкая гладь второй плотины повышает испарение. Вода выше гребня переливается.\n\nТекущая динамика: [ROOT.GetAralTrend]\nВода в пути: §Y[?aral_pending|1] дм§!."
 ARAL_GUI_MIN: "37 м"
 ARAL_TICK_0: "§Y40 м§!: естественный уровень Малого Арала (порог пролива Берга). Вода выше него переливается в Большой Арал"
 ARAL_TREND_DOWN: "§RУпадок: [?aral_monthly_level|3] м/мес§!"
 ARAL_TREND_UP: "§GРост: +[?aral_monthly_level|3] м/мес§!"
 ARAL_TREND_FLAT: "§YБез изменений§!"
 aral_dry_tt: "Регулируемый сток: маловодный год забирает у моря на §G1 дм§! меньше воды"
 ARAL_TICK_46: "§Y46 м§!: вторая плотина, предел старых планов. Море 1960 года стояло на 53 м, за пределами шкалы"
 aral_req_level: "Уровень воды не ниже §Y41,5 м§!"
 ARAL_TICK_415: "§Y41,5 м§!: рыболовство, этап II и вторая плотина требуют, чтобы море стояло не ниже"
 aral_kokaral_crest_tt: "Гребень плотины задаёт наивысший уровень моря: §Y42 м§!"
 aral_phase2_crest_tt: "Гребень плотины задаёт наивысший уровень моря: §Y44 м§!"
 aral_dam2_crest_tt: "Гребень плотины задаёт наивысший уровень моря: §Y46 м§!"
 aral_dike_risk_tt: "Пока она стоит, море может подняться до §Y41 м§!, но каждый месяц с шансом §R3%§! весенний паводок её смоет, и море вернётся к 40 м"
 aral_dam2_drift_tt: "Широкая гладь испаряет: наполнение §R-0,10 дм§! в месяц, а каждый маловодный год стоит на §R2 дм§! больше. Удержать такой уровень может только ровный приток"
 aral_loan_unlock_tt: "Открывает §Yплотину Кокарал§! и §Yрасчистку русла Сырдарьи§!"
 aral_uzb_drift_tt: "Ровный приток: море наполняется на §G0,05 дм§! в месяц быстрее"
 aral_irrigation_drift_tt: "Сэкономленная вода: море наполняется на §G0,05 дм§! в месяц быстрее"
 aral_channel_drift_tt: "Больше воды реки доходит до моря: оно наполняется на §G0,05 дм§! в месяц быстрее"
 aral_irrigation_bonus_tt: "Продуктивность сельского хозяйства §G+5%§! (штраф компенсируется на эту величину)"
 aral_fish_bonus_tt: "Доход от сельского хозяйства и рыболовства §G+5%§!"
 aral_req_russia_tt: "Россия существует"
 aral_req_nostudy_tt: "Сейчас не работает комиссия по изучению"
 aral_excl_sib_canal_tt: "Не начат §Yсибирский трубопровод§!"
 aral_excl_sib_pipe_tt: "Не начат §Yсибирский канал§!"
 aral_sibaral_tt: "Россия отвечает событием: комиссия по изучению или отказ. Вердикт приходит примерно через полтора года: осуществимо §G15%§!, нужно ещё изучать §Y30%§! (ещё год), отложено §R55%§! (закрыто на пятнадцать лет)"
 aral_sib_ok_tt: "Открывает §Yсибирский канал§! и §Yсибирский трубопровод§!"
 aral_sib_canal_tt: "Сибирская вода: море наполняется на §G0,30 дм§! в месяц быстрее, маловодный год стоит на §G3 дм§! меньше, сельское хозяйство §G+8%§!. Каждый год §R0,6 млрд $§! за воду, и каждый год с шансом §R15%§! Россия пересматривает цену (плата растёт на 50% навсегда или два года без воды)"
 aral_sib_pipe_tt: "Сибирская вода: море наполняется на §G0,15 дм§! в месяц быстрее, маловодный год стоит на §G2 дм§! меньше, сельское хозяйство §G+4%§!. Каждый год §R0,4 млрд $§! за воду, и каждый год с шансом §R8%§! Россия пересматривает цену (плата растёт на 50% навсегда или два года без воды)"
 aral_sea.1.a: "Купить попуски (0,3 млрд $, 15 ПВ)"
 aral_sea.1.b: "Дать морю уйти"
 aral_sea.1.b_tt: "Море опускается на §R[?aral_dry_loss|0] дм§! (регулируемый сток снижает эту цифру, широкая гладь второй плотины повышает)"
 aral_sea.1.d: "В горах было мало снега, и водохранилища выше по течению придерживают всё, что у них есть. До дельты река доходит тонкой струйкой, и Северный Арал теряет больше воды, чем получает. Дополнительные попуски можно купить, но не бесплатно."
 aral_sea.1.t: "Маловодный год на Сырдарье"
 aral_sea.2.a: "Отстроить заново (0,4 млрд $)"
 aral_sea.2.b: "Ждать заём"
 aral_sea.2.d: "Весенний паводок перелился через земляную дамбу и пробил в ней брешь. Накопленная за ней вода уходит обратно в южный бассейн, а инженеры повторяют, что всё, сделанное из земли, рано или поздно постигнет та же участь."
 aral_sea.2.t: "Дамбу смыло"
 aral_sea.3.a: "Профинансировать защитные пояса (0,5 млрд $)"
 aral_sea.3.b: "Пока ничего не сделать"
 aral_sea.3.d: "Каждый сухой ветер поднимает соль и пыль с обнажённого дна и несёт их на поля и в посёлки. Врачи в Приаралье сообщают о росте болезней органов дыхания и почек, а фермеры начали уезжать. Нужно что-то делать для тех, кто остаётся."
 aral_sea.3.t: "Соляные бури над дном"
 aral_sea.4.a: "Создать комиссию по изучению"
 aral_sea.4.b: "Вежливо отказать"
 aral_sea.4.d: "Казахстан и Узбекистан поднимают старый советский план поворота сибирских рек на юг. Сторонники обещают воду в обмен на фрукты и овощи и постоянный доход для России, противники отвечают, что у Оби нет лишней воды, а расплачиваться придётся Сибири."
 aral_sea.4.t: "Центральная Азия просит сибирскую воду"
 aral_sea.6.a: "Начать планирование"
 aral_sea.6.d: "Комиссия закончила работу. На бумаге проект можно построить, ценой огромных затрат и при сопротивлении сибирских регионов. Решения пока нет, но Казахстан теперь может выбирать между старым каналом и трубопроводом."
 aral_sea.6.t: "Комиссия признала проект осуществимым"
 aral_sea.7.a: "Подождать"
 aral_sea.7.d: "Комиссия не вынесла вердикт. Старые советские материалы собирают из сотен институтов, оценки растут, а отчёт переносят ещё на год."
 aral_sea.7.t: "Комиссия просит больше данных"
 aral_sea.8.a: "Принять решение"
 aral_sea.8.a_tt: "Вопрос о сибирской воде закрыт на §R15 лет§!"
 aral_sea.8.d: "Россия дала ответ: вопрос закрыт до поры. Слишком дорого, сибирские регионы против, а пресса высмеивает план. Идея вернётся, как возвращалась и раньше, но нескоро."
 aral_sea.8.t: "Россия откладывает идею"
 aral_sea.9.a: "Принять новую цену"
 aral_sea.9.a_tt: "Ежегодная плата за воду растёт на §R50%§! навсегда"
 aral_sea.9.b: "Отказаться и переждать"
 aral_sea.9.b_tt: "Россия перекрывает поставки на §R2 года§!: нет дополнительного притока и пользы для сельского хозяйства, и нет ежегодной платы"
 aral_sea.9.d: "Договор на воду пересматривается. Россия ссылается на свои расходы и просит больше. Казахстан может принять повышение, только пока новая годовая плата не превышает §Y1,5 млрд $§!; при большей цене придётся отказаться и два года обходиться без поставок."
 aral_sea.9.t: "Россия пересматривает цену"


