 ARAL_STATUS_STABLE:0 "§YСтабильное§!"
 ARAL_STATUS_RECOVERY:0 "§GВосстановление§!"
 ARAL_STATUS_CRITICAL:0 "§RОпустынивание§!"
 ARAL_GUI_LEVEL:0 "Уровень воды: §Y[?aral_sea_level|1] м§!"
 ARAL_GUI_PERCENT:0 "Восстановление: §Y[?aral_sea_restoration|0]%§!"
 ARAL_GUI_STATUS:0 "Статус моря: [ROOT.GetAralStatus]"
 ARAL_GUI_ZERO:0 "0%"
 ARAL_GUI_FULL:0 "100%"
 ARAL_GUI_BANNER:0 "Проекты восстановления"
 aral_req_level_36:0 "Уровень воды не менее §Y36 м§!"
 aral_excl_phase2_tt:0 "Не начата альтернатива: §Yвторая плотина§!"
 aral_excl_dam2_tt:0 "Не начат §Yэтап II§!"
 aral_infra_tt:0 "Добавляет §Y1§! инфраструктуры в Кызылорде"
 aral_agri_tt:0 "Добавляет §Y1§! коммерческий сельскохозяйственный район в Туркестане"
 ARAL_TICK_36:0 "§Y36 м§!: становится возможен проект рыбного хозяйства"
 ARAL_TICK_42:0 "§Y42 м§!: уровень жизнеспособности. Здесь открываются этап II и вторая плотина"
 ARAL_TICK_44:0 "§Y44 м§!: цель этапа II (3913 км2 воды)"
 aral_req_ifas:0 "Вступил в §YПрограмму МФСА§!"
 aral_req_loan:0 "Получен §Yзаём РРСА§!"
 aral_req_channel:0 "Восстановлено §Yрусло Сырдарьи§!"
 aral_req_kokaral:0 "Построена §Yплотина Кокарал§!"
 aral_req_aklak:0 "Построен §YАклакский гидроузел§!"
 aral_req_irrigation:0 "Завершена §Yмодернизация ирригации§!"
 aral_req_uzb:0 "Подписано §Yсоглашение с Узбекистаном§!"
 aral_req_saxaul1:0 "Посажены §Yзащитные леса§!"
 aral_req_amanotkel:0 "Построен §Yузел Аманоткель§!"
 ARAL_GUI_TREND:0 "В месяц: [ROOT.GetAralTrend]"
 ARAL_TREND_TT:0 "§YЕжемесячное изменение Арала§!\nВысыхание без плотины: §R-0,20%§!\nЗа земляной дамбой: §R-0,10%§!\nПосле плотины Кокарал: §R-0,06%§!\nСоглашение с Узбекистаном: §G+0,04%§!\nМодернизация орошения: §G+0,04%§! (с обоими река медленно возвращает море к гребню)\nВторая плотина: §R-0,03%§! (широкая гладь испаряет)\nНаполнение от завершённых проектов: §G+[?aral_fill|2]%§! (ещё в пути: §Y[?aral_pending|1]%§!)\nРаз в год река бывает маловодной, многоводной или обычной.\nСейчас: [ROOT.GetAralTrend]"
 ARAL_GUI_MIN:0 "-30%"
 ARAL_TICK_0:0 "§Y0%§!: море в начальном состоянии. Ниже — море продолжает сокращаться (красный)"
 ARAL_TREND_DOWN:0 "§R[?aral_monthly_change|2]%§! / §R[?aral_monthly_level|3] м§!"
 ARAL_TREND_UP:0 "§G+[?aral_monthly_change|2]%§! / §G+[?aral_monthly_level|3] м§!"
 ARAL_TREND_FLAT:0 "§Y0,00%§! / §Y0,000 м§!"
 aral_dike_risk_tt:0 "Пока она стоит, высыхание вдвое меньше (§G-0,10%§! в месяц), но каждый месяц с шансом §R3%§! паводок её смоет"
 aral_dam2_drift_tt:0 "Широкая гладь испаряет больше: ежемесячное высыхание §R+0,03%§!, а каждый маловодный год стоит на §R2%§! больше. Удержать такой уровень может только ровный приток"
 aral_dry_tt:0 "Регулируемый сток: маловодный год забирает у моря на §G1%§! меньше воды"
 aral_loan_unlock_tt:0 "Открывает §Yплотину Кокарал§! и §Yрасчистку русла Сырдарьи§!"
 aral_uzb_drift_tt:0 "Ровный сток: ежемесячное высыхание после плотины снижено на §G0,04%§!"
 aral_irrigation_drift_tt:0 "Сэкономленная вода: ежемесячное высыхание после плотины снижено на §G0,04%§!"
 aral_irrigation_bonus_tt:0 "Продуктивность сельского хозяйства §G+5%§! (штраф компенсируется на эту величину)"
 aral_fish_bonus_tt:0 "Доход от сельского хозяйства и рыболовства §G+5%§!"
 aral_req_level_42:0 "Уровень воды не ниже §Y42 м§!"
 ARAL_TICK_46:0 "§Y46 м§!: предел старых планов (вторая плотина). Выше море остаётся потерянным: остальная часть шкалы это море 1960 года"
 aral_sea.1.a:0 "Купить попуски (0,03 млрд, 15 ПВ)"
 aral_sea.1.b:0 "Дать морю уйти"
 aral_sea.1.b_tt:0 "Море теряет §R[?aral_dry_loss|0]%§! восстановления (регулируемый сток снижает эту цифру, широкая гладь второй плотины повышает)"
 aral_sea.1.d:0 "В горах было мало снега, и водохранилища выше по течению придерживают всё, что у них есть. До дельты река доходит тонкой струйкой, и Северный Арал теряет больше воды, чем получает. Дополнительные попуски можно купить, но не бесплатно."
 aral_sea.1.t:0 "Маловодный год на Сырдарье"
 aral_sea.2.a:0 "Отстроить заново (0,04 млрд $)"
 aral_sea.2.b:0 "Ждать заём"
 aral_sea.2.d:0 "Весенний паводок перелился через земляную дамбу и пробил в ней брешь. Накопленная за ней вода уходит обратно в южный бассейн, а инженеры повторяют, что всё, сделанное из земли, рано или поздно постигнет та же участь."
 aral_sea.2.t:0 "Дамбу смыло"
 aral_sea.3.a:0 "Профинансировать защитные пояса (0,05 млрд $)"
 aral_sea.3.b:0 "Пока ничего не сделать"
 aral_sea.3.d:0 "Каждый сухой ветер поднимает соль и пыль с обнажённого дна и несёт их на поля и в посёлки. Врачи в Кызылорде сообщают о росте лёгочных и почечных болезней, а фермеры начали уезжать. Нужно что-то делать для тех, кто остаётся."
 aral_sea.3.t:0 "Соляные бури над дном"
