l_russian:
 aral_sea_decisions:0 "Аральское море"
 aral_sea_decisions_desc:0 ""
 aral_sea_dynamic_modifier:0 "Влияние Аральского моря"
 aral_sea_dynamic_modifier_desc:0 "Высохшее море бьёт по сельскому хозяйству, росту населения, миграции и занятости. Возвращение воды ослабляет штрафы, как и леса и рыболовство, смягчающие последствия.\n\nУровень воды: §Y[?aral_sea_level|1] м§!. Изменение за месяц: §Y[?aral_monthly_change|2]%§! ([?aral_monthly_level|3] м)."
 aral_state_modifier:0 "Последствия высыхания Арала"
 aral_state_modifier_desc:0 "Солевые и пыльные бури, потерянное рыболовство и плохое здоровье. Сильнее всего в Кызылорде, вдвое слабее в Туркестане, Актобе и Улытау, вчетверо слабее в Мангистау и Атырау. Ослабевает по мере восстановления моря и смягчения последствий.\n\nУровень воды Арала: §Y[?aral_s_level|1] м§!. Изменение в месяц: §Y[?aral_s_change|2]%§!."
 aral_ifas:0 "Программа МФСА для бассейна"
 aral_ifas_desc:0 "Международный фонд спасения Арала координирует программы по бассейну Аральского моря в странах Центральной Азии. Воду это не возвращает, но даёт доноров, исследования и место за столом, где регион спорит о воде."
 aral_ifas_cost_label:0 "0,05 млрд $ + 25 ПВ"
 aral_ifas_cost_tt:0 "Стоимость: §R0,05 млрд $§! из казны. Политическая власть: §R25§!."
 aral_ifas_relief_tt:0 "Последствия высыхания смягчены на §G2%§!"
 aral_loan:0 "Заём РРСА"
 aral_loan_desc:0 "Проект для Северного Арала стоит ровно столько, сколько стоит его финансирование. Исследования, гарантии и документы для займа банка развития готовятся долго, но без них не начать ни плотину, ни работы на реке."
 aral_loan_cost_label:0 "0,05 млрд $ + 40 ПВ"
 aral_loan_cost_tt:0 "Стоимость: §R0,05 млрд $§! из казны. Политическая власть: §R40§!."
 aral_dike:0 "Аварийная земляная дамба"
 aral_dike_desc:0 "Дешёвая земляная дамба поперёк пролива Берга удержит воду реки уже через несколько месяцев. Прежние дамбы смыло первым же паводком, и эта не лучше. Она выигрывает время, но не решает проблему."
 aral_dike_cost_label:0 "0,04 млрд $"
 aral_dike_cost_tt:0 "Стоимость: §R0,04 млрд $§! из казны."
 aral_dike_gain_tt:0 "Восстановление Арала: §G+10%§! (поступает постепенно)"
 aral_channel:0 "Расчистка русла Сырдарьи"
 aral_channel_desc:0 "Большая часть воды реки теряется по пути к морю. Расчистка русла, ремонт регуляторов и очистка озёр дельты позволяют большему объёму дойти до Северного Арала."
 aral_channel_cost_label:0 "0,05 млрд $"
 aral_channel_cost_tt:0 "Полная стоимость: §R0,15 млрд $§!. Из казны: §R0,05 млрд $§!. В долг: §Y0,1 млрд $§! (увеличивает долг)."
 aral_channel_gain_tt:0 "Восстановление Арала: §G+15%§! (поступает постепенно)"
 aral_kokaral:0 "Плотина Кокарал"
 aral_kokaral_desc:0 "Бетонная плотина с водосбросом поперёк пролива Берга отделяет Малый Арал от умирающего южного бассейна и позволяет реке его наполнить. Это важнейшее сооружение программы, а его гребень задаёт наивысший уровень, которого может достичь море (около 42 м)."
 aral_kokaral_cost_label:0 "0,15 млрд $ + 60 ПВ"
 aral_kokaral_cost_tt:0 "Полная стоимость: §R0,45 млрд $§!. Из казны: §R0,15 млрд $§!. В долг: §Y0,3 млрд $§! (увеличивает долг). Политическая власть: §R60§!."
 aral_kokaral_gain_tt:0 "Восстановление Арала: §G+55%§! (поступает постепенно)"
 aral_aklak:0 "Аклакский гидроузел"
 aral_aklak_desc:0 "Регулирующий гидроузел на нижней Сырдарье направляет сток в озёра дельты и Северный Арал и сглаживает маловодные годы: плохая зима стоит морю меньше воды."
 aral_aklak_cost_label:0 "0,05 млрд $"
 aral_aklak_cost_tt:0 "Полная стоимость: §R0,1 млрд $§!. Из казны: §R0,05 млрд $§!. В долг: §Y0,05 млрд $§! (увеличивает долг)."
 aral_irrigation:0 "Модернизация орошения"
 aral_irrigation_desc:0 "Рисовые и хлопковые поля вдоль реки забирают большую часть воды, которая не доходит до моря. Облицовка каналов и отказ от затопления оставляют в реке больше воды и повышают урожай с кубометра."
 aral_irrigation_cost_label:0 "0,4 млрд $"
 aral_irrigation_cost_tt:0 "Полная стоимость: §R0,8 млрд $§!. Из казны: §R0,4 млрд $§!. В долг: §Y0,4 млрд $§! (увеличивает долг)."
 aral_fish:0 "Возрождение рыболовства"
 aral_fish_desc:0 "По мере опреснения воды рыба возвращается в Малый Арал. Квоты, перерабатывающий завод и холодильники снова дают Аральску доход и причину остаться людям."
 aral_fish_cost_label:0 "0,1 млрд $"
 aral_fish_cost_tt:0 "Стоимость: §R0,1 млрд $§! из казны."
 aral_fish_relief_tt:0 "Последствия высыхания смягчены на §G4%§!"
 aral_saxaul1:0 "Защитные леса"
 aral_saxaul1_desc:0 "Обнажённое дно источник соли и пыли. Саксаул, посеянный техникой и вручную, закрепляет грунт, но саженцам нужны годы, и многие не переживают первое лето."
 aral_saxaul1_cost_label:0 "0,15 млрд $"
 aral_saxaul1_cost_tt:0 "Стоимость: §R0,15 млрд $§! из казны."
 aral_saxaul1_relief_tt:0 "Последствия высыхания смягчены на §G3%§!"
 aral_saxaul2:0 "Массовая посадка саксаула"
 aral_saxaul2_desc:0 "Когда первые посадки доказали свою работоспособность, программа переходит на сотни тысяч гектаров высохшего дна: питомники, защитные пояса вокруг городов и заповедник на старом берегу."
 aral_saxaul2_cost_label:0 "0,4 млрд $"
 aral_saxaul2_cost_tt:0 "Полная стоимость: §R0,8 млрд $§!. Из казны: §R0,4 млрд $§!. В долг: §Y0,4 млрд $§! (увеличивает долг)."
 aral_saxaul2_relief_tt:0 "Последствия высыхания смягчены на §G6%§!"
 aral_uzb:0 "Соглашение с Узбекистаном по стоку"
 aral_uzb_desc:0 "Большой Арал потерян навсегда, но соглашение о стоке общей Сырдарьи сокращает неконтролируемый забор воды и позволяет Северному Аралу рассчитывать на более ровный приток."
 aral_uzb_cost_label:0 "0,05 млрд $ + 40 ПВ"
 aral_uzb_cost_tt:0 "Стоимость: §R0,05 млрд $§! из казны. Политическая власть: §R40§!."
 aral_amanotkel:0 "Гидроузел Аманоткель"
 aral_amanotkel_desc:0 "Комплекс на Сырдарье у Аманоткеля регулирует сток ниже плотины Кокарал, сглаживает маловодные годы и входит в каждый вариант следующего этапа. Без него дополнительную воду нельзя ни удержать, ни направить куда нужно."
 aral_amanotkel_cost_label:0 "0,4 млрд $"
 aral_amanotkel_cost_tt:0 "Полная стоимость: §R0,8 млрд $§!. Из казны: §R0,4 млрд $§!. В долг: §Y0,4 млрд $§! (увеличивает долг)."
 aral_phase2:0 "Этап II: повышение плотины"
 aral_phase2_desc:0 "Повышение плотины Кокарал на два метра поднимает гребень, а с ним и Малый Арал, примерно до 44 м и возвращает тысячи квадратных километров воды. Инженеры считают этот план реалистичным: дорогим, но достижимым."
 aral_phase2_cost_label:0 "0,3 млрд $ + 60 ПВ"
 aral_phase2_cost_tt:0 "Полная стоимость: §R1 млрд $§!. Из казны: §R0,3 млрд $§!. В долг: §Y0,7 млрд $§! (увеличивает долг). Политическая власть: §R60§!."
 aral_phase2_gain_tt:0 "Восстановление Арала: §G+12%§! (поступает постепенно)"
 aral_dam2:0 "Вторая плотина и канал к Аральску"
 aral_dam2_desc:0 "Старый и более смелый план: вторая плотина и канал к Аральску вернут море к городу и поднимут его выше 46 м. Большая площадь испаряет больше воды, поэтому каждый засушливый год бьёт сильнее."
 aral_dam2_cost_label:0 "0,8 млрд $ + 100 ПВ"
 aral_dam2_cost_tt:0 "Полная стоимость: §R2,5 млрд $§!. Из казны: §R0,8 млрд $§!. В долг: §Y1,7 млрд $§! (увеличивает долг). Политическая власть: §R100§!."
 aral_dam2_gain_tt:0 "Восстановление Арала: §G+22%§! (поступает постепенно)"
